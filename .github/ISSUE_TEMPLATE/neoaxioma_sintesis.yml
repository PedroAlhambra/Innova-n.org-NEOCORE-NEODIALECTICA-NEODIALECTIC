name: Síntesis Abierta · Neoaxioma™ / Open Synthesis · Neoaxiom™
description: Contraste público de un Neoaxioma™ del NEOCore™ / Public scrutiny of a NEOCore™ Neoaxiom™
title: "Síntesis Abierta / Open Synthesis · NAX-XX · "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Utiliza esta plantilla para aportar crítica, contraejemplo, evidencia, riesgo, implementación o propuesta de delta sobre un Neoaxioma™. La apertura de una aportación no implica su aceptación.

        Use this template to contribute criticism, a counterexample, evidence, risk, implementation or a proposed delta concerning a Neoaxiom™. Opening a contribution does not imply its acceptance.
  - type: input
    id: neoaxioma
    attributes:
      label: Neoaxioma / Neoaxiom
      description: Identificador y título, por ejemplo NAX-01. / Identifier and title, for example NAX-01.
    validations:
      required: true
  - type: textarea
    id: aporte
    attributes:
      label: Aporte / Contribution
      description: Expón el argumento completo. No sustituyas fuentes por resúmenes si son necesarias para evaluar el punto. / State the full argument. Do not replace sources with summaries when the sources are necessary to evaluate the point.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia, fuentes o contraejemplos / Evidence, sources or counterexamples
      description: Enlaces, datos, casos, pruebas, implementación o referencias verificables. / Links, data, cases, tests, implementation or verifiable references.
  - type: textarea
    id: relacion
    attributes:
      label: Relaciones con otros Neoaxiomas, manifiestos o publicaciones / Relations with other Neoaxioms, manifestos or publications
      description: Indica vínculos relevantes si los conoces. / Indicate relevant links if you know them.
