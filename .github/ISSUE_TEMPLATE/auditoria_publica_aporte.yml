name: Auditoría Pública · aporte o nueva propuesta / Public Audit · contribution or new proposal
description: Aporta una observación, prueba, caso, corrección o propuesta sin necesidad de completar el análisis causal. / Contribute an observation, evidence, case, correction or proposal without having to complete the causal analysis.
title: "Auditoría Pública / Public Audit · "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Este canal sirve para aportar observaciones, pruebas, refutaciones, casos comparables, correcciones o proponer una nueva Auditoría Pública / Síntesis de Problema.

        This channel is for contributing observations, evidence, refutations, comparable cases, corrections, or proposing a new Public Audit / Problem Synthesis.

        **No necesitas saber Git, preparar un informe técnico perfecto ni demostrar ya la causa.** Una pieza útil puede abrir contraste; el análisis causal, la trazabilidad completa y la propuesta de reparación pueden construirse después.

        **You do not need to know Git, prepare a perfect technical report, or already prove the cause.** One useful piece may open scrutiny; causal analysis, full traceability and repair proposals may be built afterwards.

        **ADMISIÓN ≠ VALIDACIÓN.** Una captura, testimonio o documento puede acreditar un resultado observable en un caso concreto sin demostrar por sí solo causa, intención ni responsabilidad.

        **ADMISSION ≠ VALIDATION.** A screenshot, testimony or document may establish an observable result in a specific case without by itself proving cause, intent or responsibility.

        Si una evidencia adquiere relevancia material, podrá preservarse después en el repositorio canónico. **La persona que aporta no tiene que realizar esa preservación técnica.**

        If evidence becomes materially relevant, it may later be preserved in the canonical repository. **The contributor does not have to perform that technical preservation.**

        Guía rápida / Quick guide: https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/propuestas/sintesis-abierta/GUIA_RAPIDA_APORTAR_EVIDENCIA_ES_EN.md
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de aporte / Contribution type
      options:
        - Observación o testimonio · Observation or testimony
        - Prueba nueva para auditoría existente · New evidence for an existing audit
        - Caso comparable · Comparable case
        - Refutación o evidencia contradictoria · Refutation or contradictory evidence
        - Corrección de cronología, hecho o metadatos · Chronology, fact or metadata correction
        - Pregunta o ambigüedad · Question or ambiguity
        - Propuesta de nueva auditoría · New audit proposal
        - Propuesta de reparación o resolución · Repair or resolution proposal
        - No sé cómo clasificarlo todavía · I do not yet know how to classify it
    validations:
      required: true
  - type: input
    id: auditoria
    attributes:
      label: Auditoría o problema relacionado / Related audit or problem
      description: Enlace al documento o Issue existente; si es nueva o no sabes dónde encaja, escribe NUEVA o NO SÉ. / Link to the existing document or Issue; if it is new or you do not know where it fits, write NEW or I DO NOT KNOW.
    validations:
      required: true
  - type: textarea
    id: objeto
    attributes:
      label: ¿Qué quieres aportar o contrastar? / What do you want to contribute or scrutinise?
      description: Explícalo con tus palabras. No necesitas terminología técnica. / Explain it in your own words. You do not need technical terminology.
    validations:
      required: true
  - type: textarea
    id: hechos
    attributes:
      label: ¿Qué observaste, encontraste o quieres señalar? / What did you observe, find or want to flag?
      description: Si puedes, separa lo observado de lo que interpretas. Si sólo tienes una pregunta o una fuente, indícalo. / If possible, separate observation from interpretation. If you only have a question or source, say so.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia disponible, si existe / Available evidence, if any
      description: Enlaces, capturas, imágenes, fechas, registros, comunicaciones u otros elementos. Si todavía no tienes evidencia, indica qué sería útil comprobar. / Links, screenshots, images, dates, records, communications or other elements. If you do not yet have evidence, state what would be useful to check.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### Para profundizar · opcional / To go deeper · optional
        Los campos siguientes ayudan a elevar el rigor, pero **no son una barrera de entrada**. / The following fields help increase rigour but **are not an entry barrier**.
  - type: textarea
    id: contexto
    attributes:
      label: Contexto de la prueba / Context of the evidence
      description: Fecha/hora aproximada, plataforma, pasos y resultado si los conoces. / Approximate date/time, platform, steps and result if known.
  - type: textarea
    id: incertidumbre
    attributes:
      label: ¿Qué no sabes todavía? / hipótesis alternativas / What do you not know yet? / alternative hypotheses
      description: No necesitas tener una explicación. `NO SÉ / I DON'T KNOW` es válido. / You do not need to have an explanation. `I DON'T KNOW` is valid.
  - type: textarea
    id: contradiccion
    attributes:
      label: ¿Qué podría contradecir tu interpretación? / What could contradict your interpretation?
      description: Si no lo sabes, déjalo abierto. / If you do not know, leave it open.
  - type: textarea
    id: resultado
    attributes:
      label: Resultado, prueba o reparación que sería útil / Useful result, test or repair
      description: Puede ser una explicación, una comprobación, una corrección, una reparación o simplemente abrir contraste. / It may be an explanation, check, correction, repair, or simply opening scrutiny.
  - type: textarea
    id: privacidad
    attributes:
      label: Privacidad y límites, si aplica / Privacy and limits, if applicable
      description: No publiques credenciales ni datos personales innecesarios. Indica si algo requiere anonimización. / Do not publish credentials or unnecessary personal data. State if something requires anonymisation.
  - type: checkboxes
    id: declaracion
    attributes:
      label: Declaraciones / Declarations
      options:
        - label: He intentado no presentar como hecho lo que sé que es sólo interpretación o hipótesis. / I have tried not to present as fact what I know is only interpretation or hypothesis.
          required: true
        - label: No he incluido deliberadamente credenciales ni datos personales innecesarios. / I have not deliberately included credentials or unnecessary personal data.
          required: true
        - label: Entiendo que admitir este aporte no significa validarlo y que el contraste puede corregir mi interpretación. / I understand that admitting this contribution does not validate it and scrutiny may correct my interpretation.
          required: true
  - type: markdown
    attributes:
      value: |
        **Cierre de Issue ≠ cierre epistemológico.** Nueva evidencia, contraejemplos o correcciones materialmente relevantes pueden justificar reevaluación y resíntesis. / **Issue closure ≠ epistemic closure.** Materially relevant new evidence, counterexamples or corrections may justify reevaluation and resynthesis.
