name: oneshot-sync-latest-lxv

on:
  push:
    paths:
      - '.github/workflows/oneshot-sync-latest-lxv.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize latest finite manifesto across documentation
        run: python .github/scripts/sync_latest_manifesto_feature.py
      - name: Remove oneshot and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/oneshot-sync-latest-lxv.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sincronizar LXV y Neoaxiomas en README y LEEME'
          git pull --rebase origin main
          git push origin main
