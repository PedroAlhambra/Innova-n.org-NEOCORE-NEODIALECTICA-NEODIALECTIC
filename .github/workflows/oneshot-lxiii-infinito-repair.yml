name: oneshot-lxiii-infinito-repair

on:
  push:
    paths:
      - '.github/workflows/oneshot-lxiii-infinito-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar LXIII, Infinito y reparar enlace
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          repo = 'https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC'
          legacy = 'manifiestos/63_contra_simplificacion_burda_marco_fidelidad_compresion_ES_EN.md'
          canonical = 'manifiestos/canonicos/LXIII_contra_simplificacion_burda_marco_fidelidad_compresion_ES_EN.md'
          issue = f'{repo}/issues/105'

          p = Path('manifiestos/deltas/XVI_delta_no_absolutizacion_escala_residuo_fenomenologico_umbral_x_ES_EN.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('../../obras/idea/RANSOL_RED_TIEMPO_ARBOLES_INVISIBLES_ETERNOS_ES_EN.md',
                        '../../obras/idea/RANSOL_RED_DEL_TIEMPO_ARBOLES_INVISIBLES_ETERNOS_ES_EN.md')
          p.write_text(s, encoding='utf-8')

          p = Path('manifiestos/README.md')
          s = p.read_text(encoding='utf-8')
          lxii = '- **LXII** · [Juego por la Síntesis y el Honor™ / The Game for Synthesis and Honor™](62_juego_por_la_sintesis_y_el_honor_neowar_starkdr_ransol_ES_EN.md)'
          lxiii = '- **LXIII** · [Contra la Simplificación Burda del Marco™ / Against Crude Simplification of the Framework™](63_contra_simplificacion_burda_marco_fidelidad_compresion_ES_EN.md)'
          inf = '- **∞** · [Neo0™ · Puerta Abierta del Fractal / Open Gate of the Fractal](INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md) · [Síntesis #106](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/106)'
          if lxiii not in s:
              s = s.replace(lxii, lxii + '\n' + lxiii)
          s = re.sub(r'\n- \*\*∞\*\* · \[Neo0™ · Puerta Abierta del Fractal[^\n]*', '', s)
          s = s.replace(lxiii, lxiii + '\n' + inf)
          s = s.replace('**62 manifiestos bilingües · I–LXII · 24 oleadas / 62 bilingual manifestos · I–LXII · 24 waves**',
                        '**63 manifiestos bilingües · I–LXIII · 24 oleadas / 63 bilingual manifestos · I–LXIII · 24 waves**')
          p.write_text(s, encoding='utf-8')

          p = Path('manifiestos/CANONICAL_FILENAMES.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data.setdefault('entries', {})['LXIII'] = {'legacy': legacy, 'canonical': canonical}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Sincronizar red documental
        run: |
          python .github/scripts/sync_open_synthesis_manifestos.py
          python .github/scripts/normalize_manifesto_indices.py
          python .github/scripts/sync_root_navigation.py
          python .github/scripts/sync_canonical_manifestos.py

      - name: Reforzar puerta Infinito tras normalización
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('manifiestos/README.md')
          s = p.read_text(encoding='utf-8')
          lxiii = '- **LXIII** · [Contra la Simplificación Burda del Marco™ / Against Crude Simplification of the Framework™](63_contra_simplificacion_burda_marco_fidelidad_compresion_ES_EN.md)'
          inf = '- **∞** · [Neo0™ · Puerta Abierta del Fractal / Open Gate of the Fractal](INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md) · [Síntesis #106](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/106)'
          s = re.sub(r'\n- \*\*∞\*\* · \[Neo0™ · Puerta Abierta del Fractal[^\n]*', '', s)
          if lxiii in s:
              s = s.replace(lxiii, lxiii + '\n' + inf)
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          r = p.read_text(encoding='utf-8')
          marker = '<!-- NEO_INFINITY_GATE_START -->'
          block = '''<!-- NEO_INFINITY_GATE_START -->

> **∞ · Puerta Abierta del Fractal / Open Gate of the Fractal**  
> Después del último manifiesto finito permanece [∞ · Neo0™](./manifiestos/INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md) · [Síntesis permanente #106](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/106). / After the latest finite manifesto remains [∞ · Neo0™](./manifiestos/INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md) · [permanent synthesis #106](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/106).

<!-- NEO_INFINITY_GATE_END -->'''
          if marker in r:
              r = re.sub(r'<!-- NEO_INFINITY_GATE_START -->.*?<!-- NEO_INFINITY_GATE_END -->', block, r, flags=re.S)
          else:
              anchor = '<!-- NEO_LATEST_MANIFESTO_END -->'
              r = r.replace(anchor, anchor + '\n\n' + block, 1)
          p.write_text(r, encoding='utf-8')

      - name: Auditar
        run: |
          python .github/scripts/audit_markdown_links_readmes.py

      - name: Verificar cierre
        shell: python
        run: |
          from pathlib import Path
          import json
          m = Path('manifiestos/README.md').read_text(encoding='utf-8')
          r = Path('README.md').read_text(encoding='utf-8')
          a = Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md').read_text(encoding='utf-8')
          reg = json.loads(Path('manifiestos/CANONICAL_FILENAMES.json').read_text(encoding='utf-8'))
          assert '63 manifiestos bilingües' in m and 'I–LXIII' in m
          assert m.index('**LXIII**') < m.index('**∞**')
          assert 'LXIII' in reg['entries']
          assert Path('manifiestos/canonicos/LXIII_contra_simplificacion_burda_marco_fidelidad_compresion_ES_EN.md').exists()
          assert 'INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md' in r
          assert '63 · I–LXIII' in a
          assert 'LXIII / #105' in a
          assert 'Enlaces internos rotos detectados: **0**' in a
          assert 'Fallos canónicos críticos: **0**' in a
          assert '**Estado / Status:** **OK**' in a

      - name: Commit reparación
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/oneshot-lxiii-infinito-repair.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs: integrar LXIII infinito y reparar red relacional'
            git push
          fi

      - name: Retirar one-shot
        if: always()
        run: |
          git pull --rebase || true
          git rm -f .github/workflows/oneshot-lxiii-infinito-repair.yml
          git commit -m 'ci: retirar one-shot LXIII infinito' || true
          git push || true
