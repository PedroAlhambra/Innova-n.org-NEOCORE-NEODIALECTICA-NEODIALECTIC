name: one-shot-sync-open-synthesis-and-manifesto-links

on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-open-synthesis-and-manifesto-links.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize and validate
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Commit content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs: complete Open Synthesis invitations and manifesto navigation'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Cleanup
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/one-shot-sync-open-synthesis-and-manifesto-links.yml
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove completed Open Synthesis and manifesto-link one-shot'
            git push origin main
          fi
