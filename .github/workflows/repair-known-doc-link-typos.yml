name: repair-known-doc-link-typos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-known-doc-link-typos.yml'
      - '.github/scripts/repair_known_doc_link_typos.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/repair_known_doc_link_typos.py
      - name: Commit repair if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analisis/publicos/2026-08-09_delta_manifestacion_sistemica_necesidad_neo0_idea_custodia_cognitiva_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: corregir enlace XXXIII en delta sistémico'
          git pull --rebase origin main
          git push origin main
