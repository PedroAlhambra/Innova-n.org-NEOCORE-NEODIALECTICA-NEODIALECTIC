          if en_eighth not in s:
              raise SystemExit('Open Synthesis EN eighth anchor missing')
          en_10 = en_eighth + '''\n\n## Ninth wave · Self-awareness, respect and civilisational defence\n\n| No. | Manifesto | Open Synthesis |\n|---:|---|---|\n| XXXIX | [Self-Awareness of Neodialectical Vital Need™](../../manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md) | [Issue #47](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/47) |\n| XL | [Neodialectical Respect, Neoego and Relational Honour™](../../manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md) | [Issue #48](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/48) |\n| XLI | [Limited Hammer, Talion and Protective Force™](../../manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md) | [Issue #49](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/49) |\n\n## Tenth wave · End of the Manipulated Human Era™\n\n| No. | Manifesto | Open Synthesis |\n|---:|---|---|\n| XLII | [End of the Manipulated Human Era™ · AI, Awakening and Cognitive Sovereignty](../../manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md) | [Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50) |\n\n* [Tenth-wave announcement](../../anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)'''
          s = s.replace(en_eighth, en_10, 1)
          save(p, s)

          # Public covers: keep layout and wording, only update canonical scope.
          for fname in ('PORTADA.md', 'COVER.md'):
              p, s = load(fname)
              s = s.replace('I–XXXVIII', 'I–XLII')
              save(p, s)

          # Remove this one-shot workflow in the same synchronization commit.
          Path('.github/workflows/one-shot-sync-xl42.yml').unlink()
          PY

