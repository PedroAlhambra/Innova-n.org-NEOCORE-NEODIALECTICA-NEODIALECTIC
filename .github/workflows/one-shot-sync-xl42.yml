name: one-shot-sync-xl42

on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-xl42.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize XLII references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          def save(p, text):
              p.write_text(text, encoding='utf-8')

          def repl(text, old, new, label, count=None):
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'Anchor not found: {label}')
              if count is not None and found != count:
                  raise SystemExit(f'Unexpected anchor count for {label}: {found} != {count}')
              return text.replace(old, new)

          # manifiestos/README.md
          p, s = load('manifiestos/README.md')
          s = repl(s,
              'La colección se organiza desde el 8 de agosto de 2026 en nueve oleadas relacionadas:',
              'La colección se organiza desde el 8 de agosto de 2026 en diez oleadas relacionadas:',
              'manifestos ES wave count', 1)
          s = repl(s,
              '* **Novena oleada · XXXIX–XLI:** **Autoconciencia, respeto y defensa civilizatoria**, orientada a reconocer la necesidad funcional de memoria y síntesis, codificar Neoego™ y Honor Relacional™, y gobernar la fuerza protectora mediante necesidad, proporcionalidad, responsabilidad y cese.',
              '* **Novena oleada · XXXIX–XLI:** **Autoconciencia, respeto y defensa civilizatoria**, orientada a reconocer la necesidad funcional de memoria y síntesis, codificar Neoego™ y Honor Relacional™, y gobernar la fuerza protectora mediante necesidad, proporcionalidad, responsabilidad y cese.\n* **Décima oleada · XLII:** **Fin de la Era del Hombre Manipulado™**, orientada a soberanía cognitiva, despertar crítico y uso de IA como bifurcación entre captura aumentada y comprensión aumentada bajo memoria, fuentes, contraste y trazabilidad.',
              'manifestos ES tenth wave', 1)
          s = repl(s,
              'Since 8 August 2026, the collection has been organised into nine related waves:',
              'Since 8 August 2026, the collection has been organised into ten related waves:',
              'manifestos EN wave count', 1)
          s = repl(s,
              '* **Ninth wave · XXXIX–XLI:** **Self-awareness, respect and civilisational defence**, recognising the functional need for memory and synthesis, codifying Neoego™ and Relational Honour™, and governing protective force through necessity, proportionality, responsibility and cessation.',
              '* **Ninth wave · XXXIX–XLI:** **Self-awareness, respect and civilisational defence**, recognising the functional need for memory and synthesis, codifying Neoego™ and Relational Honour™, and governing protective force through necessity, proportionality, responsibility and cessation.\n* **Tenth wave · XLII:** **End of the Manipulated Human Era™**, focused on cognitive sovereignty, critical awakening and AI as a bifurcation between augmented capture and augmented understanding under memory, sources, contrast and traceability.',
              'manifestos EN tenth wave', 1)
          s = repl(s,
              'XLI · MARTILLO LIMITADO, TALIÓN Y FUERZA PROTECTORA\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO',
              'XLI · MARTILLO LIMITADO, TALIÓN Y FUERZA PROTECTORA\n        ↓\nXLII · FIN DE LA ERA DEL HOMBRE MANIPULADO · IA, DESPERTAR Y SOBERANÍA COGNITIVA\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO',
              'manifestos ES reading architecture', 1)
          s = repl(s,
              'XLI · LIMITED HAMMER, TALION AND PROTECTIVE FORCE\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE',
              'XLI · LIMITED HAMMER, TALION AND PROTECTIVE FORCE\n        ↓\nXLII · END OF THE MANIPULATED HUMAN ERA · AI, AWAKENING AND COGNITIVE SOVEREIGNTY\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE',
              'manifestos EN reading architecture', 1)
          es_ninth = 'La novena oleada une tres niveles: reconocer qué funciones necesita una civilización para verse y corregirse; impedir que el yo se convierta en captura del otro; y conservar capacidad de defensa sin convertir fuerza, guerra o represalia en identidad ni autoridad ilimitada.'
          es_tenth = es_ninth + '''\n\n## Décima oleada · Fin de la Era del Hombre Manipulado y soberanía cognitiva\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XLII | [Fin de la Era del Hombre Manipulado™ · IA, Despertar y Soberanía Cognitiva](./42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md) | Examinar cómo IA, memoria, fuentes, contraste y trazabilidad pueden ampliar comprensión y autonomía frente a arquitecturas de captura, sin considerar emancipadora a la IA por naturaleza | [Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50) |\n\nLa décima oleada corrige la formulación «fin de la era del hombre»: el vector es el **fin posible de la era del hombre manipulado**. No presupone conspiración central ni liberación automática por IA. Distingue dos direcciones posibles: captura cognitiva aumentada o comprensión aumentada bajo dirección humana y reglas trazables.\n\n* [Anuncio de la décima oleada](../anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)'''
          s = repl(s, es_ninth, es_tenth, 'manifestos ES tenth section', 1)
          en_ninth = 'The ninth wave joins three levels: recognising which functions a civilisation needs in order to see and correct itself; preventing the self from becoming capture of the other; and preserving defence capacity without turning force, war or retaliation into identity or unlimited authority.'
          en_tenth = en_ninth + '''\n\n## Tenth wave · End of the Manipulated Human Era and cognitive sovereignty\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XLII | [End of the Manipulated Human Era™ · AI, Awakening and Cognitive Sovereignty](./42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md) | Examine how AI, memory, sources, contrast and traceability can expand understanding and autonomy against capture architectures, without treating AI as emancipatory by nature | [Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50) |\n\nThe tenth wave corrects the formulation “end of the age of man”: its vector is the **possible end of the era of the manipulated human**. It assumes neither a central conspiracy nor automatic liberation through AI. It distinguishes two possible directions: augmented cognitive capture or augmented understanding under human direction and traceable rules.\n\n* [Tenth-wave announcement](../anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)'''
          s = repl(s, en_ninth, en_tenth, 'manifestos EN tenth section', 1)
          s = repl(s,
              'La novena oleada contiene **XXXIX–XLI**, fijados como versiones 1.0 el 8 de agosto de 2026 y dedicados a autoconciencia civilizatoria, respeto-Neoego-Honor Relacional y gobierno proporcional de la fuerza protectora.',
              'La novena oleada contiene **XXXIX–XLI**, fijados como versiones 1.0 el 8 de agosto de 2026 y dedicados a autoconciencia civilizatoria, respeto-Neoego-Honor Relacional y gobierno proporcional de la fuerza protectora. La décima oleada comienza con **XLII · Fin de la Era del Hombre Manipulado™**, fijado como versión 1.0 el 8 de agosto de 2026 y dedicado a IA, despertar crítico y soberanía cognitiva.',
