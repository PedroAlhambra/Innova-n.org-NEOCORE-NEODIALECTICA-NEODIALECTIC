name: sync-bilingual-manifestos-45-47

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_manifestos_45_47_strict_symmetry.py'
      - '.github/workflows/sync-bilingual-manifestos-45-47.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore strict ES EN symmetry XLV-XLVII
        run: python .github/scripts/repair_manifestos_45_47_strict_symmetry.py
      - name: Commit repaired manifestos
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/45_multidimensionalidad_neodialectica_problema_mulo_soberania_distribuida_ES_EN.md \
                  manifiestos/46_cerrar_la_herida_comprension_evolutiva_memoria_reconciliacion_ES_EN.md \
                  manifiestos/47_odio_neo0_sino_goat_sombra_vinculo_doble_cara_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión XLV-XLVII'
          git pull --rebase origin main
          git push origin main
