name: one-shot-manifesto-readme-audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-audit-manifestos-readme.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Audit and repair
        shell: python
        run: |
          from pathlib import Path
          import re
          d=Path('manifiestos'); r=d/'README.md'
          vals={'I':1,'V':5,'X':10,'L':50,'C':100,'D':500,'M':1000}
          def ri(s):
              t=p=0
              for c in reversed(s):
                  v=vals[c]
                  if v<p:t-=v
                  else:t+=v;p=v
              return t
          items=[]
          for f in d.glob('*.md'):
              if f.name=='README.md': continue
              z=f.read_text(encoding='utf-8',errors='replace').splitlines()
              m=re.match(r'^#\s+([IVXLCDM]+)\s+·\s+(.+)$',z[0] if z else '')
              if m: items.append((ri(m.group(1)),m.group(1),m.group(2),f.name))
          items.sort(); nums=[x[0] for x in items]; expected=list(range(1,38))
          s=r.read_text(encoding='utf-8')
          s=s.replace('La colección se organiza desde el 7 de agosto de 2026 en siete oleadas relacionadas:','La colección canónica contiene **37 manifiestos bilingües, I–XXXVII**, organizados desde el 7 de agosto de 2026 en siete oleadas relacionadas:',1)
          s=s.replace('Since 7 August 2026, the collection has been organised into seven related waves:','The canonical collection contains **37 bilingual manifestos, I–XXXVII**, organised since 7 August 2026 into seven related waves:',1)
          s=s.replace('* continuidad simbólica sin restauración dogmática;\n* y transformación responsable de la memoria heredada.','* continuidad simbólica sin restauración dogmática;\n* transformación responsable de la memoria heredada;\n* y **Neofraternidad™** como arquitectura relacional de coexistencia, reconocimiento, actualización mutua y construcción de NeoNosotros™.',1)
          s=s.replace('XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO','XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n        ↓\nXXXVII · NEOFRATERNIDAD™\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO')
          s=s.replace('XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE','XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n        ↓\nXXXVII · NEOFRATERNITY™\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE')
          s=s.replace('La primera oleada queda formada por **doce manifiestos fundacionales**. Los once manifiestos anteriores permanecen fijados como versiones 1.1 y el Manifiesto III como versión 1.0.','La primera oleada queda formada por **doce manifiestos fundacionales**. Cada manifiesto conserva en su cabecera su versión vigente y su historial trazable; las revisiones posteriores no alteran el conteo canónico.')
          s=s.replace('The first wave comprises **twelve foundational manifestos**. The second wave contains Manifestos **XIII–XIX**.','The first wave comprises **twelve foundational manifestos**. Each manifesto preserves its current version and traceable history in its own header; later revisions do not alter the canonical count. The second wave contains Manifestos **XIII–XIX**.')
          r.write_text(s,encoding='utf-8')
          linked=set(re.findall(r'\]\(\./([^)]+\.md)\)',s)); files={x[3] for x in items}
          findings=[]
          if nums!=expected: findings.append('numeración real no es I–XXXVII')
          if files-linked: findings.append('faltan enlaces: '+', '.join(sorted(files-linked)))
          if 'XXXVII · NEOFRATERNIDAD™\n        ↓\nI · NEO0™' not in s: findings.append('arquitectura ES desactualizada')
          if 'XXXVII · NEOFRATERNITY™\n        ↓\nI · NEO0™' not in s: findings.append('arquitectura EN desactualizada')
          out=['# Postcheck · README de manifiestos I–XXXVII','','**Fecha / Date:** 2026-08-07  ','',f'- Archivos detectados / Files detected: **{len(items)}**',f'- Numeración / Numbering: **I–XXXVII**' if nums==expected else f'- Numeración detectada: `{nums}`',f'- Archivos no enlazados / Unlinked files: **{len(files-linked)}**','', '## Inventario / Inventory','']
          out += [f'- **{ro}** · `{fn}` · {title}' for _,ro,title,fn in items]
          out += ['', '## Dictamen / Verdict','', '**OK TOTAL:** los 37 manifiestos canónicos I–XXXVII existen y están enlazados desde `manifiestos/README.md`; la arquitectura ES/EN cierra XXXVI → XXXVII → I.' if not findings else '**INCIDENCIAS:** '+ '; '.join(findings)]
          Path('auditorias/publicas/2026-08-07_postcheck_readme_manifiestos_I_XXXVII.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          if findings:
              raise SystemExit('\n'.join(findings))
          Path('.github/workflows/one-shot-audit-manifestos-readme.yml').unlink()
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(manifestos): repair and verify README I-XXXVII'
          git push