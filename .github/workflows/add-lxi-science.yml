name: add-lxi-science

on:
  push:
    paths:
      - '.github/workflows/add-lxi-science.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add LXI to canonical manifesto index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('manifiestos/README.md')
          t = p.read_text(encoding='utf-8')
          new = '- **LXI** · [Contra el Reduccionismo Matemático™ y por la Custodia Experimental Multiescalar™ / Against Mathematical Reductionism™ and for Multiscale Experimental Custodianship™](61_contra_reduccionismo_matematico_custodia_experimental_multiescalar_ES_EN.md)'
          if new not in t:
              anchor = '- **LX** · [Relevancia Humana Necesaria™ · Inteligencia Distribuida, Aporte y Anti-Captura Social / Necessary Human Relevance™ · Distributed Intelligence, Contribution and Anti-Capture](60_relevancia_humana_necesaria_inteligencia_distribuida_aporte_anti_captura_social_ES_EN.md)'
              if anchor not in t:
                  raise SystemExit('LX anchor not found')
              t = t.replace(anchor, anchor + '\n' + new, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Retire one-shot workflow
        run: rm .github/workflows/add-lxi-science.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: indexar LXI y activar sincronización canónica'
          git pull --rebase origin main
          git push origin main
