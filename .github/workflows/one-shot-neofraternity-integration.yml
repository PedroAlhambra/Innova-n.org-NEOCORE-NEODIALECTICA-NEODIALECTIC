name: One-shot Neofraternity integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-neofraternity-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate XXXVII Neofraternity across canonical surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace(path, old, new, count=-1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  return False
              t=s.replace(old,new,count)
              p.write_text(t,encoding='utf-8')
              return True

          repo='PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC'
          issue='https://github.com/'+repo+'/issues/43'

          # XXXVI -> XXXVII -> I navigation.
          p='manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md'
          s=read(p)
          s=s.replace('[I · Neo0™ →](./11_neo0_soberania_de_guia_ES_EN.md)', '[XXXVII · Neofraternidad™ →](./37_neofraternidad_ES_EN.md)')
          if '# EN · English' in s:
              a,b=s.split('# EN · English',1)
              b=b.replace('XXXVII · Neofraternidad™', 'XXXVII · Neofraternity™')
              s=a+'# EN · English'+b
          write(p,s)

          p='manifiestos/11_neo0_soberania_de_guia_ES_EN.md'
          s=read(p)
          s=s.replace('36_corona_aguila_custodia_edad_del_hombre_ES_EN.md','37_neofraternidad_ES_EN.md')
          s=s.replace('XXXVI · Corona, Águila y Custodia de la Edad del Hombre™','XXXVII · Neofraternidad™')
          s=s.replace('Referencia interna · 36_corona_aguila_custodia_edad_del_hombre_ES_EN.md','Referencia interna · 37_neofraternidad_ES_EN.md')
          if '# EN · English' in s:
              a,b=s.split('# EN · English',1)
              b=b.replace('XXXVII · Neofraternidad™','XXXVII · Neofraternity™')
              b=b.replace('XXXVI · Crown, Eagle and Custodianship of the Age of Man™','XXXVII · Neofraternity™')
              b=b.replace('Internal reference · 36_corona_aguila_custodia_edad_del_hombre_ES_EN.md','Internal reference · 37_neofraternidad_ES_EN.md')
              s=a+'# EN · English'+b
          write(p,s)

          # Canonical manifesto index.
          p='manifiestos/README.md'
          s=read(p)
          s=s.replace('seis oleadas relacionadas','siete oleadas relacionadas')
          s=s.replace('six related waves','seven related waves')
          es6='* **Sexta oleada · XXXVI:** custodia civilizatoria, continuidad simbólica y transformación responsable de la memoria heredada.\n'
          es7=es6+'* **Séptima oleada · XXXVII:** **Neofraternidad™**, actualización mutua, autonomía relacional, reconocimiento y construcción de NeoNosotros™.\n'
          s=s.replace(es6,es7)
          en6='* **Sixth wave · XXXVI:** civilisational custodianship, symbolic continuity and responsible transformation of inherited memory.\n'
          en7=en6+'* **Seventh wave · XXXVII:** **Neofraternity™**, mutual updating, relational autonomy, recognition and construction of NeoNosotros™.\n'
          s=s.replace(en6,en7)
          s=s.replace('* and responsible transformation of inherited memory.','* responsible transformation of inherited memory;\n* and Neofraternity™ as a relational architecture of coexistence, recognition and mutual updating.')
          s=s.replace('→ XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO', '→ XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n        ↓\nXXXVII · NEOFRATERNIDAD™\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO')
          s=s.replace('→ XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE', '→ XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n        ↓\nXXXVII · NEOFRATERNITY™\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE')
          s=s.replace('La sexta oleada comienza con el Manifiesto **XXXVI**, fijado como versión 1.0 el 7 de agosto de 2026 y dedicado a custodia civilizatoria y continuidad simbólica.', 'La sexta oleada comienza con el Manifiesto **XXXVI**, fijado como versión 1.0 el 7 de agosto de 2026 y dedicado a custodia civilizatoria y continuidad simbólica. La séptima oleada comienza con **XXXVII · Neofraternidad™**, dedicado a la arquitectura relacional del NeoNosotros™.')
          s=s.replace('The sixth wave begins with Manifesto **XXXVI**, fixed as version 1.0 on 7 August 2026 and dedicated to civilisational custodianship and symbolic continuity.', 'The sixth wave begins with Manifesto **XXXVI**, fixed as version 1.0 on 7 August 2026 and dedicated to civilisational custodianship and symbolic continuity. The seventh wave begins with **XXXVII · Neofraternity™**, dedicated to the relational architecture of NeoNosotros™.')
          marker_es='La sexta oleada eleva a manifiesto autónomo el desarrollo genealógico de Corona y Águila, conservando el anexo previo como antecedente trazable.\n\n---\n\n# EN · English'
          insert_es='La sexta oleada eleva a manifiesto autónomo el desarrollo genealógico de Corona y Águila, conservando el anexo previo como antecedente trazable.\n\n## Séptima oleada · Neofraternidad y arquitectura relacional\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXVII | [Neofraternidad™](./37_neofraternidad_ES_EN.md) | Convertir vínculo, memoria compartida y diferencia en actualización mutua, autonomía, reconocimiento, límites, reciprocidad y capacidad de construir NeoNosotros™ sin absorción | [Issue #43]('+issue+') |\n\nLa séptima oleada lleva el marco a la unidad relacional mínima: singularidades capaces de crecer juntas sin dominarse, borrarse ni necesitar enemigos.\n\n---\n\n# EN · English'
          s=s.replace(marker_es,insert_es)
          marker_en='The sixth wave elevates the Crown and Eagle genealogical development to an autonomous manifesto while preserving the previous annex as a traceable antecedent.\n\n---\n\n**Innova_N · Manifiestos / Manifestos**'
          insert_en='The sixth wave elevates the Crown and Eagle genealogical development to an autonomous manifesto while preserving the previous annex as a traceable antecedent.\n\n## Seventh wave · Neofraternity and relational architecture\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXVII | [Neofraternity™](./37_neofraternidad_ES_EN.md) | Turn relationship, shared memory and difference into mutual updating, autonomy, recognition, boundaries, reciprocity and the capacity to build NeoNosotros™ without absorption | [Issue #43]('+issue+') |\n\nThe seventh wave brings the framework to its minimum relational unit: singularities capable of growing together without dominating, erasing or needing enemies.\n\n---\n\n**Innova_N · Manifiestos / Manifestos**'
          s=s.replace(marker_en,insert_en)
          write(p,s)

          # Open Synthesis index.
          p='propuestas/sintesis-abierta/README.md'
          s=read(p)
          s=s.replace('los **36 manifiestos I–XXXVI**','los **37 manifiestos I–XXXVII**')
          s=s.replace('the **36 manifestos I–XXXVI**','the **37 manifestos I–XXXVII**')
          s=s.replace('Índice completo de manifiestos I–XXXVI','Índice completo de manifiestos I–XXXVII')
          s=s.replace('Complete manifesto index I–XXXVI','Complete manifesto index I–XXXVII')
          es_marker='| XXXVI | [Corona, Águila y Custodia de la Edad del Hombre™](../../manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md) | [Issue #42](https://github.com/'+repo+'/issues/42) |\n\n## Síntesis de anexos y propuestas complementarias'
          es_insert='| XXXVI | [Corona, Águila y Custodia de la Edad del Hombre™](../../manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md) | [Issue #42](https://github.com/'+repo+'/issues/42) |\n\n## Séptima oleada · Neofraternidad y arquitectura relacional\n\n| Nº | Manifiesto | Síntesis Abierta |\n|---:|---|---|\n| XXXVII | [Neofraternidad™](../../manifiestos/37_neofraternidad_ES_EN.md) | [Issue #43]('+issue+') |\n\n## Síntesis de anexos y propuestas complementarias'
          s=s.replace(es_marker,es_insert)
          en_marker='| XXXVI | [Crown, Eagle and Custodianship of the Age of Man™](../../manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md) | [Issue #42](https://github.com/'+repo+'/issues/42) |\n\n## Annex and complementary-proposal syntheses'
          en_insert='| XXXVI | [Crown, Eagle and Custodianship of the Age of Man™](../../manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md) | [Issue #42](https://github.com/'+repo+'/issues/42) |\n\n## Seventh wave · Neofraternity and relational architecture\n\n| No. | Manifesto | Open Synthesis |\n|---:|---|---|\n| XXXVII | [Neofraternity™](../../manifiestos/37_neofraternidad_ES_EN.md) | [Issue #43]('+issue+') |\n\n## Annex and complementary-proposal syntheses'
          s=s.replace(en_marker,en_insert)
          write(p,s)

          # Root README + LEEME: keep byte-identical.
          p='README.md'
          s=read(p)
          s=s.replace('I–XXXVI','I–XXXVII')
          s=s.replace('* [XXXVI · Corona, Águila y Custodia de la Edad del Hombre™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md)\n', '* [XXXVI · Corona, Águila y Custodia de la Edad del Hombre™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md)\n* [XXXVII · Neofraternidad™](./manifiestos/37_neofraternidad_ES_EN.md)\n')
          s=s.replace('* [Síntesis Abierta XXXVI · Issue #42](https://github.com/'+repo+'/issues/42)\n', '* [Síntesis Abierta XXXVI · Issue #42](https://github.com/'+repo+'/issues/42)\n* [Síntesis Abierta XXXVII · Neofraternidad™ · Issue #43]('+issue+')\n')
          s=s.replace('* [XXXVI · Crown, Eagle and Custodianship of the Age of Man™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md)\n', '* [XXXVI · Crown, Eagle and Custodianship of the Age of Man™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md)\n* [XXXVII · Neofraternity™](./manifiestos/37_neofraternidad_ES_EN.md)\n')
          s=s.replace('* [Open Synthesis XXXVI · Issue #42](https://github.com/'+repo+'/issues/42)\n', '* [Open Synthesis XXXVI · Issue #42](https://github.com/'+repo+'/issues/42)\n* [Open Synthesis XXXVII · Neofraternity™ · Issue #43]('+issue+')\n')
          es6='| XXXVI | [Corona, Águila y Custodia de la Edad del Hombre™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md) | Custodia del legado humano compartido, continuidad simbólica y transformación responsable de la memoria | [Issue #42](https://github.com/'+repo+'/issues/42) |\n'
          es7=es6+'\n## Séptima oleada · Neofraternidad y arquitectura relacional · XXXVII\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXVII | [Neofraternidad™](./manifiestos/37_neofraternidad_ES_EN.md) | Actualización mutua, autonomía relacional, reconocimiento, límites, reciprocidad y NeoNosotros™ | [Issue #43]('+issue+') |\n'
          s=s.replace(es6,es7)
          en6='| XXXVI | [Crown, Eagle and Custodianship of the Age of Man™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md) | Custodianship of shared human legacy, symbolic continuity and responsible transformation of memory | [Issue #42](https://github.com/'+repo+'/issues/42) |\n'
          en7=en6+'\n## Seventh wave · Neofraternity and relational architecture · XXXVII\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXVII | [Neofraternity™](./manifiestos/37_neofraternidad_ES_EN.md) | Mutual updating, relational autonomy, recognition, boundaries, reciprocity and NeoNosotros™ | [Issue #43]('+issue+') |\n'
          s=s.replace(en6,en7)
          s=s.replace('→ XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n→ I · RETORNO A ORIGEN Y NUEVO CICLO', '→ XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n→ XXXVII · NEOFRATERNIDAD™\n→ I · RETORNO A ORIGEN Y NUEVO CICLO')
          s=s.replace('→ XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n→ I · RETURN TO ORIGIN AND NEW CYCLE', '→ XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n→ XXXVII · NEOFRATERNITY™\n→ I · RETURN TO ORIGIN AND NEW CYCLE')
          write('README.md',s)
          write('LEEME.md',s)

          # PORTADA and COVER: status and wave access.
          for p in ['PORTADA.md','COVER.md']:
              s=read(p)
              s=s.replace('treinta y seis manifiestos bilingües','treinta y siete manifiestos bilingües')
              s=s.replace('thirty-six bilingual manifestos','thirty-seven bilingual manifestos')
              s=s.replace('I–XXXVI','I–XXXVII')
              es6='* **Sexta oleada · XXXVI:** custodia civilizatoria, continuidad simbólica y transformación responsable de la memoria heredada.\n'
              if es6 in s and 'Séptima oleada · XXXVII' not in s:
                  s=s.replace(es6,es6+'* **Séptima oleada · XXXVII:** Neofraternidad™, autonomía relacional, actualización mutua y construcción de NeoNosotros™.\n')
              en6='* **Sixth wave · XXXVI:** civilisational custodianship, symbolic continuity and responsible transformation of inherited memory.\n'
              if en6 in s and 'Seventh wave · XXXVII' not in s:
                  s=s.replace(en6,en6+'* **Seventh wave · XXXVII:** Neofraternity™, relational autonomy, mutual updating and construction of NeoNosotros™.\n')
              es_link='* [XXXVI · Corona, Águila y Custodia de la Edad del Hombre™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md)\n'
              if es_link in s and '37_neofraternidad_ES_EN.md' not in s:
                  s=s.replace(es_link,es_link+'\n### Séptima oleada · Neofraternidad y arquitectura relacional\n\n* [XXXVII · Neofraternidad™](./manifiestos/37_neofraternidad_ES_EN.md)\n* [Síntesis Abierta XXXVII · Issue #43]('+issue+')\n')
              en_link='* [XXXVI · Crown, Eagle and Custodianship of the Age of Man™](./manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md)\n'
              if en_link in s and 'XXXVII · Neofraternity™' not in s:
                  s=s.replace(en_link,en_link+'\n### Seventh wave · Neofraternity and relational architecture\n\n* [XXXVII · Neofraternity™](./manifiestos/37_neofraternidad_ES_EN.md)\n* [Open Synthesis XXXVII · Issue #43]('+issue+')\n')
              write(p,s)

          # Wiki source orientation.
          p='wiki-source/Manifiestos.md'
          s=read(p)
          s=s.replace('I–XXXVI','I–XXXVII')
          s=s.replace('* **XXXVI:** custodia civilizatoria y continuidad simbólica.\n','* **XXXVI:** custodia civilizatoria y continuidad simbólica.\n* **XXXVII:** Neofraternidad™, actualización mutua y arquitectura relacional del NeoNosotros™.\n')
          s=s.replace('* **XXXVI:** civilisational custodianship and symbolic continuity.\n','* **XXXVI:** civilisational custodianship and symbolic continuity.\n* **XXXVII:** Neofraternity™, mutual updating and relational architecture of NeoNosotros™.\n')
          write(p,s)

          p='wiki-source/README.md'
          s=read(p)
          s=s.replace('**I–XXXVI**','**I–XXXVII**')
          s=s.replace('**XXXV → XXXVI → I → II**','**XXXV → XXXVI → XXXVII → I → II**')
          write(p,s)

          # Remove one-shot workflow itself.
          wf=Path('.github/workflows/one-shot-neofraternity-integration.yml')
          if wf.exists():
              wf.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(manifestos): integrate XXXVII Neofraternity across canonical surfaces'
          git push origin HEAD:main
