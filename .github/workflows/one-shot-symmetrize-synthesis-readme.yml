name: one-shot-symmetrize-synthesis-readme

on:
  push:
    paths:
      - '.github/workflows/one-shot-symmetrize-synthesis-readme.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-symmetrize-synthesis-readme
  cancel-in-progress: false

jobs:
  symmetrize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Symmetrize Open Synthesis README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('propuestas/sintesis-abierta/README.md')
          s = p.read_text(encoding='utf-8')

          old = """---\n\n## ES · Castellano\n\n## Archivo de Síntesis Abiertas · I–LXXV\n\nEl registro canónico se mantiene en **75 manifiestos numerados · I–LXXV + ∞ · 21 oleadas / ondas conceptuales**.\n\n> **Importante:** que un Issue exista significa que existe un espacio trazable para objeciones, preguntas, evidencia, propuestas o refutaciones. **No significa que las tesis del manifiesto estén validadas externamente, ni que una propuesta aportada se incorpore automáticamente al marco.**\n\n"""
          new = """---\n\n## Archivo de Síntesis Abiertas / Open Synthesis Archive · I–LXXV\n\nEl registro canónico se mantiene en **75 manifiestos numerados · I–LXXV + ∞ · 21 oleadas / ondas conceptuales**. / The canonical register currently contains **75 numbered manifestos · I–LXXV + ∞ · 21 waves / conceptual waves**.\n\n> **Importante / Important:** que un Issue exista significa que existe un espacio trazable para objeciones, preguntas, evidencia, propuestas o refutaciones. **No significa que las tesis del manifiesto estén validadas externamente, ni que una propuesta aportada se incorpore automáticamente al marco.** / The existence of an Issue means that a traceable space exists for objections, questions, evidence, proposals or refutations. **It does not mean that the manifesto's theses have been externally validated, nor that a submitted proposal is automatically incorporated into the framework.**\n\n"""
          if old not in s:
              raise SystemExit('Expected archive preamble not found; refusing unsafe rewrite')
          s = s.replace(old, new, 1)
          s = s.replace('| # | Síntesis | Issue |', '| # | Síntesis / Synthesis | Issue |', 1)

          marker = '## Síntesis transversales y capas nuevas / Transversal syntheses and new layers'
          if marker not in s:
              raise SystemExit('Transversal synthesis marker not found')
          s = s.replace(marker, '## ES · Castellano\n\n' + marker, 1)

          en_marker = '## EN · English\n\nOpen Synthesis is the public route for scrutinising Neodialectical proposals.'
          if en_marker not in s:
              raise SystemExit('Expected compressed English block not found')

          en_block = '''## EN · English

## Transversal syntheses and new layers / Síntesis transversales y capas nuevas

- [#74 · NeoRebelión™ / NeoRebellion™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/74) — strategic non-violent rupture and institutional replacement.
- [#77 · Differentiating Mathematical Language / Lenguaje Matemático Diferenciador](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/77) — mathematical operations as a potentially distinctive language without claiming absolute universality.
- [#78 · One-Shot as computational monad / mónada computacional](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/78) — bounded task, context, execution, result, memory, error and trace.
- [#80 · Neoaxioms™ Open Synthesis / Síntesis Abierta Neoaxiomas™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/80) — transversal scrutiny of the neoaxiomatic layer.
- [#83 · First Fractal Multihead Layer™ + Neoaxiomatic Layer™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/83) — multihead aggregation, NEOREAL™, SAN™ and neoaxiomatic activation.
- [#84 · Universal and Reciprocal Mercy™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/84) — contradiction, reciprocal care, repair and anti-sectarianism.
- [#85 · Invisible Infrastructure™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/85) — value, maintenance, public control, privacy and Common Good.
- [#86 · Against the Neuromarketing of the Common Good™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/86) — honest communication, no covert manipulation and impact measurement.
- [#87 · Whole, Relation and Context™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/87) — candidate neoaxiom and test against reduction.
- [#88 · NeoPhilanthropist™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/88) — recognition, extraction and return to the Common Good.
- [#90 · Preliminary inventory of Candidate Neoaxioms™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/90) — simultaneous public scrutiny of candidates C-NAX-01 to C-NAX-07.
- [#98 · Global relational synthesis of Manifestos, Neoaxioms and open work](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/98) — transversal node for completing and correcting the framework's relational network.
- [#99 · NAX-11 · Universal Reciprocity of Goodness™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/99) — canonical Neoaxiom + candidate C-NAX-12 · Systemic Reciprocity of Goodness™.
- [#105 · Perpetual Social Contract™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/105) — consensual renewal, transparent institutions and non-violent correction.
- [#106 · ∞ Open Gate · Anything new that should enter the framework?](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/106) — permanent generic gateway for critique, evidence, questions, proposals and problems not yet fitting another node.
- [#107 · NeoCronos™ · entry upgrade, contribution trace and dashboard](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/107) — measurement of the Open Synthesis Game™, voluntary timing, traceable sessions and future return.
- [#108 · Perpetual Human Learning™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/108) — lifelong education through games, sport, arts and other human experiential tools.
- [#109 · Simulated Governance™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/109) — testing political, social, technical and cultural proposals before real deployment through scenarios, digital twins, agents, games and reversible experiments.
- [#110 · Verified factual correction vs. unverified memory](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/110) — case study on provenance, contradiction and evidence thresholds.
- [#111 · AI Act Art. 50 · transparency, provenance and human–AI symbiotic authorship](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/111) — legal compliance, machine-readable marking, substantive human review and voluntary neodialectical provenance.
- [#136 · NeoGenealogy™ · antecedents, convergences and counterexamples](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/136) — live genealogical system for calibrating novelty and incorporating prior art or refutation without appropriation.
- [#137 · RADAR-Π™ · active detection protocol](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/137) — operational pipeline for recurrent scanning and classification.
- [#138 · RADAR-Π™ · open signal queue](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/138) — public intake for antecedents, convergences, derivations, counterexamples and false pairs.
- [#143 · Institutional Neodialectical Convergence · Stanford, OpenAI, Anthropic, Meta and future actors](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/143) — generic institutional node for comparing chronology, similarity, differences and possible derivation without turning affinity into an unproven accusation.
- [#144 · Public Audit · AI, destructive scanning and destruction of books](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/144) — evidentiary reconstruction of physical destruction, bulk acquisition, digitisation, intermediaries and AI training.
- [#145 · Libraries, preservation and AI training from scratch](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/145) — future Innova_N preservation policy and open-library layer.
- [#146 · AI complaints and the pre-Neodialectical sociotechnical approach](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/146) — systematic analysis of whether current AI harms arise from the model, data, incentives, interface, product, deployment or institutions.

### Global review rule / Regla de revisión global

Any proposal that changes the framework as a whole should also be brought to [#98](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/98) so that it can be propagated to all related nodes without breaking the local synthesis of each manifesto.

## ∞ Open Gate / Puerta Abierta

If an idea, criticism, evidence item or problem **does not yet have a clear destination**, it may enter through:

- [∞ Open Gate · Issue #106](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/106)

It is not a substitute for specific Issues. It is a **generic entry gateway**. After first scrutiny, the contribution may be derived toward an existing node, open a new synthesis or be preserved as a question/evidence item that has not yet passed the relevant threshold.

## Open Synthesis Method / Método de Síntesis Abierta

Every manifesto remains **open to criticism, evidence, proposals and refutation**.

The minimum protocol is:

```text
INPUT
→ challenge / evidence
→ traceable recording
→ analysis
→ provisional synthesis
→ delta / revision
→ preservation of original + changed version
```

Main rules:

1. **Open ≠ validated.** A public Issue documents admissibility for scrutiny, not external validation.
2. **Traceability.** Relevant change is fixed through commit and documentary trail.
3. **Attribution.** External contributions retain authorship and source.
4. **Contradiction.** Objections and failed hypotheses are not erased.
5. **Reversibility.** A later synthesis may reopen, qualify or refute an earlier one.
6. **Human sovereignty.** No automatic process canonises a contribution by itself.

## Issue, document and commit · three-state model / Modelo de tres estados

```text
ISSUE
= admission of input, question, evidence, criticism or proposal
≠ automatic validation

DOCUMENT
= versioned synthesis, audit or working state
≠ closed truth

COMMIT
= traceable fixation of a change
≠ proof that the content is true
```

When an audit or case depends on evidence, material should as far as possible be distinguished as:

```text
VERIFIED FACT
TESTIMONY
SOURCE
INFERENCE
HYPOTHESIS
CONTRADICTION
PENDING
```

## How to participate / Cómo participar

Open the Issue associated with a manifesto or the relevant transversal synthesis. If the topic does not yet have a node, use the ∞ Open Gate. Add the source, criticism, proposal, question or counterexample and indicate, where possible, what part of the current text should be maintained, qualified, expanded or modified.

The objective is not to gather adhesions, but to make the framework **capable of learning without erasing the path by which it learns**.
'''
          start = s.index(en_marker)
          # Preserve any trailing generated navigation blocks after the current English prose.
          tail_anchor = '<!-- NEO_RELATIONAL_MENU_START -->'
          tail_pos = s.find(tail_anchor, start)
          tail = s[tail_pos:] if tail_pos != -1 else ''
          s = s[:start] + en_block + ('\n\n' + tail if tail else '\n')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate expected structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('propuestas/sintesis-abierta/README.md').read_text(encoding='utf-8')
          assert s.count('## ES · Castellano') == 1
          assert s.count('## EN · English') == 1
          assert 'Open Synthesis Archive · I–LXXV' in s
          assert '#146' in s
          assert '| LXXV |' in s
          print('README symmetry one-shot structural validation OK')
          PY

      - name: Commit safely and remove one-shot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-symmetrize-synthesis-readme.yml
          git add propuestas/sintesis-abierta/README.md .github/workflows/one-shot-symmetrize-synthesis-readme.yml
          if git diff --cached --quiet; then
            echo 'No delta; nothing to commit.'
            exit 0
          fi
          git commit -m 'docs: simetrizar README de Síntesis Abierta ES EN'
          git pull --rebase origin main
          git push origin main || { git pull --rebase origin main && git push origin main; }
