name: normalize-manifesto-navigation-71

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/normalize_manifesto_navigation_71.py'
      - '.github/workflows/normalize-manifesto-navigation-71.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/normalize_manifesto_navigation_71.py
      - name: Commit navigation only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: navegación canónica aditiva I-LIX y anclas 7.1'
          git pull --rebase origin main
          git push origin main
