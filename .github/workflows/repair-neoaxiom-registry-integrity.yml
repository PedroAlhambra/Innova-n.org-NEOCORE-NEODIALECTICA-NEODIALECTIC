name: repair-neoaxiom-registry-integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-neoaxiom-registry-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Neoaxiom registry and live indexes
        run: python .github/scripts/repair_neoaxiom_registry_integrity.py

      - name: Correct dedicated audit compatibility with legacy candidate block styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/audit_neoaxiom_registry_integrity.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("        quotes = re.findall(r'^>\\s+\\*\\*(.+?)\\*\\*\\s*$', b, re.M)\n", "")
          s=s.replace("        if len(quotes) < 2:\n            problems.append(f'C-NAX-{n} necesita formulaciones destacadas completas en ambos idiomas / needs complete highlighted formulations in both languages')\n", "")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Audit Neoaxiom registry hard gate
        run: python .github/scripts/audit_neoaxiom_registry_integrity.py

      - name: Audit global ES EN symmetry with Neoaxiom gate
        run: python .github/scripts/audit_global_bilingual_symmetry.py

      - name: Verify repaired frontier explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          neo=Path('neoaxiomas/README.md').read_text(encoding='utf-8')
          block=neo.split('<!-- NEOAXIOM_CANDIDATES_72_START -->',1)[1].split('<!-- NEOAXIOM_CANDIDATES_72_END -->',1)[0]
          rows=[int(x) for x in re.findall(r'^\| \*\*C-NAX-(\d+) ·',block,re.M)]
          details=[int(x) for x in re.findall(r'^### C-NAX-(\d+) ·',block,re.M)]
          assert rows==list(range(15,25)), rows
          assert details==list(range(15,25)), details
          syn=Path('propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md').read_text(encoding='utf-8')
          assert '10 candidatos C-NAX-15–C-NAX-24' in syn
          assert '10 candidates C-NAX-15–C-NAX-24' in syn
          print('REPAIRED_FRONTIER_OK rows=10 details=10 range=15..24')
          PY

      - name: Commit repaired public state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-neoaxiom-registry-integrity.yml
          git rm .github/scripts/repair_neoaxiom_registry_integrity.py
          git add \
            neoaxiomas/README.md \
            propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md \
            propuestas/sintesis-abierta/NEOAXIOMAS_SINTESIS_ABIERTA_ES_EN.md \
            .github/scripts/audit_global_bilingual_symmetry.py \
            .github/scripts/audit_neoaxiom_registry_integrity.py \
            .github/workflows/audit-global-bilingual-symmetry.yml \
            auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md \
            auditorias/publicas/2026-08-16_auditoria_neoaxiomas_simetria_frontera_ES_EN.md
          if git diff --cached --quiet; then
            echo 'No repair delta found.'
            exit 0
          fi
          git commit -m 'fix: complete neoaxiom candidate registry and harden symmetry gate'
          git pull --rebase origin main
          git push origin main
