name: oneshot-retire-legacy-root-entry-files

on:
  push:
    paths:
      - '.github/workflows/oneshot-retire-legacy-root-entry-files.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-legacy-root-entry-files
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate living links, preserve historical links and retire duplicates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          ROOT = Path('.').resolve()
          REPO = 'PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC'
          # This commit is the last verified main state before the retirement step.
          HISTORICAL_PIN = 'd07d16e6b524137daf376fc4462da348f30a6a1e'
          LEGACY_NAMES = {'LEEME.md', 'PORTADA.md', 'COVER.md', 'PREFACIO.md', 'FOREWORD.md'}
          LEGACY_PATHS = {ROOT / x for x in LEGACY_NAMES}
          README = ROOT / 'README.md'
          if not README.exists():
              raise SystemExit('Canonical root README.md is missing')
          missing = [x for x in LEGACY_PATHS if not x.exists()]
          if missing:
              print('Already absent:', ', '.join(sorted(x.name for x in missing)))

          md_link = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')

          def rel_readme(path: Path) -> str:
              return os.path.relpath(README, start=path.parent).replace(os.sep, '/')

          def target_legacy_name(path: Path, target: str):
              raw = target.strip().strip('<>')
              clean = raw.split('#', 1)[0].split('?', 1)[0]
              # GitHub links to root legacy entries.
              m = re.search(r'github\.com/PedroAlhambra/Innova-n\.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/(?:blob/[^/]+/|raw/[^/]+/)?(LEEME|PORTADA|COVER|PREFACIO|FOREWORD)\.md$', clean)
              if m:
                  return m.group(1) + '.md'
              if clean.startswith(('http://', 'https://', 'mailto:', 'tel:', 'data:')):
                  return None
              try:
                  resolved = (path.parent / clean).resolve() if not clean.startswith('/') else (ROOT / clean.lstrip('/')).resolve()
              except Exception:
                  return None
              for lp in LEGACY_PATHS:
                  if resolved == lp:
                      return lp.name
              return None

          changed=[]
          for path in sorted(ROOT.rglob('*.md')):
              rel = path.relative_to(ROOT).as_posix()
              if '.git' in path.parts or rel.startswith('wiki-legacy-archive/'):
                  continue
              if path in LEGACY_PATHS:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              old = text

              def replace_link(m):
                  label, target = m.group(1), m.group(2)
                  legacy = target_legacy_name(path, target)
                  if not legacy:
                      return m.group(0)
                  # Historical audit documents must keep pointing to the exact
                  # retired artifact, not silently reinterpret it as README.
                  if rel.startswith('auditorias/publicas/'):
                      pinned = f'https://github.com/{REPO}/blob/{HISTORICAL_PIN}/{legacy}'
                      return f'[{label}]({pinned})'
                  return f'[Inicio / Home]({rel_readme(path)})'

              text = md_link.sub(replace_link, text)

              # The stable Wiki map must expose one canonical documentary gate,
              # not five aliases that all resolve to README.
              if rel == 'wiki-source/Mapa_del_Marco.md':
                  text = re.sub(
                      r'(## Núcleo documental\n\n)(.*?)(?=\n## Filosofía, memoria y principios)',
                      r'\1- [README raíz](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/README.md) — puerta documental canónica bilingüe. Los antiguos `LEEME.md`, `PORTADA.md`, `COVER.md`, `PREFACIO.md` y `FOREWORD.md` quedan retirados de `main`; su historia permanece en Git.\n',
                      text, count=1, flags=re.S)
                  text = re.sub(
                      r'(## Documentary core\n\n)(.*?)(?=\n## Philosophy, memory and principles)',
                      r'\1- [Root README](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/README.md) — canonical bilingual documentary gateway. The former `LEEME.md`, `PORTADA.md`, `COVER.md`, `PREFACIO.md` and `FOREWORD.md` are retired from `main`; their history remains in Git.\n',
                      text, count=1, flags=re.S)

              if text != old:
                  path.write_text(text, encoding='utf-8')
                  changed.append(rel)

          # Align permanent scripts with the canonical README-only entry rule.
          script = ROOT / '.github/scripts/sync_relational_navigation.py'
          s = script.read_text(encoding='utf-8')
          s = s.replace(
              "readmes=sorted({p for p in ROOT.rglob('README*.md') if '.git' not in p.parts}|({ROOT/'LEEME.md'} if (ROOT/'LEEME.md').exists() else set()))",
              "readmes=sorted({p for p in ROOT.rglob('README*.md') if '.git' not in p.parts})"
          )
          s = s.replace("print('README_LEEME',len(readmes),'MANIFESTOS',len(mans),'CHANGED',len(set(changed)))",
                        "print('README',len(readmes),'MANIFESTOS',len(mans),'CHANGED',len(set(changed)))")
          script.write_text(s, encoding='utf-8')

          script = ROOT / '.github/scripts/sync_latest_manifesto_feature.py'
          s = script.read_text(encoding='utf-8')
          s = s.replace('# Live README/LEEME surfaces follow CURRENT_VERSION. Dated audit snapshots',
                        '# Live README surfaces follow CURRENT_VERSION. Dated audit snapshots')
          s = s.replace("leeme = root / 'LEEME.md'\nif leeme.exists():\n    readmes.append(leeme)\n", '')
          s = s.replace("print('README_LEEME_TARGETS=',len(readmes))", "print('README_TARGETS=',len(readmes))")
          s = s.replace('across all README/LEEME surfaces;', 'across all README surfaces;')
          script.write_text(s, encoding='utf-8')

          script = ROOT / '.github/scripts/sync_historia_olvidada_relations.py'
          s = script.read_text(encoding='utf-8')
          s = s.replace('# 1) Canonical naming across README/LEEME files.', '# 1) Canonical naming across README files.')
          s = s.replace("for path in [p for p in ROOT.rglob('*.md') if p.name.startswith('README') or p.name == 'LEEME.md']:",
                        "for path in [p for p in ROOT.rglob('*.md') if p.name.startswith('README')]:")
          script.write_text(s, encoding='utf-8')

          script = ROOT / '.github/scripts/audit_global_bilingual_symmetry.py'
          s = script.read_text(encoding='utf-8')
          if "LEGACY_ROOT_NAMES =" not in s:
              needle = "EXCLUDED_PREFIXES = (\n    '.github/scripts/',\n    '.github/workflows/',\n    'manifiestos/canonicos/',\n)\n"
              replacement = needle + "LEGACY_ROOT_NAMES = {'LEEME.md', 'PORTADA.md', 'COVER.md', 'PREFACIO.md', 'FOREWORD.md'}\n"
              if needle not in s:
                  raise SystemExit('Cannot patch global symmetry exclusions')
              s = s.replace(needle, replacement, 1)
          if "'<!-- NEO_RELATED_MANIFESTOS_START -->'," not in s:
              s = s.replace("    '<!-- NEO_RELATED_WORK_START -->',\n", "    '<!-- NEO_RELATED_WORK_START -->',\n    '<!-- NEO_RELATED_MANIFESTOS_START -->',\n", 1)
          s = s.replace("return '_ES_EN' in p.name or p.name in {'README.md','LEEME.md','COVER.md','PORTADA.md'}",
                        "return '_ES_EN' in p.name or p.name == 'README.md'")
          old_loop = "    rel=p.relative_to(ROOT).as_posix()\n    if any(part in EXCLUDED_PARTS for part in p.parts): continue\n"
          new_loop = "    rel=p.relative_to(ROOT).as_posix()\n    if p.parent == ROOT and p.name in LEGACY_ROOT_NAMES: continue\n    if any(part in EXCLUDED_PARTS for part in p.parts): continue\n"
          if old_loop in s:
              s = s.replace(old_loop, new_loop, 1)
          script.write_text(s, encoding='utf-8')

          script = ROOT / '.github/scripts/audit_markdown_links_readmes.py'
          s = script.read_text(encoding='utf-8')
          s = s.replace(
              'Esos archivos permanecen temporalmente versionados mientras se migran referencias, pero no constituyen superficies canónicas vivas. / the living graph excludes `wiki-legacy-archive/` and the root legacy entry files `LEEME.md`, `PORTADA.md`, `COVER.md`, `PREFACIO.md` and `FOREWORD.md`. Those files remain temporarily versioned while references are migrated, but they are not living canonical surfaces.',
              'Esos nombres legacy no constituyen superficies canónicas vivas; tras su retirada de `main`, su contenido histórico permanece recuperable mediante Git. / the living graph excludes `wiki-legacy-archive/` and the root legacy entry files `LEEME.md`, `PORTADA.md`, `COVER.md`, `PREFACIO.md` and `FOREWORD.md`. Those legacy names are not living canonical surfaces; after retirement from `main`, their historical contents remain recoverable through Git.'
          )
          script.write_text(s, encoding='utf-8')

          # Retire the duplicate root entries only after routes and permanent
          # automation semantics have been migrated.
          for lp in sorted(LEGACY_PATHS):
              if lp.exists():
                  lp.unlink()
                  print('RETIRED', lp.name)

          # Verify that no living Markdown route points to a removed root file.
          unresolved=[]
          for path in sorted(ROOT.rglob('*.md')):
              rel = path.relative_to(ROOT).as_posix()
              if '.git' in path.parts or rel.startswith('wiki-legacy-archive/') or rel.startswith('auditorias/publicas/'):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for m in md_link.finditer(text):
                  if target_legacy_name(path, m.group(2)):
                      unresolved.append(f'{rel}: {m.group(0)}')
          if unresolved:
              raise SystemExit('Living legacy links remain:\n' + '\n'.join(unresolved[:100]))

          # Permanent scripts may mention legacy names only in explicit audit
          # exclusion/history rules, not as synchronization targets.
          checks = {
              '.github/scripts/sync_relational_navigation.py': "ROOT/'LEEME.md'",
              '.github/scripts/sync_latest_manifesto_feature.py': "root / 'LEEME.md'",
              '.github/scripts/sync_historia_olvidada_relations.py': "p.name == 'LEEME.md'",
          }
          for name, forbidden in checks.items():
              t=(ROOT/name).read_text(encoding='utf-8')
              if forbidden in t:
                  raise SystemExit(f'Legacy synchronization target remains in {name}: {forbidden}')

          print('MIGRATED_FILES', len(changed))
          print('LEGACY_ROOT_RETIRED', ','.join(sorted(LEGACY_NAMES)))
          print('POSTCHECK OK: README.md is the only root documentary entry on main; historical references are commit-pinned')
          PY

      - name: Re-run documentary and bilingual auditors locally
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/audit_markdown_links_readmes.py
          python .github/scripts/audit_global_bilingual_symmetry.py
          grep -F '**Estado / Status:** **OK**' auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md

      - name: Commit retirement and remove this one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneshot-retire-legacy-root-entry-files.yml
          git add -A
          git commit -m 'docs: retirar entradas legacy y consolidar README bilingüe'
          git pull --rebase origin main
          git push origin main
