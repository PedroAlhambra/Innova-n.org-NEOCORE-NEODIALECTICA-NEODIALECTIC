name: One-shot symmetry repair 2 2026-08-15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-symmetry-batch2-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact repairs
        run: python .github/scripts/repair_symmetry_batch2_20260815.py

      - name: Recalculate global bilingual audit
        run: python .github/scripts/audit_global_bilingual_symmetry.py

      - name: Validate patch
        run: git diff --check

      - name: Commit repairs and fresh audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            analisis/publicos/2026-08-07_parte-iii-ceuta-marruecos-evolucion-conflicto-investigaciones_ES_EN.md \
            analisis/publicos/2026-08-08_historia_olvidada_ceres_descompresion_arquetipica_generativa_ES_EN.md \
            manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md \
            manifiestos/37_neofraternidad_ES_EN.md \
            manifiestos/46_cerrar_la_herida_comprension_evolutiva_memoria_reconciliacion_ES_EN.md \
            .github/scripts/audit_global_bilingual_symmetry.py \
            auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'fix: complete remaining material ES-EN symmetry repairs'
          git push origin HEAD:main
