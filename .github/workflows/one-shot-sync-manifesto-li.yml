name: one-shot-sync-manifesto-li
on:
  push:
    paths:
      - '.github/li-sync-trigger.txt'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync manifesto LI
        run: python .github/scripts/sync_manifesto_li.py
      - name: Commit synchronized surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: integrate manifesto LI across canonical navigation and READMEs'
          git pull --rebase
          git push
      - name: Cleanup one-shot files
        run: |
          git pull --rebase
          git rm -f .github/workflows/one-shot-sync-manifesto-li.yml .github/scripts/sync_manifesto_li.py .github/li-sync-trigger.txt
          git commit -m 'chore: remove completed manifesto LI synchronization one-shot'
          git push
