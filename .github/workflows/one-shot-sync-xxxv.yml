name: one-shot-sync-xxxv

on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-xxxv.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize XXXV and indexes
        shell: python
        run: |
          from pathlib import Path

          repo = 'https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC'

          def rw(path):
              p=Path(path); return p, p.read_text(encoding='utf-8')
          def save(p,s): p.write_text(s,encoding='utf-8')

          # XXXV: add its own Open Synthesis issue.
          p,s=rw('manifiestos/35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md')
          if 'Issue #30' not in s:
              s=s.replace('* [Protocolo operativo actual para aportar](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)', f'* [Abrir la Síntesis Abierta de este manifiesto · Issue #30]({repo}/issues/30)\n* [Protocolo operativo actual para aportar](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)',1)
              s=s.replace('* [Current operational contribution protocol](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)', f'* [Open the Synthesis of this manifesto · Issue #30]({repo}/issues/30)\n* [Current operational contribution protocol](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)',1)
          save(p,s)

          # Navigation chain XXXIV -> XXXV -> I and XXXV -> I -> II.
          p,s=rw('manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md')
          s=s.replace('· [I · Neo0™ · Soberanía de Guía Neodialéctica](./11_neo0_soberania_de_guia_ES_EN.md) →','· [XXXV · Contra la Ridiculez Mediática y la Economía del Conflicto™](./35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md) →',1)
          s=s.replace('· [I · Neo0™ · Guiding Sovereignty](./11_neo0_soberania_de_guia_ES_EN.md) →','· [XXXV · Against Media Absurdity and the Conflict Economy™](./35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md) →',1)
          save(p,s)

          p,s=rw('manifiestos/11_neo0_soberania_de_guia_ES_EN.md')
          for old in ['← [XXXIV · Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md)','← [XXXI · Contra el Neuromarketing Antihumanista™](./31_contra_neuromarketing_antihumanista_ES_EN.md)']:
              s=s.replace(old,'← [XXXV · Contra la Ridiculez Mediática y la Economía del Conflicto™](./35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md)',1)
          for old in ['← [XXXIV · Operational Utility of the Framework and Perpetual Joint Audit™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md)','← [XXXI · Against Anti-Humanist Neuromarketing™](./31_contra_neuromarketing_antihumanista_ES_EN.md)']:
              s=s.replace(old,'← [XXXV · Against Media Absurdity and the Conflict Economy™](./35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md)',1)
          save(p,s)

          # Canonical manifesto index.
          p,s=rw('manifiestos/README.md')
          s=s.replace('cuatro oleadas relacionadas','cinco oleadas relacionadas')
          s=s.replace('four related waves','five related waves')
          if '* **Quinta oleada · XXXIII–XXXV:**' not in s:
              anchor='* **Cuarta oleada · XXV–XXXII:** **Rehumanización, custodia de la vida y coherencia civilizatoria**, orientada a esculpir conciencia mediante grandeza humana, impedir la deshumanización, proteger alimento y creadores, subordinar el dinero a la vida y mantener coherencia entre fines, medios y comunicación.'
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n* **Quinta oleada · XXXIII–XXXV:** transición, utilidad operativa, auditoría conjunta perpetua y reforma de la atención civilizatoria.',1)
          if '* **Fifth wave · XXXIII–XXXV:**' not in s:
              anchor='* **Fourth wave · XXV–XXXII:** **Rehumanisation, stewardship of life and civilisational coherence**, shaping consciousness through human greatness, preventing dehumanisation, protecting food and creators, subordinating money to life and preserving coherence among ends, means and communication.'
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n* **Fifth wave · XXXIII–XXXV:** transition, operational utility, perpetual joint audit and reform of civilisational attention.',1)
          es31='| XXXI | [Contra el Neuromarketing Antihumanista™](./31_contra_neuromarketing_antihumanista_ES_EN.md) | Distinguir persuasión legítima de explotación opaca de vulnerabilidades, sesgos y datos íntimos para capturar conducta | [Issue #25]('+repo+'/issues/25) |'
          es32='| XXXII | [Reversión Ideológica Neodialéctica™](./32_reversion_ideologica_neodialectica_mcluhan_neo0_ES_EN.md) | Revertir mecanismos mediáticos y sistémicos hacia autonomía, memoria, trazabilidad y dirección humana | [Issue #26]('+repo+'/issues/26) |'
          if es31 in s and es32 not in s: s=s.replace(es31,es31+'\n'+es32,1)
          en31='| XXXI | [Against Anti-Humanist Neuromarketing™](./31_contra_neuromarketing_antihumanista_ES_EN.md) | Distinguishes legitimate persuasion from opaque exploitation of vulnerability, bias and intimate data to capture behaviour | [Issue #25]('+repo+'/issues/25) |'
          en32='| XXXII | [Neodialectical Ideological Reversal™](./32_reversion_ideologica_neodialectica_mcluhan_neo0_ES_EN.md) | Reverses media and systemic mechanisms towards autonomy, memory, traceability and human direction | [Issue #26]('+repo+'/issues/26) |'
          if en31 in s and en32 not in s: s=s.replace(en31,en31+'\n'+en32,1)
          es34='| XXXIV | [Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | Demostrar aplicación práctica mediante auditorías públicas, autocorrección, memoria versionada y Síntesis Abierta permanente | [Issue #29]('+repo+'/issues/29) |'
          es35='| XXXV | [Contra la Ridiculez Mediática y la Economía del Conflicto™](./35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md) | Auditar la selección mediática de atención, conflicto, soluciones, ego institucional y aprendizaje civilizatorio | [Issue #30]('+repo+'/issues/30) |'
          if es34 in s and es35 not in s: s=s.replace(es34,es34+'\n'+es35,1)
          en34='| XXXIV | [Operational Utility of the Framework and Perpetual Joint Audit™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | Demonstrate practical application through public audits, self-correction, versioned memory and perpetual Open Synthesis | [Issue #29]('+repo+'/issues/29) |'
          en35='| XXXV | [Against Media Absurdity and the Conflict Economy™](./35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md) | Audits media allocation of attention, conflict, solutions, institutional ego and civilisational learning | [Issue #30]('+repo+'/issues/30) |'
          if en34 in s and en35 not in s: s=s.replace(en34,en34+'\n'+en35,1)
          s=s.replace('XXXI · CONTRA EL NEUROMARKETING ANTIHUMANISTA\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO','XXXI · CONTRA EL NEUROMARKETING ANTIHUMANISTA\n        ↓\nXXXII · REVERSIÓN IDEOLÓGICA NEODIALÉCTICA\n        ↓\nXXXIII · IDEA · PIEDRA ANGULAR Y ROSETTA CIVILIZATORIA\n        ↓\nXXXIV · UTILIDAD OPERATIVA Y AUDITORÍA CONJUNTA PERPETUA\n        ↓\nXXXV · CONTRA LA RIDICULEZ MEDIÁTICA Y LA ECONOMÍA DEL CONFLICTO\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO')
          s=s.replace('XXXI · AGAINST ANTI-HUMANIST NEUROMARKETING\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE','XXXI · AGAINST ANTI-HUMANIST NEUROMARKETING\n        ↓\nXXXII · NEODIALECTICAL IDEOLOGICAL REVERSAL\n        ↓\nXXXIII · IDEA · CIVILISATIONAL CORNERSTONE AND ROSETTA STONE\n        ↓\nXXXIV · OPERATIONAL UTILITY AND PERPETUAL JOINT AUDIT\n        ↓\nXXXV · AGAINST MEDIA ABSURDITY AND THE CONFLICT ECONOMY\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE')
          s=s.replace('The fourth wave contains Manifestos **XXV–XXXI**, fixed as version 1.0 on 7 August 2026.','The fourth wave contains Manifestos **XXV–XXXII**, fixed as version 1.0 on 7 August 2026. The fifth wave contains Manifestos **XXXIII–XXXV**, fixed as version 1.0 on 7 August 2026 and open to traceable revision.')
          s=s.replace('La cuarta oleada contiene los manifiestos **XXV–XXXI**, fijados como versiones 1.0 el 7 de agosto de 2026 y abiertos a revisión trazable. Cada texto conserva objeto propio para evitar solapamientos: formación, misericordia, alimento, creador vivo, dinero, medios y persuasión.','La cuarta oleada contiene los manifiestos **XXV–XXXII**, fijados como versiones 1.0 el 7 de agosto de 2026 y abiertos a revisión trazable. La quinta oleada contiene los manifiestos **XXXIII–XXXV**, también abiertos a revisión trazable, y conecta transición, utilidad operativa, auditoría conjunta y atención civilizatoria.')
          save(p,s)

          # Open Synthesis index: add XXXV next to XXXIV wherever fifth-wave table exists.
          p,s=rw('propuestas/sintesis-abierta/README.md')
          es34='| XXXIV | [Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](../../manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | [Issue #29]('+repo+'/issues/29) |'
          es35='| XXXV | [Contra la Ridiculez Mediática y la Economía del Conflicto™](../../manifiestos/35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md) | [Issue #30]('+repo+'/issues/30) |'
          if es34 in s and es35 not in s: s=s.replace(es34,es34+'\n'+es35,1)
          en34='| XXXIV | [Operational Utility of the Framework and Perpetual Joint Audit™](../../manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | [Issue #29]('+repo+'/issues/29) |'
          en35='| XXXV | [Against Media Absurdity and the Conflict Economy™](../../manifiestos/35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md) | [Issue #30]('+repo+'/issues/30) |'
          if en34 in s and en35 not in s: s=s.replace(en34,en34+'\n'+en35,1)
          save(p,s)

          # Root README and LEEME: make the current manifesto count and fifth wave visible without deleting prior content.
          for fname in ['README.md','LEEME.md']:
              p,s=rw(fname)
              s=s.replace('Índice navegable de manifiestos I–XXXI','Índice navegable de manifiestos I–XXXV')
              s=s.replace('Navigable manifesto index I–XXXI','Navigable manifesto index I–XXXV')
              es31='| XXXI | [Contra el Neuromarketing Antihumanista™](./manifiestos/31_contra_neuromarketing_antihumanista_ES_EN.md) | Persuadir, difundir y competir sin explotar vulnerabilidades ni capturar la conciencia | [Issue #25]('+repo+'/issues/25) |'
              if es31 in s and '## Quinta oleada · transición, utilidad operativa y atención civilizatoria' not in s:
                  section='''\n\n| XXXII | [Reversión Ideológica Neodialéctica™](./manifiestos/32_reversion_ideologica_neodialectica_mcluhan_neo0_ES_EN.md) | Revertir mecanismos heredados hacia autonomía, memoria, trazabilidad y dirección humana | [Issue #26]('''+repo+'''/issues/26) |\n\n## Quinta oleada · transición, utilidad operativa y atención civilizatoria · XXXIII–XXXV\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXIII | [IDEA · Piedra Angular y Piedra de Rosetta Civilizatoria™](./manifiestos/33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md) | Vehículo narrativo del Neorrenacimiento y reset sistémico mediante reemplazo | [Issue #28]('''+repo+'''/issues/28) |\n| XXXIV | [Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](./manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | Aplicación práctica, auditoría pública y autocorrección permanente | [Issue #29]('''+repo+'''/issues/29) |\n| XXXV | [Contra la Ridiculez Mediática y la Economía del Conflicto™](./manifiestos/35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md) | Atención civilizatoria, auditoría del conflicto y aprendizaje mediático | [Issue #30]('''+repo+'''/issues/30) |'''
                  s=s.replace(es31,es31+section,1)
              s=s.replace('→ XXXI · CONTRA EL NEUROMARKETING ANTIHUMANISTA\n→ I · RETORNO A ORIGEN Y NUEVO CICLO','→ XXXI · CONTRA EL NEUROMARKETING ANTIHUMANISTA\n→ XXXII · REVERSIÓN IDEOLÓGICA\n→ XXXIII · IDEA · PIEDRA ANGULAR Y ROSETTA\n→ XXXIV · UTILIDAD OPERATIVA Y AUDITORÍA PERPETUA\n→ XXXV · CONTRA LA RIDICULEZ MEDIÁTICA Y LA ECONOMÍA DEL CONFLICTO\n→ I · RETORNO A ORIGEN Y NUEVO CICLO')
              s=s.replace('→ XXXI · AGAINST ANTI-HUMANIST NEUROMARKETING\n→ I · RETURN TO ORIGIN AND NEW CYCLE','→ XXXI · AGAINST ANTI-HUMANIST NEUROMARKETING\n→ XXXII · IDEOLOGICAL REVERSAL\n→ XXXIII · IDEA · CORNERSTONE AND ROSETTA STONE\n→ XXXIV · OPERATIONAL UTILITY AND PERPETUAL AUDIT\n→ XXXV · AGAINST MEDIA ABSURDITY AND THE CONFLICT ECONOMY\n→ I · RETURN TO ORIGIN AND NEW CYCLE')
              save(p,s)

          # Remove this transient workflow from the resulting commit.
          Path('.github/workflows/one-shot-sync-xxxv.yml').unlink()
      - name: Commit synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs(manifestos): sync XXXV navigation and public indexes"
            git push
          fi
