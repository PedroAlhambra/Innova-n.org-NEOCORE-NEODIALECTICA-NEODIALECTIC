name: one-shot-xlv-multidimensionalidad

on:
  push:
    paths:
      - '.github/triggers/xlv-multidimensionalidad.trigger'

permissions:
  contents: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Propagate XLV and validate documentation
        run: python .github/scripts/one_shot_xlv_multidimensionalidad.py
      - name: Commit XLV propagation and postcheck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(manifestos): propagate XLV multidimensionality and validate links [skip ci]"
          git push
