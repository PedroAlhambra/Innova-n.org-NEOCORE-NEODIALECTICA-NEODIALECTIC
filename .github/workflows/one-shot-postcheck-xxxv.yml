name: one-shot-postcheck-xxxv
on:
  push:
    paths:
      - '.github/workflows/one-shot-postcheck-xxxv.yml'
permissions:
  contents: write
jobs:
  postcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct residual index labels
        shell: python
        run: |
          from pathlib import Path
          repo='https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC'
          for fname in ['README.md','LEEME.md']:
              p=Path(fname); s=p.read_text(encoding='utf-8')
              s=s.replace('Cuarta oleada · Rehumanización, custodia de la vida y coherencia civilizatoria · XXV–XXXI','Cuarta oleada · Rehumanización, custodia de la vida y coherencia civilizatoria · XXV–XXXII')
              s=s.replace('Fourth wave · Rehumanisation, stewardship of life and civilisational coherence · XXV–XXXI','Fourth wave · Rehumanisation, stewardship of life and civilisational coherence · XXV–XXXII')
              p.write_text(s,encoding='utf-8')
          p=Path('manifiestos/README.md'); s=p.read_text(encoding='utf-8')
          bullet=f'* [XXXII · Reversión Ideológica Neodialéctica™ · Issue #26]({repo}/issues/26)'
          marker=f'* [XXXI · Contra el Neuromarketing Antihumanista™ · Issue #25]({repo}/issues/25)'
          if marker in s and bullet not in s:
              s=s.replace(marker,marker+'\n'+bullet,1)
          bullet_en=f'* [XXXII · Neodialectical Ideological Reversal™ · Issue #26]({repo}/issues/26)'
          marker_en=f'* [XXXI · Against Anti-Humanist Neuromarketing™ · Issue #25]({repo}/issues/25)'
          if marker_en in s and bullet_en not in s:
              s=s.replace(marker_en,marker_en+'\n'+bullet_en,1)
          s=s.replace('La quinta oleada conecta transición y aplicación: IDEA aporta una puerta narrativa y una piedra de relación; la auditoría conjunta convierte el marco en una herramienta pública que debe demostrar utilidad mediante efectos verificables.','La quinta oleada conecta transición y aplicación: IDEA aporta una puerta narrativa y una piedra de relación; la auditoría conjunta convierte el marco en una herramienta pública que debe demostrar utilidad mediante efectos verificables; y la auditoría de la atención extiende esa exigencia al sistema mediático y a su economía del conflicto.')
          s=s.replace('The fifth wave connects transition and application: IDEA provides a narrative gateway and relational cornerstone; joint audit turns the framework into a public tool whose utility must be demonstrated through verifiable effects.','The fifth wave connects transition and application: IDEA provides a narrative gateway and relational cornerstone; joint audit turns the framework into a public tool whose utility must be demonstrated through verifiable effects; and attention audit extends that requirement to media systems and their conflict economy.')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/one-shot-postcheck-xxxv.yml').unlink()
      - name: Commit postcheck corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'docs(manifestos): postcheck XXXV index consistency' && git push; fi
