name: pr-neocore-73-cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance/neocore-73-cleanup-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run migration and current-surface sync
        run: |
          python .github/scripts/migrate_neocore_pre_73_refs.py
          python .github/scripts/sync_neocore_73_candidate.py

      - name: Retire transient migration script and keep workflow files untouched
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/sync_neocore_73_candidate.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import runpy\n','')
          s=s.replace("# Remove superseded numeric version labels before rebuilding the active 7.3-CANDIDATE surfaces.\nrunpy.run_path('.github/scripts/migrate_neocore_pre_73_refs.py', run_name='__main__')\n\n",'')
          p.write_text(s,encoding='utf-8')
          PY
          git rm -f .github/scripts/migrate_neocore_pre_73_refs.py
          git checkout -- .github/workflows

      - name: Verify non-workflow live tree has no obsolete NEOCore numeric version references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          raw=subprocess.check_output(['git','ls-files','-z'])
          files=[Path(x.decode()) for x in raw.split(b'\0') if x and not x.decode().startswith('.github/workflows/')]
          patterns=[
            re.compile(r'NEOCore™?[^\n]{0,80}\b7\.2\b',re.I),
            re.compile(r'\b7\.2\b[^\n]{0,80}NEOCore™?',re.I),
            re.compile(r'NEOCORE_7_2|neocore_7_2|NEOCORE_72|neocore-72',re.I),
            re.compile(r'\b(?:fijaci[oó]n|fixation|delta|versi[oó]n|version)\s+7\.2\b',re.I),
          ]
          bad=[]
          for p in files:
            if not p.exists(): continue
            try: text=p.read_text(encoding='utf-8')
            except Exception: continue
            for n,line in enumerate(text.splitlines(),1):
              if any(rx.search(line) for rx in patterns): bad.append((str(p),n,line[:220]))
          if bad:
            print('\n'.join(f'{p}:{n}: {line}' for p,n,line in bad[:200]))
            raise SystemExit(f'RESIDUAL_VERSION_REFS={len(bad)}')
          print('NON_WORKFLOW_OBSOLETE_NEOCORE_NUMERIC_VERSION_REFS=0')
          PY

      - name: Commit generated migration back to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: migrate all living NEOCore surfaces to 7.3-CANDIDATE'
          git push origin HEAD:${{ github.head_ref }}
