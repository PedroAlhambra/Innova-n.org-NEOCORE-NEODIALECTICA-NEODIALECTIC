# activated after registration on main; hardened reconciliation pass
name: Temporary public graph reconciliation

on:
  workflow_dispatch:

# Historical/one-shot writer: manual only. Living state is maintained by canonical reconcilers.
permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/one_shot_reconcile_all_public_surfaces.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: reconcile public living graph'
          git pull --rebase origin main
          git push origin main
