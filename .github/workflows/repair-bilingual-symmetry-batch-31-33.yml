name: repair-bilingual-symmetry-batch-31-33

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_bilingual_symmetry_batch_31_33.py'
      - '.github/workflows/repair-bilingual-symmetry-batch-31-33.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore strict bilingual symmetry XXXI-XXXIII
        run: python .github/scripts/repair_bilingual_symmetry_batch_31_33.py
      - name: Commit repaired source manifestos
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/31_contra_neuromarketing_antihumanista_ES_EN.md \
                  manifiestos/32_reversion_ideologica_neodialectica_mcluhan_neo0_ES_EN.md \
                  manifiestos/33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión XXXI-XXXIII'
          git pull --rebase origin main
          git push origin main
