name: cleanup-neocore-relational-layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cleanup_neocore_relational_layer.py'
      - '.github/workflows/cleanup-neocore-relational-layer.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/cleanup_neocore_relational_layer.py
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neoaxiomas/README.md README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: limpiar topología NAX y reforzar accesos relacionales'
          git pull --rebase origin main
          git push origin main
