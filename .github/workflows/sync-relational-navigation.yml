name: sync-relational-navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_relational_navigation.py'
      - '.github/workflows/sync-relational-navigation.yml'

permissions:
  contents: write

concurrency:
  group: neocore-relational-navigation-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize relational navigation only
        run: python .github/scripts/sync_relational_navigation.py
      - name: Commit managed navigation blocks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: enlazar Síntesis Relacional #98 en navegación gestionada'
          git pull --rebase origin main
          git push origin main
