name: Temporary repair language selector run22

on:
  push:
    paths:
      - '.github/workflows/repair-language-selector-run22.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair first language-navigation residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('analisis/publicos/2026-07-13-religion-identidad-dogma-conciencia-neodialectica_ES_EN.md')
          text = p.read_text(encoding='utf-8')
          old = '[🇬🇧 Go to English version / Ir a la versión en inglés ↓ ](#en)'
          new = '[ES](#es) · [EN](#en)'
          if new in text:
              raise SystemExit('selector already repaired')
          if old not in text:
              raise SystemExit('expected legacy one-way selector not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Run selector audit and preserve report
        shell: bash
        run: |
          set +e
          python .github/scripts/audit_language_selectors.py
          echo "selector_exit=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Commit repair and audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            analisis/publicos/2026-07-13-religion-identidad-dogma-conciencia-neodialectica_ES_EN.md \
            auditorias/publicas/2026-08-24_auditoria_global_selectores_idioma_ES_EN.md
          git commit -m 'fix(nav): restore ES/EN selector in religion and identity analysis'
          git pull --rebase origin main
          git push origin main
      - name: Preserve blocking result
        shell: bash
        run: |
          if [ "${selector_exit}" -ne 0 ]; then
            echo 'LANGUAGE_SELECTOR_GATE remains FAIL as expected while residues remain.'
          fi
