name: Verify relational Neoaxiom index repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dynamic Neoaxiom frontier parser
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/audit_relations_neocore.py
          python .github/scripts/audit_neoaxiom_registry_integrity.py
          python .github/scripts/audit_neoaxiom_reading_routes.py
          python .github/scripts/audit_relations_neocore.py
