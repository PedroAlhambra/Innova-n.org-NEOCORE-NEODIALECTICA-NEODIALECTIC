name: Reconcile NEOCore version surfaces

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/reconcile_neocore_version_surfaces.py'
      - '.github/workflows/reconcile-neocore-version-surfaces.yml'
      - 'versiones/**'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile living surfaces
        run: python .github/scripts/reconcile_neocore_version_surfaces.py
      - name: Commit reconciled surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/README.md neoaxiomas/README.md web4/README.md wiki-source/README.md propuestas/sintesis-abierta/README.md
          git commit -m 'docs: reconcile living NEOCore version references'
          git reset --hard HEAD
          git pull --rebase origin main
          git push
