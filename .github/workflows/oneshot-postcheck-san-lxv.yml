name: oneshot-postcheck-san-lxv

on:
  push:
    paths:
      - '.github/workflows/oneshot-postcheck-san-lxv.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  postcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Markdown, README, indices and repository-local links
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Enforce healthy graph
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md')
          text=p.read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in text:
              print(text)
              raise SystemExit('Documentary graph is not healthy.')
          print('DOCUMENTARY_GRAPH=OK')
          PY
      - name: Remove oneshot and commit report
        run: |
          set -euo pipefail
          rm -f .github/workflows/oneshot-postcheck-san-lxv.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md .github/workflows/oneshot-postcheck-san-lxv.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: postcheck SAN LXV y grafo documental'
          git pull --rebase origin main
          git push origin main
