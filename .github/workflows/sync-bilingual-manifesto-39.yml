name: sync-bilingual-manifesto-39
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_manifesto_39_strict_symmetry.py'
      - '.github/workflows/sync-bilingual-manifesto-39.yml'
permissions:
  contents: write
concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/repair_manifesto_39_strict_symmetry.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión en XXXIX'
          git pull --rebase origin main
          git push origin main
