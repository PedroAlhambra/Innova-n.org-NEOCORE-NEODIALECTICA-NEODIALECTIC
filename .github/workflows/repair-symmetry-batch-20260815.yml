name: One-shot symmetry repair 2026-08-15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-symmetry-batch-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact symmetry repairs
        run: python .github/scripts/repair_symmetry_batch_20260815.py

      - name: Validate patch
        run: git diff --check

      - name: Commit repaired manifestos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            manifiestos/50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md \
            manifiestos/51_sintesis_abierta_poder_civico_complementario_sustitutivo_jefaturas_estado_ES_EN.md \
            manifiestos/52_ciudadania_humana_neodialectica_sangre_suelo_pertenencia_civica_funcional_ES_EN.md \
            manifiestos/54_riqueza_chatarra_chatarrero_restauracion_civilizatoria_ES_EN.md
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: restore structural ES-EN symmetry in manifestos L-LIV'
          git push origin HEAD:main
