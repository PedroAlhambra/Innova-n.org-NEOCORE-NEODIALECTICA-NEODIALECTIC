name: repair-bilingual-symmetry-batch-25-30

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_bilingual_symmetry_batch_25_30.py'
      - '.github/workflows/repair-bilingual-symmetry-batch-25-30.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore strict bilingual structure XXV-XXX
        run: python .github/scripts/repair_bilingual_symmetry_batch_25_30.py
      - name: Commit repaired source manifestos
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/25_pulido_de_la_piedra_ES_EN.md \
                  manifiestos/27_valor_alimentos_vida_ES_EN.md \
                  manifiestos/28_los_tesla_ES_EN.md \
                  manifiestos/29_idolatria_del_dinero_ES_EN.md \
                  manifiestos/30_coherencia_fines_medios_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión XXV-XXX'
          git pull --rebase origin main
          git push origin main
