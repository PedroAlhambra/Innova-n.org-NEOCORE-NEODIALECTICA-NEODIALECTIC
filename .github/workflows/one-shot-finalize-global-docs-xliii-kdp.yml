name: one-shot-finalize-global-docs-xliii-kdp

on:
  push:
    paths:
      - '.github/triggers/finalize-global-docs-xliii-kdp.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair remaining README metadata and audit index
        run: |
          python - <<'PY'
          from pathlib import Path

          # The four READMEs flagged by the previous run are bilingual but use
          # interleaved or plain ## ES / ## EN structures rather than the exact
          # selector string. Broaden the validator without weakening the content check.
          s = Path('.github/scripts/one_shot_finalize_global_docs_xliii_kdp.py')
          text = s.read_text(encoding='utf-8')
          old = "        if ('ES ·' not in t) or ('EN ·' not in t):\n            out.append(str(p))"
          new = "        bilingual = ((('[ES ·' in t) and ('[EN ·' in t)) or (('## ES' in t) and ('## EN' in t)) or ((' / ' in t) and any(k in t for k in ['Public','Current','Canonical','Main','Works','Audits','Manifestos','English','Open Synthesis','Minimal Wiki source','Public audits'])))\n        if not bilingual:\n            out.append(str(p))"
          if old not in text:
              raise SystemExit('validator patch target not found')
          s.write_text(text.replace(old, new), encoding='utf-8')

          # Wiki-source README still carried a historical XXXVII state even though
          # its canonical navigation footer was current. Synchronise the recorded state.
          p = Path('wiki-source/README.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('**I–XXXVII**, enlazados desde `manifiestos/README.md`', '**I–XLIII**, enlazados desde `manifiestos/README.md`')
          t = t.replace('**XXXV → XXXVI → XXXVII → I → II**', '**XLI → XLII → XLIII → I → II**')
          if 'Último manifiesto / Latest manifesto:' not in t:
              needle = '* Manifiestos / Manifestos: **I–XLIII**, enlazados desde `manifiestos/README.md`\n'
              if needle in t:
                  t = t.replace(needle, needle + '* Último manifiesto / Latest manifesto: **XLIII · Contra la Incomprensión Reductiva de la IA™ / Against the Reductive Misunderstanding of AI™**\n', 1)
          p.write_text(t, encoding='utf-8')

          # Make the public-audit index narrate the 8-Aug response explicitly,
          # not only through the canonical KDP trace block appended below.
          p = Path('auditorias/publicas/README.md')
          t = p.read_text(encoding='utf-8')
          anchor = '### Casos de éxito, reapertura y aporte al Bien Común / Success cases, reopening and Common-Good contribution\n'
          entry = '''\n* [2026-08-08 · Respuesta KDP sobre «cambios sin publicar» y estado actual del caso 51071689](./2026-08-08_addendum_kdp_respuesta_cambios_sin_publicar_51071689_ES_EN.md)\n\n  KDP confirma que los títulos pueden dejarse en ese estado si no existen cambios reales y que ello no afecta a su disponibilidad actual. Soporte no identifica la causa raíz, el campo pendiente ni la relación con correcciones internas previas. El autor solicita mantener o reabrir el seguimiento técnico antes de republicar únicamente para limpiar el indicador visual.\n\n* [2026-08-08 · KDP response on “unpublished changes” and current state of case 51071689](./2026-08-08_addendum_kdp_respuesta_cambios_sin_publicar_51071689_ES_EN.md)\n\n  KDP confirms that titles may be left in that state when no real changes are required and that current availability is unaffected. Support does not identify the root cause, pending field or relation to earlier internal corrections. The author requests continued or reopened technical follow-up before republishing solely to clear the visual indicator.\n'''
          if '2026-08-08 · Respuesta KDP sobre' not in t:
              if anchor not in t:
                  raise SystemExit('audit README anchor not found')
              t = t.replace(anchor, anchor + entry, 1)
          t = t.replace('Caso de éxito provisional: auditoría gratuita a Amazon KDP y Author Central', 'Hito de éxito operativo provisional: auditoría gratuita a Amazon KDP y Author Central')
          t = t.replace('Provisional success case: free audit for Amazon KDP and Author Central', 'Provisional operational-success milestone: free audit for Amazon KDP and Author Central')
          t = t.replace('El estado actual debe complementarse con el addendum de reapertura del 7 de agosto.', 'El estado actual debe leerse junto con los addenda del 7 y 8 de agosto.')
          t = t.replace('The current status must be supplemented by the 7 August reopening addendum.', 'The current status must be read together with the 7 and 8 August addenda.')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Synchronise XLIII and validate repository documentation
        run: python .github/scripts/one_shot_finalize_global_docs_xliii_kdp.py
      - name: Commit final synchronisation and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(audit): finalize XLIII, KDP traceability and global link integrity [skip ci]"
            git push
          fi
