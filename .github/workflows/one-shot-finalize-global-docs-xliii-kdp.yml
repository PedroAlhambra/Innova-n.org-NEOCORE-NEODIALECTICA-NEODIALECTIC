name: one-shot-finalize-global-docs-xliii-kdp

on:
  push:
    paths:
      - '.github/triggers/finalize-global-docs-xliii-kdp.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronise XLIII and validate repository documentation
        run: python .github/scripts/one_shot_finalize_global_docs_xliii_kdp.py
      - name: Commit final synchronisation and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(audit): finalize XLIII, KDP traceability and global link integrity [skip ci]"
            git push
          fi
