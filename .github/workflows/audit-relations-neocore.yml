# trigger: 2026-08-25 · relational coverage aligned with audited corpus
name: audit-relations-neocore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/scripts/audit_relations_neocore.py'
      - '.github/workflows/audit-relations-neocore.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/scripts/audit_relations_neocore.py'
      - '.github/workflows/audit-relations-neocore.yml'

permissions:
  contents: read

concurrency:
  group: neocore-relational-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run non-reductive relational audit
        run: python .github/scripts/audit_relations_neocore.py
      - name: Confirm audit outputs were generated
        run: |
          test -s auditorias/publicas/2026-08-09_auditoria_relacional_manifestos_neoaxiomas_publicaciones_ES_EN.md
          test -s auditorias/publicas/2026-08-09_auditoria_relacional_manifestos_neoaxiomas_publicaciones.json
          echo 'RELATIONAL_AUDIT_OUTPUTS=GENERATED_EPHEMERALLY'
