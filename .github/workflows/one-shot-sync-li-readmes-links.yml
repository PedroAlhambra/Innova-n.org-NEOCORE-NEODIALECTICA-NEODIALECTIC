name: one-shot-sync-li-readmes-links
on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-li-readmes-links.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize READMEs and LI links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re

          root=Path('.')
          mdir=root/'manifiestos'
          mfiles=[]
          for p in sorted(mdir.glob('[0-9][0-9]_*.md')):
              txt=p.read_text(encoding='utf-8')
              m=re.search(r'^#\s+([IVXLCDM]+)\s+·\s+(.+)$',txt,re.M)
              if m:
                  mfiles.append((p,m.group(1),m.group(2).strip()))
          if len(mfiles)!=51:
              raise SystemExit(f'Expected 51 manifesto files, found {len(mfiles)}')

          def rel(from_file,to_file):
              return os.path.relpath(to_file, start=from_file.parent).replace(os.sep,'/')

          def network_block(readme):
              idx=rel(readme,mdir/'README.md')
              lines=[
                  '<!-- NEO_ALL_MANIFESTOS_START -->','',
                  '## Red completa de manifiestos / Complete manifesto network','',
                  '**Estado canónico / Canonical state:** **51 manifiestos bilingües · I–LI · 18 oleadas / 51 bilingual manifestos · I–LI · 18 waves**  ',
                  f'**Índice canónico / Canonical index:** [{idx}]({idx})','',
                  '<details>','<summary><strong>I–LI · 51 manifiestos / 51 manifestos</strong></summary>',''
              ]
              for p,roman,title in mfiles:
                  href=rel(readme,p)
                  lines.append(f'- **{roman}** · [{title}]({href})')
              lines += ['', '</details>','',
                  '> **Regla de lectura / Reading rule:** ningún manifiesto equivale por sí solo al marco completo. Esta navegación mantiene los 51 manifiestos accesibles desde cualquier README sin sustituir el contexto propio de cada nodo. / No single manifesto equals the complete framework. This navigation keeps all 51 manifestos accessible from every README without replacing each node’s own context.','',
                  '<!-- NEO_ALL_MANIFESTOS_END -->']
              return '\n'.join(lines)

          changed=[]
          readmes=sorted(set(root.rglob('README.md')) | {root/'LEEME.md'})
          for f in readmes:
              if not f.exists(): continue
              s=f.read_text(encoding='utf-8')
              old=s
              idx=rel(f,mdir/'README.md')
              current=('<!-- MANIFESTOS_CURRENT_START -->\n\n'
                       '**Colección completa de manifiestos / Complete manifesto collection:** **I–LI · 51 manifiestos bilingües / 51 bilingual manifestos** · '
                       f'[índice canónico / canonical index]({idx})\n\n'
                       '<!-- MANIFESTOS_CURRENT_END -->')
              if '<!-- MANIFESTOS_CURRENT_START -->' in s and '<!-- MANIFESTOS_CURRENT_END -->' in s:
                  s=re.sub(r'<!-- MANIFESTOS_CURRENT_START -->.*?<!-- MANIFESTOS_CURRENT_END -->',current,s,flags=re.S)
              else:
                  # add immediately after language selector/top intro rather than destroying local content
                  pos=s.find('\n---\n')
                  if pos<0: pos=min(len(s), max(0,s.find('\n', s.find('\n')+1)))
                  s=s[:pos]+('\n\n'+current+'\n')+s[pos:]
              nb=network_block(f)
              if '<!-- NEO_ALL_MANIFESTOS_START -->' in s and '<!-- NEO_ALL_MANIFESTOS_END -->' in s:
                  s=re.sub(r'<!-- NEO_ALL_MANIFESTOS_START -->.*?<!-- NEO_ALL_MANIFESTOS_END -->',nb,s,flags=re.S)
              else:
                  anchor='<!-- MANIFESTOS_CURRENT_END -->'
                  i=s.find(anchor)
                  i=i+len(anchor) if i>=0 else 0
                  s=s[:i]+'\n\n'+nb+s[i:]
              # only canonical collection-state phrases, not historical audit prose
              s=re.sub(r'\b50 manifiestos bilingües · I[–-]L · 17 oleadas\b','51 manifiestos bilingües · I–LI · 18 oleadas',s)
              s=re.sub(r'\b50 bilingual manifestos · I[–-]L · 17 waves\b','51 bilingual manifestos · I–LI · 18 waves',s)
              if s!=old:
                  f.write_text(s,encoding='utf-8'); changed.append(str(f))

          li=mdir/'51_sintesis_abierta_poder_civico_complementario_sustitutivo_jefaturas_estado_ES_EN.md'
          l=mdir/'50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md'
          analysis=root/'analisis/publicos/2026-08-08_accesibilidad_institucional_escalado_ciudadano_jefaturas_estado_ES_EN.md'
          relmap=mdir/'RELACIONES_TRABAJO_APLICADO_ES_EN.md'
          wiki=root/'wiki-source/Manifiestos.md'
          synth=root/'propuestas/sintesis-abierta/README.md'

          # Reciprocal applied-work relation
          if analysis.exists():
              s=analysis.read_text(encoding='utf-8'); old=s
              href=rel(analysis,li)
              if str(li.name) not in s:
                  s += f'\n\n## Relación manifiesto / Manifesto relation\n\n- [LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™]({href})\n- [Síntesis Abierta LI · Issue #59](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/59)\n'
              if s!=old: analysis.write_text(s,encoding='utf-8'); changed.append(str(analysis))

          if relmap.exists():
              s=relmap.read_text(encoding='utf-8'); old=s
              if li.name not in s:
                  s += ('\n\n## LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™ / Open Synthesis as Complementary or Substitutive Civic Power™\n\n'
                        f'- [Manifiesto LI](./{li.name})\n'
                        '- [Análisis aplicado sobre accesibilidad institucional](../analisis/publicos/2026-08-08_accesibilidad_institucional_escalado_ciudadano_jefaturas_estado_ES_EN.md)\n'
                        '- [Síntesis Abierta #59](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/59)\n'
                        '- Relaciones principales: II (Síntesis Abierta), III (Derecho de Aporte), IV (Bien Común), VIII (Ingeniería Social Abierta), IX (Memoria y Trazabilidad), X (WEB4), XXXIV (Auditoría Conjunta), XXXVI (Custodia), XLV (Soberanía Distribuida), L (Inteligencia Compartida).\n')
              if s!=old: relmap.write_text(s,encoding='utf-8'); changed.append(str(relmap))

          # Ensure previous/next continuity L -> LI and LI -> index
          if l.exists():
              s=l.read_text(encoding='utf-8'); old=s
              href=rel(l,li)
              if href not in s:
                  s += f'\n\n## Continuidad / Continuity\n\n→ [LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™]({href})\n'
              if s!=old: l.write_text(s,encoding='utf-8'); changed.append(str(l))

          # Wiki and synthesis indexes: append explicit LI only if absent
          for f,block in [
              (wiki, '\n\n### LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™\n\n- [Manifiesto LI](../manifiestos/51_sintesis_abierta_poder_civico_complementario_sustitutivo_jefaturas_estado_ES_EN.md)\n- [Síntesis Abierta #59](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/59)\n'),
              (synth, '\n\n### LI · Poder cívico, accesibilidad institucional y jefaturas del Estado / Civic power, institutional accessibility and heads of state\n\n- [Manifiesto LI](../../manifiestos/51_sintesis_abierta_poder_civico_complementario_sustitutivo_jefaturas_estado_ES_EN.md)\n- [Síntesis Abierta #59](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/59)\n')]:
              if f.exists():
                  s=f.read_text(encoding='utf-8'); old=s
                  if li.name not in s: s+=block
                  s=s.replace('I–L · 50','I–LI · 51').replace('I-L · 50','I–LI · 51')
                  if s!=old: f.write_text(s,encoding='utf-8'); changed.append(str(f))

          # Validation: every README/LEEME exposes exactly all 51 manifesto targets and all local links in modified files resolve.
          manifest_set={p.resolve() for p,_,_ in mfiles}
          errors=[]
          link_re=re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for f in readmes:
              if not f.exists(): continue
              s=f.read_text(encoding='utf-8')
              linked=set()
              for href in link_re.findall(s):
                  h=href.strip().split('#',1)[0]
                  if not h or re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:',h): continue
                  target=(f.parent/h).resolve()
                  if target in manifest_set: linked.add(target)
              if linked!=manifest_set:
                  errors.append(f'{f}: manifesto links {len(linked)}/51')
          for fs in sorted(set(changed)):
              f=Path(fs)
              s=f.read_text(encoding='utf-8')
              for href in link_re.findall(s):
                  h=href.strip().split('#',1)[0]
                  if not h or h.startswith('/') or re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:',h): continue
                  if h.startswith('mailto:'): continue
                  target=(f.parent/h).resolve()
                  if not target.exists(): errors.append(f'{f}: broken local link -> {href}')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('READMES_LEEME_TOTAL=',len(readmes))
          print('MANIFESTOS=',len(mfiles))
          print('FILES_CHANGED=',len(set(changed)))
          for x in sorted(set(changed)): print('CHANGED',x)
          print('POSTCHECK OK: every README/LEEME links all 51 manifestos; modified-file local links resolve')
          PY
      - name: Commit synchronized content
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No content changes required.'
          else
            git commit -m 'docs: synchronize LI across all READMEs and canonical links'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/one-shot-sync-li-readmes-links.yml
          git add -A
          git commit -m 'chore: remove completed LI README/link one-shot' || exit 0
          git push origin main
