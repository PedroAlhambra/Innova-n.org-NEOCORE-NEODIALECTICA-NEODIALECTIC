# temporary diagnostic: 2026-08-09T22:20+02:00
name: audit-markdown-readmes-links

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-markdown-readmes-links.yml'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - 'README.md'
      - 'LEEME.md'
      - '**/README.md'
      - 'manifiestos/**.md'
      - 'propuestas/sintesis-abierta/**.md'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose additive NAX-10 / LX integration without retaining partial changes
        run: |
          set +e
          python .github/scripts/apply_wave_human_relevance_symbols.py > /tmp/nax10_lx.log 2>&1
          code=$?
          git reset --hard HEAD
          {
            echo "# Diagnóstico temporal NAX-10 / LX"
            echo
            echo "EXIT_CODE=$code"
            echo '```text'
            cat /tmp/nax10_lx.log
            echo '```'
          } > auditorias/publicas/2026-08-09_debug_integracion_nax10_lx.md
      - name: Audit Markdown, README, indices and repository-local links
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Commit diagnostic and audit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_debug_integracion_nax10_lx.md auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: diagnosticar integración NAX-10 LX'
          git pull --rebase origin main
          git push origin main
