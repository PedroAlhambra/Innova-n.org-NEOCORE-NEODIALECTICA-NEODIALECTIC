# temporary integration runner: 2026-08-09T22:39+02:00
name: audit-markdown-readmes-links

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-markdown-readmes-links.yml'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - 'README.md'
      - 'LEEME.md'
      - '**/README.md'
      - 'manifiestos/**.md'
      - 'propuestas/sintesis-abierta/**.md'

permissions:
  contents: write

concurrency:
  group: nax10-lx-integration-final
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix single-table SAN compatibility
        run: python .github/scripts/fix_apply_wave_syn_index.py
      - name: Apply additive NAX-10 / LX integration
        run: python .github/scripts/apply_wave_human_relevance_symbols.py
      - name: Patch postcheck for I-LX
        run: python .github/scripts/patch_postcheck_for_lx.py
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: integrar NAX-10 León, Bandera de Síntesis y LX'
          git pull --rebase origin main
          git push origin main
