# temporary diagnostic 2: 2026-08-09T22:34+02:00
name: audit-markdown-readmes-links

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-markdown-readmes-links.yml'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - 'README.md'
      - 'LEEME.md'
      - '**/README.md'
      - 'manifiestos/**.md'
      - 'propuestas/sintesis-abierta/**.md'

permissions:
  contents: write

concurrency:
  group: nax10-lx-diagnostic-2
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose corrected additive integration without retaining partial changes
        run: |
          set +e
          python .github/scripts/fix_apply_wave_syn_index.py > /tmp/nax10_lx.log 2>&1
          fixcode=$?
          python .github/scripts/apply_wave_human_relevance_symbols.py >> /tmp/nax10_lx.log 2>&1
          applycode=$?
          python .github/scripts/patch_postcheck_for_lx.py >> /tmp/nax10_lx.log 2>&1
          patchcode=$?
          git reset --hard HEAD
          {
            echo "# Diagnóstico temporal NAX-10 / LX · segunda pasada"
            echo
            echo "FIX_EXIT=$fixcode"
            echo "APPLY_EXIT=$applycode"
            echo "PATCH_EXIT=$patchcode"
            echo '```text'
            cat /tmp/nax10_lx.log
            echo '```'
          } > auditorias/publicas/2026-08-09_debug_integracion_nax10_lx.md
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_debug_integracion_nax10_lx.md
          git commit -m 'audit: diagnosticar segunda pasada NAX-10 LX' || exit 0
          git pull --rebase origin main
          git push origin main
