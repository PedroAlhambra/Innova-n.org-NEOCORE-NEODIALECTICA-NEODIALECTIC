# trigger: 2026-08-09T22:50+02:00
name: audit-markdown-readmes-links

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-markdown-readmes-links.yml'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - 'README.md'
      - 'LEEME.md'
      - '**/README.md'
      - 'manifiestos/**.md'
      - 'propuestas/sintesis-abierta/**.md'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Markdown, README, indices and repository-local links
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Commit audit report if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: postcheck dinámico I-LX README índices enlaces'
          git pull --rebase origin main
          git push origin main
