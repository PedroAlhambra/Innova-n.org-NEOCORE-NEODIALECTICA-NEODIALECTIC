name: audit-markdown-readmes-links

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/audit-markdown-readmes-links.yml'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - 'manifiestos/CANONICAL_FILENAMES.json'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/audit-markdown-readmes-links.yml'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - 'manifiestos/CANONICAL_FILENAMES.json'

permissions:
  contents: read

concurrency:
  group: neocore-document-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit Markdown, README, indices and repository-local links
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Enforce healthy documentary graph
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md')
          text=p.read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in text:
              raise SystemExit('Documentary graph is not healthy; inspect the generated postcheck report in this run.')
          print('DOCUMENTARY_GRAPH=OK')
          PY
