name: audit-manifesto-bilingual-structure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit_manifesto_bilingual_structure.py'
      - '.github/workflows/audit-manifesto-bilingual-structure.yml'
      - 'manifiestos/**.md'
      - 'README.md'
      - 'manifiestos/CANONICAL_FILENAMES.json'
      - 'propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md'

permissions:
  contents: read

concurrency:
  group: neocore-manifesto-reader-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify manifestos are the first reading destination (ES/EN)
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('manifiestos/README.md').read_text(encoding='utf-8')
          root = Path('README.md').read_text(encoding='utf-8')
          collection = index.index('## Colección canónica / Canonical collection')
          first_entry = index.index('- **I** · ', collection)
          infinite_entry = index.index('- **∞** · ', first_entry)
          technical = [
              '<!-- NEOAXIOMAS_GLOBAL_LINK_START -->',
              '<!-- NEO_RELATIONAL_MENU_START -->',
              '<!-- NEO_CROSS_REFERENCE_POLICY_START -->',
              '## Dos puertas principales / Two main doors',
          ]
          assert collection < first_entry < infinite_entry < min(index.index(x) for x in technical), 'READING_FIRST_REGRESSION: technical material precedes canonical manifestos'
          top = root.split('# ES · Castellano', 1)[0]
          assert '[Leer los manifiestos · Índice canónico](./manifiestos/README.md)' in top and top.index('**ES:** [Leer los neoaxiomas') < top.index('> **Versión vigente'), 'READING_FIRST_REGRESSION: Spanish manifesto and neoaxiom links not prominent'
          assert '[Read the manifestos · Canonical index](./manifiestos/README.md)' in top and top.index('**EN:** [Read the neoaxioms') < top.index('> **Versión vigente'), 'READING_FIRST_REGRESSION: English manifesto and neoaxiom links not prominent'
          print('READING_FIRST=PASS ES/EN, index before technical material')
          PY
      - name: Audit bilingual manifesto structure
        run: python .github/scripts/audit_manifesto_bilingual_structure.py
      - name: Verify audit generated without mutating repository
        run: git diff --check
