name: audit-manifesto-bilingual-structure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit_manifesto_bilingual_structure.py'
      - '.github/workflows/audit-manifesto-bilingual-structure.yml'
      - 'manifiestos/**.md'
      - 'manifiestos/CANONICAL_FILENAMES.json'
      - 'propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md'

permissions:
  contents: read

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit bilingual manifesto structure
        run: python .github/scripts/audit_manifesto_bilingual_structure.py
      - name: Verify audit generated without mutating repository
        run: git diff --check
