name: Temporary fix run22 symmetry

on:
  push:
    paths:
      - '.github/workflows/tmp_fix_run22_symmetry.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix bilingual structure and verify gates
        shell: python
        run: |
          from pathlib import Path
          p = Path('auditorias/publicas/2026-08-24_public_maxproc_run22_ES_EN.md')
          s = p.read_text(encoding='utf-8')
          old = '## PASO_SIGUIENTE / NEXT_STEP\n\nReparar exclusivamente `analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md`, añadiendo un selector visible cuyos destinos coincidan con sus encabezados ES/EN reales, sin alterar contenido sustantivo, y volver a verificar que el gate global reduce el contador de fallos.'
          new = '## Paso siguiente\n\nReparar exclusivamente `analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md`, añadiendo un selector visible cuyos destinos coincidan con sus encabezados ES/EN reales, sin alterar contenido sustantivo, y volver a verificar que el gate global reduce el contador de fallos.'
          if old not in s:
              raise SystemExit('Expected shared next-step block not found')
          s = s.replace(old, new, 1)
          tail = 'The single next action is the bilingual `PASO_SIGUIENTE / NEXT_STEP` stated above; no second next step is opened in this run.\n'
          replacement = '## Next step\n\nThe single next action is the bilingual `PASO_SIGUIENTE / NEXT_STEP` stated above; no second next step is opened in this run.\n'
          if tail not in s:
              raise SystemExit('Expected English next-step sentence not found')
          s = s.replace(tail, replacement, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/tmp_fix_run22_symmetry.yml').unlink()
      - name: Run global audits
        shell: bash
        run: |
          python .github/scripts/audit_language_selectors.py
          python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore structural symmetry in public MAXPROC run22'
          git push
