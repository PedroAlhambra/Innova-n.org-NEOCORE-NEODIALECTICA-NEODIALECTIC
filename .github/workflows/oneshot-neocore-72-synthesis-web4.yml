name: one-shot NEOCore 7.2 synthesis sovereignty WEB4

on:
  push:
    paths:
      - '.github/workflows/oneshot-neocore-72-synthesis-web4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward to current main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - name: Apply NEOCore 7.2 delta and repair current network
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          def read(p):
              return (root/p).read_text(encoding='utf-8')
          def write(p, s):
              path = root/p
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(s, encoding='utf-8')
          def replace_section(text, start_heading, next_heading, replacement):
              pat = re.compile(re.escape(start_heading) + r'.*?(?=' + re.escape(next_heading) + r')', re.S)
              new, n = pat.subn(replacement.rstrip() + '\n\n', text, count=1)
              if n != 1:
                  raise RuntimeError(f'No se pudo sustituir sección: {start_heading}')
              return new
          def bump_version(text, version):
              return re.sub(r'(\*\*Versión / Version:\*\*\s*)[^\n]+', rf'\g<1>{version}  ', text, count=1)

          # ------------------------------------------------------------------
          # 1) Registro canónico: incorporar LXVI-LXVIII al índice vivo.
