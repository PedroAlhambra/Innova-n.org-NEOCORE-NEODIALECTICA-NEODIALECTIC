              t = t.replace('- **∞** · [Neo0™', additions + '- **∞** · [Neo0™', 1)
          elif '- **LXVII** · [' not in t:
              t = t.replace('- **∞** · [Neo0™', additions.splitlines(True)[1] + additions.splitlines(True)[2] + '- **∞** · [Neo0™', 1)
          elif '- **LXVIII** · [' not in t:
