name: Repair manifesto genealogical links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sanitize_manifesto_relation_markdown.py'
      - '.github/scripts/repair_manifesto_genealogical_links.py'
      - '.github/scripts/audit_manifesto_clickable_relations.py'
      - '.github/workflows/repair-manifesto-genealogical-links.yml'
      - 'manifiestos/CANONICAL_FILENAMES.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize malformed relational Markdown before repair
        run: python .github/scripts/sanitize_manifesto_relation_markdown.py

      - name: Repair verified genealogical targets
        run: python .github/scripts/repair_manifesto_genealogical_links.py

      - name: Sanitize relational Markdown after repair
        run: python .github/scripts/sanitize_manifesto_relation_markdown.py

      - name: Generate canonical mirrors from material sources
        run: python .github/scripts/sync_canonical_manifestos.py

      - name: Audit canonical registry completeness
        run: python .github/scripts/audit_manifesto_registry_completeness.py

      - name: Audit NEOCore role ontology
        run: python .github/scripts/audit_neocore_role_ontology.py

      - name: Show material changes
        run: git diff -- manifiestos

      - name: Audit clickable relations before commit
        run: python .github/scripts/audit_manifesto_clickable_relations.py || true

      - name: Commit repairs if needed
        shell: bash
        run: |
          if git diff --quiet -- manifiestos; then
            echo 'NO_RELATIONAL_REPAIR_CHANGE'
            exit 0
          fi
          git config user.name 'innova-n-relational-guard'
          git config user.email 'actions@users.noreply.github.com'
          git add manifiestos
          git commit -m 'fix(manifestos): sanitize and restore clickable relations'
          git push

      - name: Audit clickable relations on resulting tree
        run: python .github/scripts/audit_manifesto_clickable_relations.py
      - name: Audit canonical registry on resulting tree
        run: python .github/scripts/audit_manifesto_registry_completeness.py
      - name: Audit role ontology on resulting tree
        run: python .github/scripts/audit_neocore_role_ontology.py
