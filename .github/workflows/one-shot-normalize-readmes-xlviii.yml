name: one-shot-normalize-readmes-xlviii

on:
  push:
    paths:
      - '.github/workflows/one-shot-normalize-readmes-xlviii.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize README manifesto coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os

          repo = Path('.')
          readmes = list(repo.rglob('README.md'))
          marker_start = '<!-- MANIFESTOS_CURRENT_START -->'
          marker_end = '<!-- MANIFESTOS_CURRENT_END -->'

          def rel_manifest_index(p: Path):
              return os.path.relpath(Path('manifiestos/README.md'), p.parent).replace(os.sep, '/')

          for p in readmes:
              s = p.read_text(encoding='utf-8')
              # Repair malformed/stale Roman ranges generated by previous broad substitutions.
              s = re.sub(r'I–XLV(?:I+)?', 'I–XLVIII', s)
              s = re.sub(r'I-XLV(?:I+)?', 'I-XLVIII', s)
              s = re.sub(r'\b(?:45|46|47) manifiestos bilingües\b', '48 manifiestos bilingües', s)
              s = re.sub(r'\b(?:45|46|47) bilingual manifestos\b', '48 bilingual manifestos', s)
              s = re.sub(r'\b(?:45|46|47) manifiestos\b(?=\s*[·/])', '48 manifiestos', s)
              s = re.sub(r'\b(?:45|46|47) manifestos\b(?=\s*[·/])', '48 manifestos', s)

              # Every README exposes the complete current collection without duplicating 48 tables.
              rel = rel_manifest_index(p)
              block = (
                  f'{marker_start}\n\n'
                  f'**Colección completa de manifiestos / Complete manifesto collection:** '
                  f'**I–XLVIII · 48 manifiestos bilingües / 48 bilingual manifestos** · '
                  f'[índice canónico / canonical index]({rel})\n\n'
                  f'{marker_end}'
              )
              if marker_start in s and marker_end in s:
                  s = re.sub(re.escape(marker_start) + r'.*?' + re.escape(marker_end), block, s, flags=re.S)
              else:
                  # Put the common navigator after the opening heading block, before first horizontal rule when possible.
                  m = re.search(r'\n---\n', s)
                  if m:
                      s = s[:m.start()] + '\n\n' + block + s[m.start():]
                  else:
                      lines = s.splitlines()
                      insert = 1 if lines else 0
                      lines[insert:insert] = ['', block, '']
                      s = '\n'.join(lines)
              p.write_text(s, encoding='utf-8')

          # Root/LEEME and canonical indices must explicitly expose XLVIII and all recent nodes.
          explicit = [Path('README.md'), Path('LEEME.md'), Path('manifiestos/README.md'), Path('propuestas/sintesis-abierta/README.md')]
          for p in explicit:
              t = p.read_text(encoding='utf-8')
              for roman in ['XLIV','XLV','XLVI','XLVII','XLVIII']:
                  if roman not in t:
                      raise SystemExit(f'{p}: missing {roman}')
              if '48_sintesis_todo_lo_ve_placa_petri_universal_maquina_fractal_tiempo_ES_EN.md' not in t:
                  raise SystemExit(f'{p}: missing XLVIII link')

          # The specialized manifesto and Open Synthesis indexes must enumerate every Roman number I–XLVIII.
          nums = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX','XXX','XXXI','XXXII','XXXIII','XXXIV','XXXV','XXXVI','XXXVII','XXXVIII','XXXIX','XL','XLI','XLII','XLIII','XLIV','XLV','XLVI','XLVII','XLVIII']
          for p in [Path('manifiestos/README.md'), Path('propuestas/sintesis-abierta/README.md')]:
              t = p.read_text(encoding='utf-8')
              missing = [n for n in nums if not re.search(rf'\|\s*{re.escape(n)}\s*\|', t)]
              if missing:
                  raise SystemExit(f'{p}: missing table rows {missing}')

          # No malformed current-range token may remain in READMEs.
          bad = []
          for p in readmes:
              t = p.read_text(encoding='utf-8')
              for token in re.findall(r'I–XLV[I]+', t):
                  if token != 'I–XLVIII':
                      bad.append((str(p), token))
          if bad:
              raise SystemExit('Malformed README ranges: ' + repr(bad))

          print(f'Normalized and checked {len(readmes)} README files')
          PY

      - name: Commit normalization and remove one-shot
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-normalize-readmes-xlviii.yml
          git config user.name "Innova_N automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: normalize README coverage to 48 manifestos I-XLVIII"
          git push origin HEAD:main
