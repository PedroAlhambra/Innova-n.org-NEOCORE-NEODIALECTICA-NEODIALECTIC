name: Reconcile current framework frontiers

# Explicit writer: manual only. Validation on push belongs to read-only audit workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-current-framework-frontiers
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconcile live frontiers from canonical sources
        run: python .github/scripts/reconcile_current_frontiers.py
      - name: Commit only if reconciliation changed the index
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md
          if git diff --cached --quiet; then
            echo 'FRONTIER_RECONCILIATION_NO_CHANGE=1'
            exit 0
          fi
          git commit -m 'fix: reconciliar frontera completa de Síntesis Abierta'
          git pull --rebase origin main
          git push origin main
      - name: Re-run gate after reconciliation
        run: python .github/scripts/reconcile_current_frontiers.py
