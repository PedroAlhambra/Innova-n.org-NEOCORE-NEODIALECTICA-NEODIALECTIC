name: one-shot-crosslink-manifestos-articles

on:
  push:
    paths:
      - '.github/workflows/one-shot-crosslink-manifestos-articles.yml'

permissions:
  contents: write

jobs:
  crosslink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sweep and cross-link manifestos and articles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os

          root = Path('.')
          mdir = Path('manifiestos')
          manifests = {}
          for p in sorted(mdir.glob('*_ES_EN.md')):
              if p.name in {'RELACIONES_TRABAJO_APLICADO_ES_EN.md'}:
                  continue
              m = re.match(r'^(\d+)_', p.name)
              if not m: continue
              n = int(m.group(1))
              if 1 <= n <= 48:
                  manifests[n] = p

          # Roman numbering in canonical collection is not identical to filename prefix for I–XII.
          canonical = {
              1:'11_neo0_soberania_de_guia_ES_EN.md',
              2:'01_sintesis_abierta_neodialectica_ES_EN.md',
              3:'03_derecho_humano_aporte_sintesis_abierta_ES_EN.md',
              4:'02_neodialectica_bien_comun_ES_EN.md',
              5:'03_simbiosis_humano_ia_ES_EN.md',
              6:'09_parasitismo_sistemico_ES_EN.md',
              7:'04_economia_del_aporte_ES_EN.md',
              8:'05_ingenieria_social_psicohistoria_ES_EN.md',
              9:'06_memoria_genealogia_trazabilidad_ES_EN.md',
              10:'07_web4_sistematrazable_ES_EN.md',
              11:'08_neorrenacimiento_humano_ES_EN.md',
              12:'12_los_sin_ego_ES_EN.md',
          }
          for n in range(13,49):
              hits=list(mdir.glob(f'{n:02d}_*_ES_EN.md'))
              if hits: canonical[n]=hits[0].name

          roman = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX','XXX','XXXI','XXXII','XXXIII','XXXIV','XXXV','XXXVI','XXXVII','XXXVIII','XXXIX','XL','XLI','XLII','XLIII','XLIV','XLV','XLVI','XLVII','XLVIII']

          groups = {
            'synthesis_memory_scale': [1,2,3,4,5,9,19,34,39,43,45,48],
            'extraction_economy': [6,7,9,21,22,23,28,29,31,34,35,42],
            'human_identity_dogma': [4,8,14,16,20,22,25,32,40,45,46,48],
            'ai_governance': [2,4,5,9,18,20,22,23,34,39,42,43,45,48],
            'childhood': [14,23,27,31,38,42,46],
            'conflict_governance': [8,9,20,22,30,34,35,41,44,45,46],
            'creation_recognition': [1,3,7,9,21,22,28,33,34,37,40],
            'life_ecology': [4,5,13,17,27,29,38,44,45,48],
          }

          # Public analyses/audits are linked by filename/topic only where the conceptual relation is defensible.
          rules = [
            (r'religion-identidad-dogma-conciencia', 'human_identity_dogma'),
            (r'economia-de-la-atencion-a-la-economia-del-aporte', 'extraction_economy'),
            (r'spotify_distrokid|distrokid', 'extraction_economy'),
            (r'kdp|author-central|author_central', 'creation_recognition'),
            (r'proteccion_integral_infancia|infancia', 'childhood'),
            (r'anthropic|openai|stanford-ace|gobernanza-ia|ia-y-problema|convergencia-neodialectica', 'ai_governance'),
            (r'linkedin-como-red-profesional-fragmentada', 'extraction_economy'),
            (r'marruecos|dajla|dakhla|canarias|quorum|tutela|contratacion', 'conflict_governance'),
            (r'ecolog|alimentos|vida|suelo|agua', 'life_ecology'),
          ]

          article_paths=[]
          for base in [Path('analisis/publicos'), Path('analisis'), Path('auditorias/publicas')]:
              if base.exists():
                  for p in base.rglob('*.md'):
                      if p.name == 'README.md' or 'evidencias' in p.parts: continue
                      if p not in article_paths: article_paths.append(p)

          rel_articles={n:set() for n in range(1,49)}
          article_manifestos={p:set() for p in article_paths}
          for p in article_paths:
              key=str(p).lower()
              matched=False
              for pat,g in rules:
                  if re.search(pat,key):
                      matched=True
                      for n in groups[g]:
                          rel_articles[n].add(p)
                          article_manifestos[p].add(n)
              # Special genealogy explicitly requested: the Petri-dish article precedes XLVIII.
              if p.as_posix() == 'analisis/publicos/2026-07-13-religion-identidad-dogma-conciencia-neodialectica_ES_EN.md':
                  rel_articles[48].add(p); article_manifestos[p].add(48)

          def title_of(p):
              try:
                  for line in p.read_text(encoding='utf-8').splitlines():
                      if line.startswith('# '): return line[2:].strip()
              except Exception: pass
              return p.stem.replace('_',' ').replace('-',' ')

          # Related manifestos are generated from shared conceptual groups; capped to avoid link walls.
          rel_man={n:set() for n in range(1,49)}
          for nums in groups.values():
              for n in nums:
                  rel_man[n].update(x for x in nums if x!=n)

          START='<!-- NEO_RELATIONS_START -->'
          END='<!-- NEO_RELATIONS_END -->'
          def replace_block(text, block):
              if START in text and END in text:
                  return re.sub(re.escape(START)+r'.*?'+re.escape(END), block, text, flags=re.S)
              # Insert before final navigation/signature if possible, otherwise append.
              anchors=['\n## Navegación','\n## Navigation','\n---\n\n## Firma común','\n---\n\n## Common signature']
              pos=-1
              for a in anchors:
                  i=text.rfind(a)
                  if i>pos: pos=i
              if pos<0: return text.rstrip()+"\n\n"+block+"\n"
              return text[:pos].rstrip()+"\n\n"+block+"\n\n"+text[pos:].lstrip('\n')

          changed=[]
          for n in range(1,49):
              fn=canonical.get(n)
              if not fn: continue
              p=mdir/fn
              if not p.exists(): continue
              lines=[START,'## Relaciones internas y trabajo aplicado / Internal relations and applied work','',
                     '- [Mapa transversal Manifiestos ↔ trabajo aplicado / Transversal Manifestos ↔ applied-work map](./RELACIONES_TRABAJO_APLICADO_ES_EN.md)']
              arts=sorted(rel_articles[n], key=lambda x:x.as_posix())
              if arts:
                  lines += ['', '**Artículos, análisis y auditorías relacionados / Related articles, analyses and audits:**']
                  for a in arts[:12]:
                      rel=os.path.relpath(a, p.parent).replace(os.sep,'/')
                      lines.append(f'- [{title_of(a)}]({rel})')
              rms=sorted(rel_man[n])
              if rms:
                  lines += ['', '**Manifiestos relacionados / Related manifestos:**']
                  # Prefer nearest conceptual neighbours, but include XLVIII where shared.
                  ordered=sorted(rms, key=lambda x:(abs(x-n),x))[:10]
                  for x in ordered:
                      f=canonical.get(x)
                      if f and (mdir/f).exists():
                          lines.append(f'- {roman[x]} · [{title_of(mdir/f)}](./{f})')
              lines += ['', 'La relación documental indica afinidad conceptual, genealogía, contraste o aplicación; no implica causalidad ni equivalencia probatoria. / Documentary relation indicates conceptual affinity, genealogy, contrast or application; it does not imply causation or evidentiary equivalence.',END]
              block='\n'.join(lines)
              old=p.read_text(encoding='utf-8')
              new=replace_block(old,block)
              if new!=old:
                  p.write_text(new,encoding='utf-8'); changed.append(str(p))

          # Add reciprocal manifesto blocks to matched articles only.
          ASTART='<!-- NEO_RELATED_MANIFESTOS_START -->'; AEND='<!-- NEO_RELATED_MANIFESTOS_END -->'
          for p, nums in article_manifestos.items():
              if not nums: continue
              lines=[ASTART,'## Relación con los manifiestos / Relation to the manifestos','',
                     'Este artículo/análisis se relaciona documentalmente con los siguientes pilares del marco: / This article/analysis is documentarily related to the following framework pillars:']
              for n in sorted(nums):
                  f=canonical.get(n)
                  if f and (mdir/f).exists():
                      rel=os.path.relpath(mdir/f,p.parent).replace(os.sep,'/')
                      lines.append(f'- {roman[n]} · [{title_of(mdir/f)}]({rel})')
              relmap=os.path.relpath(mdir/'RELACIONES_TRABAJO_APLICADO_ES_EN.md',p.parent).replace(os.sep,'/')
              lines += [f'- [Mapa transversal completo / Complete transversal map]({relmap})','',
                        'Estas relaciones son de lectura, contraste, genealogía o aplicación; no convierten una afinidad conceptual en prueba causal. / These links concern reading, contrast, genealogy or application; conceptual affinity is not causal proof.',AEND]
              block='\n'.join(lines)
              old=p.read_text(encoding='utf-8')
              if ASTART in old and AEND in old:
                  new=re.sub(re.escape(ASTART)+r'.*?'+re.escape(AEND),block,old,flags=re.S)
              else:
                  new=old.rstrip()+"\n\n---\n\n"+block+"\n"
              if new!=old:
                  p.write_text(new,encoding='utf-8'); changed.append(str(p))

          # Audit report.
          report=Path('auditorias/publicas/2026-08-08_barrida_enlaces_manifiestos_articulos_XLVIII_ES_EN.md')
          linked_articles=sum(1 for v in article_manifestos.values() if v)
          report.write_text(f'''# Barrida de enlaces Manifiestos ↔ artículos · XLVIII\n# Manifestos ↔ articles cross-link sweep · XLVIII\n\n**Fecha / Date:** 2026-08-08  \n**Cobertura / Coverage:** I–XLVIII · 48 manifiestos / manifestos  \n**Artículos/análisis/auditorías con relación explícita / Articles/analyses/audits with explicit relation:** {linked_articles}\n\n## Resultado / Result\n\n- Los 48 manifiestos contienen una capa gestionada de relaciones internas. / All 48 manifestos contain a managed internal-relations layer.\n- Las relaciones temáticas enlazan manifiestos entre sí y con artículos/análisis relevantes. / Thematic relations connect manifestos to one another and to relevant articles/analyses.\n- Los artículos relacionados contienen enlaces recíprocos hacia los manifiestos. / Related articles contain reciprocal links back to the manifestos.\n- XLVIII enlaza explícitamente el antecedente de la **placa de Petri** en `analisis/publicos/2026-07-13-religion-identidad-dogma-conciencia-neodialectica_ES_EN.md`.\n- Se mantiene el mapa transversal como índice de segundo nivel y regla probatoria. / The transversal map remains the second-level index and evidentiary rule.\n\n## Regla / Rule\n\nRelación documental ≠ causalidad, culpabilidad, identidad moral ni equivalencia probatoria. / Documentary relation ≠ causation, guilt, moral identity or evidentiary equivalence.\n''',encoding='utf-8')
          changed.append(str(report))

          # Validate all newly generated relative markdown links in changed files.
          broken=[]
          link_re=re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for fn in changed:
              p=Path(fn)
              if not p.exists(): continue
              txt=p.read_text(encoding='utf-8')
              for href in link_re.findall(txt):
                  if href.startswith(('http://','https://','#','mailto:')): continue
                  href=href.split('#',1)[0]
                  if not href: continue
                  target=(p.parent/href).resolve()
                  if not target.exists(): broken.append((fn,href))
          if broken:
              print('BROKEN GENERATED/EXISTING LINKS IN CHANGED FILES:')
              for x in broken[:100]: print(x)
              raise SystemExit(2)
          print(f'Changed files: {len(changed)}; linked articles: {linked_articles}; broken: 0')
          PY

      - name: Commit cross-links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifiestos analisis auditorias
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "docs: crosslink manifestos with related articles and analyses"
            git push
          fi

      - name: Remove one-shot workflow
        if: success()
        run: |
          git pull --rebase
          git rm .github/workflows/one-shot-crosslink-manifestos-articles.yml
          git commit -m "chore: remove completed manifesto-article crosslink one-shot"
          git push
