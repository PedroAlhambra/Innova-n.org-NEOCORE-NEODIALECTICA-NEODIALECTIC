name: one-shot-repair-xl-run-xliii

on:
  push:
    paths:
      - '.github/scripts/one_shot_repair_xl_run_xliii.py'

permissions:
  contents: write

jobs:
  repair-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair XL and run XLIII sync
        run: python .github/scripts/one_shot_repair_xl_run_xliii.py
      - name: Commit repaired synchronisation
        run: |
          git config user.name "Innova_N manifesto sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(manifestos): complete XLIII sync and repair recent manifesto links [skip ci]"
          git push
