name: oneshot-fix-manifest-readme-roseta

on:
  push:
    paths:
      - '.github/workflows/oneshot-fix-manifest-readme-roseta.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair link and remove oneshot
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('manifiestos/README.md')
          s = p.read_text(encoding='utf-8')
          bad = '33_idea_piedra_angular_rosetta_civilizatoria_reset_reemplazo_ES_EN.md'
          good = '33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md'
          if bad in s:
              p.write_text(s.replace(bad, good), encoding='utf-8')
          Path('.github/workflows/oneshot-fix-manifest-readme-roseta.yml').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/README.md .github/workflows/oneshot-fix-manifest-readme-roseta.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: corregir enlace XXXIII en manifiestos README'
          git pull --rebase origin main
          git push origin main
