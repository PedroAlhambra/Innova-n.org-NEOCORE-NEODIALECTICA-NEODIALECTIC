name: One-time child-protection synchronization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-child-protection.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize XXXVIII across repository entrances
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          MANIFESTO = "./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md"
          ISSUE = "https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45"
          MAXPROC = "./analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md"
          MATRIX = "./analisis/publicos/evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md"
          ANN = "./anuncios/2026-08-07_OCTAVA_OLEADA_PROTECCION_INTEGRAL_INFANCIA_ES_EN.md"

          def load(path):
              return Path(path).read_text(encoding="utf-8")
          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")
          def insert_after(text, marker, addition):
              if addition.strip() in text or marker not in text:
                  return text
              return text.replace(marker, marker + addition, 1)
          def insert_before(text, marker, addition):
              if addition.strip() in text or marker not in text:
                  return text
              return text.replace(marker, addition + marker, 1)

          # Global range/count surfaces.
          for p in ["README.md", "LEEME.md", "PORTADA.md", "COVER.md", "manifiestos/README.md", "propuestas/sintesis-abierta/README.md"]:
              if not Path(p).exists():
                  continue
              t = load(p)
              t = t.replace("I–XXXVII", "I–XXXVIII").replace("I-XXXVII", "I-XXXVIII")
              t = t.replace("treinta y siete manifiestos bilingües", "treinta y ocho manifiestos bilingües")
              t = t.replace("thirty-seven bilingual manifestos", "thirty-eight bilingual manifestos")
              save(p, t)

          # Canonical manifesto index.
          p = "manifiestos/README.md"
          t = load(p)
          t = t.replace("en siete oleadas relacionadas", "en ocho oleadas relacionadas")
          t = t.replace("organised into seven related waves", "organised into eight related waves")
          es7 = "* **Séptima oleada · XXXVII:** **Neofraternidad™**, actualización mutua, autonomía relacional, reconocimiento y construcción de NeoNosotros™."
          en7 = "* **Seventh wave · XXXVII:** **Neofraternity™**, mutual updating, relational autonomy, recognition and construction of NeoNosotros™."
          t = insert_after(t, es7, "\n* **Octava oleada · XXXVIII:** **Protección Integral de la Infancia™**, educación, soberanía digital, programación evolutiva y transmisión civilizatoria.")
          t = insert_after(t, en7, "\n* **Eighth wave · XXXVIII:** **Integral Protection of Childhood™**, education, digital sovereignty, evolutionary programming and civilisational transmission.")
          t = t.replace("* y transformación responsable de la memoria heredada.", "* protección integral de la infancia y soberanía educativa;\n* y transformación responsable de la memoria heredada.")
          t = t.replace("* and Neofraternity™ as a relational architecture of coexistence, recognition and mutual updating.", "* Neofraternity™ as a relational architecture of coexistence, recognition and mutual updating;\n* and integral protection of childhood, educational sovereignty and civilisational transmission.")
          # Reading architectures.
          t = t.replace("XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO",
                        "XXXVI · CORONA, ÁGUILA Y CUSTODIA DE LA EDAD DEL HOMBRE\n        ↓\nXXXVII · NEOFRATERNIDAD\n        ↓\nXXXVIII · PROTECCIÓN INTEGRAL DE LA INFANCIA\n        ↓\nI · NEO0™ · RETORNO A ORIGEN Y NUEVO CICLO")
          t = t.replace("XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE",
                        "XXXVI · CROWN, EAGLE AND CUSTODIANSHIP OF THE AGE OF MAN\n        ↓\nXXXVII · NEOFRATERNITY\n        ↓\nXXXVIII · INTEGRAL PROTECTION OF CHILDHOOD\n        ↓\nI · NEO0™ · RETURN TO ORIGIN AND NEW CYCLE")
          es7para = "La séptima oleada lleva el marco a la unidad relacional mínima: singularidades capaces de crecer juntas sin dominarse, borrarse ni necesitar enemigos."
          es8section = f'''\n\n## Octava oleada · Infancia, educación y transmisión civilizatoria\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXVIII | [Protección Integral de la Infancia™](./38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Proteger seguridad material, soberanía educativa, desarrollo por edades, privacidad y atención infantil frente a captura comercial y abandono sistémico | [Issue #45]({ISSUE}) |\n\nLa octava oleada traslada el marco al punto de transmisión entre generaciones: ninguna civilización puede declararse orientada al Bien Común si deja a la infancia como último mercado disponible, delega toda protección en las familias o confunde acceso tecnológico con educación.\n'''
          t = insert_after(t, es7para, es8section)
          en7para = "The seventh wave brings the framework to its minimum relational unit: singularities capable of growing together without dominating, erasing or needing enemies."
          en8section = f'''\n\n## Eighth wave · Childhood, education and civilisational transmission\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXVIII | [Integral Protection of Childhood™](./38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Protect material security, educational sovereignty, age-differentiated development, privacy and children's attention against commercial capture and systemic abandonment | [Issue #45]({ISSUE}) |\n\nThe eighth wave moves the framework to the point of transmission between generations: no civilisation can claim orientation towards the Common Good while leaving childhood as the last available market, delegating all protection to families or confusing technological access with education.\n'''
          t = insert_after(t, en7para, en8section)
          t = t.replace("The seventh wave begins with **XXXVII · Neofraternity™**, dedicated to the relational architecture of NeoNosotros™.", "The seventh wave begins with **XXXVII · Neofraternity™**, dedicated to the relational architecture of NeoNosotros™. The eighth wave begins with **XXXVIII · Integral Protection of Childhood™**, fixed as version 1.0 on 7 August 2026 and dedicated to childhood, education and civilisational transmission.")
          t = t.replace("La séptima oleada comienza con **XXXVII · Neofraternidad™**, dedicado a la arquitectura relacional del NeoNosotros™.", "La séptima oleada comienza con **XXXVII · Neofraternidad™**, dedicado a la arquitectura relacional del NeoNosotros™. La octava oleada comienza con **XXXVIII · Protección Integral de la Infancia™**, fijado como versión 1.0 el 7 de agosto de 2026 y dedicado a infancia, educación y transmisión civilizatoria.")
          save(p, t)

          # XXXVII navigation points forward to XXXVIII.
          p = "manifiestos/37_neofraternidad_ES_EN.md"
          t = load(p)
          t = t.replace("[I · Neo0™ →](./11_neo0_soberania_de_guia_ES_EN.md)", "[XXXVIII · Protección Integral de la Infancia™ →](./38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)")
          t = t.replace("· [I · Neo0™](./11_neo0_soberania_de_guia_ES_EN.md) →", "· [XXXVIII · Protección Integral de la Infancia™](./38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) →")
          t = t.replace("· [I · Neo0™ · Sovereignty of Guidance](./11_neo0_soberania_de_guia_ES_EN.md) →", "· [XXXVIII · Integral Protection of Childhood™](./38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) →")
          save(p, t)

          # Correct canonical matrix link wherever the compatibility path was emitted.
          for p in ["manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md", "analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md"]:
              t = load(p)
              t = t.replace("2026-08-07_infancia_proteccion_consumo_educacion_medios_fuerzas-y-matriz_ES_EN.md", "2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md")
              save(p, t)

          # Open Synthesis index: append eighth-wave section before final copyright.
          p = "propuestas/sintesis-abierta/README.md"
          t = load(p)
          if "## Octava oleada · Infancia" not in t:
              es = f'''\n## Octava oleada · Infancia, educación y transmisión civilizatoria\n\n| Nº | Manifiesto | Síntesis Abierta |\n|---:|---|---|\n| XXXVIII | [Protección Integral de la Infancia™](../../manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | [Issue #45]({ISSUE}) |\n\n* [MAXPROC de protección integral](../../analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Fuentes y matriz de evidencias](../../analisis/publicos/evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n\n'''
              # place before English section when possible
              t = t.replace("\n---\n\n# EN · English", es + "\n---\n\n# EN · English", 1)
          if "## Eighth wave · Childhood" not in t:
              en = f'''\n## Eighth wave · Childhood, education and civilisational transmission\n\n| No. | Manifesto | Open Synthesis |\n|---:|---|---|\n| XXXVIII | [Integral Protection of Childhood™](../../manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | [Issue #45]({ISSUE}) |\n\n* [Child-protection MAXPROC](../../analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Sources and evidence matrix](../../analisis/publicos/evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n\n'''
              t = t.replace("\n---\n\n**© 2026", en + "\n---\n\n**© 2026", 1)
          save(p, t)

          # Main README priority links and wave table.
          p = "README.md"
          t = load(p)
          es_priority = "* [XXXVII · Neofraternidad™](./manifiestos/37_neofraternidad_ES_EN.md)"
          t = insert_after(t, es_priority, f"\n* [XXXVIII · Protección Integral de la Infancia™]({MANIFESTO})\n* [MAXPROC · Protección Integral de la Infancia™]({MAXPROC})\n* [Síntesis Abierta XXXVIII · Issue #45]({ISSUE})")
          en_priority = "* [XXXVII · Neofraternity™](./manifiestos/37_neofraternidad_ES_EN.md)"
          t = insert_after(t, en_priority, f"\n* [XXXVIII · Integral Protection of Childhood™]({MANIFESTO})\n* [MAXPROC · Integral Protection of Childhood™]({MAXPROC})\n* [Open Synthesis XXXVIII · Issue #45]({ISSUE})")
          if "## Octava oleada · infancia" not in t.lower():
              eswave = f'''\n## Octava oleada · Infancia, educación y transmisión civilizatoria · XXXVIII\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXVIII | [Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Proteger seguridad material, educación, desarrollo por edades, privacidad y atención frente a captura comercial y abandono sistémico | [Issue #45]({ISSUE}) |\n\n'''
              t = t.replace("El Manifiesto III mantiene su propia", eswave + "El Manifiesto III mantiene su propia", 1)
          if "## Eighth wave · Childhood" not in t:
              enwave = f'''\n## Eighth wave · Childhood, education and civilisational transmission · XXXVIII\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXVIII | [Integral Protection of Childhood™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Protect material security, education, age-differentiated development, privacy and attention against commercial capture and systemic abandonment | [Issue #45]({ISSUE}) |\n\n'''
              t = t.replace("Manifesto III maintains its own", enwave + "Manifesto III maintains its own", 1)
          save(p, t)

          # Lightweight entrance files: expose the eighth wave without duplicating it.
          for p in ["LEEME.md", "PORTADA.md", "COVER.md"]:
              t = load(p)
              if "38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md" not in t:
                  # insert after the first XXXVII link, whichever language appears first
                  m = re.search(r"^\* \[.*XXXVII.*\]\([^\n]+\)$", t, re.M)
                  addition = f"\n* [XXXVIII · Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Octava oleada · Protección Integral de la Infancia]({ANN})"
                  if m:
                      t = t[:m.end()] + addition + t[m.end():]
              save(p, t)

          # Analysis indexes.
          p = "analisis/publicos/README.md"
          t = load(p)
          esblock = f'''### MAXPROC · Protección Integral de la Infancia™\n\n* [2026-08-07 · Auditoría MAXPROC completa](./2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Fuentes y matriz de evidencias](./evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n* [Manifiesto XXXVIII](../../manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Síntesis Abierta · Issue #45]({ISSUE})\n\nAudita pobreza infantil, presión comercial, neuromarketing, programación por edades, educación digital, videojuegos, privacidad, grooming, ciberacoso, sexualidad, sharenting, IA y tutela pública. El Punto de No Retorno Infantil™ queda definido como hipótesis medible de alarma, no como hecho ya alcanzado.\n\n'''
          if "### MAXPROC · Protección Integral de la Infancia™" not in t:
              t = t.replace("## 2026-08\n\n", "## 2026-08\n\n" + esblock, 1)
          enblock = f'''### MAXPROC · Integral Protection of Childhood™\n\n* [2026-08-07 · Complete MAXPROC audit](./2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Sources and evidence matrix](./evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n* [Manifesto XXXVIII](../../manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Open Synthesis · Issue #45]({ISSUE})\n\nAudits child poverty, commercial pressure, neuromarketing, age-differentiated programming, digital education, games, privacy, grooming, cyberbullying, sexuality, sharenting, AI and public guardianship. The Child Point of No Return™ is defined as a measurable warning hypothesis, not a threshold already proven to have been crossed.\n\n'''
          # second occurrence of 2026-08 after EN
          if "### MAXPROC · Integral Protection of Childhood™" not in t:
              pos = t.find("# EN · English")
              if pos >= 0:
                  j = t.find("## 2026-08\n\n", pos)
                  if j >= 0:
                      j += len("## 2026-08\n\n")
                      t = t[:j] + enblock + t[j:]
          save(p, t)

          p = "analisis/README.md"
          t = load(p)
          esblock = f'''### MAXPROC · Protección Integral de la Infancia™\n\n* [Auditoría completa](./publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Fuentes y matriz de evidencias](./publicos/evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n* [Manifiesto XXXVIII](../manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Síntesis Abierta · Issue #45]({ISSUE})\n\n'''
          if "### MAXPROC · Protección Integral de la Infancia™" not in t:
              t = t.replace("## Incorporaciones recientes\n\n", "## Incorporaciones recientes\n\n" + esblock, 1)
          enblock = f'''### MAXPROC · Integral Protection of Childhood™\n\n* [Complete audit](./publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Sources and evidence matrix](./publicos/evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n* [Manifesto XXXVIII](../manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Open Synthesis · Issue #45]({ISSUE})\n\n'''
          if "### MAXPROC · Integral Protection of Childhood™" not in t:
              pos = t.find("# EN · English")
              if pos >= 0:
                  j = t.find("## Recent incorporations\n\n", pos)
                  if j >= 0:
                      j += len("## Recent incorporations\n\n")
                      t = t[:j] + enblock + t[j:]
          save(p, t)

          p = "analisis/INDEX.md"
          t = load(p)
          es = f'''* [2026-08-07 · MAXPROC — Protección Integral de la Infancia™](./publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n  * [Fuentes y matriz de evidencias](./publicos/evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n'''
          if "MAXPROC — Protección Integral de la Infancia™" not in t:
              t = t.replace("## Análisis públicos\n\n", "## Análisis públicos\n\n" + es, 1)
          en = f'''* [2026-08-07 · MAXPROC — Integral Protection of Childhood™](./publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n  * [Sources and evidence matrix](./publicos/evidencias/2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n'''
          if "MAXPROC — Integral Protection of Childhood™" not in t:
              pos = t.find("# EN · English")
              if pos >= 0:
                  j = t.find("## Public analyses\n\n", pos)
                  if j >= 0:
                      j += len("## Public analyses\n\n")
                      t = t[:j] + en + t[j:]
          save(p, t)

          p = "analisis/publicos/evidencias/README.md"
          t = load(p)
          es = '''\n### Protección Integral de la Infancia™\n\n- [Fuentes y matriz de evidencias MAXPROC](./2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n- [Análisis MAXPROC](../2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n'''
          if "### Protección Integral de la Infancia™" not in t:
              t = t.replace("\n## EN\n", es + "\n## EN\n", 1)
          en = '''\n### Integral Protection of Childhood™\n\n- [MAXPROC sources and evidence matrix](./2026-08-07_infancia_proteccion_consumo_educacion_medios_fuentes-y-matriz_ES_EN.md)\n- [MAXPROC analysis](../2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n'''
          if "### Integral Protection of Childhood™" not in t:
              t += en
          save(p, t)

          # Remove this one-time workflow in the same synchronization commit.
          Path(".github/workflows/sync-child-protection.yml").unlink()
          PY

          git config user.name "Innova_N Documentation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "docs: synchronize XXXVIII childhood protection across public indexes"
            git push origin HEAD:main
          fi