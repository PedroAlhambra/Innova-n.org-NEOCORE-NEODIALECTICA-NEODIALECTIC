name: one-shot-xlvi-close-wound

on:
  push:
    paths:
      - '.github/triggers/xlvi-close-wound.trigger'

permissions:
  contents: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Propagate XLVI and validate
        run: python .github/scripts/one_shot_xlvi_close_wound.py
      - name: Commit propagation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(manifestos): propagate XLVI close the wound and validate links [skip ci]"
          git push
