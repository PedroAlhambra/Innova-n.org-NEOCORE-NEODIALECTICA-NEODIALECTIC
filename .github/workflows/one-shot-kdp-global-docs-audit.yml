name: one-shot-kdp-global-docs-audit

on:
  push:
    paths:
      - '.github/triggers/kdp-global-docs-audit.trigger'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update KDP traceability and audit global documentation
        run: python .github/scripts/one_shot_kdp_global_docs_audit.py || true
      - name: Commit audited documentation and findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(audit): synchronise KDP traceability and preserve global audit findings [skip ci]"
            git push
          fi
