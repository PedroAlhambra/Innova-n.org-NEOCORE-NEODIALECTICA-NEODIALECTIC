name: one-shot-sync-xliii

on:
  push:
    paths:
      - '.github/scripts/one_shot_sync_xliii.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronise XLIII and audit recent manifestos
        run: python .github/scripts/one_shot_sync_xliii.py
      - name: Commit synchronisation
        run: |
          git config user.name "Innova_N manifesto sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(manifestos): synchronise XLIII and audit recent navigation [skip ci]"
          git push
