name: oneshot-issue-version-cleanup

on:
  push:
    paths:
      - '.github/workflows/oneshot-issue-version-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Replace obsolete version labels in affected Issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GH_REPO']
          issue_numbers=[71,80,98,103,131,132,161,163]
          for n in issue_numbers:
              raw=subprocess.check_output(['gh','api',f'repos/{repo}/issues/{n}'], text=True)
              obj=json.loads(raw)
              title=obj['title']
              body=obj.get('body') or ''
              new_title=title.replace('NEOCore™ 7.2','NEOCore™ PRE-7.3').replace('NEOCore 7.2','NEOCore PRE-7.3').replace('NEOCORE 7.2','NEOCORE PRE-7.3')
              new_body=body.replace('NEOCore™ 7.2','NEOCore™ PRE-7.3').replace('NEOCore 7.2','NEOCore PRE-7.3').replace('NEOCORE 7.2','NEOCORE PRE-7.3')
              new_body=new_body.replace('NEOCORE_7_2','NEOCORE_PRE_7_3').replace('neocore_7_2','neocore_PRE_7_3')
              new_body=new_body.replace('WEB4™ 7.2','WEB4™ PRE-7.3').replace('WEB4 7.2','WEB4 PRE-7.3')
              # Remaining literal version references in these explicitly selected issues are historical version labels.
              new_body=new_body.replace('7.2 candidates','PRE-7.3 candidates').replace('candidates detected in 7.2','candidates detected PRE-7.3')
              new_body=new_body.replace('Candidatos detectados en 7.2','Candidatos detectados PRE-7.3')
              new_body=new_body.replace('arquitectura 7.2','arquitectura PRE-7.3').replace('7.2 architecture','PRE-7.3 architecture')
              new_body=new_body.replace('snapshot 7.2','snapshot PRE-7.3').replace('corpus 7.2','corpus PRE-7.3')
              new_body=new_body.replace('de 7.2 a 7.3 canónico','de 7.3-CANDIDATE a 7.3 CANON')
              new_body=new_body.replace('from 7.2 to canonical 7.3','from 7.3-CANDIDATE to 7.3 CANON')
              # Final controlled cleanup for the selected issue set.
              new_body=new_body.replace('7.2','PRE-7.3')
              if new_title != title or new_body != body:
                  payload=json.dumps({'title':new_title,'body':new_body},ensure_ascii=False)
                  subprocess.check_call(['gh','api','--method','PATCH',f'repos/{repo}/issues/{n}','--input','-'], input=payload, text=True)
                  print(f'UPDATED_ISSUE={n}')
              else:
                  print(f'UNCHANGED_ISSUE={n}')
          PY

      - name: Verify no issue contains obsolete literal version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out=$(gh api --paginate "search/issues?q=%227.2%22+repo:${GH_REPO}" --jq '.items[] | "#\(.number) \(.title)"' || true)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
          echo 'ISSUE_7_2_REFERENCES=0'
