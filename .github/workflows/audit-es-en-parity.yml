name: audit-es-en-parity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-es-en-parity.yml'
      - '.github/scripts/audit_es_en_parity.py'
      - 'manifiestos/**.md'
      - 'analisis/publicos/**.md'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit ES EN parity
        run: python .github/scripts/audit_es_en_parity.py
      - name: Commit parity report if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_auditoria_paridad_ES_EN_manifiestos_articulos.md
          if git diff --cached --quiet; then
            echo 'Parity report unchanged.'
            exit 0
          fi
          git commit -m 'audit: informe de paridad ES EN en manifiestos y artículos'
          git pull --rebase origin main
          git push origin main
