name: one-shot NEOCore 7.2 runner

on:
  push:
    paths:
      - '.github/scripts/oneshot_neocore72.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/neocore72-trigger'
      - '.github/scripts/oneshot_neocore72.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward current main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
      - name: Prepatch current network inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # WEB4 reader was frozen at LX. Extend its explicit registry before
          # the 7.2 one-shot performs its own idempotent checks.
          p=Path('web4/manifiestos/index.html')
          s=p.read_text(encoding='utf-8')
          if "['LXI','Contra el Reduccionismo" not in s:
              needle="['LX','Relevancia Humana Necesaria™','60_relevancia_humana_necesaria_inteligencia_distribuida_aporte_anti_captura_social_ES_EN.md']]"
              replacement="['LX','Relevancia Humana Necesaria™','60_relevancia_humana_necesaria_inteligencia_distribuida_aporte_anti_captura_social_ES_EN.md'],['LXI','Contra el Reduccionismo Matemático™ y Custodia Experimental Multiescalar™','61_contra_reduccionismo_matematico_custodia_experimental_multiescalar_ES_EN.md'],['LXII','Juego por la Síntesis y el Honor™','62_juego_por_la_sintesis_y_el_honor_neowar_starkdr_ransol_ES_EN.md'],['LXIII','Contra la Simplificación Burda del Marco™','63_contra_simplificacion_burda_marco_fidelidad_compresion_ES_EN.md'],['LXIV','NeoCronos™','64_neocronos_tokenizacion_aporte_sintesis_abierta_ES_EN.md'],['LXV','NeoJuego™','65_neojuego_bien_comun_tokenizado_honor_aporte_ES_EN.md'],['LXVI','NeoSinergia™','66_neosinergia_neowar_activa_medici_leonidas_cancerbero_ES_EN.md'],['LXVII','NeoTitanes™','67_neotitanes_reconstruccion_sistemica_motor_bien_comun_espana_ES_EN.md'],['LXVIII','Los Conflictos que No Son Nuestros™ · Soberanía Intelectual de la Especie','68_conflictos_que_no_son_nuestros_soberania_intelectual_especie_ES_EN.md'],['∞','Neo0™ · Puerta Abierta del Fractal','INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md']]"
              if needle not in s:
                  raise SystemExit('WEB4 prepatch needle not found')
              s=s.replace(needle,replacement,1)
              p.write_text(s,encoding='utf-8')

          # Both living synthesis synchronisers had a historical fallback only
          # through LIX. Register the known issues for current finite nodes.
          old_latest="{'LVII':'77', 'LVIII':'78', 'LIX':'79'}"
          new_latest="{'LVII':'77', 'LVIII':'78', 'LIX':'79', 'LXVI':'110', 'LXVII':'112', 'LXVIII':'114'}"
          old_open="{'LVII':'77','LVIII':'78','LIX':'79'}"
          new_open="{'LVII':'77','LVIII':'78','LIX':'79','LXVI':'110','LXVII':'112','LXVIII':'114'}"
          for name,old,new in [
              ('.github/scripts/sync_latest_manifesto_feature.py',old_latest,new_latest),
              ('.github/scripts/sync_open_synthesis_manifestos.py',old_open,new_open),
          ]:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if old in s:
                  s=s.replace(old,new,1)
                  p.write_text(s,encoding='utf-8')
              elif "'LXVIII':'114'" not in s:
                  raise SystemExit(f'issue fallback not patchable: {name}')

          # Current Open Synthesis coverage was also manually frozen at LXV.
          # Repair that visible state before the generic synchroniser validates.
          p=Path('propuestas/sintesis-abierta/README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '65 manifiestos finitos · I–LXV + Manifiesto ∞ · 14 Neoaxiomas™',
              '68 manifiestos finitos · I–LXVIII + Manifiesto ∞ · 14 Neoaxiomas™'
          ).replace(
              '65 finite manifestos · I–LXV + Manifesto ∞ · 14 Neoaxioms™',
              '68 finite manifestos · I–LXVIII + Manifesto ∞ · 14 Neoaxioms™'
          )
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply and validate 7.2
        run: python .github/scripts/oneshot_neocore72.py
      - name: Commit and self-clean
        run: |
          git config user.name 'Innova_N NEOCore automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm --ignore-unmatch .github/scripts/oneshot_neocore72.py
          git rm --ignore-unmatch .github/workflows/oneshot-neocore-72-runner.yml
          git rm --ignore-unmatch .github/workflows/oneshot-neocore-72-synthesis-web4.yml
          git add -A
          git status --short
          git commit -m 'feat: NEOCore 7.2 soberanía de síntesis y WEB4 actualizado'
          git push origin main
