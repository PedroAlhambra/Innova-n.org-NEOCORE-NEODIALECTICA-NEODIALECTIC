# trigger: 2026-08-09T21:24+02:00
name: sync-neoaxioms-relational-layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_neoaxioms_relational_layer.py'
      - '.github/workflows/sync-neoaxioms-relational-layer.yml'

permissions:
  contents: write

concurrency:
  group: neocore-relational-layer-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize Neoaxioms and relational layer
        run: python .github/scripts/sync_neoaxioms_relational_layer.py
      - name: Commit synchronized layer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'docs: integrar NAX-12..14, síntesis específicas y mapa relacional vivo'
          git pull --rebase origin main
          git push origin main
