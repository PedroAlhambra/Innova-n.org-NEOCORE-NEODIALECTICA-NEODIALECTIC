# trigger: 2026-08-08T21:40:00+02:00
name: one-shot-feature-umbral-x-maxproc-001

on:
  push:
    paths:
      - '.github/workflows/one-shot-feature-umbral-x-maxproc-001.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-feature-umbral-x-maxproc-001-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Feature Umbral-X MAXPROC 001 across README surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re

          root = Path('.').resolve()
          article = root / 'analisis/publicos/2026-08-08_umbral_x_maxproc_001_leonidas_cancerbero_streaming_trazabilidad_ES_EN.md'
          issue = 'https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/61'
          protocol = root / 'propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md'
          start = '<!-- NEO_LATEST_UMBRAL_X_NEWS_START -->'
          end = '<!-- NEO_LATEST_UMBRAL_X_NEWS_END -->'

          if not article.exists() or not protocol.exists():
              raise SystemExit('Canonical Umbral-X article or contribution protocol missing')

          targets = sorted(set(root.rglob('README.md')) | set(root.rglob('README_*.md')) | {root/'LEEME.md'})
          targets = [p for p in targets if p.exists() and '.git' not in p.parts]
          changed=[]

          def rel(frm, target):
              return os.path.relpath(target, start=frm.parent).replace(os.sep, '/')

          def block(f):
              return f'''{start}

> ## 🟠 NOVEDAD · SÍNTESIS ABIERTA UMBRAL-X / LATEST · UMBRAL-X OPEN SYNTHESIS
>
> **MAXPROC 001 · El Dios del Control Leónidas-Cancerbero™**  
> **Spotify · DistroKid · TIDAL · metadatos · regalías · perfiles · trazabilidad**
>
> Publicamos la **primera Hipótesis Umbral-X MAXPROC**: ¿qué explica los círculos de soporte, desasociaciones de canciones, perfiles incorrectos y posibles anomalías de regalías? Se contrastan seis hipótesis competidoras —desde fragmentación de metadatos y error humano hasta fraude de terceros o un posible incidente técnico— **sin afirmar ninguna como hecho sin evidencia**. / We publish the **first Umbral-X MAXPROC Hypothesis**, testing six competing explanations without treating any of them as fact without evidence.
>
> **LLAMAMIENTO A MÚSICOS / CALL TO MUSICIANS:** buscamos casos comparables con DistroKid, Spotify, TIDAL y otros DSP: canciones que desaparecen o reaparecen, perfiles divididos, mappings erróneos, identificadores cambiados, regalías ausentes, soporte circular, suplantación o evidencia que refute nuestras sospechas.
>
> **[Leer investigación / Read investigation]({rel(f, article)}) · [Aportar caso o evidencia · Síntesis Abierta #61 / Contribute case or evidence · Open Synthesis #61]({issue})**  
> [Cómo aportar / How to contribute]({rel(f, protocol)})

{end}'''

          for f in targets:
              text=f.read_text(encoding='utf-8')
              old=text
              b=block(f)
              if start in text and end in text:
                  text=re.sub(re.escape(start)+r'.*?'+re.escape(end), b, text, count=1, flags=re.S)
              elif '<!-- NEO_LATEST_MANIFESTO_START -->' in text:
                  text=text.replace('<!-- NEO_LATEST_MANIFESTO_START -->', b+'\n\n<!-- NEO_LATEST_MANIFESTO_START -->',1)
              else:
                  lines=text.splitlines()
                  pos=1 if lines and lines[0].startswith('#') else 0
                  lines[pos:pos]=['',b,'']
                  text='\n'.join(lines)+( '\n' if old.endswith('\n') else '')
              if text!=old:
                  f.write_text(text,encoding='utf-8')
                  changed.append(f)

          failures=[]
          for f in targets:
              text=f.read_text(encoding='utf-8')
              if text.count(start)!=1 or text.count(end)!=1:
                  failures.append(f'{f.relative_to(root)}: latest Umbral-X marker count invalid')
              m=re.search(re.escape(start)+r'(.*?)'+re.escape(end),text,re.S)
              if not m or 'issues/61' not in m.group(1) or 'umbral_x_maxproc_001_leonidas_cancerbero' not in m.group(1):
                  failures.append(f'{f.relative_to(root)}: Umbral-X links incomplete')
              for href in re.findall(r'\[[^\]]*\]\(([^)]+)\)', m.group(1) if m else ''):
                  h=href.split('#',1)[0].strip()
                  if not h or re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:',h):
                      continue
                  if not (f.parent/h).resolve().exists():
                      failures.append(f'{f.relative_to(root)}: broken local link {href}')

          print('README_TARGETS=',len(targets))
          print('README_CHANGED=',len(changed))
          for f in changed: print('CHANGED',f.relative_to(root).as_posix())
          if failures:
              print('POSTCHECK FAIL')
              for x in failures: print(x)
              raise SystemExit(1)
          print('POSTCHECK OK: Umbral-X MAXPROC 001 featured across all README/LEEME surfaces')
          PY

      - name: Commit content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs: feature Umbral-X MAXPROC 001 across all README surfaces'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Cleanup one-shot
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/one-shot-feature-umbral-x-maxproc-001.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove completed Umbral-X MAXPROC 001 one-shot'
          git push origin main
