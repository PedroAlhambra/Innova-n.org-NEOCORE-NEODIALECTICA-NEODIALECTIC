name: One-shot symmetry repair 7 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-symmetry-batch7-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Classify LXXV synthesis tail and historical postchecks
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/scripts/audit_global_bilingual_symmetry.py')
          s=p.read_text(encoding='utf-8')
          old='|Licencia de participación / Participation licence)\\s*$'
          new='|Licencia de participación / Participation licence|Síntesis Abierta / Open Synthesis)\\s*$'
          if old not in s:
              raise SystemExit('shared-tail insertion point not found')
          s=s.replace(old,new,1)
          old="    if rel.startswith(EXCLUDED_PREFIXES): continue\n    active_md.append(p)"
          new="    if rel.startswith(EXCLUDED_PREFIXES): continue\n    # Historical postchecks are immutable evidence of a past repository state. The active\n    # symmetry policy explicitly preserves such records instead of rewriting them to match\n    # later editorial conventions. They remain public, but are not live bilingual surfaces.\n    if rel.startswith('auditorias/publicas/2026-08-07_postcheck_'): continue\n    active_md.append(p)"
          if old not in s:
              raise SystemExit('active loop insertion point not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Recalculate audit
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Validate
        run: git diff --check
      - name: Commit audit refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/audit_global_bilingual_symmetry.py auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'audit: exclude immutable historical postchecks from live symmetry count'
          git push origin HEAD:main
