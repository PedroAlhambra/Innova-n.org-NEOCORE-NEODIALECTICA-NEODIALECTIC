name: rebuild-wiki-clean

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-wiki-clean.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-public-wiki-clean
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current public Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/innova-wiki

      - name: Archive complete pre-clean Wiki in canonical repository
        run: |
          set -euo pipefail
          archive='wiki-legacy-archive/2026-08-11_pre_stable_rebuild'
          rm -rf "$archive"
          mkdir -p "$archive"
          tar --exclude='.git' -C /tmp/innova-wiki -cf - . | tar -C "$archive" -xf -
          cat > "$archive/README_ARCHIVE.md" <<'EOF'
          # Archivo de la Wiki anterior a la reconstrucción estable
          # Archive of the Wiki before the stable rebuild

          Este directorio conserva íntegramente el contenido público de la Wiki inmediatamente antes de retirar las páginas legacy de la Wiki navegable. Se preserva por genealogía, trazabilidad y posibilidad de reconstrucción histórica.

          This directory preserves the complete public Wiki content immediately before legacy pages were removed from the navigable Wiki. It is retained for genealogy, traceability and historical reconstruction.

          **Fecha / Date:** 2026-08-11

          Las páginas archivadas pueden contener números de versión y estados históricos. No representan necesariamente el estado vigente del marco.

          Archived pages may contain version numbers and historical states. They do not necessarily represent the current framework state.
          EOF

      - name: Commit Wiki archive to canonical repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki-legacy-archive/2026-08-11_pre_stable_rebuild
          if ! git diff --cached --quiet; then
            git commit -m 'archive: preservar Wiki legacy antes de reconstrucción estable'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Remove all navigable legacy Markdown pages
        run: |
          set -euo pipefail
          find /tmp/innova-wiki -maxdepth 1 -type f -name '*.md' -delete

      - name: Install stable Wiki pages from wiki-source
        run: |
          set -euo pipefail
          cp wiki-source/Home.md /tmp/innova-wiki/Home.md
          cp wiki-source/Mapa_del_Marco.md /tmp/innova-wiki/Mapa_del_Marco.md
          cp wiki-source/Filosofia_y_NEOCore.md /tmp/innova-wiki/Filosofia_y_NEOCore.md
          cp wiki-source/Manifiestos.md /tmp/innova-wiki/Manifiestos.md
          cp wiki-source/Neoaxiomas.md /tmp/innova-wiki/Neoaxiomas.md
          cp wiki-source/Sintesis_Abierta.md /tmp/innova-wiki/Sintesis_Abierta.md
          cp wiki-source/Participar.md /tmp/innova-wiki/Participar.md
          cp wiki-source/Analisis_Neodialecticos_Publicos.md /tmp/innova-wiki/Analisis_Neodialecticos_Publicos.md
          cp wiki-source/Obras_y_Cultura.md /tmp/innova-wiki/Obras_y_Cultura.md
          cp wiki-source/WEB4_y_Proyeccion.md /tmp/innova-wiki/WEB4_y_Proyeccion.md
          cp wiki-source/Procedencia_Trazabilidad_y_Legal.md /tmp/innova-wiki/Procedencia_Trazabilidad_y_Legal.md
          cp wiki-source/_Sidebar.md /tmp/innova-wiki/_Sidebar.md

      - name: Verify exact stable Markdown surface
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          Analisis_Neodialecticos_Publicos.md
          Filosofia_y_NEOCore.md
          Home.md
          Manifiestos.md
          Mapa_del_Marco.md
          Neoaxiomas.md
          Obras_y_Cultura.md
          Participar.md
          Procedencia_Trazabilidad_y_Legal.md
          Sintesis_Abierta.md
          WEB4_y_Proyeccion.md
          _Sidebar.md
          EOF
          )
          actual=$(find /tmp/innova-wiki -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          version_hits=$(grep -RInE 'NEOCore™?[[:space:]]+[0-9]+\.[0-9]+' /tmp/innova-wiki/*.md || true)
          allowed='/tmp/innova-wiki/_Sidebar.md:'
          bad=$(printf '%s\n' "$version_hits" | grep -v '^$' | grep -v "^${allowed}" || true)
          if [ -n "$bad" ]; then
            echo 'VERSION_NUMBER_OUTSIDE_SIDEBAR'
            echo "$bad"
            exit 1
          fi
          echo 'WIKI_MARKDOWN_SURFACE=EXACT'
          echo 'VERSION_NUMBER_POLICY=OK'

      - name: Commit and push clean Wiki
        run: |
          set -euo pipefail
          cd /tmp/innova-wiki
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'WIKI_ALREADY_CLEAN=1'
            exit 0
          fi
          git commit -m 'wiki: reconstrucción completa estable y sin versiones internas'
          git push origin master
