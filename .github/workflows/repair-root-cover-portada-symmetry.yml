name: repair-root-cover-portada-symmetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_root_cover_portada_symmetry.py'
      - '.github/workflows/repair-root-cover-portada-symmetry.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore root bilingual symmetry
        run: python .github/scripts/repair_root_cover_portada_symmetry.py
      - name: Commit repaired surfaces
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COVER.md PORTADA.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión en COVER y PORTADA'
          git pull --rebase origin main
          git push origin main
