name: fix-and-run-bilingual-manifestos-49-56
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/harden_manifesto_repair_tail_markers.py'
      - '.github/workflows/fix-and-run-bilingual-manifestos-49-56.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden repair scripts
        run: python .github/scripts/harden_manifesto_repair_tail_markers.py
      - name: Repair XLIX-LVI
        run: |
          python .github/scripts/repair_manifesto_49_strict_symmetry.py
          python .github/scripts/repair_manifesto_50_strict_symmetry.py
          python .github/scripts/repair_manifesto_51_strict_symmetry.py
          python .github/scripts/repair_manifesto_52_structure_only.py
          python .github/scripts/repair_manifesto_53_strict_symmetry.py
          python .github/scripts/repair_manifesto_54_structure_only.py
          python .github/scripts/repair_manifesto_55_structure_only.py
          python .github/scripts/repair_manifesto_56_structure_only.py
      - name: Commit repaired sources and hardened scripts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/repair_manifesto_49_strict_symmetry.py \
                  .github/scripts/repair_manifesto_50_strict_symmetry.py \
                  .github/scripts/repair_manifesto_51_strict_symmetry.py \
                  .github/scripts/repair_manifesto_53_strict_symmetry.py \
                  manifiestos/49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md \
                  manifiestos/50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md \
                  manifiestos/51_sintesis_abierta_poder_civico_complementario_sustitutivo_jefaturas_estado_ES_EN.md \
                  manifiestos/52_ciudadania_humana_neodialectica_sangre_suelo_pertenencia_civica_funcional_ES_EN.md \
                  manifiestos/53_leonidas_defensor_sintesis_auditoria_abierta_aportes_externos_ES_EN.md \
                  manifiestos/54_riqueza_chatarra_chatarrero_restauracion_civilizatoria_ES_EN.md \
                  manifiestos/55_ataque_micromaquinas_plagas_escala_invisible_ES_EN.md \
                  manifiestos/56_no_control_sintesis_previa_potencia_energia_orbital_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión XLIX-LVI'
          git pull --rebase origin main
          git push origin main
