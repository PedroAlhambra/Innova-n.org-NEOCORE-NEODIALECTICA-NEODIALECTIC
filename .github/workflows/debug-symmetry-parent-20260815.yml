name: Debug remaining parent symmetry mismatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-symmetry-parent-20260815.yml']
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print signatures
        shell: python
        run: |
          import re
          from pathlib import Path
          text=Path('analisis/publicos/2026-07-21_espana-sin-consulta-marruecos-regularizacion-nacionalidad-control-democratico.md').read_text(encoding='utf-8')
          es=re.search(r'^#{1,4}\s+Versión en español\s*$',text,re.M)
          en=re.search(r'^#{1,4}\s+English version\s*$',text,re.M)
          a=text[es.end():en.start()]
          b=text[en.end():]
          m=re.search(r'^#{1,6}\s+Documentary status / Estado documental\s*$',b,re.M)
          if m: b=b[:m.start()]
          def sig(s):
              out=[]
              for m in re.finditer(r'^(#{2,6})\s+(.+?)\s*$',s,re.M):
                  title=m.group(2).strip(); ident=''
                  mm=re.match(r'^((?:\d+)|(?:[IVXLCDM]+))\.\s+',title)
                  if mm: ident=mm.group(1)
                  out.append((len(m.group(1)),ident,title))
              return out
          A=sig(a); B=sig(b)
          print('LEN',len(A),len(B))
          for i in range(max(len(A),len(B))):
              x=A[i] if i<len(A) else None; y=B[i] if i<len(B) else None
              if (None if x is None else x[:2]) != (None if y is None else y[:2]):
                  print('MISMATCH',i,'ES=',x,'EN=',y)
          print('ES_TAIL',A[-8:])
          print('EN_TAIL',B[-8:])
