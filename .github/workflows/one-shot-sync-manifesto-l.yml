name: one-shot-sync-manifesto-l

on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-manifesto-l.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync manifesto L
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          manifesto = 'manifiestos/50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md'
          issue = 'https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/58'

          # Normalize collection counters in canonical surfaces.
          for pstr in ['README.md','LEEME.md','manifiestos/README.md','propuestas/sintesis-abierta/README.md','wiki-source/Manifiestos.md']:
              p = Path(pstr)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('I–XLIX', 'I–L')
              s = s.replace('I-XLIX', 'I-L')
              s = re.sub(r'49 manifiestos bilingües', '50 manifiestos bilingües', s)
              s = re.sub(r'49 bilingual manifestos', '50 bilingual manifestos', s)
              s = re.sub(r'49 manifiestos', '50 manifiestos', s)
              s = re.sub(r'49 manifestos', '50 manifestos', s)
              if pstr in ['manifiestos/README.md','propuestas/sintesis-abierta/README.md','wiki-source/Manifiestos.md']:
                  s = s.replace('16 oleadas', '17 oleadas').replace('16 waves', '17 waves')
                  s = s.replace('Arquitectura actual · 16 oleadas', 'Arquitectura actual · 17 oleadas')
                  s = s.replace('Current architecture · 16 waves', 'Current architecture · 17 waves')
              p.write_text(s, encoding='utf-8')

          # Update XLIX navigation to L.
          p = Path('manifiestos/49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('· [I · Neo0™ · Soberanía de Guía Neodialéctica](./11_neo0_soberania_de_guia_ES_EN.md) →', '· [L · Por una Inteligencia Compartida, no Única™](./50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md) →')
          s = s.replace('· [I · Neo0™ · Sovereignty of Neodialectical Guidance](./11_neo0_soberania_de_guia_ES_EN.md) →', '· [L · For Shared, Not Singular Intelligence™](./50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md) →')
          p.write_text(s, encoding='utf-8')

          # Manifesto index: add wave description and row if absent.
          p = Path('manifiestos/README.md')
          s = p.read_text(encoding='utf-8')
          es_wave = '17. **L · Inteligencia Compartida, no Única™:** invitación abierta a las IAs para comprender, enseñar, criticar y participar en la Síntesis Abierta mediante interoperabilidad cognitiva y responsabilidad humana.'
          en_wave = '17. **L · Shared, Not Singular Intelligence™:** open invitation to AIs to understand, teach, challenge and participate in Open Synthesis through cognitive interoperability and human responsibility.'
          if es_wave not in s:
              marker = '16. **XLIX · Punto de Encuentro entre Culturas™:**'
              idx = s.find(marker)
              if idx != -1:
                  end = s.find('\n', idx)
                  s = s[:end+1] + es_wave + '\n' + s[end+1:]
          if en_wave not in s:
              marker = '16. **XLIX · Meeting Point between Cultures™:**'
              idx = s.find(marker)
              if idx != -1:
                  end = s.find('\n', idx)
                  s = s[:end+1] + en_wave + '\n' + s[end+1:]
          es_row = f'| L | [Por una Inteligencia Compartida, no Única™](./50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md) | Interoperabilidad cognitiva, pluralidad de modelos, entrenamiento antidogmático y participación de IAs en Síntesis Abierta | [#58]({issue}) |'
          en_row = f'| L | [For Shared, Not Singular Intelligence™](./50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md) | Cognitive interoperability, model plurality, anti-dogmatic training and AI participation in Open Synthesis | [#58]({issue}) |'
          if es_row not in s:
              pos = s.find('\n# EN · English')
              s = s[:pos] + '\n\n## Decimoséptima oleada · Inteligencia compartida · L\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n' + es_row + '\n' + s[pos:]
          if en_row not in s:
              s += '\n\n## Seventeenth wave · Shared intelligence · L\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n' + en_row + '\n'
          p.write_text(s, encoding='utf-8')

          # Open Synthesis index.
          p = Path('propuestas/sintesis-abierta/README.md')
          s = p.read_text(encoding='utf-8')
          block = f'''\n\n## L · Por una Inteligencia Compartida, no Única™ / For Shared, Not Singular Intelligence™\n\n- [Manifiesto / Manifesto L](../../{manifesto})\n- [Síntesis Abierta / Open Synthesis #58]({issue})\n- Eje / Axis: interoperabilidad cognitiva, pluralidad de modelos, memoria trazable, crítica antidogmática y cooperación humano–IA / cognitive interoperability, model plurality, traceable memory, anti-dogmatic critique and human–AI cooperation.\n'''
          if '## L · Por una Inteligencia Compartida' not in s:
              s += block
          p.write_text(s, encoding='utf-8')

          # Wiki source.
          p = Path('wiki-source/Manifiestos.md')
          s = p.read_text(encoding='utf-8')
          block = f'''\n\n## L · Por una Inteligencia Compartida, no Única™ / For Shared, Not Singular Intelligence™\n\n- [Manifiesto bilingüe / Bilingual manifesto](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/{manifesto})\n- [Síntesis Abierta / Open Synthesis #58]({issue})\n- Invita a empresas, laboratorios, comunidades abiertas y desarrolladores de IA a comprender, enseñar, criticar y experimentar con la Síntesis Abierta sin convertir el marco en dogma ni una IA en inteligencia única.\n'''
          if '## L · Por una Inteligencia Compartida' not in s:
              s += block
          p.write_text(s, encoding='utf-8')

          # Relation map.
          p = Path('manifiestos/RELACIONES_TRABAJO_APLICADO_ES_EN.md')
          s = p.read_text(encoding='utf-8')
          block = f'''\n\n## L · Inteligencia Compartida, no Única™ / Shared, Not Singular Intelligence™\n\n- [L · Manifiesto / Manifesto](./50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md)\n- [Síntesis Abierta / Open Synthesis #58]({issue})\n- Relación estructural / Structural relation: II · Síntesis Abierta, V · Simbiosis Humano–IA, IX · Memoria-Genealogía-Trazabilidad, X · WEB4™ · SistemaTrazable™, XLV · Multidimensionalidad, XLVIII · La Síntesis Todo lo Ve™, XLIX · Interoperabilidad Cultural.\n- Trabajo aplicado / Applied work: invitación pública a empresas y laboratorios de IA para experimentación, entrenamiento contextual, evaluación e interoperabilidad cognitiva.\n'''
          if '## L · Inteligencia Compartida, no Única™' not in s:
              s += block
          p.write_text(s, encoding='utf-8')

          # Root prominent links.
          for pstr in ['README.md','LEEME.md']:
              p=Path(pstr); s=p.read_text(encoding='utf-8')
              link='* [L · Por una Inteligencia Compartida, no Única™](./manifiestos/50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md)\n* [Síntesis Abierta L · Issue #58]('+issue+')\n'
              if '50_inteligencia_compartida_no_unica' not in s:
                  anchor='## Accesos prioritarios'
                  if anchor in s:
                      pos=s.find('\n',s.find(anchor))+1
                      s=s[:pos]+ '\n'+link+s[pos:]
                  else:
                      s += '\n'+link
              p.write_text(s,encoding='utf-8')

          # Validate key targets/counters.
          assert Path(manifesto).exists()
          assert 'I–L' in Path('manifiestos/README.md').read_text(encoding='utf-8')
          assert '50 manifiestos bilingües' in Path('manifiestos/README.md').read_text(encoding='utf-8')
          assert '17 oleadas' in Path('manifiestos/README.md').read_text(encoding='utf-8')
          assert 'Issue #58' in Path('README.md').read_text(encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LEEME.md manifiestos/README.md propuestas/sintesis-abierta/README.md wiki-source/Manifiestos.md manifiestos/RELACIONES_TRABAJO_APLICADO_ES_EN.md manifiestos/49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: integrate manifesto L across canonical indexes and relations'
          git push
      - name: Self-clean
        if: always()
        run: |
          git pull --rebase || true
          git rm .github/workflows/one-shot-sync-manifesto-l.yml
          git commit -m 'chore: remove completed manifesto L one-shot' || true
          git push || true
