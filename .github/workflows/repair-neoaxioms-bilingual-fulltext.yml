# trigger: 2026-08-09T21:29+02:00
name: repair-neoaxioms-bilingual-fulltext

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_neoaxioms_bilingual_fulltext.py'
      - '.github/workflows/repair-neoaxioms-bilingual-fulltext.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full bilingual Neoaxiom text
        run: python .github/scripts/repair_neoaxioms_bilingual_fulltext.py
      - name: Commit if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neoaxiomas/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restaurar texto íntegro ES-EN de Neoaxiomas NAX-01..14'
          git pull --rebase origin main
          git push origin main
