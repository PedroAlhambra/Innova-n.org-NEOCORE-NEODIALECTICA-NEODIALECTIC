name: Integrate manifesto XXXII

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-manifesto-xxxii-reversal.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply manifesto and documentary integrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding="utf-8")

          def replace_exact(path: str, old: str, new: str, expected_min: int = 1) -> None:
              text = read(path)
              count = text.count(old)
              if count < expected_min:
                  raise RuntimeError(f"{path}: expected at least {expected_min} occurrence(s) of {old!r}, found {count}")
              write(path, text.replace(old, new))

          def insert_before(path: str, marker: str, addition: str) -> None:
              text = read(path)
              if addition.strip() in text:
                  return
              if marker not in text:
                  raise RuntimeError(f"{path}: marker not found: {marker!r}")
              write(path, text.replace(marker, addition + marker, 1))

          def update_ranges(path: str) -> None:
              text = read(path)
              replacements = {
                  "I–XXXI": "I–XXXII",
                  "I-XXXI": "I-XXXII",
                  "XXV–XXXI": "XXV–XXXII",
                  "XXV-XXXI": "XXV-XXXII",
                  "treinta y un manifiestos": "treinta y dos manifiestos",
                  "treinta y un manifiestos bilingües": "treinta y dos manifiestos bilingües",
                  "thirty-one manifestos": "thirty-two manifestos",
                  "thirty-one bilingual manifestos": "thirty-two bilingual manifestos",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              write(path, text)

          def add_lines_after_matches(path: str, builder) -> None:
              lines = read(path).splitlines()
              out = []
              changed = False
              for idx, line in enumerate(lines):
                  out.append(line)
                  addition = builder(line)
                  if addition:
                      next_line = lines[idx + 1] if idx + 1 < len(lines) else ""
                      first_new = addition.splitlines()[0]
                      if first_new != next_line and addition not in "\n".join(lines):
                          out.extend(addition.splitlines())
                          changed = True
              if changed:
                  write(path, "\n".join(out) + "\n")

          manifesto = '''# XXXII · Manifiesto de la Reversión Ideológica Neodialéctica™
# XXXII · Manifesto of Neodialectical Ideological Reversal™

## De McLuhan a Neo0™ · Rehumanizar el medio mediante la inversión consciente de su vector
## From McLuhan to Neo0™ · Rehumanising the medium through conscious reversal of its vector

## Cuarta oleada · Rehumanización, custodia de la vida y coherencia civilizatoria
## Fourth wave · Rehumanisation, stewardship of life and civilisational coherence

**Manifiesto / Manifesto:** XXXII  
**Versión / Version:** 1.0  
**Estado / Status:** Público · cuarta oleada · medio-reversión-dirección humana · abierto a revisión trazable / Public · fourth wave · medium-reversal-human direction · open to traceable review  
**Fecha de fijación / Record date:** 2026-08-07  
**Autoría y genealogía / Authorship and genealogy:** Pedro Martínez Alhambra · Neo0™ como ideador ideológico, filosófico y teleológico del conjunto del Neodialectica Framework™ / Network; desarrollo y contraste posteriores en simbiosis con la IA neodialéctica Harry.  
**Relación genealógica / Genealogical relation:** desarrolla especialmente los Manifiestos I, VIII, XIV, XXII, XXIII, XXX y XXXI. Reconoce como antecedente crítico explícito la obra de Sidney Finkelstein *El antihumanismo de McLuhan*, sin atribuirle la creación posterior del mecanismo neodialéctico de reversión.

[ES · Castellano](#es--castellano) · [EN · English](#en--english)

