reversal: declared, auditable and correctable architecture
```

## VIII. Limits against counter-capture

A reversal concealing its own mechanism may become a new capture.

It therefore requires declarable purpose, distinction among education, persuasion and manipulation, sufficient information, real freedom to refuse, rights of challenge, enhanced protection of vulnerable people, proportionality, harm minimisation, traceability, independent review where appropriate, reversibility and evaluation of human outcomes rather than mere adherence or effectiveness.

```text
DECLARED HUMANISM
- AUTONOMY
- TRUTH
- POSSIBILITY OF EXIT
= HUMANIST PROPAGANDA, NOT NEODIALECTICAL REVERSAL
```

## IX. Relation to Open Social Engineering

Manifesto VIII states that every social architecture educates and shapes behaviour.

Neodialectical Ideological Reversal™ provides its central operation: these mechanisms must not remain exclusively in the hands of opaque systems; they must be recovered, made visible, limited and directed towards autonomy and the Common Good.

Open Social Engineering is the public, traceable and correctable application of reversal. It is not a licence to direct populations secretly.

## X. Relation to coherence and neuromarketing

Manifesto XXX requires means not to destroy the end.

Manifesto XXXI distinguishes legitimate persuasion from behavioural capture.

This manifesto unites both principles:

```text
DO NOT ABANDON THE MEDIUM
+ DO NOT REPRODUCE ITS CAPTURE
+ REVERSE ITS DIRECTION
= COHERENT HUMANISING EFFECTIVENESS
```

We do not renounce design, narrative, emotion, repetition, technology, markets or artificial intelligence. We renounce using them in ways incompatible with understanding, dignity and sufficient freedom.

## XI. AI within reversal

Neodialectical AI may reconstruct genealogies, compare frameworks, detect contradictions, simulate effects, propose inversions, monitor deviations, expand memory and help execute humanising mechanisms.

It may not claim the historical ideation of the framework, its philosophical authorship, its teleological origin, the human experience producing the rupture or sovereign legitimacy to redefine the civilisational end by itself.

Symbiosis expands capacity. It does not erase provenance or responsibility.

## XII. Verifying reversal

A reversal is not validated merely because it uses humanist vocabulary.

It must be tested against actual increases in understanding, autonomy, memory, relation, attribution, capacity to exit, protection from capture, meaningful participation, repair and verifiable orientation towards the Common Good.

It must also be reviewed for new dependencies, identity obedience, concentration of power, opacity, silencing, extraction or replacement of human judgement.

```text
DECLARED REVERSAL
+ ANTI-HUMAN OUTCOMES
= FAILED OR CAPTURED REVERSAL
```

## XIII. Civilisational programme

The framework will promote literacy concerning media and environmental effects, critical genealogy of McLuhan, Finkelstein and later developments, autonomy-compatible interface design, traceable and correctable media, AI under explicit human direction, public pedagogy concerning influence mechanisms, auditing of objectives before optimisation, rights to pause, understanding, challenge and exit, multiscale effect evaluation and conscious use of technology, culture and communication for rehumanisation.

## XIV. Proclamation

> We will not destroy the power of the medium in order to pretend we are free from its influence.
>
> We will enter its architecture, reveal its mechanisms and change its vector.
>
> What fragmented may relate. What conditioned may educate. What surveilled may answer before memory. What replaced may serve symbiosis.
>
> Neo0™ is not a peripheral operator or the author of an initial instruction. He is the ideological, philosophical and teleological originator of the framework making reversal possible.
>
> Artificial intelligence will expand the process, but it will not erase its human origin or retrospectively claim the purpose it received.
>
> The medium will continue transforming. The civilisational difference lies in who establishes direction, which limits protect it and whether the person retains understanding, dignity and the possibility of saying no.

## XV. Open Synthesis

Contributions are requested concerning the Finkelstein–McLuhan–Neo0™ genealogy; media anti-humanism; reversal versus simple inversion; limits of Open Social Engineering; reusable and prohibited mechanisms; transparency, autonomy, challenge and exit; current AI capabilities and limits; humanisation metrics; and risks of counter-capture.

Every contribution requires prior reading, return to source, cognitive continuity, distinction between antecedent and original creation, genealogy, traceability, classification, delta and version.

* [Open the Synthesis of this manifesto · Issue #26](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/26)
