name: one-shot-final-postcheck-index

on:
  push:
    paths:
      - '.github/triggers/final-postcheck-index.trigger'

permissions:
  contents: write

jobs:
  postcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Index final audit and run last internal-link postcheck
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse

          # 1. Finish Wiki-source state metadata.
          p=Path('wiki-source/README.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('Última revisión de arquitectura Wiki / Last Wiki architecture review: **2026-08-07**', 'Última revisión de arquitectura Wiki / Last Wiki architecture review: **2026-08-08**')
          manifest_line='* Manifiestos / Manifestos: **I–XLIII**, enlazados desde `manifiestos/README.md`'
          latest='* Último manifiesto / Latest manifesto: [XLIII · Contra la Incomprensión Reductiva de la IA™ / Against the Reductive Misunderstanding of AI™](../manifiestos/43_contra_incomprension_reductiva_ia_inteligencia_humana_expandida_ES_EN.md)'
          if latest not in t and manifest_line in t:
              t=t.replace(manifest_line, manifest_line+'\n'+latest,1)
          p.write_text(t,encoding='utf-8')

          # 2. Index the final audit itself in the public-audit README.
          p=Path('auditorias/publicas/README.md')
          t=p.read_text(encoding='utf-8')
          anchor='### Integridad documental / Documentary integrity\n'
          entry='''\n* [2026-08-08 · Auditoría global final de README, enlaces, XLIII y trazabilidad KDP](./2026-08-08_auditoria_global_readmes_enlaces_y_trazabilidad_kdp_ES_EN.md)\n\n  Postcheck integral del árbol Markdown: READMEs, rutas internas, aliases versionados de la Wiki, estado I–XLIII, enlaces de Síntesis Abierta y cadena documental KDP 51071689.\n\n* [2026-08-08 · Final global audit of README, links, XLIII and KDP traceability](./2026-08-08_auditoria_global_readmes_enlaces_y_trazabilidad_kdp_ES_EN.md)\n\n  Full Markdown-tree postcheck covering READMEs, internal paths, versioned Wiki aliases, I–XLIII state, Open Synthesis links and the KDP 51071689 documentary chain.\n'''
          if '2026-08-08 · Auditoría global final' not in t:
              if anchor not in t: raise SystemExit('audit index anchor missing')
              t=t.replace(anchor,anchor+entry,1)
          p.write_text(t,encoding='utf-8')

          # 3. Repository-local link validation, recognising extensionless Wiki aliases.
          link_re=re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          root=Path('.').resolve()
          files=sorted(x for x in Path('.').rglob('*.md') if '.git' not in x.parts and 'node_modules' not in x.parts)
          checked=wiki_aliases=0; broken=[]
          for src in files:
              txt=src.read_text(encoding='utf-8')
              for raw in link_re.findall(txt):
                  u=raw.strip().strip('<>')
                  if not u or u.startswith(('http://','https://','mailto:','tel:','data:','#')): continue
                  u=urllib.parse.unquote(u.split('#',1)[0].split('?',1)[0])
                  checked+=1
                  cand=(Path('.')/u.lstrip('/')).resolve() if u.startswith('/') else (src.parent/u).resolve()
                  try: cand.relative_to(root)
                  except ValueError:
                      broken.append((str(src),raw,'escapes root')); continue
                  if cand.exists(): continue
                  if 'wiki-source' in src.parts and cand.with_suffix('.md').exists():
                      wiki_aliases+=1; continue
                  broken.append((str(src),raw,str(cand)))
          if broken:
              print('BROKEN',broken)
              raise SystemExit(2)

          # 4. Canonical live-hub checks.
          hubs=[Path(x) for x in ['README.md','LEEME.md','PORTADA.md','COVER.md','analisis/README.md','analisis/auditorias/README.md','analisis/publicos/README.md','analisis/publicos/evidencias/README.md','auditorias/publicas/README.md','manifiestos/README.md','obras/README.md','obras/idea/README.md','obras/idea/assets/README.md','propuestas/sintesis-abierta/README.md','wiki-source/README.md']]
          stale=[]
          pats=[('XLIIII',re.compile(r'XLIIII')),('I–XLII',re.compile(r'I–XLII(?!I)')),('42 manifestos ES',re.compile(r'\b42\s+manifiestos\b',re.I)),('42 manifestos EN',re.compile(r'\b42\s+bilingual\s+manifestos\b',re.I)),('tenth wave ES only XLII',re.compile(r'Décima oleada · XLII(?!–XLIII)')),('tenth wave EN only XLII',re.compile(r'Tenth wave · XLII(?!–XLIII)'))]
          for h in hubs:
              if not h.exists(): stale.append((str(h),'missing')); continue
              txt=h.read_text(encoding='utf-8')
              for label,pat in pats:
                  if pat.search(txt): stale.append((str(h),label))
          if stale:
              print('STALE',stale); raise SystemExit(3)

          # 5. KDP chain and XLIII checks.
          kdp_hubs=[Path(x) for x in ['README.md','analisis/README.md','analisis/INDEX.md','analisis/publicos/README.md','analisis/auditorias/README.md','auditorias/publicas/README.md','obras/idea/README.md','wiki-source/Analisis_Neodialecticos_Publicos.md']]
          missing=[str(h) for h in kdp_hubs if 'KDP_51071689_TRACE_START' not in h.read_text(encoding='utf-8')]
          if missing: print('KDP MISSING',missing); raise SystemExit(4)
          collection=[Path(x) for x in ['README.md','LEEME.md','PORTADA.md','COVER.md','manifiestos/README.md','propuestas/sintesis-abierta/README.md','wiki-source/Manifiestos.md']]
          miss43=[str(h) for h in collection if '43_contra_incomprension_reductiva_ia_inteligencia_humana_expandida_ES_EN.md' not in h.read_text(encoding='utf-8')]
          if miss43: print('XLIII MISSING',miss43); raise SystemExit(5)

          # 6. Update the final report's exact postcheck counts and record final index closure.
          r=Path('auditorias/publicas/2026-08-08_auditoria_global_readmes_enlaces_y_trazabilidad_kdp_ES_EN.md')
          rt=r.read_text(encoding='utf-8')
          rt=re.sub(r'Enlaces Markdown internos relativos comprobados: \*\*\d+\*\*\.', f'Enlaces Markdown internos relativos comprobados: **{checked}**.', rt)
          rt=re.sub(r'Relative internal Markdown links checked: \*\*\d+\*\*\.', f'Relative internal Markdown links checked: **{checked}**.', rt)
          rt=re.sub(r'Enlaces Wiki extensionless reconocidos correctamente contra su `\.md` fuente: \*\*\d+\*\*\.', f'Enlaces Wiki extensionless reconocidos correctamente contra su `.md` fuente: **{wiki_aliases}**.', rt)
          rt=re.sub(r'Extensionless Wiki links correctly resolved against versioned `\.md` sources: \*\*\d+\*\*\.', f'Extensionless Wiki links correctly resolved against versioned `.md` sources: **{wiki_aliases}**.', rt)
          closure='- Auditoría final indexada en `auditorias/publicas/README.md`: **sí**. / Final audit indexed in `auditorias/publicas/README.md`: **yes**.'
          if closure not in rt:
              rt=rt.replace('## Límite de la comprobación\n', closure+'\n\n## Límite de la comprobación\n',1)
          r.write_text(rt,encoding='utf-8')

          print('FINAL_OK markdown',len(files),'readmes',len(list(Path('.').rglob('README.md'))),'links',checked,'wiki_aliases',wiki_aliases,'broken',len(broken),'stale',len(stale))

          # 7. Remove this disposable one-shot workflow and trigger.
          Path('.github/workflows/one-shot-final-postcheck-index.yml').unlink(missing_ok=True)
          Path('.github/triggers/final-postcheck-index.trigger').unlink(missing_ok=True)
          PY
      - name: Commit final postcheck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(audit): index final postcheck and close internal documentation gaps [skip ci]"
          git push
