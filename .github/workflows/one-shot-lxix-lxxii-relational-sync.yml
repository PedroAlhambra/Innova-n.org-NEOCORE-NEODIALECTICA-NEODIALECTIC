name: one-shot LXIX-LXXII relational sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-lxix-lxxii-relational-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate manifestos, neoaxiom and navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          ROOT=Path('.')
          GH='https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC'

          docs={
            '69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md':{
              'roman':'LXIX','issue':119,
              'refs':[
                ('XXXVIII · Protección Integral de la Infancia™ / Comprehensive Protection of Childhood™','38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md'),
                ('XL · Honor Relacional™ / Relational Honor™','40_respeto_neoego_honor_relacional_ES_EN.md'),
                ('XLI · Martillo Limitado™ / Limited Hammer™','41_martillo_limitado_talion_fuerza_protectora_ES_EN.md'),
                ('XLVI · Cerrar la Herida™ / Closing the Wound™','46_cerrar_la_herida_comprension_evolutiva_memoria_reconciliacion_ES_EN.md'),
                ('LXVIII · Soberanía Intelectual de la Especie™ / Intellectual Sovereignty of the Species™','68_conflictos_que_no_son_nuestros_soberania_intelectual_especie_ES_EN.md'),
                ('LXX · Fauno™ / Faun™','70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md'),
                ('LXXI · Separación de Planos™ / Separation of Planes™','71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md'),
                ('LXXII · Hombre Custodio™ / Custodian Man™','72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md')],
            },
            '70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md':{
              'roman':'LXX','issue':120,
              'refs':[
                ('XXIX · Contra la Idolatría del Dinero™ / Against the Idolatry of Money™','29_idolatria_del_dinero_ES_EN.md'),
                ('XXXVIII · Protección Integral de la Infancia™ / Comprehensive Protection of Childhood™','38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md'),
                ('XL · Honor Relacional™ / Relational Honor™','40_respeto_neoego_honor_relacional_ES_EN.md'),
                ('XLVI · Cerrar la Herida™ / Closing the Wound™','46_cerrar_la_herida_comprension_evolutiva_memoria_reconciliacion_ES_EN.md'),
                ('LXIX · Defensa de la Inocencia Humana™ / Defence of Human Innocence™','69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md'),
                ('LXXI · Separación de Planos™ / Separation of Planes™','71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md'),
                ('LXXII · Hombre Custodio™ / Custodian Man™','72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md')],
            },
            '71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md':{
              'roman':'LXXI','issue':121,
              'refs':[
                ('XXXI · Contra el Neuromarketing Antihumanista™ / Against Anti-Humanist Neuromarketing™','31_contra_neuromarketing_antihumanista_ES_EN.md'),
                ('XXXVIII · Protección Integral de la Infancia™ / Comprehensive Protection of Childhood™','38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md'),
                ('XLII · Fin de la Era del Hombre Manipulado™ / End of the Era of the Manipulated Human™','42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md'),
                ('LXIX · Defensa de la Inocencia Humana™ / Defence of Human Innocence™','69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md'),
                ('LXX · Fauno™ / Faun™','70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md'),
                ('LXXII · Hombre Custodio™ / Custodian Man™','72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md')],
            },
            '72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md':{
              'roman':'LXXII','issue':122,
              'refs':[
                ('XXXVI · Custodia de la Edad del Hombre™ / Custodianship of the Age of Man™','36_corona_aguila_custodia_edad_del_hombre_ES_EN.md'),
                ('XL · Honor Relacional™ / Relational Honor™','40_respeto_neoego_honor_relacional_ES_EN.md'),
                ('XLI · Martillo Limitado™ / Limited Hammer™','41_martillo_limitado_talion_fuerza_protectora_ES_EN.md'),
                ('XLVII · Sombra™ / Shadow™','47_odio_neo0_sino_goat_sombra_vinculo_doble_cara_ES_EN.md'),
                ('LXVI · NeoSinergia™ / NeoSynergy™','66_neosinergia_neowar_activa_medici_leonidas_cancerbero_ES_EN.md'),
                ('LXVII · NeoTitanes™ / NeoTitans™','67_neotitanes_reconstruccion_sistemica_motor_bien_comun_espana_ES_EN.md'),
                ('LXIX · Defensa de la Inocencia Humana™ / Defence of Human Innocence™','69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md'),
                ('LXX · Fauno™ / Faun™','70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md'),
                ('LXXI · Separación de Planos™ / Separation of Planes™','71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md')],
            },
          }

          for fn,d in docs.items():
              p=ROOT/'manifiestos'/fn
              text=p.read_text(encoding='utf-8')
              gate=f"**Síntesis Abierta específica / Specific Open Synthesis:** [#{d['issue']}]({GH}/issues/{d['issue']})"
              text=re.sub(r'\*\*Síntesis Abierta específica / Specific Open Synthesis:\*\*[^\n]*',gate,text)
              if '<!-- NEO_CANONICAL_CROSSREFS_START -->' not in text:
                  lines=['<!-- NEO_CANONICAL_CROSSREFS_START -->','', '## Referencias cruzadas canónicas / Canonical cross-references','']
                  for label,target in d['refs']:
                      lines.append(f'- [{label}](./{target})')
                  lines += [
                      f"- [Síntesis Abierta {d['roman']} / Open Synthesis {d['roman']} · #{d['issue']}]({GH}/issues/{d['issue']})",
                      f"- [C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™ / Relational Inviolability and Separation of Planes™ · #123]({GH}/issues/123)",
                      '- [Neoaxiomas™ / Neoaxioms™](../neoaxiomas/README.md)',
                      '- [Delta relacional / Relational delta](../propuestas/sintesis-abierta/2026-08-11_DELTA_DEFENSA_INOCENCIA_FAUNO_SEPARACION_PLANOS_HOMBRE_CUSTODIO_ES_EN.md)',
                      '- [∞ · Puerta Abierta del Fractal / Open Gate of the Fractal](./INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md)',
                      '', '<!-- NEO_CANONICAL_CROSSREFS_END -->',''
                  ]
                  block='\n'.join(lines)
                  pos=text.rfind('**Navegación / Navigation:**')
                  if pos < 0:
                      raise SystemExit(f'Navigation marker missing in {p}')
                  text=text[:pos]+block+text[pos:]
              p.write_text(text,encoding='utf-8')

          # Canonical filename registry.
          regp=ROOT/'manifiestos'/'CANONICAL_FILENAMES.json'
          reg=json.loads(regp.read_text(encoding='utf-8'))
          additions={
              'LXIX':('manifiestos/69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md','manifiestos/canonicos/LXIX_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md'),
              'LXX':('manifiestos/70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md','manifiestos/canonicos/LXX_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md'),
              'LXXI':('manifiestos/71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md','manifiestos/canonicos/LXXI_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md'),
              'LXXII':('manifiestos/72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md','manifiestos/canonicos/LXXII_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md'),
          }
          for roman,(legacy,canonical) in additions.items():
              reg['entries'][roman]={'legacy':legacy,'canonical':canonical}
          regp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Manifesto README: remove stale duplicate, add 69-72, update live state.
          rp=ROOT/'manifiestos'/'README.md'
          t=rp.read_text(encoding='utf-8')
          dup='- **LXVI** · [NeoSinergia™ · Neowar™ Activa, Sistema MÉDICI™ y Leónidas–Cancerbero™ / NeoSynergy™](66_neosinergia_neowar_activa_medici_leonidas_cancerbero_ES_EN.md)\n'
          t=t.replace(dup,'')
          marker='- **LXVIII** · [Los Conflictos que No Son Nuestros™ · Soberanía Intelectual de la Especie / The Conflicts That Are Not Ours™](68_conflictos_que_no_son_nuestros_soberania_intelectual_especie_ES_EN.md)\n'
          add=(
              '- **LXIX** · [Defensa de la Inocencia Humana™ · Asimetría Protectora y Deber de Custodia / Defence of Human Innocence™](69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md) · [SAN #119]('+GH+'/issues/119)\n'
              '- **LXX** · [El Fauno™ · Masculinidad Fragmentada, Depredación Relacional y Retorno al Hombre / The Faun™](70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md) · [SAN #120]('+GH+'/issues/120)\n'
              '- **LXXI** · [Libertad Sexual, Hipersexualización Industrial y Separación de Planos™ / Sexual Freedom, Industrial Hypersexualisation and Separation of Planes™](71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md) · [SAN #121]('+GH+'/issues/121)\n'
              '- **LXXII** · [El Hombre Custodio™ · Fuerza, Deseo, Poder y Responsabilidad / The Custodian Man™](72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md) · [SAN #122]('+GH+'/issues/122)\n'
          )
          if '- **LXIX** ·' not in t:
              if marker not in t: raise SystemExit('LXVIII README marker missing')
              t=t.replace(marker,marker+add)
          t=t.replace('**LXVIII · Los Conflictos que No Son Nuestros™ · Soberanía Intelectual de la Especie / The Conflicts That Are Not Ours™ · Intellectual Sovereignty of the Species**','**LXXII · El Hombre Custodio™ · Fuerza, Deseo, Poder y Responsabilidad / The Custodian Man™ · Strength, Desire, Power and Responsibility**')
          t=re.sub(r'\*\*\[Leer LXVIII / Read LXVIII\]\([^\n]+',f'**[Leer LXXII / Read LXXII](72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md) · [Síntesis Abierta LXXII · #122 / Open Synthesis LXXII · #122]({GH}/issues/122)**',t)
          t=t.replace('68 manifiestos finitos bilingües · I–LXVIII + Manifiesto ∞ / 68 finite bilingual manifestos · I–LXVIII + Manifesto ∞','72 manifiestos finitos bilingües · I–LXXII + Manifiesto ∞ / 72 finite bilingual manifestos · I–LXXII + Manifesto ∞')
          t=t.replace('**Fecha / Date:** 2026-08-10','**Fecha / Date:** 2026-08-11')
          t=t.replace('I–LXVIII + ∞ + Neoaxiomas + sistema','I–LXXII + ∞ + Neoaxiomas + sistema')
          t=re.sub(r'\*\*Última síntesis finita / Latest finite synthesis:\*\*[^\n]+',f'**Última síntesis finita / Latest finite synthesis:** [LXXII · El Hombre Custodio™](72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md) · [Issue #122]({GH}/issues/122)',t)
          rp.write_text(t,encoding='utf-8')

          # Canonical README live coverage.
          cp=ROOT/'manifiestos'/'canonicos'/'README.md'
          c=cp.read_text(encoding='utf-8').replace('correspondencia completa I–LX está','correspondencia completa I–LXXII está')
          cp.write_text(c,encoding='utf-8')

          # Neoaxiom candidate registry and full formulation.
          np=ROOT/'neoaxiomas'/'README.md'
          n=np.read_text(encoding='utf-8')
          n=n.replace('I–LXVIII / Neoaxiomatic candidates detected in the I–LXVIII review','I–LXXII / Neoaxiomatic candidates detected in the I–LXXII review')
          row18='| **C-NAX-18 · Motor del Bien Común + NeoSinergia™ / Common-Good Engine + NeoSynergy™** | [LXVI](../manifiestos/66_neosinergia_neowar_activa_medici_leonidas_cancerbero_ES_EN.md) + [LXVII](../manifiestos/67_neotitanes_reconstruccion_sistemica_motor_bien_comun_espana_ES_EN.md) | Candidato relacional a síntesis; no convierte cooperación en coerción / Relational synthesis candidate; does not turn cooperation into coercion |\n'
          row19='| **C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™ / Relational Inviolability and Separation of Planes™** | [LXIX](../manifiestos/69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md) + [LXX](../manifiestos/70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md) + [LXXI](../manifiestos/71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md) + [LXXII](../manifiestos/72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md) | **Candidato explícito · SAN #123**; no canonizado / **Explicit candidate · SAN #123**; not canonicalised |\n'
          if 'C-NAX-19 · Inviolabilidad Relacional' not in n:
              if row18 not in n: raise SystemExit('C-NAX-18 row missing')
              n=n.replace(row18,row18+row19)
          if '### C-NAX-19 · Inviolabilidad Relacional' not in n:
              block='''\n### C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™ / Relational Inviolability and Separation of Planes™\n\n**ES · formulación candidata:**\n\n> **Ningún deseo, fantasía, rol, vínculo, acceso, dependencia o posición de poder convierte a otra persona en disponible, poseída u obligada. Toda relación legítima debe preservar dignidad, consentimiento válido, capacidad real de salida y responsabilidad proporcional a la asimetría de poder.**\n\n```text\nDIGNIDAD COMÚN\n+ CONSENTIMIENTO VÁLIDO\n+ SEPARACIÓN DE PLANOS\n+ CAPACIDAD REAL DE SALIDA\n+ PROTECCIÓN PROPORCIONAL A VULNERABILIDAD\n+ RESPONSABILIDAD PROPORCIONAL A PODER\n= INVIOLABILIDAD RELACIONAL™\n```\n\n**EN · candidate formulation:**\n\n> **No desire, fantasy, role, bond, access, dependency or position of power turns another person into someone available, possessed or obliged. Every legitimate relationship must preserve dignity, valid consent, real capacity to exit and responsibility proportional to power asymmetry.**\n\n```text\nCOMMON DIGNITY\n+ VALID CONSENT\n+ SEPARATION OF PLANES\n+ REAL CAPACITY TO EXIT\n+ PROTECTION PROPORTIONAL TO VULNERABILITY\n+ RESPONSIBILITY PROPORTIONAL TO POWER\n= RELATIONAL INVIOLABILITY™\n```\n\n**Separación de Planos / Separation of Planes:** `FANTASÍA/FANTASY ≠ REALIDAD/REALITY · DESEO/DESIRE ≠ DERECHO/RIGHT · ROL/ROLE ≠ IDENTIDAD TOTAL/TOTAL IDENTITY · EXCITACIÓN/AROUSAL ≠ CONSENTIMIENTO/CONSENT · PODER/POWER ≠ PERMISO/PERMISSION · ACCESO/ACCESS ≠ DISPONIBILIDAD/AVAILABILITY · RELACIÓN/RELATIONSHIP ≠ PROPIEDAD/OWNERSHIP`.\n\n**Síntesis específica / Dedicated synthesis:** [#123]('''+GH+'''/issues/123). **CANDIDATO ≠ CANON / CANDIDATE ≠ CANON.**\n\n'''
              pos=n.find('**Regla 7.2 / 7.2 rule:**')
              if pos<0: raise SystemExit('Rule 7.2 marker missing')
              n=n[:pos]+block+n[pos:]
          np.write_text(n,encoding='utf-8')

          # Complete Open Synthesis index.
          ip=ROOT/'propuestas'/'sintesis-abierta'/'INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md'
          x=ip.read_text(encoding='utf-8')
          x=x.replace('**Fecha / Date:** 2026-08-10','**Fecha / Date:** 2026-08-11')
          x=x.replace('68 manifiestos finitos I–LXVIII + Manifiesto ∞','72 manifiestos finitos I–LXXII + Manifiesto ∞')
          x=x.replace('| LXVI | [NeoSinergia™ · Neowar™ Activa, Sistema MÉDICI™ y Leónidas–Cancerbero™](../../manifiestos/66_neosinergia_neowar_activa_medici_leonidas_cancerbero_ES_EN.md) | [#110]('+GH+'/issues/110) |\n','')
          row68='| LXVIII | [Los Conflictos que No Son Nuestros™ · Soberanía Intelectual de la Especie](../../manifiestos/68_conflictos_que_no_son_nuestros_soberania_intelectual_especie_ES_EN.md) | [#114]('+GH+'/issues/114) |\n'
          rows=(
              '| LXIX | [Defensa de la Inocencia Humana™](../../manifiestos/69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md) | [#119]('+GH+'/issues/119) |\n'
              '| LXX | [El Fauno™](../../manifiestos/70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md) | [#120]('+GH+'/issues/120) |\n'
              '| LXXI | [Libertad Sexual, Hipersexualización Industrial y Separación de Planos™](../../manifiestos/71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md) | [#121]('+GH+'/issues/121) |\n'
              '| LXXII | [El Hombre Custodio™](../../manifiestos/72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md) | [#122]('+GH+'/issues/122) |\n'
          )
          if '| LXIX |' not in x:
              if row68 not in x: raise SystemExit('LXVIII index row missing')
              x=x.replace(row68,row68+rows)
          nax14='| NAX-14 · Prevención de la Bifurcación Simbiótica™ | [#97]('+GH+'/issues/97) |\n'
          nax19='| **C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™ · candidato** | [#123]('+GH+'/issues/123) |\n'
          if 'C-NAX-19 · Inviolabilidad Relacional' not in x:
              x=x.replace(nax14,nax14+nax19)
          trans='| Delta · Defensa de la Inocencia Humana™ ↔ Fauno™ ↔ Separación de Planos™ ↔ Hombre Custodio™ | [documento](./2026-08-11_DELTA_DEFENSA_INOCENCIA_FAUNO_SEPARACION_PLANOS_HOMBRE_CUSTODIO_ES_EN.md) · [#119]('+GH+'/issues/119) · [#120]('+GH+'/issues/120) · [#121]('+GH+'/issues/121) · [#122]('+GH+'/issues/122) · [C-NAX-19 #123]('+GH+'/issues/123) |\n'
          if 'Delta · Defensa de la Inocencia Humana™ ↔ Fauno™' not in x:
              marker='| No Absolutización de Escala™, Residuo Fenomenológico y Cosmologías Monádicas | [#104]('+GH+'/issues/104) |\n'
              x=x.replace(marker,marker+trans)
          ip.write_text(x,encoding='utf-8')

          # Open Synthesis portal: update live range and expose cluster.
          pp=ROOT/'propuestas'/'sintesis-abierta'/'README.md'
          s=pp.read_text(encoding='utf-8')
          s=s.replace('68 manifiestos finitos','72 manifiestos finitos').replace('68 finite manifestos','72 finite manifestos').replace('I–LXVIII','I–LXXII')
          if '<!-- DELTA_INVIOLABILIDAD_RELACIONAL_20260811_START -->' not in s:
              appendix='''\n\n<!-- DELTA_INVIOLABILIDAD_RELACIONAL_20260811_START -->\n## Delta 2026-08-11 · Inviolabilidad Relacional / Relational Inviolability\n\n**ES.** Nueva constelación abierta: [LXIX · Defensa de la Inocencia Humana™](../../manifiestos/69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md) · [#119]('''+GH+'''/issues/119); [LXX · Fauno™](../../manifiestos/70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md) · [#120]('''+GH+'''/issues/120); [LXXI · Libertad Sexual, Hipersexualización Industrial y Separación de Planos™](../../manifiestos/71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md) · [#121]('''+GH+'''/issues/121); [LXXII · Hombre Custodio™](../../manifiestos/72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md) · [#122]('''+GH+'''/issues/122); [C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™](../../neoaxiomas/README.md) · [#123]('''+GH+'''/issues/123). [Delta íntegro](./2026-08-11_DELTA_DEFENSA_INOCENCIA_FAUNO_SEPARACION_PLANOS_HOMBRE_CUSTODIO_ES_EN.md).\n\n**EN.** New open constellation: [LXIX · Defence of Human Innocence™](../../manifiestos/69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md) · [#119]('''+GH+'''/issues/119); [LXX · Faun™](../../manifiestos/70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md) · [#120]('''+GH+'''/issues/120); [LXXI · Sexual Freedom, Industrial Hypersexualisation and Separation of Planes™](../../manifiestos/71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md) · [#121]('''+GH+'''/issues/121); [LXXII · Custodian Man™](../../manifiestos/72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md) · [#122]('''+GH+'''/issues/122); [C-NAX-19 · Relational Inviolability and Separation of Planes™](../../neoaxiomas/README.md) · [#123]('''+GH+'''/issues/123). [Full delta](./2026-08-11_DELTA_DEFENSA_INOCENCIA_FAUNO_SEPARACION_PLANOS_HOMBRE_CUSTODIO_ES_EN.md).\n<!-- DELTA_INVIOLABILIDAD_RELACIONAL_20260811_END -->\n'''
              s+=appendix
          pp.write_text(s,encoding='utf-8')

          # Relational work map.
          mp=ROOT/'manifiestos'/'RELACIONES_TRABAJO_APLICADO_ES_EN.md'
          m=mp.read_text(encoding='utf-8')
          if '<!-- RELACION_LXIX_LXXII_START -->' not in m:
              m+='''\n\n<!-- RELACION_LXIX_LXXII_START -->\n## Constelación LXIX–LXXII · Inviolabilidad, Fauno, Separación de Planos y Custodia / LXIX–LXXII constellation · Inviolability, Faun, Separation of Planes and Custodianship\n\n**ES:** XXXVIII · Protección Integral de la Infancia™ → LXIX · Defensa de la Inocencia Humana™ → LXX · Fauno™ → LXXI · Separación de Planos™ → LXXII · Hombre Custodio™ → C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™. La relación no declara causalidad empírica entre pornografía, migración, clase o conducta; abre esos factores a auditoría específica y conserva `ORIGEN ≠ CONDUCTA`, `FANTASÍA ≠ REALIDAD`, `DESEO ≠ DERECHO`, `PROTECCIÓN ≠ PROPIEDAD`.\n\n**EN:** XXXVIII · Comprehensive Protection of Childhood™ → LXIX · Defence of Human Innocence™ → LXX · Faun™ → LXXI · Separation of Planes™ → LXXII · Custodian Man™ → C-NAX-19 · Relational Inviolability and Separation of Planes™. The relation does not declare empirical causation between pornography, migration, class or conduct; it opens those factors to specific audit and preserves `ORIGIN ≠ CONDUCT`, `FANTASY ≠ REALITY`, `DESIRE ≠ RIGHT`, `PROTECTION ≠ OWNERSHIP`.\n\n[Delta íntegro / Full delta](../propuestas/sintesis-abierta/2026-08-11_DELTA_DEFENSA_INOCENCIA_FAUNO_SEPARACION_PLANOS_HOMBRE_CUSTODIO_ES_EN.md) · [LXIX #119]('''+GH+'''/issues/119) · [LXX #120]('''+GH+'''/issues/120) · [LXXI #121]('''+GH+'''/issues/121) · [LXXII #122]('''+GH+'''/issues/122) · [C-NAX-19 #123]('''+GH+'''/issues/123)\n<!-- RELACION_LXIX_LXXII_END -->\n'''
          mp.write_text(m,encoding='utf-8')

          # Infinity receives the new finite frontier without erasing earlier genealogy.
          fp=ROOT/'manifiestos'/'INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md'
          inf=fp.read_text(encoding='utf-8')
          inf=inf.replace('**Versión / Version:** 1.3','**Versión / Version:** 1.4').replace('**Fecha de esta versión / Date of this version:** 2026-08-10','**Fecha de esta versión / Date of this version:** 2026-08-11')
          inf=inf.replace('Cuando exista LXVIII, ∞ irá después de LXVIII.','Cuando exista LXXII, ∞ irá después de LXXII.').replace('When LXVIII exists, ∞ will go after LXVIII.','When LXXII exists, ∞ will go after LXXII.')
          if '<!-- INFINITO_LXIX_LXXII_START -->' not in inf:
              block='''\n\n<!-- INFINITO_LXIX_LXXII_START -->\n## XII. Inviolabilidad relacional, Fauno™ y custodia de la potencia\n\nLa apertura de ∞ incorpora ahora la constelación **LXIX–LXXII** sin convertirla en dogma cerrado. LXIX extiende la protección de la infancia hacia una obligación general de defensa proporcional de la vulnerabilidad; LXX abre el arquetipo Fauno™ como potencia masculina fragmentada sin convertir masculinidad, origen, clase o sexualidad en culpabilidad; LXXI separa libertad sexual adulta de captura y abre a auditoría la hipersexualización industrial; LXXII propone Hombre Custodio™ como integración de fuerza, deseo y poder bajo responsabilidad.\n\nLa relación común se somete a **C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™**, todavía candidato:\n\n```text\nFANTASÍA ≠ REALIDAD\nDESEO ≠ DERECHO\nROL ≠ IDENTIDAD TOTAL\nEXCITACIÓN ≠ CONSENTIMIENTO\nPODER ≠ PERMISO\nACCESO ≠ DISPONIBILIDAD\nRELACIÓN ≠ PROPIEDAD\n```\n\n[LXIX · #119]('''+GH+'''/issues/119) · [LXX · #120]('''+GH+'''/issues/120) · [LXXI · #121]('''+GH+'''/issues/121) · [LXXII · #122]('''+GH+'''/issues/122) · [C-NAX-19 · #123]('''+GH+'''/issues/123)\n\n## XII. Relational inviolability, Faun™ and custodianship of power\n\nThe opening of ∞ now incorporates the **LXIX–LXXII** constellation without turning it into closed dogma. LXIX extends child protection toward a general duty of proportional defence of vulnerability; LXX opens the Faun™ archetype as fragmented masculine power without turning masculinity, origin, class or sexuality into guilt; LXXI separates adult sexual freedom from capture and opens industrial hypersexualisation to audit; LXXII proposes Custodian Man™ as integration of strength, desire and power under responsibility.\n\nThe common relation is submitted to **C-NAX-19 · Relational Inviolability and Separation of Planes™**, still a candidate:\n\n```text\nFANTASY ≠ REALITY\nDESIRE ≠ RIGHT\nROLE ≠ TOTAL IDENTITY\nAROUSAL ≠ CONSENT\nPOWER ≠ PERMISSION\nACCESS ≠ AVAILABILITY\nRELATIONSHIP ≠ OWNERSHIP\n```\n\n[LXIX · #119]('''+GH+'''/issues/119) · [LXX · #120]('''+GH+'''/issues/120) · [LXXI · #121]('''+GH+'''/issues/121) · [LXXII · #122]('''+GH+'''/issues/122) · [C-NAX-19 · #123]('''+GH+'''/issues/123)\n<!-- INFINITO_LXIX_LXXII_END -->\n'''
              inf+=block
          fp.write_text(inf,encoding='utf-8')

          # WEB4 manifesto reader and public surface current range.
          wp=ROOT/'web4'/'manifiestos'/'index.html'
          w=wp.read_text(encoding='utf-8')
          w=w.replace('I–LXVIII + ∞','I–LXXII + ∞').replace('68 manifiestos','72 manifiestos').replace('68 finite manifestos','72 finite manifestos')
          old="['LXVIII','Los Conflictos que No Son Nuestros™ · Soberanía Intelectual de la Especie','68_conflictos_que_no_son_nuestros_soberania_intelectual_especie_ES_EN.md'],['∞','Neo0™ · Puerta Abierta del Fractal','INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md']"
          new="['LXVIII','Los Conflictos que No Son Nuestros™ · Soberanía Intelectual de la Especie','68_conflictos_que_no_son_nuestros_soberania_intelectual_especie_ES_EN.md'],['LXIX','Defensa de la Inocencia Humana™','69_defensa_inocencia_humana_asimetria_protectora_deber_custodia_ES_EN.md'],['LXX','El Fauno™','70_fauno_masculinidad_fragmentada_depredacion_relacional_retorno_hombre_ES_EN.md'],['LXXI','Libertad Sexual, Hipersexualización Industrial y Separación de Planos™','71_libertad_sexual_hipersexualizacion_industrial_separacion_planos_ES_EN.md'],['LXXII','El Hombre Custodio™','72_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md'],['∞','Neo0™ · Puerta Abierta del Fractal','INFINITO_neo0_puerta_abierta_fractal_leonidas_ES_EN.md']"
          if old in w: w=w.replace(old,new)
          elif "['LXIX','Defensa de la Inocencia Humana™'" not in w: raise SystemExit('WEB4 manifesto array marker missing')
          wp.write_text(w,encoding='utf-8')

          for path in ['web4/index.html','web4/README.md']:
              p=ROOT/path; z=p.read_text(encoding='utf-8')
              z=z.replace('I–LXVIII','I–LXXII').replace('68 manifiestos','72 manifiestos').replace('68 finite manifestos','72 finite manifestos').replace('los 68 manifiestos','los 72 manifiestos')
              p.write_text(z,encoding='utf-8')

          # Live top-level indexes: only present-state phrases, not dated audit snapshots.
          for path in ['README.md','LEEME.md','wiki-source/README.md','obras/README.md','analisis/README.md','analisis/publicos/README.md','analisis/auditorias/README.md','auditorias/publicas/README.md','proyeccion/README.md']:
              p=ROOT/path
              if not p.exists(): continue
              z=p.read_text(encoding='utf-8')
              z=z.replace('I–LXVIII + ∞','I–LXXII + ∞').replace('I–LXVIII + Manifiesto ∞','I–LXXII + Manifiesto ∞').replace('68 manifiestos finitos','72 manifiestos finitos').replace('68 finite manifestos','72 finite manifestos')
              p.write_text(z,encoding='utf-8')

          # Generate derived canonical copies through the repository's own resolver.
          subprocess.run(['python','.github/scripts/sync_canonical_manifestos.py'],check=True)

          # Sanity checks.
          for fn,d in docs.items():
              text=(ROOT/'manifiestos'/fn).read_text(encoding='utf-8')
              assert '# ES ·' in text and '# EN ·' in text
              assert f"issues/{d['issue']}" in text
              assert '<!-- NEO_CANONICAL_CROSSREFS_START -->' in text
          data=json.loads(regp.read_text(encoding='utf-8'))
          assert all(k in data['entries'] for k in ['LXIX','LXX','LXXI','LXXII'])
          assert (ROOT/'manifiestos/canonicos/LXXII_hombre_custodio_fuerza_deseo_poder_responsabilidad_ES_EN.md').exists()
          assert 'C-NAX-19' in np.read_text(encoding='utf-8') and 'issues/123' in np.read_text(encoding='utf-8')
          assert '| LXXII |' in ip.read_text(encoding='utf-8')
          assert "['LXXII','El Hombre Custodio™'" in wp.read_text(encoding='utf-8')
          print('LXIX-LXXII_RELATIONAL_SYNC=OK')
          PY
      - name: Commit and self-remove
        shell: bash
