          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-lxix-lxxii-relational-sync.yml
          git add -A
          git commit -m "sync: integrar LXIX-LXXII C-NAX-19 índices WEB4 y navegación"
          git push
