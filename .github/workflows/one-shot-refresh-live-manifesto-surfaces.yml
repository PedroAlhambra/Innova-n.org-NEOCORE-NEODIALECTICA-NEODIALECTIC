name: one-shot refresh live manifesto surfaces

# second-push trigger after workflow registration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-refresh-live-manifesto-surfaces.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh live current-state surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/sync_latest_manifesto_feature.py')
          s=p.read_text(encoding='utf-8')
          old="""def replace_version(text):
    text = re.sub(r'NEOCore™\\s+v?7\\.0', lambda m: m.group(0).replace('7.0', CURRENT_VERSION), text)
    text = re.sub(r'NEOCore\\s+v?7\\.0', lambda m: m.group(0).replace('7.0', CURRENT_VERSION), text)
    text = re.sub(r'NEOCore™\\s+7\\.x', f'NEOCore™ {CURRENT_VERSION}', text)
    text = re.sub(r'NEOCore\\s+7\\.x', f'NEOCore {CURRENT_VERSION}', text)
    return text
"""
          new="""def replace_version(text):
    # Live README/LEEME surfaces must follow CURRENT_VERSION. Historical
    # dated audit files are outside this synchroniser and retain their snapshot.
    text = re.sub(r'NEOCore™\\s+v?7\\.[01]', f'NEOCore™ {CURRENT_VERSION}', text)
    text = re.sub(r'NEOCore\\s+v?7\\.[01]', f'NEOCore {CURRENT_VERSION}', text)
    text = re.sub(r'NEOCore™\\s+7\\.x', f'NEOCore™ {CURRENT_VERSION}', text)
    text = re.sub(r'NEOCore\\s+7\\.x', f'NEOCore {CURRENT_VERSION}', text)
    return text
"""
          if old not in s:
              raise SystemExit('replace_version block changed; refusing blind patch')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python .github/scripts/sync_open_synthesis_manifestos.py
          python .github/scripts/sync_latest_manifesto_feature.py
          python - <<'PY'
          from pathlib import Path
          checks={
            'README.md':['NEOCore™ 7.2','LXXII','72 manifiestos','I–LXXII'],
            'LEEME.md':['NEOCore™ 7.2','LXXII','72 manifiestos','I–LXXII'],
            'manifiestos/README.md':['LXXII','72 manifiestos finitos','I–LXXII'],
            'propuestas/sintesis-abierta/README.md':['LXXII','72 manifiestos'],
          }
          for path,terms in checks.items():
              text=Path(path).read_text(encoding='utf-8')
              for term in terms:
                  assert term in text,(path,term)
          assert '# Innova_N — NEOCore™ 7.1' not in Path('README.md').read_text(encoding='utf-8')
          assert '# Innova_N — NEOCore™ 7.1' not in Path('LEEME.md').read_text(encoding='utf-8')
          print('LIVE_SURFACES_LXXII=OK')
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-refresh-live-manifesto-surfaces.yml
          git add -A
          git commit -m "sync: refrescar README LEEME y síntesis vivas a LXXII"
          git push