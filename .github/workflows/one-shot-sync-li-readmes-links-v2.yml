name: one-shot-sync-li-readmes-links-v2
on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-li-readmes-links-v2.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync canonical manifesto network and LI crosslinks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          root=Path('.')
          mdir=root/'manifiestos'
          index=mdir/'README.md'
          itxt=index.read_text(encoding='utf-8')
          # Canonical list is the managed network already present in the canonical manifesto index.
          mm=re.search(r'<!-- NEO_ALL_MANIFESTOS_START -->(.*?)<!-- NEO_ALL_MANIFESTOS_END -->',itxt,re.S)
          if not mm: raise SystemExit('Canonical manifesto network block missing')
          entries=[]; seen=set()
          pat=re.compile(r'^- \*\*([IVXLCDM]+)\*\* · \[([^\]]+)\]\(([^)]+\.md)\)\s*$',re.M)
          for roman,title,href in pat.findall(mm.group(1)):
              p=(mdir/href).resolve() if not href.startswith('../') and '/' not in href else (index.parent/href).resolve()
              if roman in seen: continue
              if not p.exists(): raise SystemExit(f'Missing canonical manifesto target: {href}')
              seen.add(roman); entries.append((roman,title,p))
          if len(entries)!=51 or entries[-1][0] != 'LI':
              raise SystemExit(f'Canonical list invalid: {len(entries)} unique entries, last={entries[-1][0] if entries else None}')

          def rel(f,p): return os.path.relpath(p,start=f.parent).replace(os.sep,'/')
          def block(f):
              idx=rel(f,index.resolve())
              out=['<!-- NEO_ALL_MANIFESTOS_START -->','',
                   '## Red completa de manifiestos / Complete manifesto network','',
                   '**Estado canónico / Canonical state:** **51 manifiestos bilingües · I–LI · 18 oleadas / 51 bilingual manifestos · I–LI · 18 waves**  ',
                   f'**Índice canónico / Canonical index:** [{idx}]({idx})','',
                   '<details>','<summary><strong>I–LI · 51 manifiestos / 51 manifestos</strong></summary>','']
              for roman,title,p in entries: out.append(f'- **{roman}** · [{title}]({rel(f,p)})')
              out += ['', '</details>','',
                      '> **Regla de lectura / Reading rule:** ningún manifiesto equivale por sí solo al marco completo. Esta navegación mantiene los 51 manifiestos accesibles desde cualquier README sin sustituir el contexto propio de cada nodo. / No single manifesto equals the complete framework. This navigation keeps all 51 manifestos accessible from every README without replacing each node’s own context.','',
                      '<!-- NEO_ALL_MANIFESTOS_END -->']
              return '\n'.join(out)

          readmes=sorted(set(root.rglob('README.md')) | {root/'LEEME.md'})
          changed=[]
          for f in readmes:
              if not f.exists(): continue
              s=f.read_text(encoding='utf-8'); old=s
              idx=rel(f,index.resolve())
              cur=('<!-- MANIFESTOS_CURRENT_START -->\n\n'
                   '**Colección completa de manifiestos / Complete manifesto collection:** **I–LI · 51 manifiestos bilingües / 51 bilingual manifestos** · '
                   f'[índice canónico / canonical index]({idx})\n\n<!-- MANIFESTOS_CURRENT_END -->')
              if '<!-- MANIFESTOS_CURRENT_START -->' in s:
                  s=re.sub(r'<!-- MANIFESTOS_CURRENT_START -->.*?<!-- MANIFESTOS_CURRENT_END -->',cur,s,flags=re.S)
              else:
                  s=cur+'\n\n'+s
              nb=block(f)
              if '<!-- NEO_ALL_MANIFESTOS_START -->' in s:
                  s=re.sub(r'<!-- NEO_ALL_MANIFESTOS_START -->.*?<!-- NEO_ALL_MANIFESTOS_END -->',nb,s,flags=re.S)
              else:
                  a='<!-- MANIFESTOS_CURRENT_END -->'; i=s.find(a)+len(a); s=s[:i]+'\n\n'+nb+s[i:]
              # State-only normalization in navigation docs.
              s=s.replace('I–L · 50 manifiestos bilingües','I–LI · 51 manifiestos bilingües')
              s=s.replace('I–L · 50 bilingual manifestos','I–LI · 51 bilingual manifestos')
              s=s.replace('50 manifiestos bilingües · I–L · 17 oleadas','51 manifiestos bilingües · I–LI · 18 oleadas')
              s=s.replace('50 bilingual manifestos · I–L · 17 waves','51 bilingual manifestos · I–LI · 18 waves')
              if s!=old: f.write_text(s,encoding='utf-8'); changed.append(str(f))

          li=mdir/'51_sintesis_abierta_poder_civico_complementario_sustitutivo_jefaturas_estado_ES_EN.md'
          l=mdir/'50_inteligencia_compartida_no_unica_invitacion_ias_sintesis_abierta_ES_EN.md'
          analysis=root/'analisis/publicos/2026-08-08_accesibilidad_institucional_escalado_ciudadano_jefaturas_estado_ES_EN.md'
          relmap=mdir/'RELACIONES_TRABAJO_APLICADO_ES_EN.md'
          wiki=root/'wiki-source/Manifiestos.md'
          synth=root/'propuestas/sintesis-abierta/README.md'
          issue='https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/59'

          if analysis.exists():
              s=analysis.read_text(encoding='utf-8'); old=s
              if li.name not in s:
                  s += f'\n\n## Relación manifiesto / Manifesto relation\n\n- [LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™]({rel(analysis,li.resolve())})\n- [Síntesis Abierta LI · Issue #59]({issue})\n'
              if s!=old: analysis.write_text(s,encoding='utf-8'); changed.append(str(analysis))
          if relmap.exists():
              s=relmap.read_text(encoding='utf-8'); old=s
              if li.name not in s:
                  s += ('\n\n## LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™ / Open Synthesis as Complementary or Substitutive Civic Power™\n\n'
                        f'- [Manifiesto LI](./{li.name})\n'
                        '- [Análisis aplicado sobre accesibilidad institucional](../analisis/publicos/2026-08-08_accesibilidad_institucional_escalado_ciudadano_jefaturas_estado_ES_EN.md)\n'
                        f'- [Síntesis Abierta #59]({issue})\n'
                        '- Relaciones principales: II, III, IV, VIII, IX, X, XXXIV, XXXVI, XLV y L.\n')
              if s!=old: relmap.write_text(s,encoding='utf-8'); changed.append(str(relmap))
          if l.exists():
              s=l.read_text(encoding='utf-8'); old=s; h=rel(l,li.resolve())
              if h not in s: s += f'\n\n## Continuidad / Continuity\n\n→ [LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™]({h})\n'
              if s!=old: l.write_text(s,encoding='utf-8'); changed.append(str(l))
          if wiki.exists():
              s=wiki.read_text(encoding='utf-8'); old=s
              s=s.replace('I–L · 50','I–LI · 51').replace('17 oleadas','18 oleadas').replace('17 waves','18 waves')
              if li.name not in s: s += f'\n\n### LI · Síntesis Abierta como Poder Cívico Complementario o Sustitutivo™\n\n- [Manifiesto LI](../manifiestos/{li.name})\n- [Síntesis Abierta #59]({issue})\n'
              if s!=old: wiki.write_text(s,encoding='utf-8'); changed.append(str(wiki))
          if synth.exists():
              s=synth.read_text(encoding='utf-8'); old=s
              if li.name not in s: s += f'\n\n### LI · Poder cívico y jefaturas del Estado / Civic power and heads of state\n\n- [Manifiesto LI](../../manifiestos/{li.name})\n- [Síntesis Abierta #59]({issue})\n'
              if s!=old: synth.write_text(s,encoding='utf-8'); changed.append(str(synth))

          # Validate managed manifesto links in every README/LEEME.
          targets={p for _,_,p in entries}; link_re=re.compile(r'\[[^\]]*\]\(([^)]+)\)'); errors=[]
          for f in readmes:
              s=f.read_text(encoding='utf-8'); found=set()
              mm=re.search(r'<!-- NEO_ALL_MANIFESTOS_START -->(.*?)<!-- NEO_ALL_MANIFESTOS_END -->',s,re.S)
              if not mm: errors.append(f'{f}: missing managed network'); continue
              for href in link_re.findall(mm.group(1)):
                  h=href.split('#',1)[0]
                  if not h or re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:',h): continue
                  p=(f.parent/h).resolve()
                  if p in targets: found.add(p)
              if found!=targets: errors.append(f'{f}: {len(found)}/51 manifesto links')
          for f in [li,l,analysis,relmap,wiki,synth]:
              if not f.exists(): errors.append(f'missing required file: {f}')
          if errors: raise SystemExit('\n'.join(errors))
          print('READMES_LEEME_TOTAL=',len(readmes))
          print('CANONICAL_MANIFESTOS=',len(entries))
          print('FILES_CHANGED=',len(set(changed)))
          for f in sorted(set(changed)): print('CHANGED',f)
          print('POSTCHECK OK: all README/LEEME networks expose I–LI; LI reciprocal canonical links present')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'docs: synchronize all READMEs and links through manifesto LI'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Cleanup
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/one-shot-sync-li-readmes-links.yml .github/workflows/one-shot-sync-li-readmes-links-v2.yml
          git add -A
          git commit -m 'chore: remove LI synchronization one-shots' || exit 0
          git push origin main
