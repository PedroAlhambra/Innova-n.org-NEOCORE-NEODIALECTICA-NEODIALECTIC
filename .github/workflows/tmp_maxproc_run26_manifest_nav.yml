name: Temporary MAXPROC Run26 manifesto navigation repair

on:
  push:
    paths:
      - '.github/workflows/tmp_maxproc_run26_manifest_nav.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair false language navigation and verify gates
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('manifiestos/README.md')
          text = p.read_text(encoding='utf-8')
          old = '[ES · Castellano](#colección-canónica--canonical-collection) · [EN · English](#colección-canónica--canonical-collection) · [Síntesis Abierta](../propuestas/sintesis-abierta/README.md) · [Índice completo de Síntesis](../propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md) · [Auditorías Públicas](../auditorias/publicas/README.md)'
          new = '[Colección canónica / Canonical collection](#colección-canónica--canonical-collection) · [Síntesis Abierta / Open Synthesis](../propuestas/sintesis-abierta/README.md) · [Índice completo de Síntesis / Complete Synthesis index](../propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md) · [Auditorías Públicas / Public Audits](../auditorias/publicas/README.md)'
          if old not in text:
              raise SystemExit('Expected false ES/EN navigation line not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          note = '''# MAXPROC público Run26 · navegación honesta del índice de manifiestos / Public MAXPROC Run26 · truthful manifesto-index navigation

[ES · Castellano](#es--castellano) · [EN · English](#en--english)

# ES · Castellano

**Fecha:** 2026-08-25

## Estado observado

Los gates públicos vigentes estaban en PASS para simetría, selectores, integridad de enlaces y navegación relacional; `7.3-CANDIDATE` continuaba abierta y no canónica.

## Problema elegido

`manifiestos/README.md` mostraba un pseudo-selector `ES · Castellano / EN · English` cuyos dos enlaces apuntaban al mismo anchor `#colección-canónica--canonical-collection`. La página es un índice bilingüe intercalado, no dos capas separadas ES/EN; por tanto el control era visualmente engañoso aunque la ruta existiera.

## Acción

Se sustituyó únicamente ese pseudo-selector por navegación bilingüe descriptiva hacia la colección canónica, Síntesis Abierta, índice completo y auditorías públicas. No se modificó el corpus, la frontera I–LXXXI + ∞, la genealogía ni el estado `7.3-CANDIDATE`.

## Pruebas

Se ejecutaron `audit_language_selectors.py`, `audit_global_bilingual_symmetry.py` y `audit_markdown_links_readmes.py` después del cambio.

## Resultado

`PASS` para el delta corregido si los tres validadores finalizan sin fallo. El cambio elimina una navegación lingüística falsa sin inventar capas ES/EN inexistentes.

## PASO_SIGUIENTE

Revisar si otros README bilingües intercalados muestran controles de idioma que apunten al mismo destino y corregir sólo el primer caso demostrado.

# EN · English

**Date:** 2026-08-25

## Observed state

Current public gates were PASS for symmetry, language selectors, link integrity and relational navigation; `7.3-CANDIDATE` remained open and non-canonical.

## Chosen problem

`manifiestos/README.md` displayed a pseudo `ES · Castellano / EN · English` selector whose two links targeted the same `#colección-canónica--canonical-collection` anchor. The page is an interleaved bilingual index, not two separate ES/EN layers, so the control was visually misleading even though the route existed.

## Action

Only that pseudo-selector was replaced with truthful bilingual navigation to the canonical collection, Open Synthesis, complete index and public audits. The corpus, I–LXXXI + ∞ frontier, genealogy and `7.3-CANDIDATE` state were not changed.

## Tests

`audit_language_selectors.py`, `audit_global_bilingual_symmetry.py` and `audit_markdown_links_readmes.py` were run after the change.

## Result

`PASS` for the corrected delta if all three validators finish successfully. The change removes false language navigation without inventing ES/EN layers that do not exist.

## NEXT_STEP

Check whether other interleaved bilingual README files expose language controls that point to the same destination, and correct only the first demonstrated case.
'''
          Path('auditorias/publicas/2026-08-25_public_maxproc_run26_ES_EN.md').write_text(note, encoding='utf-8')
      - name: Run public gates
        run: |
          set -euo pipefail
          python .github/scripts/audit_language_selectors.py
          python .github/scripts/audit_global_bilingual_symmetry.py
          python .github/scripts/audit_markdown_links_readmes.py
      - name: Commit repair, reports and trace; remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp_maxproc_run26_manifest_nav.yml
          git add -A
          git commit -m 'fix: replace false language selector in manifesto index'
          git pull --rebase origin main
          git push origin main
