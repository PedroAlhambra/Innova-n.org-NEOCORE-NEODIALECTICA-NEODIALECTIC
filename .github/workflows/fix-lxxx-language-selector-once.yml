name: Fix LXXX language selector once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lxxx-language-selector-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert selector conservatively
        shell: python
        run: |
          from pathlib import Path

          selector = '[ES · Castellano](#es--castellano) · [EN · English](#en--english)'
          paths = [
              Path('manifiestos/80_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md'),
              Path('manifiestos/canonicos/LXXX_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert '# ES · Castellano' in text and '# EN · English' in text, path
              prefix = text.split('# ES · Castellano', 1)[0]
              if selector in prefix:
                  continue
              needle = '\n---\n\n# ES · Castellano'
              assert text.count(needle) == 1, f'{path}: unexpected ES boundary count'
              text = text.replace(needle, f'\n{selector}\n\n---\n\n# ES · Castellano', 1)
              path.write_text(text, encoding='utf-8')

      - name: Verify exact reader capability
        shell: python
        run: |
          from pathlib import Path
          selector = '[ES · Castellano](#es--castellano) · [EN · English](#en--english)'
          for p in [
              Path('manifiestos/80_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md'),
              Path('manifiestos/canonicos/LXXX_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md'),
          ]:
              t = p.read_text(encoding='utf-8')
              assert t.count(selector) == 1, p
              assert t.index(selector) < t.index('# ES · Castellano') < t.index('# EN · English'), p

      - name: Diff guard
        run: |
          git diff --check
          git diff -- manifiestos/80_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md manifiestos/canonicos/LXXX_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md

      - name: Remove one-shot workflow and commit repair
        run: |
          rm .github/workflows/fix-lxxx-language-selector-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/80_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md \
                  manifiestos/canonicos/LXXX_neotrama_hojas_reconstruidas_agua_recuperada_fuego_de_agua_ES_EN.md \
                  .github/workflows/fix-lxxx-language-selector-once.yml
          git commit -m 'fix(manifesto): restore ES/EN selector in LXXX'
          git push
