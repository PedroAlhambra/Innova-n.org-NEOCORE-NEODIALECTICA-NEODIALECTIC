name: Audit bilingual language selectors

on:
  push:
    paths:
      - '**/*.md'
      - '.github/scripts/audit_language_selectors.py'
      - '.github/workflows/audit-language-selectors.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/scripts/audit_language_selectors.py'
      - '.github/workflows/audit-language-selectors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-selector-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit ES/EN language selectors
        run: python .github/scripts/audit_language_selectors.py
