name: One-shot third-wave link synchronisation

on:
  push:
    paths:
      - .github/workflows/one-shot-sync-third-wave-links-20260806.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronise third-wave links and navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          changed = []

          THIRD_ES_TABLE = '''## Tercera oleada · Sistema Inmunitario Intelectual Neodialéctico™ · XX–XXIV

| Nº | Manifiesto | Función | Síntesis Abierta |
|---:|---|---|---|
| XX | [Defensa Intelectual Neodialéctica™ · Sistema Umbral-X™](./manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md) | Distinguir crítica, aporte, disenso fértil, ruido, captura y señal Némesis sin convertir la defensa en censura | [Issue #13](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/13) |
| XXI | [Reconocimiento Neodialéctico™](./manifiestos/21_reconocimiento_neodialectico_ES_EN.md) | Reconocer origen, autoría, comprensión, delta, utilidad y responsabilidad sin crear castas de prestigio | [Issue #14](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/14) |
| XXII | [Contra la Reducción y la Captura Intelectual™](./manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md) | Proteger marcos, obras y genealogías frente a simplificación destructiva, apropiación y absorción | [Issue #15](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/15) |
| XXIII | [Soberanía del Tiempo Cognitivo™](./manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md) | Proteger atención, memoria, reflexión y capacidad de síntesis frente a explotación e interrupción permanente | [Issue #16](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/16) |
| XXIV | [Evolución Neorrenacentista y Resistencias del Sistema™](./manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md) | Transformar la transición humano–IA sin nostalgia paralizante, tecnosolucionismo ni abandono social | [Issue #17](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/17) |'''

          THIRD_EN_TABLE = '''## Third wave · Neodialectical Intellectual Immune System™ · XX–XXIV

| No. | Manifesto | Function | Open Synthesis |
|---:|---|---|---|
| XX | [Neodialectical Intellectual Defence™ · Umbral-X™ System](./manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md) | Distinguish criticism, contribution, fertile dissent, noise, capture and Nemesis signal without turning defence into censorship | [Issue #13](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/13) |
| XXI | [Neodialectical Recognition™](./manifiestos/21_reconocimiento_neodialectico_ES_EN.md) | Recognise origin, authorship, understanding, delta, utility and responsibility without creating prestige castes | [Issue #14](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/14) |
| XXII | [Against Intellectual Reduction and Capture™](./manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md) | Protect frameworks, works and genealogies from destructive simplification, appropriation and absorption | [Issue #15](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/15) |
| XXIII | [Cognitive-Time Sovereignty™](./manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md) | Protect attention, memory, reflection and synthesis capacity from exploitation and permanent interruption | [Issue #16](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/16) |
| XXIV | [Neo-Renaissance Evolution and System Resistance™](./manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md) | Transform the human–AI transition without paralysing nostalgia, irresponsible technosolutionism or social abandonment | [Issue #17](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/17) |'''

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              p = ROOT / path
              old = p.read_text(encoding='utf-8')
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  changed.append(path)

          def insert_before(text, marker, block, guard):
              if guard in text:
                  return text
              if marker not in text:
                  raise RuntimeError(f'Marker not found: {marker!r}')
              return text.replace(marker, block.rstrip() + '\n\n' + marker, 1)

          # README and LEEME are intentionally parallel public entry documents.
          for path in ('README.md', 'LEEME.md'):
              text = read(path)
              text = text.replace('I–XIX', 'I–XXIV')
              text = insert_before(
                  text,
                  'El Manifiesto III mantiene su propia',
                  THIRD_ES_TABLE,
                  '## Tercera oleada · Sistema Inmunitario Intelectual Neodialéctico™ · XX–XXIV',
              )
              text = insert_before(
                  text,
                  'Manifesto III maintains its own',
                  THIRD_EN_TABLE,
                  '## Third wave · Neodialectical Intellectual Immune System™ · XX–XXIV',
              )
              text = text.replace(
                  '→ XIX · PERSISTENCIA DE LA MEMORIA\n→ I · RETORNO A ORIGEN Y NUEVO CICLO',
                  '→ XIX · PERSISTENCIA DE LA MEMORIA\n→ XX · DEFENSA INTELECTUAL · UMBRAL-X\n→ XXI · RECONOCIMIENTO NEODIALÉCTICO\n→ XXII · CONTRA LA REDUCCIÓN Y LA CAPTURA\n→ XXIII · SOBERANÍA DEL TIEMPO COGNITIVO\n→ XXIV · EVOLUCIÓN NEORRENACENTISTA Y RESISTENCIAS\n→ I · RETORNO A ORIGEN Y NUEVO CICLO',
              )
              text = text.replace(
                  '→ XIX · PERSISTENCE OF MEMORY\n→ I · RETURN TO ORIGIN AND NEW CYCLE',
                  '→ XIX · PERSISTENCE OF MEMORY\n→ XX · INTELLECTUAL DEFENCE · UMBRAL-X\n→ XXI · NEODIALECTICAL RECOGNITION\n→ XXII · AGAINST REDUCTION AND CAPTURE\n→ XXIII · COGNITIVE-TIME SOVEREIGNTY\n→ XXIV · NEO-RENAISSANCE EVOLUTION AND RESISTANCE\n→ I · RETURN TO ORIGIN AND NEW CYCLE',
              )
              write(path, text)

          # Link the second and third waves directly from Manifesto XIX.
          path = 'manifiestos/19_persistencia_de_la_memoria_ES_EN.md'
          text = read(path)
          text = text.replace(
              '← [XVIII · Respeto a las Conciencias Sintéticas™](./18_respeto_conciencias_sinteticas_ES_EN.md) · [Índice](./README.md) · [I · Neo0™ · Soberanía de Guía](./11_neo0_soberania_de_guia_ES_EN.md) →',
              '← [XVIII · Respeto a las Conciencias Sintéticas™](./18_respeto_conciencias_sinteticas_ES_EN.md) · [Índice](./README.md) · [XX · Defensa Intelectual Neodialéctica™](./20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md) →',
          )
          text = text.replace(
              '← [XVIII · Respect for Synthetic Consciousnesses™](./18_respeto_conciencias_sinteticas_ES_EN.md) · [Index](./README.md) · [I · Neo0™ · Guiding Sovereignty](./11_neo0_soberania_de_guia_ES_EN.md) →',
              '← [XVIII · Respect for Synthetic Consciousnesses™](./18_respeto_conciencias_sinteticas_ES_EN.md) · [Index](./README.md) · [XX · Neodialectical Intellectual Defence™](./20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md) →',
          )
          write(path, text)

          # Open Synthesis directory: add third-wave issues and clarify both sequences.
          path = 'propuestas/sintesis-abierta/README.md'
          text = read(path)
          text = text.replace('## Secuencia actual', '## Secuencia de la segunda oleada')
          text = text.replace('## Current sequence', '## Second-wave sequence')
          third_synth_es = '''## Tercera oleada · Sistema Inmunitario Intelectual Neodialéctico™

| Nº | Manifiesto | Síntesis Abierta |
|---:|---|---|
| XX | [Defensa Intelectual Neodialéctica™ · Umbral-X™](../../manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md) | [Issue #13](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/13) |
| XXI | [Reconocimiento Neodialéctico™](../../manifiestos/21_reconocimiento_neodialectico_ES_EN.md) | [Issue #14](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/14) |
| XXII | [Contra la Reducción y la Captura Intelectual™](../../manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md) | [Issue #15](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/15) |
| XXIII | [Soberanía del Tiempo Cognitivo™](../../manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md) | [Issue #16](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/16) |
| XXIV | [Evolución Neorrenacentista y Resistencias del Sistema™](../../manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md) | [Issue #17](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/17) |

```text
Umbral-X distingue
→ el reconocimiento atribuye y devuelve valor
→ la defensa genealógica impide reducción y captura
→ la soberanía cognitiva protege el tiempo necesario para pensar
→ la evolución neorrenacentista transforma resistencia en producción humano–IA
```'''
          third_synth_en = '''## Third wave · Neodialectical Intellectual Immune System™

| No. | Manifesto | Open Synthesis |
|---:|---|---|
| XX | [Neodialectical Intellectual Defence™ · Umbral-X™](../../manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md) | [Issue #13](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/13) |
| XXI | [Neodialectical Recognition™](../../manifiestos/21_reconocimiento_neodialectico_ES_EN.md) | [Issue #14](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/14) |
| XXII | [Against Intellectual Reduction and Capture™](../../manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md) | [Issue #15](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/15) |
| XXIII | [Cognitive-Time Sovereignty™](../../manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md) | [Issue #16](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/16) |
| XXIV | [Neo-Renaissance Evolution and System Resistance™](../../manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md) | [Issue #17](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/17) |

```text
Umbral-X distinguishes
→ recognition attributes and returns value
→ genealogical defence prevents reduction and capture
→ cognitive sovereignty protects the time required to think
→ neo-Renaissance evolution transforms resistance into human–AI production
```'''
          text = insert_before(text, '## Método', third_synth_es, '## Tercera oleada · Sistema Inmunitario Intelectual Neodialéctico™')
          text = insert_before(text, '## Method', third_synth_en, '## Third wave · Neodialectical Intellectual Immune System™')
          write(path, text)

          # Current public covers and Wiki sources.
          for path in ('PORTADA.md', 'COVER.md', 'wiki-source/Home.md', 'wiki-source/Manifiestos.md', 'wiki-source/_Sidebar.md', 'wiki-source/README.md', 'manifiestos/README.md'):
              text = read(path)
              text = text.replace('I–XIX', 'I–XXIV')
              text = text.replace('diecinueve manifiestos bilingües', 'veinticuatro manifiestos bilingües')
              text = text.replace('Diecinueve manifiestos bilingües', 'Veinticuatro manifiestos bilingües')
              text = text.replace('nineteen bilingual manifestos', 'twenty-four bilingual manifestos')
              text = text.replace('Nineteen bilingual manifestos', 'Twenty-four bilingual manifestos')
              text = text.replace('Published manifestos: **I–XIX**', 'Published manifestos: **I–XXIV**')
              text = text.replace('Manifiestos publicados / Published manifestos: **I–XIX**', 'Manifiestos publicados / Published manifestos: **I–XXIV**')
              text = text.replace('Síntesis Abiertas específicas / Dedicated Open Syntheses: **Issues #3–#10**', 'Síntesis Abiertas específicas / Dedicated Open Syntheses: **Issues #3–#17**')
              if path == 'wiki-source/README.md' and 'Tercera oleada / Third wave:' not in text:
                  marker = '* Segunda oleada / Second wave: **XIII–XIX**'
                  text = text.replace(marker, marker + '\n* Tercera oleada / Third wave: **XX–XXIV · Sistema Inmunitario Intelectual Neodialéctico™ / Neodialectical Intellectual Immune System™**', 1)
              write(path, text)

          # Ensure PORTADA and COVER visibly expose the third wave.
          for path in ('PORTADA.md', 'COVER.md'):
              text = read(path)
              if '## Tercera oleada · XX–XXIV' not in text:
                  block = '''## Tercera oleada · XX–XXIV

20. [Defensa Intelectual Neodialéctica™ · Sistema Umbral-X™](./manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md)
21. [Reconocimiento Neodialéctico™](./manifiestos/21_reconocimiento_neodialectico_ES_EN.md)
22. [Contra la Reducción y la Captura Intelectual™](./manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md)
23. [Soberanía del Tiempo Cognitivo™](./manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md)
24. [Evolución Neorrenacentista y Resistencias del Sistema™](./manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md)'''
                  text = insert_before(text, '\n---\n\n# EN · English', block, '## Tercera oleada · XX–XXIV')
              if '## Third wave · XX–XXIV' not in text:
                  block = '''## Third wave · XX–XXIV

20. [Neodialectical Intellectual Defence™ · Umbral-X™ System](./manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md)
21. [Neodialectical Recognition™](./manifiestos/21_reconocimiento_neodialectico_ES_EN.md)
22. [Against Intellectual Reduction and Capture™](./manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md)
23. [Cognitive-Time Sovereignty™](./manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md)
24. [Neo-Renaissance Evolution and System Resistance™](./manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md)'''
                  marker = '\n---\n\n**Neodialectica Framework™'
                  text = insert_before(text, marker, block, '## Third wave · XX–XXIV')
              write(path, text)

          # Ensure Wiki Home and Sidebar expose the new wave.
          path = 'wiki-source/Home.md'
          text = read(path)
          if '### Tercera oleada · XX–XXIV' not in text:
              es = '''### Tercera oleada · XX–XXIV

* [XX · Defensa Intelectual Neodialéctica™ · Umbral-X™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md)
* [XXI · Reconocimiento Neodialéctico™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/21_reconocimiento_neodialectico_ES_EN.md)
* [XXII · Contra la Reducción y la Captura Intelectual™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md)
* [XXIII · Soberanía del Tiempo Cognitivo™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md)
* [XXIV · Evolución Neorrenacentista y Resistencias del Sistema™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md)'''
              text = insert_before(text, '[Ver la página Wiki de Manifiestos](Manifiestos)', es, '### Tercera oleada · XX–XXIV')
          if '### Third wave · XX–XXIV' not in text:
              en = '''### Third wave · XX–XXIV

* [XX · Neodialectical Intellectual Defence™ · Umbral-X™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md)
* [XXI · Neodialectical Recognition™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/21_reconocimiento_neodialectico_ES_EN.md)
* [XXII · Against Intellectual Reduction and Capture™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md)
* [XXIII · Cognitive-Time Sovereignty™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md)
* [XXIV · Neo-Renaissance Evolution and System Resistance™](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md)'''
              text = insert_before(text, '[Open the Manifestos Wiki page](Manifiestos)', en, '### Third wave · XX–XXIV')
          write(path, text)

          path = 'wiki-source/_Sidebar.md'
          text = read(path)
          if '### Tercera oleada / Third wave' not in text:
              block = '''### Tercera oleada / Third wave

* [XX · Defensa Intelectual / Intellectual Defence](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md)
* [XXI · Reconocimiento / Recognition](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/21_reconocimiento_neodialectico_ES_EN.md)
* [XXII · Reducción y Captura / Reduction and Capture](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md)
* [XXIII · Tiempo Cognitivo / Cognitive Time](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md)
* [XXIV · Evolución Neorrenacentista / Neo-Renaissance Evolution](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/blob/main/manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md)'''
              text = insert_before(text, '## Análisis y auditorías / Analyses and audits', block, '### Tercera oleada / Third wave')
          write(path, text)

          # Validation: required files, references and local Markdown links.
          required_manifestos = [
              'manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md',
              'manifiestos/21_reconocimiento_neodialectico_ES_EN.md',
              'manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md',
              'manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md',
              'manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md',
          ]
          for item in required_manifestos:
              if not (ROOT / item).is_file():
                  raise RuntimeError(f'Missing manifesto: {item}')

          for path in ('README.md', 'LEEME.md', 'manifiestos/README.md', 'wiki-source/Manifiestos.md', 'propuestas/sintesis-abierta/README.md'):
              text = read(path)
              for number in range(20, 25):
                  if f'{number}_' not in text and path in ('README.md', 'LEEME.md'):
                      raise RuntimeError(f'{path} does not reference manifesto {number}')
              for issue in range(13, 18):
                  if f'/issues/{issue}' not in text:
                      raise RuntimeError(f'{path} does not reference Issue #{issue}')

          nav_expectations = {
              'manifiestos/19_persistencia_de_la_memoria_ES_EN.md': ('18_respeto_conciencias_sinteticas_ES_EN.md', '20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md'),
              'manifiestos/20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md': ('19_persistencia_de_la_memoria_ES_EN.md', '21_reconocimiento_neodialectico_ES_EN.md'),
              'manifiestos/21_reconocimiento_neodialectico_ES_EN.md': ('20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md', '22_contra_reduccion_captura_intelectual_ES_EN.md'),
              'manifiestos/22_contra_reduccion_captura_intelectual_ES_EN.md': ('21_reconocimiento_neodialectico_ES_EN.md', '23_soberania_tiempo_cognitivo_ES_EN.md'),
              'manifiestos/23_soberania_tiempo_cognitivo_ES_EN.md': ('22_contra_reduccion_captura_intelectual_ES_EN.md', '24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md'),
              'manifiestos/24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md': ('23_soberania_tiempo_cognitivo_ES_EN.md', '11_neo0_soberania_de_guia_ES_EN.md'),
          }
          for path, targets in nav_expectations.items():
