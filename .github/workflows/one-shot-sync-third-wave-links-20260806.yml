                      raise RuntimeError(f'{path} missing navigation target {target}')

          selected = [
              'README.md', 'LEEME.md', 'PORTADA.md', 'COVER.md',
              'manifiestos/README.md', 'propuestas/sintesis-abierta/README.md',
              'wiki-source/Home.md', 'wiki-source/Manifiestos.md',
              'wiki-source/_Sidebar.md', 'wiki-source/README.md',
          ]
          stale = []
          for path in selected:
              text = read(path)
              for token in ('I–XIX', 'diecinueve manifiestos bilingües', 'nineteen bilingual manifestos'):
                  if token in text:
                      stale.append((path, token))
          if stale:
              raise RuntimeError(f'Stale live references remain: {stale}')

          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          for path in selected + list(nav_expectations):
              base = (ROOT / path).parent
              for target in link_re.findall(read(path)):
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  target = target.split('#', 1)[0]
                  if not target:
                      continue
                  candidate = (base / target).resolve()
                  try:
                      candidate.relative_to(ROOT.resolve())
                  except ValueError:
                      raise RuntimeError(f'Link escapes repository: {path} -> {target}')
                  if not candidate.exists():
                      raise RuntimeError(f'Broken local link: {path} -> {target}')

          print('UPDATED_FILES')
          for item in changed:
              print(item)
          PY

      - name: Commit repository synchronisation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Innova_N Sync"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-sync-third-wave-links-20260806.yml
          git add README.md LEEME.md PORTADA.md COVER.md manifiestos wiki-source propuestas/sintesis-abierta/README.md
          git diff --cached --check
          git commit -m "docs(manifestos): synchronise third-wave links and navigation"
          git push origin HEAD:main

      - name: Synchronise versioned Wiki sources to the public Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/innova-wiki
          git clone -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/innova-wiki
          cp wiki-source/Home.md /tmp/innova-wiki/Home.md
          cp wiki-source/Manifiestos.md /tmp/innova-wiki/Manifiestos.md
          cp wiki-source/_Sidebar.md /tmp/innova-wiki/_Sidebar.md
          cd /tmp/innova-wiki
          git config user.name "Innova_N Wiki Sync"
          git config user.email "actions@users.noreply.github.com"
          git add Home.md Manifiestos.md _Sidebar.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Wiki already synchronised"
          else
            git commit -m "docs: synchronise third-wave manifesto links"
            git push origin HEAD:master || git push origin HEAD:main
          fi
