name: one-shot-publish-xliv-neowar

on:
  push:
    paths:
      - '.github/triggers/publish-xliv-neowar.trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Propagate XLIV and validate repository
        run: python .github/scripts/one_shot_publish_xliv_neowar.py
      - name: Commit XLIV propagation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(manifestos): propagate XLIV Neowar and validate links [skip ci]"
          git push
