name: Sync latest manifesto README blocks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifiestos/README.md'
      - 'manifiestos/CANONICAL_FILENAMES.json'
      - '**/README.md'
      - '.github/scripts/sync_latest_manifesto_feature.py'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - '.github/workflows/sync-latest-manifesto-feature.yml'
      - '.github/scripts/sync_documentation_transaction.sh'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize on current main with bounded retry and full gates
        run: bash .github/scripts/sync_documentation_transaction.sh latest
