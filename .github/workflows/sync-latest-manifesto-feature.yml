name: sync-latest-manifesto-feature

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifiestos/README.md'
      - '.github/scripts/sync_latest_manifesto_feature.py'
      - '.github/scripts/migrate_neocore_73_open_canon.py'
      - '.github/workflows/sync-latest-manifesto-feature.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate obsolete NEOCore 7.3 pre-canon labels across repository
        run: python .github/scripts/migrate_neocore_73_open_canon.py
      - name: Synchronize and validate latest manifesto feature
        run: python .github/scripts/sync_latest_manifesto_feature.py
      - name: Commit if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'docs: migrate NEOCore 7.3 to open canon across all public text surfaces'
          git pull --rebase origin main
          git push origin main