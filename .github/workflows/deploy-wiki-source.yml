name: deploy-wiki-source

on:
  workflow_dispatch:
  push:
    paths:
      - 'wiki-source/**'
      - '.github/workflows/deploy-wiki-source.yml'

permissions:
  contents: write

concurrency:
  group: deploy-public-wiki
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone public Wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/innova-wiki

      - name: Project stable wiki-source pages
        run: |
          set -euo pipefail
          cp wiki-source/Home.md /tmp/innova-wiki/Home.md
          cp wiki-source/Mapa_del_Marco.md /tmp/innova-wiki/Mapa_del_Marco.md
          cp wiki-source/Filosofia_y_NEOCore.md /tmp/innova-wiki/Filosofia_y_NEOCore.md
          cp wiki-source/Manifiestos.md /tmp/innova-wiki/Manifiestos.md
          cp wiki-source/Neoaxiomas.md /tmp/innova-wiki/Neoaxiomas.md
          cp wiki-source/Sintesis_Abierta.md /tmp/innova-wiki/Sintesis_Abierta.md
          cp wiki-source/Participar.md /tmp/innova-wiki/Participar.md
          cp wiki-source/Analisis_Neodialecticos_Publicos.md /tmp/innova-wiki/Analisis_Neodialecticos_Publicos.md
          cp wiki-source/Obras_y_Cultura.md /tmp/innova-wiki/Obras_y_Cultura.md
          cp wiki-source/WEB4_y_Proyeccion.md /tmp/innova-wiki/WEB4_y_Proyeccion.md
          cp wiki-source/Procedencia_Trazabilidad_y_Legal.md /tmp/innova-wiki/Procedencia_Trazabilidad_y_Legal.md
          cp wiki-source/_Sidebar.md /tmp/innova-wiki/_Sidebar.md

      - name: Commit and push Wiki if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/innova-wiki
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Home.md Mapa_del_Marco.md Filosofia_y_NEOCore.md Manifiestos.md Neoaxiomas.md Sintesis_Abierta.md Participar.md Analisis_Neodialecticos_Publicos.md Obras_y_Cultura.md WEB4_y_Proyeccion.md Procedencia_Trazabilidad_y_Legal.md _Sidebar.md
          if git diff --cached --quiet; then
            echo 'WIKI_ALREADY_SYNCED=1'
            exit 0
          fi
          git commit -m 'wiki: sync stable framework map from wiki-source'
          git push origin master
