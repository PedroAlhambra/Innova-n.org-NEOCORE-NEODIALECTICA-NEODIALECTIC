name: repair-neoaxiom-accessibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-neoaxiom-accessibility.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neocore-neoaxiom-accessibility-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply plain-language and example layer
        run: python .github/scripts/repair_neoaxiom_accessibility.py

      - name: Check textual integrity
        run: git diff --check

      - name: Audit Neoaxiom registry, symmetry and clarity
        run: python .github/scripts/audit_neoaxiom_registry_integrity.py

      - name: Audit global ES EN symmetry
        run: python .github/scripts/audit_global_bilingual_symmetry.py

      - name: Verify clarity layer explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          neo=Path('neoaxiomas/README.md').read_text(encoding='utf-8')
          block=neo.split('<!-- NEOAXIOM_CANDIDATES_72_START -->',1)[1].split('<!-- NEOAXIOM_CANDIDATES_72_END -->',1)[0]
          ids=sorted(set(int(x) for x in re.findall(r'^### C-NAX-(\d+) ·',block,re.M)))
          assert ids == list(range(15,27)), ids
          for n in ids:
              part=block.split(f'### C-NAX-{n} ·',1)[1]
              if n < ids[-1]:
                  part=part.split(f'### C-NAX-{n+1} ·',1)[0]
              for marker in ['**ES · en sencillo:**','**ES · ejemplo:**','**EN · in plain language:**','**EN · example:**']:
                  assert marker in part, (n, marker)
          for n,path in {
              23:'propuestas/sintesis-abierta/2026-08-15_C_NAX_23_CONSERVACION_FRACTAL_COMUN_ES_EN.md',
              24:'propuestas/sintesis-abierta/2026-08-15_C_NAX_24_DIAGNOSTICO_NO_ES_SINTESIS_ES_EN.md',
              25:'propuestas/sintesis-abierta/2026-08-16_C_NAX_25_FENOMENO_NO_ES_NARRATIVA_ES_EN.md',
              26:'propuestas/sintesis-abierta/2026-08-16_C_NAX_26_PODER_TRAZABILIDAD_ACUSACION_EVIDENCIA_ES_EN.md',
          }.items():
              text=Path(path).read_text(encoding='utf-8')
              assert f'<!-- C-NAX-{n}_ACCESS_START -->' in text
              assert '## Lectura sencilla y ejemplo / Plain-language reading and example' in text
          print('NEOAXIOM_CLARITY_OK candidates=12 dedicated=4')
          PY

      - name: Commit repaired public state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            neoaxiomas/README.md \
            propuestas/sintesis-abierta/2026-08-15_C_NAX_23_CONSERVACION_FRACTAL_COMUN_ES_EN.md \
            propuestas/sintesis-abierta/2026-08-15_C_NAX_24_DIAGNOSTICO_NO_ES_SINTESIS_ES_EN.md \
            propuestas/sintesis-abierta/2026-08-16_C_NAX_25_FENOMENO_NO_ES_NARRATIVA_ES_EN.md \
            propuestas/sintesis-abierta/2026-08-16_C_NAX_26_PODER_TRAZABILIDAD_ACUSACION_EVIDENCIA_ES_EN.md \
            .github/scripts/audit_neoaxiom_registry_integrity.py \
            auditorias/publicas/2026-08-16_auditoria_neoaxiomas_simetria_frontera_ES_EN.md
          if git diff --cached --quiet; then
            echo 'No accessibility delta found.'
            exit 0
          fi
          git commit -m 'docs: make Neoaxiom candidates readable with symmetric examples'
          git pull --rebase origin main
          git push origin main
