name: one-shot sync systemic need delta

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'automation/systemic-need-delta-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run synchronizer
        run: python .github/scripts/one_shot_sync_systemic_need_delta.py
      - name: Commit synchronized state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: synchronize systemic need delta relations"
            git pull --rebase origin main
            git push origin main
          fi
