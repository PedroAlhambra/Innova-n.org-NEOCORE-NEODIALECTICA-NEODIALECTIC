name: one-shot final postcheck LXXIII LXXIV C-NAX-20 C-NAX-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-integrate-LXXIII-LXXIV-cnax20-21.yml'
      - '.github/scripts/oneshot_readme_frontier_LXXIV.py'

permissions:
  contents: write

concurrency:
  group: neocore-lxxiii-lxxiv-final-postcheck
  cancel-in-progress: false

jobs:
  postcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sweep every README and LEEME living frontier
        run: python .github/scripts/oneshot_readme_frontier_LXXIV.py || true
      - name: Synchronize Open Synthesis and navigation
        run: python .github/scripts/sync_open_synthesis_manifestos.py || true
      - name: Normalize indices
        run: python .github/scripts/normalize_manifesto_indices.py || true
      - name: Synchronize cross-references and canonical copies
        run: |
          python .github/scripts/sync_manifesto_crossrefs.py || true
          python .github/scripts/sync_canonical_manifestos.py || true
      - name: Audit ES EN parity
        run: python .github/scripts/audit_es_en_parity.py || true
      - name: Audit README and internal links
        run: python .github/scripts/audit_markdown_links_readmes.py || true
      - name: Commit synchronization and reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: materializar barrido README paridad enlaces LXXIV'
          git pull --rebase origin main
          git push origin main
