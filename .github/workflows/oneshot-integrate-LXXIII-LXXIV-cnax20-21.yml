name: one-shot integrate LXXIII LXXIV C-NAX-20 C-NAX-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-integrate-LXXIII-LXXIV-cnax20-21.yml'
      - '.github/scripts/oneshot_integrate_LXXIII_LXXIV_cnax20_21.py'

permissions:
  contents: write

concurrency:
  group: neocore-lxxiii-lxxiv-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate living documentary frontier
        run: python .github/scripts/oneshot_integrate_LXXIII_LXXIV_cnax20_21.py
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrar LXXIII LXXIV C-NAX-20 C-NAX-21 en red viva'
          git pull --rebase origin main
          git push origin main
