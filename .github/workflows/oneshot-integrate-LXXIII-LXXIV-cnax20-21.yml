name: one-shot final postcheck LXXIII LXXIV C-NAX-20 C-NAX-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-integrate-LXXIII-LXXIV-cnax20-21.yml'
      - '.github/scripts/oneshot_readme_frontier_LXXIV.py'

permissions:
  contents: write

concurrency:
  group: neocore-lxxiii-lxxiv-final-postcheck
  cancel-in-progress: false

jobs:
  postcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sweep every README and LEEME living frontier
        run: python .github/scripts/oneshot_readme_frontier_LXXIV.py
      - name: Synchronize Open Synthesis and navigation
        run: python .github/scripts/sync_open_synthesis_manifestos.py || true
      - name: Normalize indices
        run: python .github/scripts/normalize_manifesto_indices.py || true
      - name: Synchronize cross-references and canonical copies
        run: |
          python .github/scripts/sync_manifesto_crossrefs.py || true
          python .github/scripts/sync_canonical_manifestos.py || true
      - name: Audit ES EN parity
        run: python .github/scripts/audit_es_en_parity.py
      - name: Audit README and internal links
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Enforce final state
        run: |
          python - <<'PY'
          from pathlib import Path
          link=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md').read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in link or '74 · I–LXXIV' not in link or 'LXXIV / #125' not in link:
              raise SystemExit('README/link audit is not at LXXIV/#125 OK')
          par=Path('auditorias/publicas/2026-08-09_auditoria_paridad_ES_EN_manifiestos_articulos.md').read_text(encoding='utf-8')
          if '**Recortes/materialmente asimétricos para revisión:** 0' not in par or '**Con marcador incompleto/ausente:** 0' not in par:
              raise SystemExit('Material ES/EN parity is not clean')
          rd=Path('auditorias/publicas/2026-08-11_postcheck_README_frontera_LXXIV_ES_EN.md').read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in rd:
              raise SystemExit('README frontier sweep not clean')
          for f in ('manifiestos/canonicos/LXXIII_maduracion_invertida_humanidad_comun_degradacion_arquetipica_ES_EN.md','manifiestos/canonicos/LXXIV_asimetria_destruccion_trol_humano_bot_ES_EN.md'):
              if not Path(f).exists(): raise SystemExit(f'Missing canonical {f}')
          print('FINAL_POSTCHECK=OK')
          PY
      - name: Commit final synchronization and postchecks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: cerrar README paridad enlaces y frontera LXXIV'
          git pull --rebase origin main
          git push origin main
