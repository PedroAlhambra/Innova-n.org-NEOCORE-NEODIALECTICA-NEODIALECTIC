name: one-shot integrate LXXIII LXXIV C-NAX-20 C-NAX-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-integrate-LXXIII-LXXIV-cnax20-21.yml'
      - '.github/scripts/oneshot_integrate_LXXIII_LXXIV_cnax20_21_v2.py'

permissions:
  contents: write

concurrency:
  group: neocore-lxxiii-lxxiv-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate living documentary frontier
        run: python .github/scripts/oneshot_integrate_LXXIII_LXXIV_cnax20_21_v2.py
      - name: Synchronize Open Synthesis and README surfaces
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Normalize indices
        run: python .github/scripts/normalize_manifesto_indices.py
      - name: Synchronize root navigation
        run: python .github/scripts/sync_root_navigation.py
      - name: Generate canonical representations
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Synchronize cross-references
        run: python .github/scripts/sync_manifesto_crossrefs.py
      - name: Regenerate canonical representations
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Audit README and links
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Commit integration and postcheck
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: cerrar red viva LXXIII LXXIV C-NAX-20 C-NAX-21'
          git pull --rebase origin main
          git push origin main
