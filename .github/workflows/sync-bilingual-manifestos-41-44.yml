name: sync-bilingual-manifestos-41-44

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_manifesto_41_strict_symmetry.py'
      - '.github/scripts/repair_manifesto_42_strict_symmetry.py'
      - '.github/scripts/repair_manifesto_43_strict_symmetry.py'
      - '.github/scripts/repair_manifesto_44_strict_symmetry.py'
      - '.github/workflows/sync-bilingual-manifestos-41-44.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore strict ES EN symmetry XLI-XLIV
        run: |
          python .github/scripts/repair_manifesto_41_strict_symmetry.py
          python .github/scripts/repair_manifesto_42_strict_symmetry.py
          python .github/scripts/repair_manifesto_43_strict_symmetry.py
          python .github/scripts/repair_manifesto_44_strict_symmetry.py
      - name: Commit repaired manifestos
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md \
                  manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md \
                  manifiestos/43_contra_incomprension_reductiva_ia_inteligencia_humana_expandida_ES_EN.md \
                  manifiestos/44_neowar_contra_adiccion_guerra_justicia_bien_comun_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión XLI-XLIV'
          git pull --rebase origin main
          git push origin main
