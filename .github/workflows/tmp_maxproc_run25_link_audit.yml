name: Temporary MAXPROC Run25 link audit

on:
  push:
    paths:
      - '.github/workflows/tmp_maxproc_run25_link_audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run fresh link audit
        shell: bash
        run: |
          set +e
          python .github/scripts/audit_markdown_links_readmes.py
          echo "link_rc=$?" >> "$GITHUB_ENV"
      - name: Remove temporary workflow and commit audit result
        shell: bash
        run: |
          rm .github/workflows/tmp_maxproc_run25_link_audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md .github/workflows/tmp_maxproc_run25_link_audit.yml
          git commit -m 'audit: refresh public link integrity for MAXPROC run25'
          git push
      - name: Expose audit result
        shell: bash
        run: |
          echo "LINK_AUDIT_RC=$link_rc"
