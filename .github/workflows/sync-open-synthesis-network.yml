name: sync-open-synthesis-network

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-open-synthesis-network.yml'
      - '.github/scripts/sync_open_synthesis_manifestos.py'

permissions:
  contents: write

concurrency:
  group: sync-open-synthesis-network-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize and validate Open Synthesis network
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Commit synchronized network if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'docs: sync 53-manifesto Open Synthesis network and Leónidas audit access'
          git pull --rebase origin main
          git push origin main
