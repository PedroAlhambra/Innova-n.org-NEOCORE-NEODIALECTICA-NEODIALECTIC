name: sync-open-synthesis-network

# Current live frontier: I–LXXIV + ∞ · C-NAX-15–C-NAX-21 candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'manifiestos/*.md'
      - 'manifiestos/README.md'
      - 'manifiestos/CANONICAL_FILENAMES.json'
      - 'neoaxiomas/README.md'
      - 'propuestas/sintesis-abierta/README.md'
      - 'propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md'
      - '.github/workflows/sync-open-synthesis-network.yml'
      - '.github/scripts/oneshot_integrate_LXXIII_LXXIV_cnax20_21_v2.py'
      - '.github/scripts/register_manifestos_LXIII_LXVI.py'
      - '.github/scripts/sync_open_synthesis_manifestos.py'
      - '.github/scripts/sync_canonical_manifestos.py'
      - '.github/scripts/normalize_manifesto_indices.py'
      - '.github/scripts/sync_root_navigation.py'
      - '.github/scripts/audit_markdown_links_readmes.py'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate current LXXIII-LXXIV and C-NAX-20-21 frontier
        run: python .github/scripts/oneshot_integrate_LXXIII_LXXIV_cnax20_21_v2.py
      - name: Register historical recent manifestos safely
        run: python .github/scripts/register_manifestos_LXIII_LXVI.py
      - name: Synchronize Open Synthesis network
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Validate full Neoaxiom candidate frontier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md')
          s=p.read_text(encoding='utf-8')
          for n in range(15,22):
              if f'C-NAX-{n}' not in s:
                  raise SystemExit(f'C-NAX-{n} missing from complete SAN index')
          if '74 manifiestos finitos I–LXXIV' not in s or '74 finite manifestos I–LXXIV' not in s:
              raise SystemExit('Living manifesto frontier is not I-LXXIV in complete SAN index')
          print('CANDIDATE_INDEX_15_21=OK')
          print('MANIFESTO_FRONTIER_I_LXXIV=OK')
          PY
      - name: Normalize canonical indices
        run: python .github/scripts/normalize_manifesto_indices.py
      - name: Synchronize root navigation
        run: python .github/scripts/sync_root_navigation.py
      - name: Generate canonical manifesto representations
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Synchronize manifesto cross-references
        run: python .github/scripts/sync_manifesto_crossrefs.py
      - name: Regenerate canonical representations after cross-reference sync
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Audit generated documentary graph
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Enforce healthy documentary graph before publish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md')
          text=p.read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in text:
              raise SystemExit('Generated documentary graph is not healthy; publish aborted.')
          if 'Último manifiesto / Síntesis: **LXXIV / #125**' not in text and 'Latest manifesto / synthesis: **LXXIV / #125**' not in text:
              raise SystemExit('Postcheck did not resolve LXXIV/#125 as current frontier')
          print('DOCUMENTARY_GRAPH=OK')
          PY
      - name: Commit synchronized network if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sync Open Synthesis and canonical manifesto network'
          git pull --rebase origin main
          git push origin main
