# trigger: 2026-08-09T22:14+02:00
name: sync-open-synthesis-network

on:
  workflow_dispatch:
  push:
    paths:
      - 'manifiestos/*.md'
      - 'manifiestos/README.md'
      - 'propuestas/sintesis-abierta/README.md'
      - '.github/workflows/sync-open-synthesis-network.yml'
      - '.github/scripts/sync_open_synthesis_manifestos.py'
      - '.github/scripts/normalize_manifesto_indices.py'
      - '.github/scripts/sync_root_navigation.py'
      - '.github/scripts/apply_wave_human_relevance_symbols.py'
      - '.github/scripts/patch_postcheck_for_lx.py'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply additive NAX-10 and human-relevance integration
        run: python .github/scripts/apply_wave_human_relevance_symbols.py
      - name: Patch postcheck for I-LX corpus
        run: python .github/scripts/patch_postcheck_for_lx.py
      - name: Synchronize Open Synthesis network
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Normalize canonical indices
        run: python .github/scripts/normalize_manifesto_indices.py
      - name: Synchronize root navigation
        run: python .github/scripts/sync_root_navigation.py
      - name: Relational audit
        run: python .github/scripts/audit_relations_neocore.py
      - name: Bilingual parity audit
        run: python .github/scripts/audit_bilingual_parity_simple.py
      - name: Historical non-reductive audit
        run: python .github/scripts/audit_manifesto_history_regressions.py
      - name: Final NEOCore 7.1 postcheck
        run: python .github/scripts/postcheck_neocore_71_integridad_relacional.py
      - name: Commit synchronized network if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'docs: ampliar NAX-10, publicar LX y relanzar mapa relacional'
          git pull --rebase origin main
          git push origin main
