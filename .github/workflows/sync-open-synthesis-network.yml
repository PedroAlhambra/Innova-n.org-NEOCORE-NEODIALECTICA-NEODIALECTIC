name: sync-open-synthesis-network

# Living frontier is derived dynamically from manifiestos/README.md and canonical registries.
on:
  workflow_dispatch:
  push:
    paths:
      - 'manifiestos/*.md'
      - 'manifiestos/README.md'
      - 'manifiestos/CANONICAL_FILENAMES.json'
      - 'neoaxiomas/README.md'
      - 'propuestas/sintesis-abierta/README.md'
      - 'propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md'
      - '.github/workflows/sync-open-synthesis-network.yml'
      - '.github/scripts/register_manifestos_LXIII_LXVI.py'
      - '.github/scripts/normalize_manifesto_bilingual_names.py'
      - '.github/scripts/normalize_internal_link_aliases.py'
      - '.github/scripts/sync_open_synthesis_manifestos.py'
      - '.github/scripts/sync_canonical_manifestos.py'
      - '.github/scripts/normalize_manifesto_indices.py'
      - '.github/scripts/sync_root_navigation.py'
      - '.github/scripts/sync_manifesto_crossrefs.py'
      - '.github/scripts/audit_es_en_parity.py'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - '.github/scripts/audit_manifesto_bilingual_structure.py'
      - '.github/scripts/audit_relations_neocore.py'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize bilingual manifesto identities
        run: python .github/scripts/normalize_manifesto_bilingual_names.py
      - name: Normalize known internal link aliases
        run: python .github/scripts/normalize_internal_link_aliases.py
      - name: Register historical recent manifestos safely
        run: python .github/scripts/register_manifestos_LXIII_LXVI.py
      - name: Synchronize Open Synthesis network
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Normalize canonical indices
        run: python .github/scripts/normalize_manifesto_indices.py
      - name: Synchronize root navigation
        run: python .github/scripts/sync_root_navigation.py
      - name: Generate canonical manifesto representations
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Synchronize manifesto cross-references
        run: python .github/scripts/sync_manifesto_crossrefs.py
      - name: Regenerate canonical representations after cross-reference sync
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Audit ES EN semantic parity
        run: python .github/scripts/audit_es_en_parity.py
      - name: Audit bilingual manifesto structure
        run: python .github/scripts/audit_manifesto_bilingual_structure.py
      - name: Audit relational graph and Neoaxiom synthesis coverage
        run: python .github/scripts/audit_relations_neocore.py
      - name: Audit generated documentary graph
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Show audit summaries
        run: |
          echo '--- LINK AUDIT ---'
          head -n 45 auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md
          echo '--- STRUCTURE AUDIT ---'
          head -n 16 auditorias/publicas/2026-08-12_auditoria_estructura_bilingue_manifiestos_ES_EN.md
          echo '--- RELATIONAL AUDIT ---'
          head -n 28 auditorias/publicas/2026-08-09_auditoria_relacional_manifestos_neoaxiomas_publicaciones_ES_EN.md
      - name: Enforce healthy documentary graph, bilingual parity and relations
        run: |
          python - <<'PY'
          from pathlib import Path
          links=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md').read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in links:
              raise SystemExit('Generated documentary graph is not healthy; publish aborted.')
          parity=Path('auditorias/publicas/2026-08-09_auditoria_paridad_ES_EN_manifiestos_articulos.md').read_text(encoding='utf-8')
          if '**Recortes/materialmente asimétricos para revisión:** 0' not in parity:
              raise SystemExit('Material ES/EN asymmetry detected; publish aborted.')
          if '**Con marcador incompleto/ausente:** 0' not in parity:
              raise SystemExit('Incomplete ES/EN markers detected; publish aborted.')
          structure=Path('auditorias/publicas/2026-08-12_auditoria_estructura_bilingue_manifiestos_ES_EN.md').read_text(encoding='utf-8')
          if '**REVISAR / REVIEW:** 0' not in structure:
              raise SystemExit('Bilingual manifesto identity/index asymmetry detected; publish aborted.')
          rel=Path('auditorias/publicas/2026-08-09_auditoria_relacional_manifestos_neoaxiomas_publicaciones_ES_EN.md').read_text(encoding='utf-8')
          required=[
              '- Cobertura del mapa curado: **74/74**.',
              '- Ausentes del mapa curado: **ninguno / none**.',
              '- Neoaxiomas sin Síntesis específica: **ninguno / none**.',
              '- Enlaces locales realmente no resueltos: **0**.',
              '- Manifiestos sin enlace entrante desde publicaciones/documentos aplicados: **0**.',
          ]
          missing=[x for x in required if x not in rel]
          if missing:
              raise SystemExit('Relational audit is incomplete: '+repr(missing))
          print('DOCUMENTARY_GRAPH=OK')
          print('MATERIAL_PARITY=OK')
          print('BILINGUAL_STRUCTURE=OK')
          print('RELATIONAL_GRAPH=OK')
          PY
      - name: Commit synchronized network if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sync Open Synthesis and canonical manifesto network'
          git pull --rebase origin main
          git push origin main
