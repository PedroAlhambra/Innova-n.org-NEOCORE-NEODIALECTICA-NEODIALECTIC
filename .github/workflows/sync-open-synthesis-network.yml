name: sync-open-synthesis-network

# Current live frontier: I–LXXII + ∞ · C-NAX-15–C-NAX-19 candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'manifiestos/*.md'
      - 'manifiestos/README.md'
      - 'manifiestos/CANONICAL_FILENAMES.json'
      - 'neoaxiomas/README.md'
      - 'propuestas/sintesis-abierta/README.md'
      - 'propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md'
      - '.github/workflows/sync-open-synthesis-network.yml'
      - '.github/scripts/register_manifestos_LXIII_LXVI.py'
      - '.github/scripts/sync_open_synthesis_manifestos.py'
      - '.github/scripts/sync_canonical_manifestos.py'
      - '.github/scripts/normalize_manifesto_indices.py'
      - '.github/scripts/sync_root_navigation.py'
      - '.github/scripts/audit_markdown_links_readmes.py'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register recent manifestos in canonical catalogue
        run: python .github/scripts/register_manifestos_LXIII_LXVI.py
      - name: Synchronize Open Synthesis network
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Complete Neoaxiom candidate index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('**72 manifiestos finitos I–LXXII + Manifiesto ∞ · 14 Neoaxiomas™ · síntesis transversales, auditorías y proyectos de sistema**', '**72 manifiestos finitos I–LXXII + Manifiesto ∞ · 14 Neoaxiomas™ canónicos + 5 candidatos C-NAX-15–C-NAX-19 · síntesis transversales, auditorías y proyectos de sistema**')
          marker='| **C-NAX-19 · Inviolabilidad Relacional y Separación de Planos™ · candidato** | [#123](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/123) |'
          rows='''| **C-NAX-15 · Soberanía Intelectual de la Especie™ · candidato** | [matriz #80](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/80) · [LXVIII #114](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/114) |
| **C-NAX-16 · No Coronación de la Parte™ · candidato** | [matriz #80](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/80) · [∞ #106](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/106) |
| **C-NAX-17 · Reconstrucción Sistémica™ · candidato** | [matriz #80](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/80) · [LXVII #112](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/112) |
| **C-NAX-18 · Motor del Bien Común + NeoSinergia™ · candidato** | [matriz #80](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/80) · [LXVI #110](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/110) · [LXVII #112](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/112) |
'''
          if 'C-NAX-15 · Soberanía Intelectual de la Especie™ · candidato' not in s:
              if marker not in s:
                  raise SystemExit('C-NAX-19 marker missing from complete SAN index')
              s=s.replace(marker,rows+marker)
          for n in range(15,20):
              if f'C-NAX-{n}' not in s:
                  raise SystemExit(f'C-NAX-{n} missing from complete SAN index')
          p.write_text(s,encoding='utf-8')
          print('CANDIDATE_INDEX_15_19=OK')
          PY
      - name: Normalize canonical indices
        run: python .github/scripts/normalize_manifesto_indices.py
      - name: Synchronize root navigation
        run: python .github/scripts/sync_root_navigation.py
      - name: Generate canonical manifesto representations
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Audit generated documentary graph
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Enforce healthy documentary graph before publish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md')
          text=p.read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in text:
              raise SystemExit('Generated documentary graph is not healthy; publish aborted.')
          print('DOCUMENTARY_GRAPH=OK')
          PY
      - name: Commit synchronized network if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sync Open Synthesis and canonical manifesto network'
          git pull --rebase origin main
          git push origin main