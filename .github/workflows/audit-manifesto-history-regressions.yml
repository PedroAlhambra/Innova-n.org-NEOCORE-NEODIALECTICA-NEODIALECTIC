name: audit-manifesto-history-regressions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit_manifesto_history_regressions.py'
      - '.github/workflows/audit-manifesto-history-regressions.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit historical manifesto regressions
        run: python .github/scripts/audit_manifesto_history_regressions.py
      - name: Commit audit outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_auditoria_regresiones_historicas_manifiestos_ES_EN.md auditorias/publicas/2026-08-09_auditoria_regresiones_historicas_manifiestos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: detectar regresiones históricas de manifiestos'
          git pull --rebase origin main
          git push origin main
