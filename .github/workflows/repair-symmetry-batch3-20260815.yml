name: One-shot symmetry repair 3 2026-08-15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-symmetry-batch3-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact repairs
        run: python .github/scripts/repair_symmetry_batch3_20260815.py
      - name: Recalculate audit
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Validate
        run: git diff --check
      - name: Commit repairs and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            analisis/publicos/2026-04-01_stanford-ace-y-marco-previo-neodialectico.md \
            .github/scripts/audit_global_bilingual_symmetry.py \
            auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'fix: restore Stanford ACE parity and tighten shared-tail audit'
          git push origin HEAD:main
