name: repair-lxi-readmes-links

on:
  push:
    paths:
      - '.github/workflows/repair-lxi-readmes-links.yml'
  workflow_dispatch:

permissions:
  contents: write

# One-shot repair retriggered after fixing manual current-state surfaces.
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize Open Synthesis network
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Normalize canonical indices
        run: python .github/scripts/normalize_manifesto_indices.py
      - name: Synchronize root navigation
        run: python .github/scripts/sync_root_navigation.py
      - name: Generate canonical manifesto representations
        run: python .github/scripts/sync_canonical_manifestos.py
      - name: Audit documentary graph
        run: python .github/scripts/audit_markdown_links_readmes.py
      - name: Enforce current LXI state and healthy links
        run: |
          python - <<'PY'
          from pathlib import Path
          report=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md').read_text(encoding='utf-8')
          checks={
            'status OK':'**Estado / Status:** **OK**' in report,
            '61 manifestos':'Manifiestos canónicos detectados: **61 · I–LXI**' in report,
            'latest LXI':'Último manifiesto / Síntesis: **LXI / #101**' in report,
            'zero broken':'Enlaces internos rotos detectados: **0**' in report,
            'zero critical':'Fallos canónicos críticos: **0**' in report,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
            raise SystemExit('POSTCHECK FAIL: '+', '.join(bad))
          print('POSTCHECK=LXI_OK')
          PY
      - name: Retire one-shot workflow and commit
        run: |
          rm .github/workflows/repair-lxi-readmes-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sincronizar LXI en README índices y enlaces'
          git pull --rebase origin main
          git push origin main
