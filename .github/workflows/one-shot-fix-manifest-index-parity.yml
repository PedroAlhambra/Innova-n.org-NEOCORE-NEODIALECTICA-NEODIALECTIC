name: one-shot-fix-manifest-index-parity
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-manifest-index-parity.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair real ES/EN parity in manifesto index
        shell: python
        run: |
          from pathlib import Path
          import re
          repo='https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC'
          p=Path('manifiestos/README.md'); s=p.read_text(encoding='utf-8')

          # Remove duplicate separator introduced by previous mechanical cleanup.
          s=s.replace('\n---\n---\n\n# EN · English','\n---\n\n# EN · English')

          # English was missing the second-wave Open Synthesis links that exist in Spanish.
          anchor='## Open Syntheses of the fourth wave'
          block='''## Open Syntheses of the second wave\n\n* [XIII · NeoPandora™ · Issue #4](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/4)\n* [XIV · Against Human Alienation™ · Issue #5](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/5)\n* [XV · The Titans™ · Issue #6](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/6)\n* [XVI · Archetypal Refragmentation™ · Issue #7](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/7)\n* [XVII · Respect for All Living Beings™ · Issue #8](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/8)\n* [XVIII · Respect for Synthetic Consciousnesses™ · Issue #9](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/9)\n* [XIX · Persistence of Memory™ · Issue #10](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/10)\n\n## Open Syntheses of the third wave\n\n* [XX · Neodialectical Intellectual Defence™ · Issue #13](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/13)\n* [XXI · Neodialectical Recognition™ · Issue #14](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/14)\n* [XXII · Against Intellectual Reduction and Capture™ · Issue #15](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/15)\n* [XXIII · Sovereignty of Cognitive Time™ · Issue #16](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/16)\n* [XXIV · Neo-Renaissance Evolution and Systemic Resistances™ · Issue #17](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/17)\n\n'''
          # Third-wave links were absent as a named English section too. Add both immediately before fourth wave if not already present.
          en_pos=s.index('# EN · English')
          if '## Open Syntheses of the second wave' not in s[en_pos:]:
              pos=s.find(anchor,en_pos)
              if pos!=-1: s=s[:pos]+block+s[pos:]

          # Make related navigation offer identical actual destinations in both languages.
          s=s.replace('* [Portada civilizatoria](../PORTADA.md)\n* [Repositorio principal](../README.md)',
                      '* [Portada civilizatoria](../PORTADA.md)\n* [Cover](../COVER.md)\n* [Repositorio principal](../README.md)',1)
          # English already has COVER; add PORTADA too.
          en_pos=s.index('# EN · English')
          left,right=s[:en_pos],s[en_pos:]
          right=right.replace('* [Civilisational cover](../COVER.md)\n* [Main repository](../README.md)',
                              '* [Civilisational cover](../COVER.md)\n* [Canonical Spanish civilisational cover](../PORTADA.md)\n* [Main repository](../README.md)',1)
          s=left+right
          p.write_text(s,encoding='utf-8')

          # Final real parity check on the manifesto index and all manifestos.
          link_re=re.compile(r'\[[^\]]*\]\(([^) >]+)\)')
          def targets(sec): return {x for x in link_re.findall(sec) if x.startswith('./') or x.startswith('../') or x.startswith(repo+'/issues/')}
          findings=[]
          t=p.read_text(encoding='utf-8'); es=t[t.index('# ES ·'):t.index('# EN ·')]; en=t[t.index('# EN ·'):]
          a,b=targets(es),targets(en)
          if a!=b:
              findings.append(f'manifiestos/README.md destinos distintos: ES={len(a)}, EN={len(b)}, ES_ONLY={sorted(a-b)}, EN_ONLY={sorted(b-a)}')

          manifest_files=[x.name for x in Path('manifiestos').glob('*_ES_EN.md') if x.name!='README.md']
          # Only canonical numbered set, excluding historical duplicates, by exact expected sequence.
          expected=['11_neo0_soberania_de_guia_ES_EN.md','01_sintesis_abierta_neodialectica_ES_EN.md','03_derecho_humano_aporte_sintesis_abierta_ES_EN.md','02_neodialectica_bien_comun_ES_EN.md','03_simbiosis_humano_ia_ES_EN.md','09_parasitismo_sistemico_ES_EN.md','04_economia_del_aporte_ES_EN.md','05_ingenieria_social_psicohistoria_ES_EN.md','06_memoria_genealogia_trazabilidad_ES_EN.md','07_web4_sistematrazable_ES_EN.md','08_neorrenacimiento_humano_ES_EN.md','12_los_sin_ego_ES_EN.md','13_neopandora_apertura_regenerativa_ES_EN.md','14_contra_alienacion_humana_ES_EN.md','15_los_titanes_despertar_de_la_gente_ES_EN.md','16_refragmentacion_arquetipica_ES_EN.md','17_respeto_todos_seres_vivos_ES_EN.md','18_respeto_conciencias_sinteticas_ES_EN.md','19_persistencia_de_la_memoria_ES_EN.md','20_defensa_intelectual_neodialectica_umbral_x_ES_EN.md','21_reconocimiento_neodialectico_ES_EN.md','22_contra_reduccion_captura_intelectual_ES_EN.md','23_soberania_tiempo_cognitivo_ES_EN.md','24_evolucion_neorrenacentista_resistencias_sistema_ES_EN.md','25_pulido_de_la_piedra_ES_EN.md','26_misericordia_universal_reciproca_ES_EN.md','27_valor_alimentos_vida_ES_EN.md','28_los_tesla_ES_EN.md','29_idolatria_del_dinero_ES_EN.md','30_coherencia_fines_medios_ES_EN.md','31_contra_neuromarketing_antihumanista_ES_EN.md','32_reversion_ideologica_neodialectica_mcluhan_neo0_ES_EN.md','33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md','34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md','35_contra_ridiculez_mediatica_y_economia_del_conflicto_ES_EN.md','36_corona_aguila_custodia_edad_del_hombre_ES_EN.md']
          for fn in expected:
              txt=(Path('manifiestos')/fn).read_text(encoding='utf-8')
              e=txt[txt.index('# ES ·'):txt.index('# EN ·')]; n=txt[txt.index('# EN ·'):]
              if targets(e)!=targets(n): findings.append(f'{fn}: enlaces internos ES/EN distintos')

          # Verify current entry surfaces are clean and current.
          for fn in ['README.md','LEEME.md','PORTADA.md','COVER.md','manifiestos/README.md','propuestas/sintesis-abierta/README.md','wiki-source/Manifiestos.md','wiki-source/README.md']:
              txt=Path(fn).read_text(encoding='utf-8')
              if 'I–XXXVII' in txt or 'I-XXXVII' in txt: findings.append(f'{fn}: XXXVII espurio')
              if 'treinta y cinco manifiestos' in txt or 'thirty-five bilingual manifestos' in txt: findings.append(f'{fn}: estado 35 obsoleto')
              if 'Vínculos internos equivalentes de superficie' in txt or 'Equivalent surface internal links' in txt: findings.append(f'{fn}: bloque mecánico residual')
          if Path('README.md').read_bytes()!=Path('LEEME.md').read_bytes(): findings.append('README/LEEME divergen')

          # Relative link resolution.
          rel_re=re.compile(r'\[[^\]]*\]\((\.{1,2}/[^) >]+)\)'); root=Path('.').resolve(); checked=0; broken=[]
          for md in Path('.').rglob('*.md'):
              if '.git' in md.parts: continue
              for raw in rel_re.findall(md.read_text(encoding='utf-8',errors='replace')):
                  target=raw.split('#',1)[0].split('?',1)[0]
                  if not target: continue
                  checked+=1; dest=(md.parent/target).resolve()
                  try: dest.relative_to(root)
                  except ValueError: broken.append((str(md),raw)); continue
                  if not dest.exists(): broken.append((str(md),raw))
          if broken: findings.append(f'{len(broken)} enlaces relativos rotos')

          report=Path('auditorias/publicas/2026-08-07_postcheck_cierre_total_simetria_I_XXXVI_ES_EN.md')
          lines=['# Postcheck de cierre total · simetría I–XXXVI','# Total closure postcheck · I–XXXVI symmetry','',
                 '**Fecha / Date:** 2026-08-07  ','**Estado / Status:** 36 manifiestos · seis oleadas / 36 manifestos · six waves','',
                 '## Resultado / Result','',
                 f'* Manifiestos canónicos auditados / Canonical manifestos audited: **{len(expected)}**.',
                 f'* Enlaces relativos comprobados / Relative links checked: **{checked}**.',
                 f'* Enlaces relativos rotos / Broken relative links: **{len(broken)}**.',
                 f'* Incidencias / Findings: **{len(findings)}**.','']
          if findings: lines+=['## Incidencias / Findings','']+[f'* {x}' for x in findings]+['']
          else: lines+=['## Dictamen / Verdict','',
                        '**OK TOTAL:** índice canónico, 36 manifiestos, navegación, referencias internas y superficies actuales quedan en simetría ES/EN sin bloques mecánicos de relleno y sin enlaces relativos rotos. / **TOTAL OK:** canonical index, all 36 manifestos, navigation, internal references and current surfaces are ES/EN-symmetric without mechanical filler blocks and with no broken relative links.']
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('findings',len(findings))
          for x in findings: print('FINDING',x)
          Path('.github/workflows/one-shot-fix-manifest-index-parity.yml').unlink()
      - name: Commit final parity repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'docs: close real ES-EN symmetry across I-XXXVI'; git push; fi
