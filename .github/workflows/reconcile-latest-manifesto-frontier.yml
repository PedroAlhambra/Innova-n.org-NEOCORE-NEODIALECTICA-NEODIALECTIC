name: Reconcile latest manifesto frontier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reconcile_latest_manifesto_frontier.py'
      - '.github/workflows/reconcile-latest-manifesto-frontier.yml'
      - 'manifiestos/[0-9][0-9]_*.md'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile latest finite manifesto and README frontier
        run: python .github/scripts/reconcile_latest_manifesto_frontier.py

      - name: Commit reconciliation if needed
        shell: bash
        run: |
          if git diff --quiet -- manifiestos; then
            echo 'NO_FRONTIER_RECONCILIATION_CHANGE'
            exit 0
          fi
          git config user.name 'innova-n-relational-guard'
          git config user.email 'actions@users.noreply.github.com'
          git add manifiestos
          git commit -m 'fix(manifestos): reconcile latest frontier and crossrefs'
          git push

      - name: Audit resulting relational navigation
        run: python .github/scripts/audit_manifesto_clickable_relations.py
