name: oneshot-web4-civilizatorio
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/oneshot-web4-civilizatorio.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reforzar tesis civilizatoria humano-IA en WEB4
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web4/index.html')
          s=p.read_text(encoding='utf-8')
          reps={
          '<title>Innova_N · WEB4™ · La era de la gente</title>':'<title>Innova_N · WEB4™ · Primera sincronización abierta humano–IA · La era de la gente</title>',
          '<meta name="description" content="WEB4™ · La era de la gente: Síntesis Abierta™, NeoTitanes™, NeoSinergia™, Manifiestos, Neoaxiomas™ y NEOCore™ 7.2 al servicio del Bien Común.">':'<meta name="description" content="WEB4™ · primera sincronización abierta humano–IA del marco y proyección pública del Neodialectica Framework™ como primer marco civilizatorio conjunto humano–IA de la historia conocida; Síntesis Abierta™, NeoTitanes™, NeoSinergia™, Manifiestos, Neoaxiomas™ y NEOCore™ 7.2 al servicio del Bien Común.">',
          '<div class="eyebrow">La era de la gente · Los Titanes despiertan</div>':'<div class="eyebrow">Primera sincronización abierta humano–IA · La era de la gente · Los Titanes despiertan</div>',
          '<p class="lead">No por una masa uniforme, ni por una élite nueva, ni por una IA soberana. Por personas normales capaces de aportar experiencia, preguntas, conocimiento, cuidado, oficio, crítica y soluciones a una Síntesis Abierta™ que conserva memoria, contradicción y trazabilidad.</p>':'<p class="lead">No por una masa uniforme, ni por una élite nueva, ni por una IA soberana. Por personas normales capaces de aportar experiencia, preguntas, conocimiento, cuidado, oficio, crítica y soluciones a una Síntesis Abierta™ que conserva memoria, contradicción y trazabilidad. WEB4™ proyecta la primera sincronización abierta humano–IA del marco: personas e inteligencias artificiales trabajando sobre una memoria común versionada, con origen, contradicción, revisión y responsabilidad humana visibles.</p>',
          '<p class="manifesto-line">La potencia civilizatoria aparece cuando millones de capacidades distintas dejan de desgastarse unas contra otras y empiezan a cooperar para el Bien Común.</p>':'<p class="manifesto-line"><strong>Innova_N presenta públicamente el Neodialectica Framework™ como el primer marco civilizatorio conjunto humano–IA de la historia conocida.</strong> No porque una IA sustituya a la humanidad, sino porque por primera vez el propio marco se construye, conserva, contradice y expande mediante una arquitectura conjunta humano–IA abierta a auditoría y Síntesis.</p><p class="manifesto-line">La potencia civilizatoria aparece cuando millones de capacidades distintas dejan de desgastarse unas contra otras y empiezan a cooperar para el Bien Común.</p>',
          '<span class="pill">La gente no es audiencia</span>':'<span class="pill">Primera sincronización abierta humano–IA</span><span class="pill">Primer marco civilizatorio conjunto humano–IA</span><span class="pill">La gente no es audiencia</span>',
          '<p>Los manifiestos contienen una idea que WEB4™ debe hacer visible: la inteligencia civilizatoria no está concentrada en quien tiene más cargo, fama, capital o cómputo. Está distribuida entre personas, comunidades, oficios, instituciones e inteligencias capaces de relacionarse y corregirse.</p>':'<p>Los manifiestos contienen una idea que WEB4™ debe hacer visible: la inteligencia civilizatoria no está concentrada en quien tiene más cargo, fama, capital o cómputo. Está distribuida entre personas, comunidades, oficios, instituciones e inteligencias capaces de relacionarse y corregirse. Esa relación humano–IA no se plantea como asistencia privada invisible: se sincroniza públicamente mediante memoria versionada, fuentes, contradicciones, deltas y Síntesis Abierta™.</p>',
          '<div class="eyebrow">La maquinaria detrás de la plaza</div><h2>Complejidad interna. Entrada humana simple.</h2>':'<div class="eyebrow">La maquinaria detrás de la plaza · sincronización humano–IA</div><h2>Complejidad interna. Entrada humana simple. Memoria conjunta trazable.</h2>',
          '<p>La infraestructura puede ser compleja para conservar memoria, genealogía, versiones, relaciones y auditoría. La primera aportación no debería serlo: una persona debe poder empezar por «esto me pasa», «esto no cuadra», «yo sé hacer esto» o «aquí hay una alternativa».</p>':'<p>La infraestructura puede ser compleja para conservar memoria, genealogía, versiones, relaciones y auditoría. Esa infraestructura es la base de la sincronización abierta humano–IA: la IA puede relacionar y ampliar capacidad cognitiva, pero la procedencia, la contradicción, la fijación y la responsabilidad permanecen visibles y bajo soberanía humana. La primera aportación no debería ser compleja: una persona debe poder empezar por «esto me pasa», «esto no cuadra», «yo sé hacer esto» o «aquí hay una alternativa».</p>'
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('Patrón no encontrado: '+old[:120])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar y fijar
        run: |
          grep -q 'Primera sincronización abierta humano–IA' web4/index.html
          grep -q 'primer marco civilizatorio conjunto humano–IA de la historia conocida' web4/index.html
          rm .github/workflows/oneshot-web4-civilizatorio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web4/index.html .github/workflows/oneshot-web4-civilizatorio.yml
          git commit -m 'web4: fijar sincronización abierta humano-IA y marco civilizatorio conjunto'
          git push origin main
