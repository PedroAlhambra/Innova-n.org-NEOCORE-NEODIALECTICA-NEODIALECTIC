name: Neoaxiom Manifest Relations

on:
  workflow_dispatch:
  push:
    paths:
      - 'neoaxiomas/**'
      - 'manifiestos/**'
      - '.github/scripts/sync_neoaxiom_manifest_relations.py'
      - '.github/scripts/audit_neoaxiom_manifest_relations.py'
      - '.github/workflows/neoaxiom-manifest-relations.yml'

permissions:
  contents: write

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Synchronise fixed Neoaxiom manifesto relations
        run: python .github/scripts/sync_neoaxiom_manifest_relations.py
      - name: Audit fixed Neoaxiom manifesto relations
        run: python .github/scripts/audit_neoaxiom_manifest_relations.py
      - name: Audit complete Neoaxiom registry
        run: python .github/scripts/audit_neoaxiom_registry_integrity.py
      - name: Commit synchronised relations
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neoaxiomas/ README.md .github/scripts/ 2>/dev/null || true
          git commit -m "neoaxiomas: sync fixed NAX manifesto relations"
          git push
