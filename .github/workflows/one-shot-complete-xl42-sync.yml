name: one-shot-complete-xl42-sync

on:
  push:
    paths:
      - '.github/workflows/one-shot-complete-xl42-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete XLII synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s); p.write_text(n, encoding='utf-8')

          def must_replace(s, old, new, label, count=1):
              c=s.count(old)
              if c < count:
                  raise SystemExit(f'{label}: expected at least {count}, found {c}')
              return s.replace(old,new,count)

          def patch_leeme(s):
              es_anchor='''**Antecedente genealógico de XXXVI:** [Corona, Águila e Innova_N como herramienta neodialéctica](./propuestas/sintesis-abierta/ANEXO_CORONA_AGUILA_CUSTODIA_LEGADO_EDAD_DEL_HOMBRE_ES_EN.md).  \n**Anexo vinculado a XXXV:** [Responsabilidad de los Nodos de Poder y Deber de Examen Civilizatorio](./propuestas/sintesis-abierta/ANEXO_RESPONSABILIDAD_NODOS_DE_PODER_Y_DEBER_DE_EXAMEN_ES_EN.md).\n\n\nEl Manifiesto III mantiene'''
              es_insert='''**Antecedente genealógico de XXXVI:** [Corona, Águila e Innova_N como herramienta neodialéctica](./propuestas/sintesis-abierta/ANEXO_CORONA_AGUILA_CUSTODIA_LEGADO_EDAD_DEL_HOMBRE_ES_EN.md).  \n**Anexo vinculado a XXXV:** [Responsabilidad de los Nodos de Poder y Deber de Examen Civilizatorio](./propuestas/sintesis-abierta/ANEXO_RESPONSABILIDAD_NODOS_DE_PODER_Y_DEBER_DE_EXAMEN_ES_EN.md).\n\n## Octava oleada · Infancia, educación y transmisión civilizatoria · XXXVIII\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXVIII | [Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Proteger seguridad material, educación, desarrollo por edades, privacidad y atención frente a captura comercial y abandono sistémico | [Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45) |\n\n## Novena oleada · Autoconciencia, respeto y defensa civilizatoria · XXXIX–XLI\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXIX | [Autoconciencia de la Necesidad Vital Neodialéctica™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md) | Memoria, relación, contraste, trazabilidad y corrección como infraestructura civilizatoria | [Issue #47](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/47) |\n| XL | [Respeto Neodialéctico, Neoego y Honor Relacional™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md) | Preservar límites, reciprocidad y genealogía sin convertir excelencia en captura | [Issue #48](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/48) |\n| XLI | [Martillo Limitado, Talión y Fuerza Protectora™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md) | Gobernar defensa mediante necesidad, proporcionalidad, distinción, responsabilidad y cese | [Issue #49](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/49) |\n\n## Décima oleada · Fin de la Era del Hombre Manipulado™ · XLII\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XLII | [Fin de la Era del Hombre Manipulado™ · IA, Despertar y Soberanía Cognitiva](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md) | Examinar la IA como bifurcación entre captura aumentada y comprensión aumentada bajo dirección humana, memoria, fuentes, contraste y trazabilidad | [Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50) |\n\n* [Anuncio de la décima oleada](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n\nEl Manifiesto III mantiene'''
              if '## Décima oleada · Fin de la Era del Hombre Manipulado™ · XLII' not in s:
                  s=must_replace(s, es_anchor, es_insert, 'LEEME ES wave insertion')
              s=must_replace(s, '→ XXXVII · NEOFRATERNIDAD™\n→ I · RETORNO A ORIGEN Y NUEVO CICLO', '→ XXXVII · NEOFRATERNIDAD™\n→ XXXVIII · PROTECCIÓN INTEGRAL DE LA INFANCIA\n→ XXXIX · AUTOCONCIENCIA DE LA NECESIDAD VITAL\n→ XL · NEOEGO Y HONOR RELACIONAL\n→ XLI · MARTILLO LIMITADO Y FUERZA PROTECTORA\n→ XLII · FIN DE LA ERA DEL HOMBRE MANIPULADO\n→ I · RETORNO A ORIGEN Y NUEVO CICLO', 'LEEME ES chain')

              en_anchor='''**Genealogical antecedent of XXXVI:** [Crown, Eagle and Innova_N as a neodialectical tool](./propuestas/sintesis-abierta/ANEXO_CORONA_AGUILA_CUSTODIA_LEGADO_EDAD_DEL_HOMBRE_ES_EN.md).  \n**Linked annex to XXXV:** [Responsibility of Power Nodes and Civilisational Duty of Examination](./propuestas/sintesis-abierta/ANEXO_RESPONSABILIDAD_NODOS_DE_PODER_Y_DEBER_DE_EXAMEN_ES_EN.md).\n\n\nManifesto III maintains'''
              en_insert='''**Genealogical antecedent of XXXVI:** [Crown, Eagle and Innova_N as a neodialectical tool](./propuestas/sintesis-abierta/ANEXO_CORONA_AGUILA_CUSTODIA_LEGADO_EDAD_DEL_HOMBRE_ES_EN.md).  \n**Linked annex to XXXV:** [Responsibility of Power Nodes and Civilisational Duty of Examination](./propuestas/sintesis-abierta/ANEXO_RESPONSABILIDAD_NODOS_DE_PODER_Y_DEBER_DE_EXAMEN_ES_EN.md).\n\n## Eighth wave · Childhood, education and civilisational transmission · XXXVIII\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXVIII | [Integral Protection of Childhood™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Protect material security, education, age-differentiated development, privacy and attention against commercial capture and systemic abandonment | [Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45) |\n\n## Ninth wave · Self-awareness, respect and civilisational defence · XXXIX–XLI\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXIX | [Self-Awareness of Neodialectical Vital Need™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md) | Memory, relation, contrast, traceability and correction as civilisational infrastructure | [Issue #47](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/47) |\n| XL | [Neodialectical Respect, Neoego and Relational Honour™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md) | Preserve boundaries, reciprocity and genealogy without turning excellence into capture | [Issue #48](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/48) |\n| XLI | [Limited Hammer, Talion and Protective Force™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md) | Govern defence through necessity, proportionality, distinction, responsibility and cessation | [Issue #49](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/49) |\n\n## Tenth wave · End of the Manipulated Human Era™ · XLII\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XLII | [End of the Manipulated Human Era™ · AI, Awakening and Cognitive Sovereignty](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md) | Examine AI as a bifurcation between augmented capture and augmented understanding under human direction, memory, sources, contrast and traceability | [Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50) |\n\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n\nManifesto III maintains'''
              if '## Tenth wave · End of the Manipulated Human Era™ · XLII' not in s:
                  s=must_replace(s, en_anchor, en_insert, 'LEEME EN wave insertion')
              s=must_replace(s, '→ XXXVII · NEOFRATERNITY™\n→ I · RETURN TO ORIGIN AND NEW CYCLE', '→ XXXVII · NEOFRATERNITY™\n→ XXXVIII · INTEGRAL PROTECTION OF CHILDHOOD\n→ XXXIX · SELF-AWARENESS OF VITAL NEED\n→ XL · NEOEGO AND RELATIONAL HONOUR\n→ XLI · LIMITED HAMMER AND PROTECTIVE FORCE\n→ XLII · END OF THE MANIPULATED HUMAN ERA\n→ I · RETURN TO ORIGIN AND NEW CYCLE', 'LEEME EN chain')
              return s

          def patch_portada(s):
              s=must_replace(s,'La colección pública contiene actualmente **treinta y ocho manifiestos bilingües**:','La colección pública contiene actualmente **cuarenta y dos manifiestos bilingües**:','PORTADA ES count')
              s=must_replace(s,'The public collection currently contains **thirty-eight bilingual manifestos**:','The public collection currently contains **forty-two bilingual manifestos**:','PORTADA EN count')
              es_bullet='* **Octava oleada · XXXVIII:** Protección Integral de la Infancia™, educación, soberanía digital y transmisión civilizatoria.'
              s=must_replace(s,es_bullet,es_bullet+'\n* **Novena oleada · XXXIX–XLI:** autoconciencia de necesidad vital, Neoego™, Honor Relacional™ y fuerza protectora limitada.\n* **Décima oleada · XLII:** Fin de la Era del Hombre Manipulado™, IA, despertar crítico y soberanía cognitiva.','PORTADA ES bullets')
              en_bullet='* **Eighth wave · XXXVIII:** Integral Protection of Childhood™, education, digital sovereignty and civilisational transmission.'
              s=must_replace(s,en_bullet,en_bullet+'\n* **Ninth wave · XXXIX–XLI:** self-awareness of vital need, Neoego™, Relational Honour™ and limited protective force.\n* **Tenth wave · XLII:** End of the Manipulated Human Era™, AI, critical awakening and cognitive sovereignty.','PORTADA EN bullets')
              es_oct='''### Octava oleada · Infancia, educación y transmisión civilizatoria\n\n* [XXXVIII · Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [MAXPROC · Protección Integral de la Infancia™](./analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Anuncio de la octava oleada](./anuncios/2026-08-07_OCTAVA_OLEADA_PROTECCION_INTEGRAL_INFANCIA_ES_EN.md)\n* [Síntesis Abierta XXXVIII · Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45)'''
              es_more=es_oct+'''\n\n### Novena oleada · Autoconciencia, respeto y defensa civilizatoria\n\n* [XXXIX · Autoconciencia de la Necesidad Vital Neodialéctica™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n* [XL · Respeto Neodialéctico, Neoego y Honor Relacional™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n* [XLI · Martillo Limitado, Talión y Fuerza Protectora™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n* [Síntesis Abierta XXXIX · Issue #47](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/47)\n* [Síntesis Abierta XL · Issue #48](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/48)\n* [Síntesis Abierta XLI · Issue #49](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/49)\n\n### Décima oleada · Fin de la Era del Hombre Manipulado™\n\n* [XLII · Fin de la Era del Hombre Manipulado™ · IA, Despertar y Soberanía Cognitiva](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Anuncio de la décima oleada](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n* [Síntesis Abierta XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)'''
              if '### Décima oleada · Fin de la Era del Hombre Manipulado™' not in s:
                  s=must_replace(s,es_oct,es_more,'PORTADA ES sections')
              en_oct='''### Eighth wave · Childhood, education and civilisational transmission\n\n* [XXXVIII · Integral Protection of Childhood™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [MAXPROC · Integral Protection of Childhood™](./analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Eighth-wave announcement](./anuncios/2026-08-07_OCTAVA_OLEADA_PROTECCION_INTEGRAL_INFANCIA_ES_EN.md)\n* [Open Synthesis XXXVIII · Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45)'''
              en_more=en_oct+'''\n\n### Ninth wave · Self-awareness, respect and civilisational defence\n\n* [XXXIX · Self-Awareness of Neodialectical Vital Need™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n* [XL · Neodialectical Respect, Neoego and Relational Honour™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n* [XLI · Limited Hammer, Talion and Protective Force™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n* [Open Synthesis XXXIX · Issue #47](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/47)\n* [Open Synthesis XL · Issue #48](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/48)\n* [Open Synthesis XLI · Issue #49](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/49)\n\n### Tenth wave · End of the Manipulated Human Era™\n\n* [XLII · End of the Manipulated Human Era™ · AI, Awakening and Cognitive Sovereignty](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n* [Open Synthesis XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)'''
              if '### Tenth wave · End of the Manipulated Human Era™' not in s:
                  s=must_replace(s,en_oct,en_more,'PORTADA EN sections')
              return s

          def patch_cover(s):
              es_main='* [XXXVIII · Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)'
              if '* [XLII · Fin de la Era del Hombre Manipulado™]' not in s:
                  s=must_replace(s,es_main,es_main+'\n* [XLII · Fin de la Era del Hombre Manipulado™](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Décima oleada · anuncio](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)', 'COVER ES access')
              en_main='* [XXXVIII · Integral Protection of Childhood™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)'
              if '* [XLII · End of the Manipulated Human Era™]' not in s:
                  s=must_replace(s,en_main,en_main+'\n* [XLII · End of the Manipulated Human Era™](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)', 'COVER EN access')
              es_oct='''## Octava oleada · XXXVIII · Infancia, educación y transmisión civilizatoria\n\n38. [Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n\n* [MAXPROC · Protección Integral de la Infancia™](./analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Síntesis Abierta · Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45)'''
              es_more=es_oct+'''\n\n## Novena oleada · XXXIX–XLI · Autoconciencia, respeto y defensa civilizatoria\n\n39. [Autoconciencia de la Necesidad Vital Neodialéctica™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n40. [Respeto Neodialéctico, Neoego y Honor Relacional™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n41. [Martillo Limitado, Talión y Fuerza Protectora™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n\n## Décima oleada · XLII · Fin de la Era del Hombre Manipulado™\n\n42. [Fin de la Era del Hombre Manipulado™ · IA, Despertar y Soberanía Cognitiva](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n\n* [Síntesis Abierta XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)\n* [Anuncio de la décima oleada](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)'''
              if '## Décima oleada · XLII · Fin de la Era del Hombre Manipulado™' not in s:
                  s=must_replace(s,es_oct,es_more,'COVER ES sections')
              en_oct='''## Eighth wave · XXXVIII · Childhood, education and civilisational transmission\n\n38. [Integral Protection of Childhood™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n\n* [MAXPROC · Integral Protection of Childhood™](./analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Open Synthesis · Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45)'''
              en_more=en_oct+'''\n\n## Ninth wave · XXXIX–XLI · Self-awareness, respect and civilisational defence\n\n39. [Self-Awareness of Neodialectical Vital Need™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n40. [Neodialectical Respect, Neoego and Relational Honour™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n41. [Limited Hammer, Talion and Protective Force™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n\n## Tenth wave · XLII · End of the Manipulated Human Era™\n\n42. [End of the Manipulated Human Era™ · AI, Awakening and Cognitive Sovereignty](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n\n* [Open Synthesis XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)'''
              if '## Tenth wave · XLII · End of the Manipulated Human Era™' not in s:
                  s=must_replace(s,en_oct,en_more,'COVER EN sections')
              return s

          patch('LEEME.md', patch_leeme)
          patch('PORTADA.md', patch_portada)
          patch('COVER.md', patch_cover)

          Path('.github/workflows/one-shot-complete-xl42-sync.yml').unlink()
          PY

      - name: Validate and commit
        shell: bash
        run: |
          test "$(grep -c 'Fin de la Era del Hombre Manipulado' LEEME.md)" -ge 2
          test "$(grep -c 'End of the Manipulated Human Era' LEEME.md)" -ge 2
          test "$(grep -c 'cuarenta y dos manifiestos bilingües' PORTADA.md)" -eq 1
          test "$(grep -c 'forty-two bilingual manifestos' PORTADA.md)" -eq 1
          test "$(grep -c '^42\. ' COVER.md)" -eq 2
          git config user.name 'Innova_N documentary sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: complete XLII sync across LEEME and covers [skip ci]'
          git push
