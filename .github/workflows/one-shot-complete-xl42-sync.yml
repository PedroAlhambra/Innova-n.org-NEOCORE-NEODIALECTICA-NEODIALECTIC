name: one-shot-complete-xl42-sync

on:
  push:
    paths:
      - '.github/workflows/one-shot-complete-xl42-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete XLII synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # LEEME: append missing wave blocks immediately before its existing Manifesto III note.
          p=Path('LEEME.md'); s=p.read_text(encoding='utf-8')
          if '## Décima oleada · Fin de la Era del Hombre Manipulado™ · XLII' not in s:
              marker='El Manifiesto III mantiene'
              block='''## Octava oleada · Infancia, educación y transmisión civilizatoria · XXXVIII\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXVIII | [Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Proteger seguridad material, educación, desarrollo por edades, privacidad y atención frente a captura comercial y abandono sistémico | [Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45) |\n\n## Novena oleada · Autoconciencia, respeto y defensa civilizatoria · XXXIX–XLI\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXIX | [Autoconciencia de la Necesidad Vital Neodialéctica™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md) | Memoria, relación, contraste, trazabilidad y corrección como infraestructura civilizatoria | [Issue #47](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/47) |\n| XL | [Respeto Neodialéctico, Neoego y Honor Relacional™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md) | Preservar límites, reciprocidad y genealogía sin convertir excelencia en captura | [Issue #48](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/48) |\n| XLI | [Martillo Limitado, Talión y Fuerza Protectora™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md) | Gobernar defensa mediante necesidad, proporcionalidad, distinción, responsabilidad y cese | [Issue #49](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/49) |\n\n## Décima oleada · Fin de la Era del Hombre Manipulado™ · XLII\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XLII | [Fin de la Era del Hombre Manipulado™ · IA, Despertar y Soberanía Cognitiva](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md) | Examinar la IA como bifurcación entre captura aumentada y comprensión aumentada bajo dirección humana, memoria, fuentes, contraste y trazabilidad | [Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50) |\n\n* [Anuncio de la décima oleada](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n\n'''
              if marker not in s: raise SystemExit('LEEME ES marker missing')
              s=s.replace(marker,block+marker,1)
          if '## Tenth wave · End of the Manipulated Human Era™ · XLII' not in s:
              marker='Manifesto III maintains'
              block='''## Eighth wave · Childhood, education and civilisational transmission · XXXVIII\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXVIII | [Integral Protection of Childhood™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md) | Protect material security, education, age-differentiated development, privacy and attention against commercial capture and systemic abandonment | [Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45) |\n\n## Ninth wave · Self-awareness, respect and civilisational defence · XXXIX–XLI\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXIX | [Self-Awareness of Neodialectical Vital Need™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md) | Memory, relation, contrast, traceability and correction as civilisational infrastructure | [Issue #47](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/47) |\n| XL | [Neodialectical Respect, Neoego and Relational Honour™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md) | Preserve boundaries, reciprocity and genealogy without turning excellence into capture | [Issue #48](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/48) |\n| XLI | [Limited Hammer, Talion and Protective Force™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md) | Govern defence through necessity, proportionality, distinction, responsibility and cessation | [Issue #49](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/49) |\n\n## Tenth wave · End of the Manipulated Human Era™ · XLII\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XLII | [End of the Manipulated Human Era™ · AI, Awakening and Cognitive Sovereignty](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md) | Examine AI as a bifurcation between augmented capture and augmented understanding under human direction, memory, sources, contrast and traceability | [Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50) |\n\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n\n'''
              if marker not in s: raise SystemExit('LEEME EN marker missing')
              s=s.replace(marker,block+marker,1)
          s=s.replace('→ XXXVII · NEOFRATERNIDAD™\n→ I · RETORNO A ORIGEN Y NUEVO CICLO','→ XXXVII · NEOFRATERNIDAD™\n→ XXXVIII · PROTECCIÓN INTEGRAL DE LA INFANCIA\n→ XXXIX · AUTOCONCIENCIA DE LA NECESIDAD VITAL\n→ XL · NEOEGO Y HONOR RELACIONAL\n→ XLI · MARTILLO LIMITADO Y FUERZA PROTECTORA\n→ XLII · FIN DE LA ERA DEL HOMBRE MANIPULADO\n→ I · RETORNO A ORIGEN Y NUEVO CICLO',1)
          s=s.replace('→ XXXVII · NEOFRATERNITY™\n→ I · RETURN TO ORIGIN AND NEW CYCLE','→ XXXVII · NEOFRATERNITY™\n→ XXXVIII · INTEGRAL PROTECTION OF CHILDHOOD\n→ XXXIX · SELF-AWARENESS OF VITAL NEED\n→ XL · NEOEGO AND RELATIONAL HONOUR\n→ XLI · LIMITED HAMMER AND PROTECTIVE FORCE\n→ XLII · END OF THE MANIPULATED HUMAN ERA\n→ I · RETURN TO ORIGIN AND NEW CYCLE',1)
          p.write_text(s,encoding='utf-8')

          # PORTADA: update count/bullets and place new wave links before transverse deltas.
          p=Path('PORTADA.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('**treinta y ocho manifiestos bilingües**','**cuarenta y dos manifiestos bilingües**')
          s=s.replace('**thirty-eight bilingual manifestos**','**forty-two bilingual manifestos**')
          es_oct='* **Octava oleada · XXXVIII:** Protección Integral de la Infancia™, educación, soberanía digital y transmisión civilizatoria.'
          if '**Novena oleada · XXXIX–XLI:**' not in s:
              s=s.replace(es_oct,es_oct+'\n* **Novena oleada · XXXIX–XLI:** autoconciencia de necesidad vital, Neoego™, Honor Relacional™ y fuerza protectora limitada.\n* **Décima oleada · XLII:** Fin de la Era del Hombre Manipulado™, IA, despertar crítico y soberanía cognitiva.',1)
          en_oct='* **Eighth wave · XXXVIII:** Integral Protection of Childhood™, education, digital sovereignty and civilisational transmission.'
          if '**Ninth wave · XXXIX–XLI:**' not in s:
              s=s.replace(en_oct,en_oct+'\n* **Ninth wave · XXXIX–XLI:** self-awareness of vital need, Neoego™, Relational Honour™ and limited protective force.\n* **Tenth wave · XLII:** End of the Manipulated Human Era™, AI, critical awakening and cognitive sovereignty.',1)
          if '### Décima oleada · Fin de la Era del Hombre Manipulado™' not in s:
              marker='### Deltas transversales recientes'
              block='''### Novena oleada · Autoconciencia, respeto y defensa civilizatoria\n\n* [XXXIX · Autoconciencia de la Necesidad Vital Neodialéctica™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n* [XL · Respeto Neodialéctico, Neoego y Honor Relacional™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n* [XLI · Martillo Limitado, Talión y Fuerza Protectora™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n* [Síntesis Abierta XXXIX–XLI · Issues #47–#49](./manifiestos/README.md#novena-oleada--autoconciencia-respeto-y-defensa-civilizatoria)\n\n### Décima oleada · Fin de la Era del Hombre Manipulado™\n\n* [XLII · IA, Despertar y Soberanía Cognitiva](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Anuncio de la décima oleada](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n* [Síntesis Abierta XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)\n\n'''
              if marker not in s: raise SystemExit('PORTADA ES marker missing')
              s=s.replace(marker,block+marker,1)
          if '### Tenth wave · End of the Manipulated Human Era™' not in s:
              marker='### Recent transverse deltas'
              block='''### Ninth wave · Self-awareness, respect and civilisational defence\n\n* [XXXIX · Self-Awareness of Neodialectical Vital Need™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n* [XL · Neodialectical Respect, Neoego and Relational Honour™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n* [XLI · Limited Hammer, Talion and Protective Force™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n\n### Tenth wave · End of the Manipulated Human Era™\n\n* [XLII · AI, Awakening and Cognitive Sovereignty](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n* [Open Synthesis XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)\n\n'''
              if marker not in s: raise SystemExit('PORTADA EN marker missing')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')

          # COVER: add direct access and numbered waves 39–42 before transverse deltas.
          p=Path('COVER.md'); s=p.read_text(encoding='utf-8')
          if '* [XLII · Fin de la Era del Hombre Manipulado™]' not in s:
              anchor='* [XXXVIII · Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)'
              s=s.replace(anchor,anchor+'\n* [XLII · Fin de la Era del Hombre Manipulado™](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Décima oleada · anuncio](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)',1)
          if '* [XLII · End of the Manipulated Human Era™]' not in s:
              anchor='* [XXXVIII · Integral Protection of Childhood™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)'
              s=s.replace(anchor,anchor+'\n* [XLII · End of the Manipulated Human Era™](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)',1)
          if '## Décima oleada · XLII · Fin de la Era del Hombre Manipulado™' not in s:
              marker='### Deltas transversales recientes'
              block='''## Novena oleada · XXXIX–XLI · Autoconciencia, respeto y defensa civilizatoria\n\n39. [Autoconciencia de la Necesidad Vital Neodialéctica™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n40. [Respeto Neodialéctico, Neoego y Honor Relacional™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n41. [Martillo Limitado, Talión y Fuerza Protectora™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n\n## Décima oleada · XLII · Fin de la Era del Hombre Manipulado™\n\n42. [Fin de la Era del Hombre Manipulado™ · IA, Despertar y Soberanía Cognitiva](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n\n* [Síntesis Abierta XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)\n* [Anuncio de la décima oleada](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n\n'''
              s=s.replace(marker,block+marker,1)
          if '## Tenth wave · XLII · End of the Manipulated Human Era™' not in s:
              marker='### Recent transverse deltas'
              block='''## Ninth wave · XXXIX–XLI · Self-awareness, respect and civilisational defence\n\n39. [Self-Awareness of Neodialectical Vital Need™](./manifiestos/39_autoconciencia_necesidad_vital_neodialectica_ES_EN.md)\n40. [Neodialectical Respect, Neoego and Relational Honour™](./manifiestos/40_respeto_neoego_honor_relacional_ES_EN.md)\n41. [Limited Hammer, Talion and Protective Force™](./manifiestos/41_martillo_limitado_talion_fuerza_protectora_ES_EN.md)\n\n## Tenth wave · XLII · End of the Manipulated Human Era™\n\n42. [End of the Manipulated Human Era™ · AI, Awakening and Cognitive Sovereignty](./manifiestos/42_fin_era_hombre_manipulado_ia_despertar_soberania_cognitiva_ES_EN.md)\n\n* [Open Synthesis XLII · Issue #50](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/50)\n* [Tenth-wave announcement](./anuncios/2026-08-08_DECIMA_OLEADA_FIN_ERA_HOMBRE_MANIPULADO_ES_EN.md)\n\n'''
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/one-shot-complete-xl42-sync.yml').unlink()
          PY
      - name: Validate and commit
        shell: bash
        run: |
          grep -q 'cuarenta y dos manifiestos bilingües' PORTADA.md
          grep -q 'forty-two bilingual manifestos' PORTADA.md
          test "$(grep -c '^42\. ' COVER.md)" -eq 2
          grep -q '→ XLII · FIN DE LA ERA DEL HOMBRE MANIPULADO' LEEME.md
          grep -q '→ XLII · END OF THE MANIPULATED HUMAN ERA' LEEME.md
          git config user.name 'Innova_N documentary sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: complete XLII sync across LEEME and covers [skip ci]'
          git push
