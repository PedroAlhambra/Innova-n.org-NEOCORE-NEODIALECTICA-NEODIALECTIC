name: Guard Neoaxiom document navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'neoaxiomas/**'
      - 'propuestas/sintesis-abierta/*C_NAX_*_ES_EN.md'
      - 'propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md'
      - 'propuestas/sintesis-abierta/NEOAXIOMAS_SINTESIS_ABIERTA_ES_EN.md'
      - '.github/scripts/audit_neoaxiom_registry_integrity.py'
      - '.github/workflows/repair-neoaxiom-navigation.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify document-first Neoaxiom navigation
        run: python .github/scripts/audit_neoaxiom_registry_integrity.py
      - name: Ensure the guard is non-mutating
        run: git diff --exit-code
