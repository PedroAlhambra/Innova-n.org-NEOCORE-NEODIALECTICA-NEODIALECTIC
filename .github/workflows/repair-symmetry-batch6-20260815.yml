name: One-shot symmetry repair 6 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-symmetry-batch6-20260815.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refine remaining explicit bilingual tails
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/scripts/audit_global_bilingual_symmetry.py')
          s=p.read_text(encoding='utf-8')
          old='|Derechos / Rights)\\s*$'
          new='|Derechos / Rights|Nodos relacionados / Related nodes|Navegación / Navigation|Trazabilidad KDP 51071689 · estado actual / KDP 51071689 traceability · current state|Licencia de participación / Participation licence)\\s*$'
          if old not in s:
              raise SystemExit('shared-tail insertion point not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Recalculate audit
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Validate
        run: git diff --check
      - name: Commit audit refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/audit_global_bilingual_symmetry.py auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'audit: classify remaining explicit bilingual tails'
          git push origin HEAD:main
