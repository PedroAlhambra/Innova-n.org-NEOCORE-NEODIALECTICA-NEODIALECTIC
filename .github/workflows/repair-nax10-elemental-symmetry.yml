name: repair-nax10-elemental-symmetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_nax10_elemental_symmetry.py'
      - '.github/workflows/repair-nax10-elemental-symmetry.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore NAX-10 strict ES EN symmetry
        run: python .github/scripts/repair_nax10_elemental_symmetry.py
      - name: Commit repaired NAX-10
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neoaxiomas/NAX-10_FUEGO_DE_AGUA_TOTALIDAD_ELEMENTAL_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión en NAX-10 elemental'
          git pull --rebase origin main
          git push origin main
