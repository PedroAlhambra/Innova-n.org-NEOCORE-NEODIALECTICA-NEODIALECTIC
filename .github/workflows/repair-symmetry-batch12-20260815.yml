name: One-shot symmetry repair 12 2026-08-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-symmetry-batch12-20260815.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align English Markdown formatting with Spanish authorial structure
        shell: python
        run: |
          import re
          from pathlib import Path
          path=Path('analisis/publicos/2026-07-21_espana-sin-consulta-marruecos-regularizacion-nacionalidad-control-democratico.md')
          text=path.read_text(encoding='utf-8')
          en=re.search(r'^#{1,4}\s+English version\s*$',text,re.M)
          tail=re.search(r'^#{1,6}\s+Documentary status / Estado documental\s*$',text[en.end():],re.M)
          if not en or not tail: raise SystemExit('English boundaries not found')
          start=en.end(); end=start+tail.start()
          body=text[start:end]
          body=re.sub(r'(?m)^-\s+','',body)
          body=re.sub(r'(?m)^>\s?','',body)
          path.write_text(text[:start]+body+text[end:],encoding='utf-8')
      - name: Recalculate audit
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Validate
        run: git diff --check
      - name: Commit if clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          r=Path('auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md').read_text(encoding='utf-8')
          if 'Split structural failures: **0**' not in r or 'Paired surfaces for review: **0**' not in r or 'Marker failures: **0**' not in r:
              raise SystemExit('global audit not clean after formatting alignment')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analisis/publicos/2026-07-21_espana-sin-consulta-marruecos-regularizacion-nacionalidad-control-democratico.md auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'fix: align legacy English formatting and close bilingual audit'
          git push origin HEAD:main
