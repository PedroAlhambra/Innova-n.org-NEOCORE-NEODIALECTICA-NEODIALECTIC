          }

          # Validate the canonical set before writing anything.
          missing = []
          for roman, (fn, _) in manifestos.items():
              if not (ROOT/'manifiestos'/fn).exists():
                  missing.append(f'{roman}:{fn}')
          if missing:
              raise SystemExit('Missing canonical manifestos: ' + ', '.join(missing))
          if len(manifestos) != 47:
              raise SystemExit(f'Expected 47 canonical manifestos, found {len(manifestos)}')

          def strip_block(text, a, b):
              return re.sub(re.escape(a) + r'.*?' + re.escape(b) + r'\n?', '', text, flags=re.S)

          def add_related_block(path: Path, roman: str):
              text = path.read_text(encoding='utf-8')
              text = strip_block(text, START, END).rstrip() + '\n'
              lines = [
                  '', START, '', '---', '',
                  '## Trabajo aplicado y casos relacionados / Applied work and related cases', '',
                  '> **Regla de lectura / Reading rule:** una relación documental muestra aplicación, contraste, precedencia o correspondencia estructural. No convierte por sí sola una hipótesis en hecho probado, una convergencia en copia, una investigación en culpabilidad ni una analogía funcional en identidad moral. / A documentary relation shows application, contrast, precedence or structural correspondence. It does not by itself turn a hypothesis into proven fact, convergence into copying, an investigation into guilt, or a functional analogy into moral identity.', ''
              ]
              for key in R[roman]:
                  target, label, level = D[key]
                  lines.append(f'- **{level}** · [{label}]({target}) — {descriptions[key]}')
                  if key in caution:
                      lines.append(f'  - **Límite / Limit:** {caution[key]}')
              lines += [
                  f'- [Mapa transversal Manifiesto ↔ trabajo aplicado / Manifesto ↔ applied-work map](./RELACIONES_TRABAJO_APLICADO_ES_EN.md#manifiesto-{roman.lower()})',
                  '', END, ''
              ]
              path.write_text(text + '\n'.join(lines), encoding='utf-8')

          for roman, (fn, _) in manifestos.items():
              add_related_block(ROOT/'manifiestos'/fn, roman)

          # Central relational map generated from the same source of truth.
