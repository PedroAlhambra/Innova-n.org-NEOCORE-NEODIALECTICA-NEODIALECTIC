              '# Mapa transversal · Manifiestos ↔ trabajo aplicado',
              '# Transversal map · Manifestos ↔ applied work', '',
              '**Estado / Status:** público · relacional · 2026-08-08 / public · relational · 2026-08-08  ',
              '**Cobertura / Coverage:** I–XLVII · 47 manifiestos · catorce oleadas / 47 manifestos · fourteen waves  ',
              '**Función / Function:** hacer navegable la relación entre principios, análisis, auditorías, obras, protocolos, evidencias y casos sin convertir correlación documental en prueba causal. / Make the relation among principles, analyses, audits, works, protocols, evidence and cases navigable without turning documentary correlation into causal proof.', '',
              '---', '',
