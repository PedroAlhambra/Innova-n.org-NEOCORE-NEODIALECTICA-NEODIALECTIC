              t = re.sub(r'los \*\*\d+ manifiestos I–XLVII\*\*', 'los **47 manifiestos I–XLVII**', t)
              t = re.sub(r'all \*\*\d+ Manifestos I–XLVII\*\*', 'all **47 Manifestos I–XLVII**', t)
              extra = '''\n## Oleadas XII–XIV · Multidimensionalidad, reconciliación y sombra / Waves XII–XIV · Multidimensionality, reconciliation and shadow\n\n- [XLV · Issue #53](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/53) · [Manifiesto / Manifesto](../../manifiestos/45_multidimensionalidad_neodialectica_problema_mulo_soberania_distribuida_ES_EN.md)\n- [XLVI · Issue #54](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/54) · [Manifiesto / Manifesto](../../manifiestos/46_cerrar_la_herida_comprension_evolutiva_memoria_reconciliacion_ES_EN.md)\n- [XLVII · Issue #55](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/55) · [Manifiesto / Manifesto](../../manifiestos/47_odio_neo0_sino_goat_sombra_vinculo_doble_cara_ES_EN.md)\n'''
              if '## Oleadas XII–XIV' not in t:
                  t = t.rstrip() + '\n' + extra
              p.write_text(t,encoding='utf-8')

          # Wiki source remains an orientation layer: update ranges and add one map entry, not a duplicate matrix.
          p = ROOT/'wiki-source'/'Manifiestos.md'
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace('I–XLV','I–XLVII').replace('I-XLV','I-XLVII')
              t = t.replace('**XLV:**', '**XLV:**')
              if 'XLVI–XLVII' not in t:
                  needle = '* **XLV:**'
                  idx = t.find(needle)
                  if idx != -1:
                      eol = t.find('\n', idx)
                      t = t[:eol+1] + '* **XLVI–XLVII:** reconciliación civilizatoria, sombra, vínculo y verdad emocional.\n' + t[eol+1:]
              p.write_text(t,encoding='utf-8')

          # Validation: links and markers on all modified manifesto/work-map surfaces.
          errors = []
          for roman,(fn,_) in manifestos.items():
              p = ROOT/'manifiestos'/fn
              txt = p.read_text(encoding='utf-8')
              if txt.count(START) != 1 or txt.count(END) != 1:
                  errors.append(f'{p}: related-work marker count')
          mp = ROOT/'manifiestos'/'RELACIONES_TRABAJO_APLICADO_ES_EN.md'
          if not mp.exists() or mp.read_text(encoding='utf-8').count('<a id="manifiesto-') != 47:
              errors.append('central relation map does not contain 47 anchors')

          # Check relative Markdown links in the modified manifesto family, central map, reciprocal nodes and indexes.
          check_paths = [ROOT/'manifiestos'/fn for fn,_ in manifestos.values()] + [mp]
          check_paths += [ROOT/x for x in work_to_manifestos] + [ROOT/x for x in index_targets if (ROOT/x).exists()]
          check_paths += [ROOT/x for x in current_surfaces if (ROOT/x).exists()]
          link_re = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for pth in dict.fromkeys(check_paths):
              txt = pth.read_text(encoding='utf-8')
              for raw in link_re.findall(txt):
                  url = raw.strip().split()[0]
                  if url.startswith(('http://','https://','mailto:','#')):
                      continue
                  url = url.split('#',1)[0]
                  if not url: continue
                  dest = (pth.parent/url).resolve()
                  try:
                      dest.relative_to(ROOT.resolve())
                  except Exception:
                      continue
                  if not dest.exists():
                      errors.append(f'{pth}: broken relative link -> {url}')

          # Current canonical integrity checks.
          mi = (ROOT/'manifiestos'/'README.md').read_text(encoding='utf-8')
          if 'catorce oleadas relacionadas' not in mi or 'fourteen related waves' not in mi:
              errors.append('manifesto index wave count not normalized')
          for token in ['XLV |','XLVI |','XLVII |','Issue #53','Issue #54','Issue #55']:
              if token not in mi: errors.append(f'manifesto index missing {token}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(f'Validation failed with {len(errors)} error(s)')

          # Self-delete one-shot workflow before committing.
          wf = ROOT/'.github/workflows/correlate-manifestos-applied-work.yml'
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit relational layer
        shell: bash
        run: |
          git config user.name "Innova_N Documentation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: correlate manifestos with applied work and repair canonical map"
          git push origin HEAD:main
