name: patch-nax10-lion-index

on:
  push:
    paths:
      - '.github/workflows/patch-nax10-lion-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_nax10_lion_index.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neoaxiomas/README.md
          git commit -m 'docs: completar NAX-10 con León en topología e índice' || exit 0
          git pull --rebase origin main
          git push origin main
