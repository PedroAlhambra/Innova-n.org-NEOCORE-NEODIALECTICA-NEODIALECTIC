name: One-shot public documentary graph reconciliation 2026-08-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneshot-fix-documentary-graph-web4-guard-20260815.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch persistent generators and guards
        shell: python
        run: |
          from pathlib import Path
          import base64

          p=Path('.github/scripts/audit_markdown_links_readmes.py')
          t=p.read_text(encoding='utf-8')
          old="if 'innova-n.org' not in wr or 'no es demo' not in low_wr or 'segunda web' not in low_wr:"
          new="if 'innova-n.org' not in wr or ('no es demo' not in low_wr and 'no es una demo' not in low_wr) or 'segunda web' not in low_wr:"
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('WEB4 guard condition not found')
          p.write_text(t,encoding='utf-8')

          p=Path('.github/scripts/sync_relations_lxxv.py')
          t=p.read_text(encoding='utf-8')
          marker="\n\n{END}'''"
          addition=base64.b64decode('').decode('utf-8')
          if '## LXXVI · El Altavoz sin Síntesis™' not in t:
              if marker not in t:
                  raise SystemExit('relation block end marker not found')
              t=t.replace(marker,'\n\n'+addition+marker,1)
          t=t.replace('**Cobertura / Coverage:** I–LXXV · 75 manifiestos finitos + ∞ como continuidad abierta / 75 finite manifestos I–LXXV + ∞ as open continuity  ','**Cobertura / Coverage:** I–LXXVI · 76 manifiestos finitos + ∞ como continuidad abierta / 76 finite manifestos I–LXXVI + ∞ as open continuity  ')
          t=t.replace("'## Matriz completa I–LXXV / Complete I–LXXV matrix'","'## Matriz completa I–LXXVI / Complete I–LXXVI matrix'")
          t=t.replace("text=upsert(text,radar_wiki,'## Análisis, evidencia y auditorías')","# wiki map has its own ES/EN structure; avoid mixed insertion here\ntext=old")
          p.write_text(t,encoding='utf-8')
      - name: Rebuild and audit public graph
        run: |
          python .github/scripts/register_manifesto_frontier.py
          python .github/scripts/normalize_manifesto_bilingual_names.py
          python .github/scripts/normalize_internal_link_aliases.py
          python .github/scripts/register_manifestos_LXIII_LXVI.py
          python .github/scripts/sync_neoaxiom_candidates.py
          python .github/scripts/sync_manifesto_frontier_headers.py
          python .github/scripts/sync_open_synthesis_manifestos.py
          python .github/scripts/normalize_manifesto_indices.py
          python .github/scripts/sync_root_navigation.py
          python .github/scripts/sync_relations_frontier.py
          python .github/scripts/sync_relations_lxxv.py
          python .github/scripts/sync_canonical_manifestos.py
          python .github/scripts/sync_manifesto_crossrefs.py
          python .github/scripts/sync_canonical_manifestos.py
          python .github/scripts/audit_manifesto_registry_completeness.py
          python .github/scripts/audit_es_en_parity.py
          python .github/scripts/audit_manifesto_bilingual_structure.py
          python .github/scripts/audit_relations_neocore.py
          python .github/scripts/audit_markdown_links_readmes.py
          python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Enforce clean living state
        shell: python
        run: |
          from pathlib import Path
          import json
          registry=json.loads(Path('manifiestos/CANONICAL_FILENAMES.json').read_text(encoding='utf-8'))['entries']
          if len(registry)!=76 or 'LXXVI' not in registry:
              raise SystemExit('canonical frontier is not I-LXXVI')
          links=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md').read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in links:
              raise SystemExit('documentary graph not healthy')
          rel=Path('auditorias/publicas/2026-08-09_auditoria_relacional_manifestos_neoaxiomas_publicaciones_ES_EN.md').read_text(encoding='utf-8')
          if '- Cobertura del mapa curado: **76/76**.' not in rel or '- Ausentes del mapa curado: **ninguno / none**.' not in rel:
              raise SystemExit('relational map not 76/76')
          glob=Path('auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md').read_text(encoding='utf-8')
          required=('Split structural failures: **0**','Marker failures: **0**','Paired surfaces for review: **0**','Issue templates with non-symmetric visible labels: **0**')
          if any(x not in glob for x in required):
              raise SystemExit('global bilingual symmetry regressed')
          print('PUBLIC_GRAPH=OK FRONTIER=I-LXXVI RELATIONS=76/76 BILINGUAL=0')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: reconcile LXXVI canonical graph links relations and synthesis frontier'
          git pull --rebase origin main
          git push origin HEAD:main
