name: audit-bilingual-parity-simple

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit_bilingual_parity_simple.py'
      - '.github/workflows/audit-bilingual-parity-simple.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit bilingual parity
        run: python .github/scripts/audit_bilingual_parity_simple.py
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/publicas/2026-08-09_auditoria_paridad_bilingue_manifiestos_neoaxiomas_ES_EN.md auditorias/publicas/2026-08-09_auditoria_paridad_bilingue_manifiestos_neoaxiomas.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: paridad bilingüe manifiestos y Neoaxiomas'
          git pull --rebase origin main
          git push origin main
