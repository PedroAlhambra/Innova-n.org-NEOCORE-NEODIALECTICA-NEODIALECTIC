name: Homogenize manifesto contribution footer

on:
  push:
    paths:
      - ".github/workflows/homogenize-manifestos.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  homogenize:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == '[automation] Homogenize manifesto contribution footer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical contribution footer
        run: python scripts/homogenize_manifesto_contribution_footer.py

      - name: Validate patch
        run: git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- manifiestos; then
            echo "No manifesto changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifiestos
          git commit -m "Manifiestos: homogeneizar cómo aportar a la Síntesis Abierta"
          git push

# This file may be dispatched manually or activated with the exact automation Issue title.
