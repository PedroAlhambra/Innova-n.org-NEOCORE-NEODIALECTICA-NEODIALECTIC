name: one-shot-sync-c-nax-25-26

on:
  push:
    paths:
      - '.github/workflows/oneshot-sync-c-nax-25-26.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register standalone candidates 25 and 26 symmetrically
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('neoaxiomas/README.md')
          text=p.read_text(encoding='utf-8')
          row24="| **C-NAX-24 · Diagnóstico ≠ Síntesis™ / Diagnosis ≠ Synthesis™** | [LXXVI + documento C-NAX-24](../propuestas/sintesis-abierta/2026-08-15_C_NAX_24_DIAGNOSTICO_NO_ES_SINTESIS_ES_EN.md) | **Candidato explícito · SAN #149**; no canonizado / **Explicit candidate · SAN #149**; not canonicalised |"
          rows="""| **C-NAX-25 · Fenómeno ≠ Narrativa™ / Phenomenon ≠ Narrative™** | [LXXVII + documento C-NAX-25](../propuestas/sintesis-abierta/2026-08-16_C_NAX_25_FENOMENO_NO_ES_NARRATIVA_ES_EN.md) | **Candidato explícito · SAN #155**; no canonizado / **Explicit candidate · SAN #155**; not canonicalised |
| **C-NAX-26 · Poder ↑ → Trazabilidad ↑ · Acusación ↑ → Evidencia ↑ / Power ↑ → Traceability ↑ · Accusation ↑ → Evidence ↑** | [Delta transversal + documento C-NAX-26](../propuestas/sintesis-abierta/2026-08-16_C_NAX_26_PODER_TRAZABILIDAD_ACUSACION_EVIDENCIA_ES_EN.md) | **Candidato explícito · SAN #156**; no canonizado / **Explicit candidate · SAN #156**; not canonicalised |"""
          if 'C-NAX-25 · Fenómeno ≠ Narrativa™' not in text:
              if row24 not in text: raise SystemExit('C-NAX-24 registry row anchor not found')
              text=text.replace(row24,row24+'\n'+rows,1)
          marker='<!-- NEOAXIOM_CANDIDATES_72_END -->'
          blocks="""
### C-NAX-25 · Fenómeno ≠ Narrativa™ / Phenomenon ≠ Narrative™

**ES · formulación candidata:**

> **La refutación de una explicación no implica la inexistencia del fenómeno que pretendía explicar; el reconocimiento de un fenómeno no implica aceptar la narrativa, causalidad o identidad política construida alrededor de él.**

```text
FENÓMENO ≠ NARRATIVA
REFUTAR CAUSALIDAD ≠ REFUTAR FENÓMENO
RECONOCER FENÓMENO ≠ ACEPTAR CAUSALIDAD
```

**EN · candidate formulation:**

> **Refuting an explanation does not imply the non-existence of the phenomenon it attempted to explain; recognising a phenomenon does not imply accepting the narrative, causality or political identity constructed around it.**

```text
PHENOMENON ≠ NARRATIVE
REFUTING CAUSALITY ≠ REFUTING PHENOMENON
RECOGNISING PHENOMENON ≠ ACCEPTING CAUSALITY
```

**Límite / Limit:** no establece equidistancia automática y no legitima un fenómeno por el mero hecho de ser percibido; fenómeno y causalidades deben someterse a datos, definición, escala y contraste. / it does not establish automatic equidistance and does not legitimise a phenomenon merely because it is perceived; phenomenon and causalities must be subjected to data, definition, scale and scrutiny.  
**Procedencia / Provenance:** [LXXVII + documento C-NAX-25](../propuestas/sintesis-abierta/2026-08-16_C_NAX_25_FENOMENO_NO_ES_NARRATIVA_ES_EN.md).  
**Síntesis / Synthesis:** [#155](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/155) · **CANDIDATO ≠ CANON / CANDIDATE ≠ CANON.**

### C-NAX-26 · Poder ↑ → Trazabilidad ↑ · Acusación ↑ → Evidencia ↑ / Power ↑ → Traceability ↑ · Accusation ↑ → Evidence ↑

**ES · formulación candidata:**

> **A mayor capacidad efectiva de un nodo para alterar el espacio común, mayor debe ser la exigencia proporcional de trazabilidad, auditabilidad y responsabilidad sobre el ejercicio de ese poder. A mayor gravedad de una acusación contra una persona u organización, mayor debe ser la exigencia proporcional de evidencia antes de tratarla como conclusión. El poder no implica culpabilidad, pero tampoco debe comprar opacidad; la sospecha no implica verdad, pero tampoco debe quedar prohibida de investigación.**

```text
PODER ↑ → TRAZABILIDAD ↑
IMPACTO SISTÉMICO ↑ → AUDITABILIDAD ↑
GRAVEDAD DE LA ACUSACIÓN ↑ → EVIDENCIA REQUERIDA ↑
PODER ≠ CULPABILIDAD
PODER ≠ INMUNIDAD
SOSPECHA ≠ HECHO
INVESTIGAR ≠ CONDENAR
```

**EN · candidate formulation:**

> **The greater a node's effective capacity to alter the common space, the greater the proportional requirement for traceability, auditability and responsibility over the exercise of that power. The greater the seriousness of an accusation against a person or organisation, the greater the proportional evidentiary requirement before treating it as a conclusion. Power does not imply guilt, but neither should it buy opacity; suspicion does not imply truth, but neither should it be barred from investigation.**

```text
POWER ↑ → TRACEABILITY ↑
SYSTEMIC IMPACT ↑ → AUDITABILITY ↑
SERIOUSNESS OF ACCUSATION ↑ → REQUIRED EVIDENCE ↑
POWER ≠ GUILT
POWER ≠ IMMUNITY
SUSPICION ≠ FACT
INVESTIGATING ≠ CONDEMNING
```

**Escala / Scale:** `0 sospecha/suspicion → 1 indicio/indication → 2 relación documentada/documented relationship → 3 convergencia de intereses/convergence of interests → 4 coordinación documentada/documented coordination → 5 agenda documentada/documented agenda → 6 responsabilidad demostrada/demonstrated responsibility`. Ningún nivel superior se hereda automáticamente; cada transición exige evidencia adicional y trazable. / No higher level is automatically inherited; every transition requires additional traceable evidence.  
**Procedencia / Provenance:** [Delta transversal + documento C-NAX-26](../propuestas/sintesis-abierta/2026-08-16_C_NAX_26_PODER_TRAZABILIDAD_ACUSACION_EVIDENCIA_ES_EN.md).  
**Síntesis / Synthesis:** [#156](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/156) · **CANDIDATO ≠ CANON / CANDIDATE ≠ CANON.**

"""
          if '### C-NAX-25 · Fenómeno ≠ Narrativa™' not in text:
              if marker not in text: raise SystemExit('candidate end marker not found')
              text=text.replace(marker,blocks+marker,1)
          p.write_text(text,encoding='utf-8')
          print('REGISTERED_STANDALONE_CANDIDATES=25,26')
          PY

      - name: Audit bilingual and documentary integrity
        run: |
          python .github/scripts/sync_root_navigation.py
          python .github/scripts/audit_es_en_parity.py
          python .github/scripts/audit_manifesto_bilingual_structure.py
          python .github/scripts/audit_relations_neocore.py
          python .github/scripts/audit_markdown_links_readmes.py
          python - <<'PY'
          from pathlib import Path
          neo=Path('neoaxiomas/README.md').read_text(encoding='utf-8')
          for token in ['C-NAX-25', 'C-NAX-26', '#155', '#156']:
              if token not in neo: raise SystemExit(f'missing registry token: {token}')
          parity=Path('auditorias/publicas/2026-08-09_auditoria_paridad_ES_EN_manifiestos_articulos.md').read_text(encoding='utf-8')
          if '**Recortes/materialmente asimétricos para revisión:** 0' not in parity or '**Con marcador incompleto/ausente:** 0' not in parity:
              raise SystemExit('material ES/EN parity failed')
          links=Path('auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md').read_text(encoding='utf-8')
          if '**Estado / Status:** **OK**' not in links: raise SystemExit('documentary links failed')
          print('C_NAX_25_26_REGISTRY=OK')
          print('MATERIAL_PARITY=OK')
          print('DOCUMENTARY_GRAPH=OK')
          PY

      - name: Commit synchronized registry and remove one-shot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneshot-sync-c-nax-25-26.yml
          git add -A
          git commit -m 'docs: synchronize C-NAX-25 and C-NAX-26 registry'
          git pull --rebase origin main
          git push origin main
