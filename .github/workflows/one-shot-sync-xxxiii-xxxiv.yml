name: one-shot-sync-xxxiii-xxxiv

on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-xxxiii-xxxiv.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch manifestos and indexes
        shell: python
        run: |
          from pathlib import Path

          p33 = Path('manifiestos/33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md')
          s = p33.read_text(encoding='utf-8')
          es_anchor = "La aspiración es que millones de personas lo lean porque encuentran valor en él, no porque una institución las obligue."
          es_insert = es_anchor + "\n\n### Comprar y elegir edición\n\n* [Comprar IDEA · versiones publicadas y enlaces por idioma](../obras/idea/README.md#doce-idiomas-actuales)\n* [Registro canónico de ediciones y formatos](../obras/idea/EDICIONES.md)"
          en_anchor = "The aspiration is that millions read it because they find value in it, not because an institution compels them."
          en_insert = en_anchor + "\n\n### Buy and choose an edition\n\n* [Buy IDEA · published editions and language links](../obras/idea/README.md#doce-idiomas-actuales)\n* [Canonical edition and format register](../obras/idea/EDICIONES.md)"
          if '### Comprar y elegir edición' not in s:
              if es_anchor not in s or en_anchor not in s:
                  raise SystemExit('Expected purchase anchors not found in manifesto XXXIII')
              s = s.replace(es_anchor, es_insert, 1).replace(en_anchor, en_insert, 1)
          s = s.replace('**Versión / Version:** 1.0', '**Versión / Version:** 1.1', 1)
          s = s.replace('· [I · Neo0™ · Soberanía de Guía Neodialéctica](./11_neo0_soberania_de_guia_ES_EN.md) →', '· [XXXIV · Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) →', 1)
          s = s.replace('· [I · Neo0™ · Guiding Sovereignty](./11_neo0_soberania_de_guia_ES_EN.md) →', '· [XXXIV · Operational Utility of the Framework and Perpetual Joint Audit™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) →', 1)
          p33.write_text(s, encoding='utf-8')

          p34 = Path('manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md')
          s = p34.read_text(encoding='utf-8')
          if 'Issue #29' not in s:
              s = s.replace('* [Protocolo operativo actual para aportar](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)', '* [Abrir la Síntesis Abierta de este manifiesto · Issue #29](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/29)\n* [Protocolo operativo actual para aportar](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)', 1)
              s = s.replace('* [Current operational contribution protocol](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)', '* [Open the Synthesis of this manifesto · Issue #29](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/29)\n* [Current operational contribution protocol](../propuestas/sintesis-abierta/APORTAR_A_LA_SINTESIS_ES_EN.md)', 1)
          p34.write_text(s, encoding='utf-8')

          p32 = Path('manifiestos/32_reversion_ideologica_neodialectica_mcluhan_neo0_ES_EN.md')
          s = p32.read_text(encoding='utf-8')
          s = s.replace('· [I · Neo0™ · Soberanía de Guía Neodialéctica](./11_neo0_soberania_de_guia_ES_EN.md) →', '· [XXXIII · IDEA · Piedra Angular y Piedra de Rosetta Civilizatoria™](./33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md) →', 1)
          s = s.replace('· [I · Neo0™ · Guiding Sovereignty](./11_neo0_soberania_de_guia_ES_EN.md) →', '· [XXXIII · IDEA · Civilisational Cornerstone and Rosetta Stone™](./33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md) →', 1)
          p32.write_text(s, encoding='utf-8')

          p1 = Path('manifiestos/11_neo0_soberania_de_guia_ES_EN.md')
          s = p1.read_text(encoding='utf-8')
          s = s.replace('← [XXXI · Contra el Neuromarketing Antihumanista™](./31_contra_neuromarketing_antihumanista_ES_EN.md)', '← [XXXIV · Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md)', 1)
          s = s.replace('← [XXXI · Against Anti-Humanist Neuromarketing™](./31_contra_neuromarketing_antihumanista_ES_EN.md)', '← [XXXIV · Operational Utility of the Framework and Perpetual Joint Audit™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md)', 1)
          p1.write_text(s, encoding='utf-8')

          idx = Path('manifiestos/README.md')
          s = idx.read_text(encoding='utf-8')
          s = s.replace('**Cuarta oleada · XXV–XXXI:**', '**Cuarta oleada · XXV–XXXII:**')
          s = s.replace('**Fourth wave · XXV–XXXI:**', '**Fourth wave · XXV–XXXII:**')
          marker_es = 'La cuarta oleada lleva el sistema desde su protección intelectual hacia la vida concreta.'
          block_es = '''## Quinta oleada · Transición, utilidad operativa y nuevo ciclo humano\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XXXIII | [IDEA · Piedra Angular y Piedra de Rosetta Civilizatoria™](./33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md) | Conectar la memoria literaria de origen con el reset sistémico mediante reemplazo y el Neorrenacimiento Humano | [Issue #28](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/28) |\n| XXXIV | [Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | Demostrar aplicación práctica mediante auditorías públicas, autocorrección, memoria versionada y Síntesis Abierta permanente | [Issue #29](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/29) |\n\nLa quinta oleada conecta transición y aplicación: IDEA aporta una puerta narrativa y una piedra de relación; la auditoría conjunta convierte el marco en una herramienta pública que debe demostrar utilidad mediante efectos verificables.\n\n'''
          if '## Quinta oleada · Transición, utilidad operativa y nuevo ciclo humano' not in s and marker_es in s:
              pos = s.find(marker_es)
              next_hr = s.find('\n---', pos)
              if next_hr != -1:
                  s = s[:next_hr] + '\n\n' + block_es + s[next_hr:]
          marker_en = 'The fourth wave'
          block_en = '''## Fifth wave · Transition, operational utility and a new human cycle\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XXXIII | [IDEA · Civilisational Cornerstone and Rosetta Stone™](./33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md) | Connect literary memory of origin with systemic reset through replacement and the Human Neo-Renaissance | [Issue #28](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/28) |\n| XXXIV | [Operational Utility of the Framework and Perpetual Joint Audit™](./34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | Demonstrate practical application through public audits, self-correction, versioned memory and perpetual Open Synthesis | [Issue #29](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/29) |\n\nThe fifth wave connects transition and application: IDEA provides a narrative gateway and relational cornerstone; joint audit turns the framework into a public tool whose utility must be demonstrated through verifiable effects.\n\n'''
          if '## Fifth wave · Transition, operational utility and a new human cycle' not in s:
              en_start = s.find('# EN · English')
              if en_start != -1:
                  en_fourth = s.find('## Fourth wave', en_start)
                  if en_fourth != -1:
                      next_hr = s.find('\n---', en_fourth)
                      if next_hr != -1:
                          s = s[:next_hr] + '\n\n' + block_en + s[next_hr:]
          idx.write_text(s, encoding='utf-8')

          syn = Path('propuestas/sintesis-abierta/README.md')
          s = syn.read_text(encoding='utf-8')
          if 'XXXIV' not in s:
              insert_es = '''\n## Quinta oleada · Transición, utilidad operativa y nuevo ciclo humano\n\n| Nº | Manifiesto | Síntesis Abierta |\n|---:|---|---|\n| XXXIII | [IDEA · Piedra Angular y Piedra de Rosetta Civilizatoria™](../../manifiestos/33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md) | [Issue #28](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/28) |\n| XXXIV | [Utilidad Operativa del Marco y Auditoría Conjunta Perpetua™](../../manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | [Issue #29](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/29) |\n'''
              method = s.find('\n## Método')
              if method != -1:
                  s = s[:method] + insert_es + s[method:]
              insert_en = '''\n## Fifth wave · Transition, operational utility and a new human cycle\n\n| No. | Manifesto | Open Synthesis |\n|---:|---|---|\n| XXXIII | [IDEA · Civilisational Cornerstone and Rosetta Stone™](../../manifiestos/33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md) | [Issue #28](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/28) |\n| XXXIV | [Operational Utility of the Framework and Perpetual Joint Audit™](../../manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md) | [Issue #29](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/29) |\n'''
              en_start = s.find('# EN · English')
              method_en = s.find('\n## Method', en_start) if en_start != -1 else -1
              if method_en != -1:
                  s = s[:method_en] + insert_en + s[method_en:]
          syn.write_text(s, encoding='utf-8')

          Path('.github/workflows/one-shot-sync-xxxiii-xxxiv.yml').unlink()
      - name: Commit synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs(manifestos): sync XXXIII-XXXIV navigation, purchase links and indexes"
            git push
          fi
