                 '* Las superficies bilingües comprobadas ofrecen el mismo conjunto de destinos internos en ES y EN.',
                 '* El índice de Síntesis Abierta no anuncia un XXXVII inexistente.', '',
                 '## EN · Checks','',
                 '* PORTADA and COVER distinguish fifth wave XXXIII–XXXV from sixth wave XXXVI.',
