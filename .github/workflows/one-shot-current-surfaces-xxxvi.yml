                 '* XXXVI, Issue #42 and the sixth wave are visible from entry surfaces.',
                 '* Checked bilingual surfaces provide the same set of internal destinations in ES and EN.',
                 '* The Open Synthesis index does not advertise a nonexistent XXXVII.','',
                 '## Resultado / Result','',f'* Incidencias / Findings: **{len(errors)}**.',f'* Enlaces relativos comprobados / Relative links checked: **{checked}**.',f'* Enlaces rotos / Broken links: **{len(broken)}**.','']
          if errors: lines+=['## Incidencias / Findings','']+[f'* {x}' for x in errors]+['']
          if broken: lines+=['## Enlaces rotos / Broken links','']+[f'* `{a}` → `{b}` ({c})' for a,b,c in broken]+['']
          if not errors: lines+=['## Dictamen / Verdict','','**OK global:** superficies de entrada, oleadas, últimos deltas, navegación y destinos internos ES/EN quedan sincronizados en el estado I–XXXVI. / **Global OK:** entry surfaces, waves, latest deltas, navigation and ES/EN internal destinations are synchronised at I–XXXVI state.']
