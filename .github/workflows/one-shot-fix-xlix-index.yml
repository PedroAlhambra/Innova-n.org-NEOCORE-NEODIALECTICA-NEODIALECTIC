name: one-shot-fix-xlix-index

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-xlix-index.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix canonical XLIX state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('manifiestos/README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('**Estado canónico / Canonical state:** **49 manifiestos bilingües · I–XLIX · 15 oleadas / 48 bilingual manifestos · I–XLIX · 15 waves**', '**Estado canónico / Canonical state:** **49 manifiestos bilingües · I–XLIX · 16 oleadas / 49 bilingual manifestos · I–XLIX · 16 waves**')
          s = s.replace('## Arquitectura actual · 15 oleadas', '## Arquitectura actual · 16 oleadas')
          if '16. **XLIX · Punto de Encuentro entre Culturas™:' not in s:
              anchor = '15. **XLVIII · La Síntesis Todo lo Ve™:** observación distribuida, Placa de Petri Universal™, potencias de diez, escalas micro–macro y Máquina Fractal del Tiempo™ como modelo de memoria evolutiva del organismo conjunto.'
              add = '\n16. **XLIX · Punto de Encuentro entre Culturas™:** unidad sin uniformidad, interoperabilidad cultural, traducción de sentido y cooperación entre culturas sin desaparición de la singularidad.'
              if anchor in s:
                  s = s.replace(anchor, anchor + add, 1)
          # ensure a dedicated wave section is present before any appended duplicate block or end
          if '## Decimosexta oleada · Punto de Encuentro entre Culturas™ · XLIX' not in s:
              block = '''\n\n## Decimosexta oleada · Punto de Encuentro entre Culturas™ · XLIX\n\n| Nº | Manifiesto | Función | Síntesis Abierta |\n|---:|---|---|---|\n| XLIX | [La Neodialéctica como Punto de Encuentro entre Culturas™](./49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md) | Unidad sin uniformidad, interoperabilidad cultural, traducción de sentido y cooperación sin desaparición | [#57](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/57) |\n\n## Sixteenth wave · Meeting Point between Cultures™ · XLIX\n\n| No. | Manifesto | Function | Open Synthesis |\n|---:|---|---|---|\n| XLIX | [Neodialectics as a Meeting Point between Cultures™](./49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md) | Unity without uniformity, cultural interoperability, translation of meaning and cooperation without disappearance | [#57](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/57) |\n'''
              s += block
          p.write_text(s, encoding='utf-8')

          # Normalize common state text wherever stale counts remain.
          for p in Path('.').rglob('*.md'):
              s = p.read_text(encoding='utf-8')
              old = s
              s = s.replace('48 bilingual manifestos · I–XLIX', '49 bilingual manifestos · I–XLIX')
              s = s.replace('49 manifiestos bilingües · I–XLIX · 15 oleadas', '49 manifiestos bilingües · I–XLIX · 16 oleadas')
              s = s.replace('49 bilingual manifestos · I–XLIX · 15 waves', '49 bilingual manifestos · I–XLIX · 16 waves')
              if s != old:
                  p.write_text(s, encoding='utf-8')

          # validation
          text = Path('manifiestos/README.md').read_text(encoding='utf-8')
          assert '49 manifiestos bilingües · I–XLIX · 16 oleadas' in text
          assert '49 bilingual manifestos · I–XLIX · 16 waves' in text
          assert '16. **XLIX · Punto de Encuentro entre Culturas™:' in text
          assert Path('manifiestos/49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md').exists()
          print('XLIX canonical index state OK')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.md' '**/*.md' || true
          git commit -m "docs: normalize XLIX canonical state to 49 manifestos and 16 waves" || true
          git push

      - name: Clean completed one-shots
        run: |
          git pull --rebase
          git rm -f .github/workflows/one-shot-sync-xlix.yml .github/workflows/one-shot-fix-xlix-index.yml
          git commit -m "chore: remove completed XLIX one-shots"
          git push
