name: oneshot-symmetry-radar-wiki-map

on:
  push:
    paths:
      - '.github/workflows/oneshot-symmetry-radar-wiki-map.yml'

permissions:
  contents: write

jobs:
  symmetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore symmetry without duplicating redundant Wiki content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # Wiki map: remove an obsolete duplicated ES-only genealogy/radar generated block
          # instead of duplicating the redundancy into English.
          p=Path('wiki-source/Mapa_del_Marco.md')
          s=p.read_text(encoding='utf-8')
          pattern=r'\n<!-- NEO_GENEALOGY_RADAR_START -->\n.*?<!-- NEO_GENEALOGY_RADAR_END -->\n'
          s,n=re.subn(pattern,'\n',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('Wiki duplicated genealogy/radar block not found')
          p.write_text(s,encoding='utf-8')

          # RADAR-PI: restore structures that had been compressed into prose in EN.
          p=Path('propuestas/sintesis-abierta/RADAR_PI_ANTECEDENTES_DIALECTICOS_ARQUETIPOS_RECURRENTES_ES_EN.md')
          s=p.read_text(encoding='utf-8')

          replacements=[
          ('''RADAR-Π™ may open signals concerning decision mechanisms, patterns of self-limitation or scaling, technical architectures, human–machine coordination, institutional structures, memory/traceability/revision mechanisms, conflict/cooperation/custodianship patterns, functional archetypal recurrences, philosophical or scientific antecedents, earlier partial implementations, independent contemporary convergences, and counterexamples that challenge or refute parts of the framework.''',
          '''RADAR-Π™ may open a signal concerning:\n\n- decision mechanisms;\n- patterns of self-limitation or scaling;\n- technical architectures;\n- forms of human–machine coordination;\n- institutional structures;\n- memory, traceability or review mechanisms;\n- patterns of conflict, cooperation or custodianship;\n- functional archetypal recurrences;\n- philosophical or scientific antecedents;\n- earlier partial implementations;\n- independent contemporary convergences;\n- counterexamples that challenge or refute a component of the framework.'''),
          ('''RADAR-Π™ should register archetypal recurrence only when a **recognisable relational function** can be described as recurring under different contexts.\n\nArchetypal language guides the search; evidence determines classification.''',
          '''RADAR-Π™ should register archetypal recurrence only when a **recognisable relational function** can be described as recurring under different contexts.\n\nExamples of useful questions:\n\n```text\nDOES THE CUSTODIANSHIP FUNCTION REAPPEAR?\nDOES THE PATTERN OF CROWNING ONE PART REAPPEAR?\nDOES A PAUSE BEFORE POORLY UNDERSTOOD POWER REAPPEAR?\nDOES A MEMORY + CONTRADICTION + REVIEW MECHANISM REAPPEAR?\n```\n\nArchetypal language guides the search; evidence determines classification.'''),
          ('''For every strong match it should also seek older antecedents, more complete earlier implementations, failures of apparently similar mechanisms, cases with opposite outcomes, simpler alternative explanations, and sources that weaken the proposed interpretation.''',
          '''For every strong match it should also try to locate:\n\n- still older antecedents;\n- more complete implementations of the same component;\n- failures of apparently similar mechanisms;\n- cases where the pattern produced opposite consequences;\n- simpler alternative explanations;\n- sources that weaken the proposed interpretation.'''),
          ('''**Umbral-X™** provides the sufficient-signal criterion before elevating a resemblance into a material relation. It is not used to shield the framework from uncomfortable antecedents; it reduces noise and demands evidence proportional to the claim.''',
          '''**Umbral-X™** provides the sufficient-signal criterion before elevating a resemblance into a material relation.\n\n```text\nWEAK CLUE\n→ MAY REMAIN IN THE QUEUE\n\nSUFFICIENT SIGNAL\n→ RETURN TO SOURCE\n\nSTRONG CONTRADICTION\n→ MUST ENTER SAN™\n```\n\nUmbral-X™ is not used to shield the framework from uncomfortable antecedents. It is used to reduce noise and demand evidence proportional to the claim.'''),
          ('''A RADAR-Π™ case may result in no delta, attribution correction, narrowing of a novelty claim, conceptual reformulation, a new genealogical relation, a new delta, a counterexample requiring limitation or withdrawal of a formulation, or local refutation.''',
          '''A RADAR-Π™ case may result in:\n\n- **no delta**: the comparison changes no material claim;\n- **attribution correction**;\n- **narrowing of a novelty claim**;\n- **conceptual reformulation**;\n- **a new genealogical relation**;\n- **a new delta**;\n- **a counterexample requiring limitation or withdrawal of a formulation**;\n- **local refutation**.''')]

          for old,new in replacements:
              if old not in s:
                  raise SystemExit('RADAR target missing: '+old[:60])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('RADAR_WIKI_MAP_SYMMETRY=OK')
          PY
      - name: Recalculate symmetry
        run: |
          python .github/scripts/audit_global_bilingual_symmetry.py
          python .github/scripts/audit_es_en_parity.py
      - name: Commit and remove one-shot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneshot-symmetry-radar-wiki-map.yml
          git add -A
          git commit -m 'docs: restaurar simetria RADAR PI y mapa Wiki'
          git pull --rebase origin main
          git push origin main
