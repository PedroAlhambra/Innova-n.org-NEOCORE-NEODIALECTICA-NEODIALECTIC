name: oneshot-symmetry-batch-kdp-incentives-childhood-xxxvi

on:
  push:
    paths:
      - '.github/workflows/oneshot-symmetry-batch-kdp-incentives-childhood-xxxvi.yml'

permissions:
  contents: write

concurrency:
  group: oneshot-symmetry-batch-kdp-incentives-childhood-xxxvi
  cancel-in-progress: false

jobs:
  symmetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore material symmetry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil

          # 1) KDP audit: restore the 12-language enumerated structure in English.
          p=Path('analisis/publicos/2026-08-06_auditoria-indirecta-kdp-author-central-idea_ES_EN.md')
          s=p.read_text(encoding='utf-8')
          old='''In a later communication on 6 August 2026, KDP and Author Central confirmed in writing that published IDEA formats in twelve languages had been correctly assigned to the Author Page:\n\nFinnish, Norwegian, Danish, Swedish, Polish, Dutch, German, Italian, English, Portuguese, French and Spanish.'''
          new='''In a later communication on 6 August 2026, KDP and Author Central confirmed in writing that published IDEA formats in twelve languages had been correctly assigned to the Author Page:\n\n1. Finnish;\n2. Norwegian;\n3. Danish;\n4. Swedish;\n5. Polish;\n6. Dutch;\n7. German;\n8. Italian;\n9. English;\n10. Portuguese;\n11. French;\n12. Spanish.'''
          if old not in s:
              raise SystemExit('KDP EN section 8 target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 2) Incentive delta: restore the 8 structural requirements as a list.
          p=Path('analisis/publicos/2026-08-08_delta_poder_incentivos_tokenizacion_y_transicion_neodialectica_ES_EN.md')
          s=p.read_text(encoding='utf-8')
          old='''This does not mean replacing one manipulation system with another.\n\nReconfiguration must be public in its essential rules, reviewable, plural, compatible with rights, capture-resistant, multiscale, non-hereditary and subject to Open Synthesis.'''
          new='''This does not mean replacing one manipulation system with another.\n\nReconfiguration must be:\n\n- public in its essential rules;\n- reviewable;\n- plural;\n- compatible with rights;\n- resistant to capture;\n- multiscale;\n- non-hereditary;\n- and subject to Open Synthesis.'''
          if old not in s:
              raise SystemExit('Incentive delta EN section 4 target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 3) Childhood announcement: restore headings and architecture block in English.
          p=Path('anuncios/2026-08-07_OCTAVA_OLEADA_PROTECCION_INTEGRAL_INFANCIA_ES_EN.md')
          s=p.read_text(encoding='utf-8')
          old='''Childhood is not treated as an immature market segment or a homogeneous audience. It is treated as the first responsibility of a civilisation seeking to transmit freedom, judgement, culture, technology and creative capacity to the next generation.\n\nThe manifesto establishes the **Child Point of No Return™** as a measurable hypothesis rather than a current fact: a warning threshold in which adult discretionary consumption collapses, remaining non-essential household spending becomes increasingly concentrated on children, and commercial pressure targets precisely their attention, identity and desire.\n\nPublic audiovisual oversight is defined as **independent, plural, transparent and appealable**, not as ideological censorship by the government of the day.'''
          new='''## Core\n\nChildhood is not treated as an immature market segment or a homogeneous audience. It is treated as the first responsibility of a civilisation seeking to transmit freedom, judgement, culture, technology and creative capacity to the next generation.\n\nThe manifesto establishes the **Child Point of No Return™** as a measurable hypothesis: a warning threshold in which adult discretionary consumption collapses, remaining non-essential household spending becomes increasingly concentrated on children, and commercial pressure targets precisely their attention, identity and desire.\n\nIt does not claim that this threshold has already been reached. It requires that it be measured.\n\n## Proposed architecture\n\n```text\nMATERIAL SECURITY\n+ FAMILY\n+ SCHOOL\n+ GUARANTEED DEVICES WHEN NEEDED\n+ TEACHERS\n+ BOOKS\n+ PROGRAMMING AND DIGITAL CREATION\n+ GUIDED EDUCATIONAL AI\n+ AGE-DIFFERENTIATED AUDIOVISUAL PROGRAMMING\n+ COMMERCIAL PROTECTION\n+ PRIVACY\n+ NON-COMMERCIALISED TIME\n+ CHILD PARTICIPATION\n= INTEGRAL PROTECTION OF CHILDHOOD™\n```\n\nPublic audiovisual oversight is defined as **independent, plural, transparent and appealable**, not as ideological censorship by the government of the day.'''
          if old not in s:
              raise SystemExit('Childhood announcement EN target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 4) Manifesto XXXVI: restore the Open Synthesis list in English.
          p=Path('manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md')
          s=p.read_text(encoding='utf-8')
          old='''Contributions are invited on the limits among custodianship, property and symbolic appropriation; the difference between archetypal recovery and political restoration; the universal meaning of the Age of Man; historical risks associated with Crown, Eagle and Lion; the Spanish heraldic constellation and its non-causal relations with NAX-10; the Flag of Spain in Synthesis™ and the Flag of Humanity in Synthesis™; criteria for symbolic inclusion without biologising identities or turning diversity into hierarchy; mechanisms preventing authoritarian, imperial, nationalist, racial or commercial capture; Innova_N as a living tool rather than an external representation of a hammer; transformation of memory into an engine of ideas vectorised by joint synthesis; the relation among framework, planet, human life and fractal organism; responsibility of the creative agent integrated into the whole; and criteria for institutional use by the Innova_N Foundation.'''
          new='''Contributions are invited on:\n\n- the limits among custodianship, property and symbolic appropriation;\n- the difference between archetypal recovery and political restoration;\n- the universal meaning of the Age of Man;\n- historical risks associated with Crown, Eagle and Lion;\n- the Spanish heraldic constellation and its non-causal relations with NAX-10;\n- the Flag of Spain in Synthesis™ and the Flag of Humanity in Synthesis™;\n- criteria for symbolic inclusion without biologising identities or turning diversity into hierarchy;\n- mechanisms preventing authoritarian, imperial, nationalist, racial or commercial capture;\n- Innova_N as a living tool rather than an external representation of a hammer;\n- transformation of memory into an engine of ideas vectorised through joint synthesis;\n- the relation among framework, planet, human life and fractal organism;\n- responsibility of the creative agent integrated into the whole;\n- and criteria for institutional use by the Innova_N Foundation.'''
          if old not in s:
              raise SystemExit('Manifesto XXXVI EN section XII target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Keep canonical mirror byte-identical for XXXVI.
          entries=json.loads(Path('manifiestos/CANONICAL_FILENAMES.json').read_text(encoding='utf-8'))['entries']
          src=Path(entries['XXXVI']['legacy'])
          dst=Path(entries['XXXVI']['canonical'])
          dst.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(src,dst)
          print('SYMMETRY_BATCH=OK')
          PY

      - name: Recalculate audits
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/audit_manifesto_registry_completeness.py
          python .github/scripts/audit_es_en_parity.py
          python .github/scripts/audit_manifesto_bilingual_structure.py
          python .github/scripts/audit_global_bilingual_symmetry.py
          grep -F '**Recortes/materialmente asimétricos para revisión:** 0' auditorias/publicas/2026-08-09_auditoria_paridad_ES_EN_manifiestos_articulos.md
          grep -F '**REVISAR / REVIEW:** 0' auditorias/publicas/2026-08-12_auditoria_estructura_bilingue_manifiestos_ES_EN.md

      - name: Commit batch and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneshot-symmetry-batch-kdp-incentives-childhood-xxxvi.yml
          git add -A
          git commit -m 'docs: restaurar simetria KDP incentivos infancia y XXXVI'
          git pull --rebase origin main
          git push origin main
