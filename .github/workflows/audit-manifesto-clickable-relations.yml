name: Audit manifesto clickable relations

on:
  pull_request:
    paths:
      - 'manifiestos/**'
      - '.github/scripts/audit_manifesto_clickable_relations.py'
      - '.github/scripts/repair_manifesto_clickable_relations.py'
      - '.github/workflows/audit-manifesto-clickable-relations.yml'
  push:
    branches: [main]
    paths:
      - 'manifiestos/**'
      - '.github/scripts/audit_manifesto_clickable_relations.py'
      - '.github/scripts/repair_manifesto_clickable_relations.py'
      - '.github/workflows/audit-manifesto-clickable-relations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relational-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair manifesto relational navigation
        if: github.event_name == 'push'
        run: python .github/scripts/repair_manifesto_clickable_relations.py
      - name: Commit repaired relational hyperlinks
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- manifiestos; then
            echo 'No relational hyperlink repairs required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add manifiestos
            git commit -m 'fix(manifestos): repair clickable genealogical relations'
            git push
          fi
      - name: Audit manifesto relational navigation
        run: python .github/scripts/audit_manifesto_clickable_relations.py
      - name: Audit canonical registry completeness
        run: python .github/scripts/audit_manifesto_registry_completeness.py
      - name: Audit NEOCore role ontology and NeoTitan delta literacy
        run: python .github/scripts/audit_neocore_role_ontology.py
