name: sync-manifesto-crossrefs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-manifesto-crossrefs.yml'
      - '.github/scripts/sync_documentation_transaction.sh'
      - '.github/scripts/sync_manifesto_crossrefs.py'
      - '.github/scripts/sync_manifesto_reference_policy.py'
      - '.github/scripts/sync_manifesto_index.py'
      - '.github/scripts/audit_manifesto_clickable_relations.py'
      - '.github/scripts/audit_global_bilingual_symmetry.py'
      - '.github/scripts/audit_language_selectors.py'
      - 'manifiestos/**.md'
      - 'neoaxiomas/README.md'
      - 'obras/idea/README.md'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize on current main with bounded retry and full gates
        run: bash .github/scripts/sync_documentation_transaction.sh crossrefs
