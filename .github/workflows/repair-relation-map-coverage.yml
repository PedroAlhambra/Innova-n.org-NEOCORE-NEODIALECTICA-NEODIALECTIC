name: repair-relation-map-coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_relation_map_coverage.py'
      - '.github/workflows/repair-relation-map-coverage.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair explicit I-LIX relation-map coverage
        run: python .github/scripts/repair_relation_map_coverage.py
      - name: Commit if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/RELACIONES_TRABAJO_APLICADO_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: completar mapa relacional I-LIX y espejo EN'
          git pull --rebase origin main
          git push origin main
