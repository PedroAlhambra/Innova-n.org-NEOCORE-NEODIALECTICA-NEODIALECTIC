name: one-shot-repair-spanish-index-xlix

on:
  push:
    paths:
      - '.github/workflows/one-shot-repair-spanish-index-xlix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair missing XLIX Spanish index row
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          p=Path('manifiestos/README.md')
          s=p.read_text(encoding='utf-8')
          es,en=s.split('# EN · English',1)
          target='./49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md'
          if target not in es:
              marker='## Relación entre principios y trabajo aplicado'
              block='''## Decimosexta oleada · Interoperabilidad cultural · XLIX

| Nº | Manifiesto | Función | Síntesis Abierta |
|---:|---|---|---|
| XLIX | [La Neodialéctica como Punto de Encuentro entre Culturas™](./49_neodialectica_punto_encuentro_culturas_interoperabilidad_cultural_ES_EN.md) | Unidad sin uniformidad, interoperabilidad cultural, traducción de sentido y cooperación sin desaparición de la singularidad | [#57](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/57) |

'''
              if marker not in es: raise SystemExit('insertion marker not found')
              es=es.replace(marker,block+marker,1)
              s=es+'# EN · English'+en
              p.write_text(s,encoding='utf-8')
          row_re=re.compile(r'^\|\s*([IVXLCDM]+)\s*\|\s*\[[^\]]+\]\((\.\/[^)]+\.md)\)\s*\|',re.M)
          es2=p.read_text(encoding='utf-8').split('# EN · English',1)[0]
          rows=[]; seen=set()
          for roman,path in row_re.findall(es2):
              if roman not in seen: rows.append((roman,path)); seen.add(roman)
          print('ES_UNIQUE_MANIFESTOS=',len(rows))
          if len(rows)!=50: raise SystemExit(f'Expected 50 ES rows, got {len(rows)}')
          if 'XLIX' not in seen or 'L' not in seen: raise SystemExit('XLIX or L still missing')
          print('Spanish canonical index repaired: I-L 50/50')
      - name: Commit repair
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add manifiestos/README.md
            git commit -m 'docs: restore XLIX in Spanish canonical manifesto index'
            git push
          fi
      - name: Self-remove
        run: |
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-repair-spanish-index-xlix.yml
          git commit -m 'chore: remove completed Spanish manifesto index repair'
          git push

# trigger
