name: one-shot fix SAN index XXXIII link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-san-index-link.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact XXXIII path and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('propuestas/sintesis-abierta/INDICE_COMPLETO_SINTESIS_ABIERTAS_ES_EN.md')
          s=p.read_text(encoding='utf-8')
          wrong='../../manifiestos/33_idea_piedra_angular_rosetta_civilizatoria_reset_reemplazo_ES_EN.md'
          right='../../manifiestos/33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md'
          if wrong not in s:
              raise SystemExit('Expected broken XXXIII path not found')
          s=s.replace(wrong,right)
          p.write_text(s,encoding='utf-8')
          assert Path('manifiestos/33_idea_piedra_angular_roseta_civilizatoria_reset_reemplazo_ES_EN.md').exists()
          print('XXXIII_SAN_LINK=OK')
          PY
          python .github/scripts/audit_markdown_links_readmes.py
          grep -q '\*\*Estado / Status:\*\* \*\*OK\*\*' auditorias/publicas/2026-08-09_postcheck_LVI_no_control_readmes_enlaces_ES_EN.md
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-fix-san-index-link.yml
          git add -A
          git commit -m 'fix: corregir enlace XXXIII y cerrar postcheck documental'
          git push