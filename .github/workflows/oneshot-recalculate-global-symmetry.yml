name: oneshot-recalculate-global-symmetry

on:
  push:
    paths:
      - '.github/workflows/oneshot-recalculate-global-symmetry.yml'

permissions:
  contents: write

jobs:
  recalculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recalculate
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Commit report and remove one-shot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneshot-recalculate-global-symmetry.yml
          git add auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'audit: recalcular simetria global tras segunda tanda'
          git pull --rebase origin main
          git push origin main
