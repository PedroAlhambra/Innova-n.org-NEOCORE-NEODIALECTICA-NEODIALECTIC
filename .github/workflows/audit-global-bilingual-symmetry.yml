name: audit-global-bilingual-symmetry

# Revisión viva 2026-08-24 · simetría ES/EN + navegación lingüística + gate NAX/C-NAX.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/ISSUE_TEMPLATE/*.yaml'
      - '.github/scripts/audit_global_bilingual_symmetry.py'
      - '.github/scripts/audit_neoaxiom_registry_integrity.py'
      - '.github/scripts/audit_language_selectors.py'
      - '.github/workflows/audit-global-bilingual-symmetry.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit global ES EN symmetry
        id: content_symmetry
        continue-on-error: true
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Audit ES EN language navigation
        id: language_navigation
        continue-on-error: true
        run: python .github/scripts/audit_language_selectors.py
      - name: Commit audit reports
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md \
            auditorias/publicas/2026-08-16_auditoria_neoaxiomas_simetria_frontera_ES_EN.md \
            auditorias/publicas/2026-08-24_auditoria_global_selectores_idioma_ES_EN.md
          if git diff --cached --quiet; then
            echo 'Global bilingual audit reports unchanged.'
            exit 0
          fi
          git commit -m 'audit: simetría global ES EN, navegación y gate neoaxiomático'
          git pull --rebase origin main
          git push origin main
      - name: Enforce blocking audit result
        if: always()
        run: |
          set -euo pipefail
          echo "CONTENT_SYMMETRY=${{ steps.content_symmetry.outcome }}"
          echo "LANGUAGE_NAVIGATION=${{ steps.language_navigation.outcome }}"
          if [ "${{ steps.content_symmetry.outcome }}" != "success" ] || [ "${{ steps.language_navigation.outcome }}" != "success" ]; then
            echo 'One or more bilingual gates failed. Evidence was preserved; global PASS is blocked.'
            exit 1
          fi
          echo 'CONTENT_SYMMETRY = PASS'
          echo 'LANGUAGE_NAVIGATION = PASS'
