name: audit-global-bilingual-symmetry

# Revisión viva 2026-08-31 · gate puro: valida, no muta el corpus ni genera commits recursivos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'versiones/**'
      - 'manifiestos/**'
      - 'neoaxiomas/**'
      - 'propuestas/**'
      - 'analisis/**'
      - 'fragmentos/**'
      - 'obras/**'
      - 'web4/**'
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/ISSUE_TEMPLATE/*.yaml'
      - '.github/scripts/audit_global_bilingual_symmetry.py'
      - '.github/scripts/audit_neoaxiom_registry_integrity.py'
      - '.github/scripts/audit_language_selectors.py'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - '.github/workflows/audit-global-bilingual-symmetry.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'versiones/**'
      - 'manifiestos/**'
      - 'neoaxiomas/**'
      - 'propuestas/**'
      - 'analisis/**'
      - 'fragmentos/**'
      - 'obras/**'
      - 'web4/**'
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/ISSUE_TEMPLATE/*.yaml'
      - '.github/scripts/audit_global_bilingual_symmetry.py'
      - '.github/scripts/audit_neoaxiom_registry_integrity.py'
      - '.github/scripts/audit_language_selectors.py'
      - '.github/scripts/audit_markdown_links_readmes.py'
      - '.github/workflows/audit-global-bilingual-symmetry.yml'

permissions:
  contents: read

concurrency:
  group: audit-global-bilingual-symmetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit global ES EN symmetry
        id: content_symmetry
        continue-on-error: true
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Audit ES EN language navigation
        id: language_navigation
        continue-on-error: true
        run: python .github/scripts/audit_language_selectors.py
      - name: Enforce blocking audit result
        if: always()
        run: |
          set -euo pipefail
          echo "CONTENT_SYMMETRY=${{ steps.content_symmetry.outcome }}"
          echo "LANGUAGE_NAVIGATION=${{ steps.language_navigation.outcome }}"
          if [ "${{ steps.content_symmetry.outcome }}" != "success" ] || [ "${{ steps.language_navigation.outcome }}" != "success" ]; then
            echo 'One or more bilingual gates failed. No corpus mutation was performed by CI.'
            exit 1
          fi
          echo 'CONTENT_SYMMETRY = PASS'
          echo 'LANGUAGE_NAVIGATION = PASS'
