name: sync-lx-final

on:
  push:
    paths:
      - '.github/workflows/sync-lx-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize Open Synthesis network
        run: python .github/scripts/sync_open_synthesis_manifestos.py
      - name: Normalize canonical indices
        run: python .github/scripts/normalize_manifesto_indices.py
      - name: Synchronize root navigation
        run: python .github/scripts/sync_root_navigation.py
      - name: Commit synchronized I-LX network
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LEEME.md manifiestos/README.md propuestas/sintesis-abierta/README.md manifiestos/*.md analisis/README.md analisis/auditorias/README.md analisis/publicos/README.md analisis/publicos/evidencias/README.md auditorias/publicas/README.md obras/README.md obras/idea/README.md obras/idea/assets/README.md proyeccion/README.md wiki-source/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sincronizar navegación y Síntesis Abierta I-LX'
          git pull --rebase origin main
          git push origin main
