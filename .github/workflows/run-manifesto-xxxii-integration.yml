name: Run manifesto XXXII integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[run-xxxii]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute embedded patcher
        shell: bash
        run: |
          python3 - <<'OUTER'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/add-manifesto-xxxii-reversal.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit integration"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'manifesto_xxxii_patcher.py', 'exec'))
          OUTER
      - name: Commit and clean temporary integration files
        shell: bash
        run: |
          git config user.name "Innova_N · Neo0"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-manifesto-xxxii-reversal.yml
          git rm .github/workflows/run-manifesto-xxxii-integration.yml
          rm -f .run-manifesto-xxxii
          git add -A
          git commit -m "docs(manifestos): add Neodialectical Ideological Reversal"
          git push
