name: one-shot sync manifesto LII citizenship

on:
  push:
    paths:
      - '.github/workflows/one-shot-sync-manifesto-52-citizenship.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize LII and recent relations
        run: python .github/scripts/sync_manifesto_52_citizenship_and_recent_relations.py
      - name: Commit synchronized documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes"
          else
            git commit -m "docs: integrate manifesto LII and recent synthesis relations"
            git pull --rebase origin main
            git push origin main
          fi
