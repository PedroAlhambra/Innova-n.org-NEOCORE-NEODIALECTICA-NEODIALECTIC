name: Refine paired symmetry gates 2026-08-15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-paired-symmetry-gates-20260815.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expand explicit language gate recognition
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/scripts/audit_global_bilingual_symmetry.py')
          s=p.read_text(encoding='utf-8')
          old="ES_PATTERNS = [r'^#{1,4}\\s+ES\\s+·\\s+[^\\n]+$']\nEN_PATTERNS = [r'^#{1,4}\\s+EN\\s+·\\s+[^\\n]+$']"
          new="ES_PATTERNS = [r'^#{1,4}\\s+(?:ES(?:\\s+·\\s+[^\\n]+)?|Versión(?: en)? española)\\s*$']\nEN_PATTERNS = [r'^#{1,4}\\s+(?:EN(?:\\s+·\\s+[^\\n]+)?|English version)\\s*$']"
          if old not in s:
              raise SystemExit('expected language-gate block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Recalculate audit
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Validate
        run: git diff --check
      - name: Commit refined audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/audit_global_bilingual_symmetry.py auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'audit: recognise plain and legacy ES-EN language gates'
          git push origin HEAD:main
