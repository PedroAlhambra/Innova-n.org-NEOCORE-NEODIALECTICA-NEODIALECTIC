name: Harden symmetry boundaries 2026-08-15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-symmetry-boundaries-20260815.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Harden gate and shared-tail detection
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/scripts/audit_global_bilingual_symmetry.py')
          s=p.read_text(encoding='utf-8')
          old="ES_PATTERNS = [r'^#{1,4}\\s+(?:ES(?:\\s+·\\s+[^\\n]+)?|Versión(?: en)? española)\\s*$']\nEN_PATTERNS = [r'^#{1,4}\\s+(?:EN(?:\\s+·\\s+[^\\n]+)?|English version)\\s*$']"
          new="ES_PATTERNS = [r'^#{1,4}\\s+ES(?:\\s+·\\s+[^\\n]+)?\\s*$']\nEN_PATTERNS = [r'^#{1,4}\\s+EN(?:\\s+·\\s+[^\\n]+)?\\s*$']"
          if old not in s:
              raise SystemExit('gate block not found')
          s=s.replace(old,new,1)
          old2="""    # A bilingual heading after the EN body normally begins a shared tail, e.g.\n    # \"# Fuentes / Sources\" or \"## Trazabilidad / Traceability\". It belongs to neither language half.\n    m=re.search(r'^#{1,6}\\s+[^\\n]+\\s+/\\s+[^\\n]+\\s*$',s,re.M)\n    if m: positions.append(m.start())"""
          new2="""    # Only known editorial bilingual tail headings are shared boundaries. A slash alone\n    # is not sufficient: content headings such as \"Stanford / ACE\" are part of the document.\n    m=re.search(r'^#{1,6}\\s+(?:Fuentes[^\\n]* / [^\\n]*(?:Sources|sources)|Historial de versiones / Version history|Firma común / Common signature|Principio de procedencia / Provenance principle)\\s*$',s,re.M)\n    if m: positions.append(m.start())"""
          if old2 not in s:
              raise SystemExit('generic shared-tail block not found')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
      - name: Recalculate audit
        run: python .github/scripts/audit_global_bilingual_symmetry.py
      - name: Validate
        run: git diff --check
      - name: Commit hardened audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/audit_global_bilingual_symmetry.py auditorias/publicas/2026-08-12_auditoria_global_simetria_ES_EN.md
          git commit -m 'audit: harden language gates and shared-tail boundaries'
          git push origin HEAD:main
