name: repair-neoaxioms-strict-bilingual-symmetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_neoaxioms_strict_bilingual_symmetry.py'
      - '.github/workflows/repair-neoaxioms-strict-bilingual-symmetry.yml'

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore strict bilingual symmetry in Neoaxioms
        run: python .github/scripts/repair_neoaxioms_strict_bilingual_symmetry.py
      - name: Commit repaired Neoaxiom layer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neoaxiomas/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión en Neoaxiomas'
          git pull --rebase origin main
          git push origin main
