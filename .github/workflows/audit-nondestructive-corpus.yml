name: Audit non-destructive corpus maintenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'manifiestos/**'
      - 'neoaxiomas/**'
      - 'propuestas/sintesis-abierta/**'
      - 'versiones/**'
      - 'auditorias/**'
      - '.github/scripts/**'
      - '.github/workflows/audit-nondestructive-corpus.yml'
  push:
    branches: [main]
    paths:
      - 'manifiestos/**'
      - 'neoaxiomas/**'
      - 'propuestas/sintesis-abierta/**'
      - 'versiones/**'
      - 'auditorias/**'
      - '.github/scripts/**'
      - '.github/workflows/audit-nondestructive-corpus.yml'

permissions:
  contents: read

jobs:
  nondestructive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Protect existing corpus from destructive maintenance
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          [ -n "$base" ] || exit 0

          protected='^(manifiestos/|neoaxiomas/|propuestas/sintesis-abierta/|versiones/|auditorias/)'
          regenerated_selector_report='auditorias/publicas/2026-08-24_auditoria_global_selectores_idioma_ES_EN.md'
          while IFS=$'\t' read -r status path rest; do
            [[ "$path" =~ $protected ]] || continue

            if [[ "$status" == D* ]]; then
              echo "NON_DESTRUCTIVE_FAILURE: protected corpus file deleted: $path" >&2
              exit 1
            fi

            if [[ "$status" == M* && "$path" != "$regenerated_selector_report" ]] && git cat-file -e "$base:$path" 2>/dev/null && git cat-file -e "HEAD:$path" 2>/dev/null; then
              old_size="$(git cat-file -s "$base:$path")"
              new_size="$(git cat-file -s "HEAD:$path")"
              if [ "$old_size" -ge 1024 ] && [ $((new_size * 100)) -lt $((old_size * 65)) ]; then
                echo "NON_DESTRUCTIVE_FAILURE: suspicious shrinkage in $path ($old_size -> $new_size bytes)." >&2
                echo "A maintenance loop may not replace a complete source from a truncated read or summary." >&2
                exit 1
              fi
            fi
          done < <(git diff --name-status "$base" HEAD)

      - name: Protect Neoaxiom reading routes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/audit_neoaxiom_reading_routes.py
          python .github/scripts/audit_neoaxiom_registry_integrity.py

      - name: Diff integrity
        run: python .github/scripts/audit_diff_integrity_markdown.py HEAD^
