name: One-time final eighth-wave portada grouping

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-portada-eighth-wave-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PORTADA.md'); t=p.read_text(encoding='utf-8')
          old='''### Séptima oleada · Neofraternidad y arquitectura relacional\n\n* [XXXVII · Neofraternidad™](./manifiestos/37_neofraternidad_ES_EN.md)\n\n### Octava oleada · Infancia, educación y transmisión civilizatoria\n\n* [XXXVIII · Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [MAXPROC · Protección Integral de la Infancia™](./analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Anuncio de la octava oleada](./anuncios/2026-08-07_OCTAVA_OLEADA_PROTECCION_INTEGRAL_INFANCIA_ES_EN.md)\n* [Síntesis Abierta XXXVIII · Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45)\n* [Síntesis Abierta XXXVII · Issue #43](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/43)'''
          new='''### Séptima oleada · Neofraternidad y arquitectura relacional\n\n* [XXXVII · Neofraternidad™](./manifiestos/37_neofraternidad_ES_EN.md)\n* [Síntesis Abierta XXXVII · Issue #43](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/43)\n\n### Octava oleada · Infancia, educación y transmisión civilizatoria\n\n* [XXXVIII · Protección Integral de la Infancia™](./manifiestos/38_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [MAXPROC · Protección Integral de la Infancia™](./analisis/publicos/2026-08-07_maxproc_proteccion_integral_infancia_punto_no_retorno_ES_EN.md)\n* [Anuncio de la octava oleada](./anuncios/2026-08-07_OCTAVA_OLEADA_PROTECCION_INTEGRAL_INFANCIA_ES_EN.md)\n* [Síntesis Abierta XXXVIII · Issue #45](https://github.com/PedroAlhambra/Innova-n.org-NEOCORE-NEODIALECTICA-NEODIALECTIC/issues/45)'''
          if old not in t:
              raise SystemExit('expected block not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix-portada-eighth-wave-v2.yml').unlink()
          PY
          git config user.name "Innova_N Documentation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize seventh/eighth wave grouping in PORTADA"
          git push origin HEAD:main