name: final-neocore-version-surface-cleanup

on:
  push:
    paths:
      - '.github/workflows/final-neocore-version-surface-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean obsolete NEOCore 7.2 version references
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          exts={'.md','.py','.yml','.yaml','.json','.txt','.html','.js','.ts','.tsx','.jsx'}
          replacements={
            "CURRENT_VERSION = '7.2'":"CURRENT_VERSION = '7.3-CANDIDATE'",
            'CURRENT_VERSION = "7.2"':'CURRENT_VERSION = "7.3-CANDIDATE"',
            'NEOCore™ 7.2':'NEOCore™ PRE-7.3',
            'NEOCore 7.2':'NEOCore PRE-7.3',
            'NEOCORE 7.2':'NEOCORE PRE-7.3',
            'WEB4™ 7.2':'WEB4™ PRE-7.3',
            'WEB4 7.2':'WEB4 PRE-7.3',
            'Regla 7.2 / 7.2 rule':'Regla PRE-7.3 / PRE-7.3 rule',
            'revisión 7.2':'revisión PRE-7.3',
            'review 7.2':'review PRE-7.3',
            'The 7.2 review':'The PRE-7.3 review',
            'estado 7.2':'estado PRE-7.3',
            'state 7.2':'state PRE-7.3',
            'delta 7.2':'delta PRE-7.3',
            '7.2 delta':'PRE-7.3 delta',
            '7.2 añade':'PRE-7.3 añade',
            '7.2 adds':'PRE-7.3 adds',
            '7.2 candidates':'PRE-7.3 candidates',
            'Candidatos detectados en 7.2':'Candidatos detectados PRE-7.3',
            'candidates detected in 7.2':'candidates detected PRE-7.3',
            'arquitectura 7.2':'arquitectura PRE-7.3',
            '7.2 architecture':'PRE-7.3 architecture',
            'snapshot 7.2':'snapshot PRE-7.3',
            'corpus 7.2':'corpus PRE-7.3',
            'NEOCORE_7_2':'NEOCORE_PRE_7_3',
            'neocore_7_2':'neocore_PRE_7_3',
          }
          changed=[]
          for p in root.rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts: continue
            try: s=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            n=s
            for a,b in replacements.items(): n=n.replace(a,b)
            if n!=s:
              p.write_text(n,encoding='utf-8'); changed.append(str(p))
          print('CHANGED',len(changed))
          for p in changed: print(p)
          PY
      - name: Remove temporary cleanup workflows
        run: |
          rm -f .github/workflows/oneshot-issue-version-cleanup.yml
          rm -f .github/workflows/final-neocore-version-surface-cleanup.yml
      - name: Verify semantic version residues
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          pats=[
            re.compile(r'NEOCore(?:™)?\s+7\.2'), re.compile(r'NEOCORE\s+7\.2'),
            re.compile(r'WEB4(?:™)?\s+7\.2'), re.compile(r'\bRegla 7\.2\b'),
            re.compile(r'\b7\.2 rule\b',re.I), re.compile(r'\b(?:state|estado|review|revisión|delta|architecture|arquitectura|snapshot|corpus)\s+7\.2\b',re.I),
            re.compile(r'\b7\.2\s+(?:state|estado|review|revisión|delta|adds|añade|candidates|architecture)\b',re.I),
            re.compile(r'NEOCORE_7_2|neocore_7_2')]
          bad=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            try:s=p.read_text(encoding='utf-8')
            except:continue
            for i,line in enumerate(s.splitlines(),1):
              if any(r.search(line) for r in pats): bad.append(f'{p}:{i}:{line.strip()}')
          if bad:
            print('\n'.join(bad)); sys.exit(1)
          print('SEMANTIC_7_2_VERSION_REFERENCES=0')
          PY
      - name: Run core audits
        run: |
          python .github/scripts/audit_markdown_links_readmes.py
          python .github/scripts/audit_global_bilingual_symmetry.py
          python .github/scripts/audit_neoaxiom_registry_integrity.py
      - name: Commit final cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: eliminate residual NEOCore 7.2 version references and retire cleanup workflow'
          git push
