name: Reconcile public living surfaces

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-reconcile-all-public-surfaces.yml
      - .github/scripts/one_shot_reconcile_all_public_surfaces.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reconciliation
        run: python .github/scripts/one_shot_reconcile_all_public_surfaces.py
      - name: Commit reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: reconcile living public graph to LXXXIV and C-NAX-27"
          git pull --rebase origin main
          git push origin main
