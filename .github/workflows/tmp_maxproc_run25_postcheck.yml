name: Temporary MAXPROC Run25 postcheck

on:
  push:
    paths:
      - '.github/workflows/tmp_maxproc_run25_postcheck.yml'

permissions:
  contents: write

jobs:
  postcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run blocking public gates
        shell: bash
        run: |
          python .github/scripts/audit_global_bilingual_symmetry.py
          python .github/scripts/audit_language_selectors.py
          python .github/scripts/audit_markdown_links_readmes.py
          python .github/scripts/audit_relations_neocore.py
      - name: Remove temporary workflow and commit regenerated audits
        shell: bash
        run: |
          rm .github/workflows/tmp_maxproc_run25_postcheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: Run25 postcheck public gates'
          git push
