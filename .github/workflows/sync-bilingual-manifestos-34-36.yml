name: sync-bilingual-manifestos-34-36

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair_manifestos_34_36_strict_symmetry.py'
      - '.github/workflows/sync-bilingual-manifestos-34-36.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neocore-document-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore strict ES EN symmetry XXXIV and XXXVI
        run: python .github/scripts/repair_manifestos_34_36_strict_symmetry.py
      - name: Commit repaired manifestos
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifiestos/34_utilidad_operativa_marco_auditoria_conjunta_perpetua_ES_EN.md \
                  manifiestos/36_corona_aguila_custodia_edad_del_hombre_ES_EN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: simetría ES EN sin compresión XXXIV y XXXVI'
          git pull --rebase origin main
          git push origin main
